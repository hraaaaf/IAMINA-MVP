# ── docker-compose.override.yml — LOCAL DEV ONLY ──────────────────────────────
# Auto-merged by `docker compose up`. Do NOT use for staging/prod — there, run the
# base file explicitly: `docker compose -f docker-compose.yml up`.
#
# Gives the dev loop: Django runserver + hot reload, host port 8001 (matches the
# Flutter API_BASE_URL default), and a stack that boots without Firebase creds.
#
# First run:
#   docker compose up --build
#   docker compose run --rm backend python manage.py setup_demo   # demo data
#   # Frontend (host): flutter run --dart-define=API_BASE_URL=http://127.0.0.1:8001
#
# Firebase auth (optional — only needed to exercise login): mount creds + set path.
# Each dev points at their own secrets dir (host-specific, gitignored), e.g.:
#   volumes:     [ "${HOME}/.iamina-secrets:/secrets:ro" ]
#   environment: { FIREBASE_CREDENTIALS_PATH: /secrets/firebase-credentials.json }
# ──────────────────────────────────────────────────────────────────────────────
services:
  backend:
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "True"
      # Boot the stack without Firebase creds; set a mounted path (see header) for auth.
      FIREBASE_CREDENTIALS_PATH: ""
    # `!override` replaces the base 8000:8000 mapping (instead of appending) so this
    # stack only claims host port 8001 and coexists with other projects on 8000.
    ports: !override
      - "8001:8000"   # host 8001 (Flutter default) -> container 8000

  # Don't publish Postgres/Redis to the host — the backend reaches them over the
  # internal compose network (db:5432, redis:6379). Host publication is only for
  # external DB tools and collides with other running stacks. Re-add per-dev if needed.
  db:
    ports: !override []
  redis:
    ports: !override []
