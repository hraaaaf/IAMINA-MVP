# ── IAmina — docker-compose (development + staging) ─────────────────────────
# Usage:
#   docker-compose up --build          # start all services
#   docker-compose up -d               # detached
#   docker-compose run backend python manage.py migrate
#   docker-compose run backend python manage.py createsuperuser
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       iamina
      POSTGRES_USER:     iamina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iamina_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iamina -d iamina"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"   # expose for local DB tools (pgAdmin, DBeaver)

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"   # expose for local inspection (redis-cli)

  # ── Django backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use the compose db service
      DATABASE_URL: postgres://iamina:${POSTGRES_PASSWORD:-iamina_dev_password}@db:5432/iamina
      # Override REDIS_URL to use the compose redis service
      REDIS_URL: redis://redis:6379/0
      # Explicit — never rely on the default
      DJANGO_SETTINGS_MODULE: amina.settings
    volumes:
      # Mount source for hot-reload in development (remove in prod)
      - ./backend:/app
      # Persist SQLite fallback and staticfiles outside the mount
      - backend_static:/app/staticfiles
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn
               --bind 0.0.0.0:8000
               --workers 3
               --worker-class gthread
               --threads 2
               --timeout 120
               --reload
               --access-logfile -
               --error-logfile -
               amina.wsgi:application"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  backend_static:
