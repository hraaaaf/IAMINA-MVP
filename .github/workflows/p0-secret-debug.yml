name: P0 Secret Debug

on:
  pull_request:
    branches: [main]

jobs:
  debug:
    if: github.head_ref == 'fix/p0-secret-hygiene'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture sanitized scanner findings
        run: python scripts/check_secrets.py > secret-findings.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: secret-findings
          path: secret-findings.txt
