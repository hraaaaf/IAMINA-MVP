name: UX-1 roadmap refresh

on:
  push:
    branches:
      - ux/ux-1-dashboard-rich-locale-parity
    paths:
      - .github/workflows/ux-1-roadmap-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/ux-1-dashboard-rich-locale-parity
          fetch-depth: 0
      - name: Update canonical roadmap and remove this temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ROADMAP.md')
          s = p.read_text()
          replacements = {
            '> **Last updated:** 2026-08-10 — UX-0 visual rebase found a previously untested populated-Dashboard locale-parity defect; the historical visual and Journal workstreams remain closed, while a narrowly scoped UX-1 remediation is now queued.':
            '> **Last updated:** 2026-08-10 — UX-0 is merged and post-merge green. UX-1 has remediated the populated-Dashboard FR/AR locale-parity defect and is in final visual/reviewer certification before merge.',
            '| UX visual rebase | 50% | 🔴 UX-1 required | UX-0 rich-state audit run `31403179971`; 8/8 FR/AR renders; populated Dashboard baseline 8.4/10 due mixed-language rich-state content |':
            '| UX visual rebase | 90% | 🟡 UX-1 final certification | UX-0 closed via PR #83; UX-1 baseline 8.4/10 → first post-fix rendered read ~9.2/10; exact final review/certifier/merge still required |',
            '| UX-0 | Baseline + visual constitution | 90% | Fresh populated Dashboard matrix run `31403179971`, artifact `9068596037`, 8/8 FR/AR renders, zero page errors; cross-locale rich-state baseline **8.4/10**; docs/review/certification still pending | 🟡 |':
            '| UX-0 | Baseline + visual constitution | 100% | PR #83 merged as `0a9e026638021ea3e565d5cf870da7ed9ec1c5ee`; post-merge CI #1447 + drift #1259 green; fresh populated Dashboard baseline **8.4/10** established without reopening already certified surfaces | ✅ Closed |',
            '| UX-1 | Populated Dashboard locale parity + hierarchy | 0% | Localize all rich-state patient-facing KPI/chart/insight/event copy and canonical meal labels; preserve clinical calculations/data semantics; exact-final-head FR/AR matrix must score **>9.0/10** with no critical/high finding | 🔴 Next |':
            '| UX-1 | Populated Dashboard locale parity + hierarchy | 90% | Raw meal IDs and hard-coded rich-state French copy removed; FR/EN/AR GMI/CV/AGP/Hero/events/insights/recent-entry copy localized; clinical calculations unchanged; CI #1449 + drift #1261 green; first 32-view rendered matrix ~**9.2/10**; exact-final-head Reviewer + Certifier + merge pending | 🟡 |',
            '6. **UX product-quality lane:** close UX-0 governance, then execute UX-1 populated-Dashboard locale parity + hierarchy to >9.0/10; do not broaden beyond fresh evidence.':
            '6. **UX product-quality lane:** complete UX-1 exact-final-head visual/reviewer certification, merge with expected-head locking and verify post-merge CI/drift; do not broaden beyond fresh evidence.'
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'roadmap marker count != 1: {old[:100]!r} => {s.count(old)}')
              s = s.replace(old, new)
          anchor = 'UX-1 is intentionally narrower than the historical UX plan: the empty/first-use Dashboard, Journal, Profile, Importer and post-save surfaces remain protected by their existing rendered certifications. Further UX LOTs are created only if new rendered evidence exposes a sub-9 state.\n'
          if s.count(anchor) != 1:
              raise SystemExit('UX-1 anchor missing')
          detail = '''\n### UX-1 pre-closeout evidence\n\n- Baseline: populated Dashboard **8.4/10** cross-locale on run `31403179971`, artifact `9068596037`; raw `dinner` and French KPI/chart/insight residue were visible in Arabic.\n- Product remediation localizes canonical/legacy meal IDs plus all high-salience populated Dashboard Hero, GMI, CV, AGP, event, insight and recent-entry copy in FR/EN/AR. Clinical calculations, thresholds, persistence and data semantics are unchanged.\n- The clinical explainability contract was migrated rather than weakened: GMI method/coverage/laboratory limitation and CV general-reference/non-personalized wording are now asserted through the same l10n keys and explicit FR/EN/AR corpus.\n- Exact product head `2b1483fb89b6dcbb6885f017085a98b48d0d7e76` passed CI #1449 and migration drift #1261, including the complete Flutter suite and PostgreSQL source-of-truth.\n- First post-fix visual matrix run `31407376293`, artifact `9070305707`, digest `sha256:ea150de67056d74d6209ea3d862445d1235aaf9084e7f0b4ff971a23e604d`: 32 FR/AR top/mid/lower/full screenshots across `1440×1000`, `768×1024`, `390×844`, `360×560`, zero page errors; visual read approximately **9.2/10**. A second product-head render run `31408059463`, artifact `9070602793`, digest `sha256:13d13788927edd5e29cafe5915b6ed2a33cb7fdadc92599b8aac680abbc5e2b7` reproduced the same corrected runtime before the test-only contract migration.\n- UX-1 remains open until the final documentation head is re-rendered, isolated UX + Clinical reviewers pass, Release Certifier authorizes the exact expected head, PR #84 merges and post-merge CI/drift are green.\n'''
          s = s.replace(anchor, anchor + detail)
          p.write_text(s)
          PY
          git rm .github/workflows/ux-1-roadmap-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md
          git diff --cached --check
          git commit -m 'docs(ux): record UX-1 pre-closeout evidence'
          git push origin HEAD:ux/ux-1-dashboard-rich-locale-parity
