name: PR18 roadmap checkpoint

on:
  push:
    branches: [feat/p0-mena-provider-benchmark]

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-provider-benchmark
      - name: Update roadmap accurately
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/ROADMAP.md')
          text = path.read_text()
          text = text.replace(
              '| P0-MENA-4 — multimodal provider benchmark | 0% | ⚪ Next major lot | Evaluation set and benchmark pending |',
              '| P0-MENA-4 — multimodal provider benchmark | 29% | 🟡 Framework green; live runs blocked | 2 of 7 tasks closed in PR #18; text/STT/vision runs require approved evidence and credentials |'
          )
          text = text.replace(
              '**MENA critical-path completion:** 22 of 41 explicit roadmap tasks closed, approximately **54%**.',
              '**MENA critical-path completion:** 24 of 41 explicit roadmap tasks closed, approximately **59%**.'
          )
          text = text.replace(
              '- [ ] Build representative minimized and synthetic evaluation sets.\n- [ ] Define scoring for privacy, residency, no-training/no-retention terms, MENA quality, safety, latency, availability and cost.',
              '- [x] Build representative minimized and synthetic evaluation sets. **Strict contracts, stable fingerprints, modality/locale coverage and identity-data rejection are green in PR #18.**\n- [x] Define scoring for privacy, residency, no-training/no-retention terms, MENA quality, safety, latency, availability and cost. **Safety/privacy hard floors, evidence expiry, deterministic judges, versioned reports and fail-closed cutover are green in PR #18.**'
          )
          marker = 'One evaluation unit must remain one PR and one ROADMAP responsibility.\n'
          checkpoint = '''One evaluation unit must remain one PR and one ROADMAP responsibility.

## P0-MENA-4 checkpoint — PR #18

- **4A complete:** canonical synthetic/minimized corpus for text, STT, document OCR, glucometer OCR and meal vision.
- **4B complete:** provider-neutral runner, deterministic judges and weighted scoring.
- **4C infrastructure complete:** explicit provider evidence contract, expiry and disqualification rules, candidate registry and provenance-preserving reports.
- **4D infrastructure complete:** modality-specific ranking, rejected-alternative ledger and production cutover gate.
- **Live benchmark blocked:** no provider may be scored from fabricated values. Network runs require current legal/processor evidence, approved synthetic-only credentials and an authorized benchmark environment.
'''
          if marker not in text:
              raise SystemExit('roadmap marker not found')
          text = text.replace(marker, checkpoint)
          path.write_text(text)
          PY
          rm .github/workflows/pr18-roadmap-checkpoint.yml
      - name: Commit checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(roadmap): checkpoint P0-MENA-4 framework"
          git push origin HEAD:feat/p0-mena-provider-benchmark
