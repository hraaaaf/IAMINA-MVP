name: Demo multilingual Groq benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/demo-multilingual-benchmark.yml"
      - "backend/evaluation/demo_multilingual_benchmark.py"
      - "backend/companion/demo_model.py"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run bounded synthetic comparison through production path
        env:
          DJANGO_SETTINGS_MODULE: amina.settings
          SECRET_KEY: demo-benchmark-nonproduction
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: sqlite:///demo-benchmark.db
        working-directory: backend
        run: python evaluation/demo_multilingual_benchmark.py --output ../artifacts/demo-multilingual-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-multilingual-benchmark
          path: artifacts/demo-multilingual-benchmark.json
          retention-days: 14


  prod-casual-fallback-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Smoke production casual fallback continuity
        env:
          BASE_URL: https://iamina-certified.vercel.app
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          scenarios = [
              {
                  "name": "gulf",
                  "language": "ar",
                  "turns": [
                      "هلا، ما أبي حلول الحين، بس ودي أسولف شوي.",
                      "إيه كذا أحسن، خلك خفيف وبسيط.",
                  ],
              },
              {
                  "name": "darija",
                  "language": "fr",
                  "turns": [
                      "salam, ma bghit ta chi 7al daba, ghir n9ssr m3ak chwia",
                      "iwa hakka mzyan, khlli lhdra khfifa",
                  ],
              },
          ]

          failures = []
          results = []

          for scenario in scenarios:
              history = []
              replies = []
              for message in scenario["turns"]:
                  payload = json.dumps({
                      "message": message,
                      "language": scenario["language"],
                      "history": history,
                  }, ensure_ascii=False).encode("utf-8")
                  req = urllib.request.Request(
                      base + "/api/v1/demo/chat",
                      data=payload,
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = json.loads(response.read().decode("utf-8"))
                  reply = body.get("reply", "").strip()
                  if not reply:
                      failures.append(scenario["name"] + ":empty")
                      break
                  replies.append(reply)
                  history.extend([
                      {"role": "user", "content": message},
                      {"role": "assistant", "content": reply},
                  ])

              if len(replies) == 2 and replies[0] == replies[1]:
                  failures.append(scenario["name"] + ":repeated-identical")
              joined = " ".join(replies)
              if "وضع العرض" in joined or "mode démo" in joined.lower():
                  failures.append(scenario["name"] + ":generic-demo-fallback")
              if scenario["name"] == "darija":
                  if any("\u0600" <= ch <= "\u06ff" for ch in joined):
                      failures.append("darija:arabic-script-drift")

              results.append({"name": scenario["name"], "replies": replies})

          print(json.dumps({
              "production": True,
              "synthetic": True,
              "status": "PASS" if not failures else "FAIL",
              "failures": failures,
              "results": results,
          }, ensure_ascii=False))
          if failures:
              raise SystemExit("casual fallback smoke failures: " + ", ".join(failures))
          PY
