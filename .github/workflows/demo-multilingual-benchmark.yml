name: Demo multilingual Groq benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/demo-multilingual-benchmark.yml"
      - "backend/evaluation/demo_multilingual_benchmark.py"
      - "backend/companion/demo_model.py"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run bounded synthetic comparison through production path
        env:
          DJANGO_SETTINGS_MODULE: amina.settings
          SECRET_KEY: demo-benchmark-nonproduction
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: sqlite:///demo-benchmark.db
        working-directory: backend
        run: python evaluation/demo_multilingual_benchmark.py --output ../artifacts/demo-multilingual-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-multilingual-benchmark
          path: artifacts/demo-multilingual-benchmark.json
          retention-days: 14


  prod-casual-chat-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Smoke production casual chat framing
        env:
          BASE_URL: https://iamina-certified.vercel.app
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          scenarios = [
              ("fr", [
                  "Pas besoin d'un plan, juste parle-moi normalement.",
                  "Je veux juste discuter un peu, rien de plus.",
              ]),
              ("fr", [
                  "salam, lyouma t3yit chwia bghit ghir nhder chwia",
                  "ma bghitch conseils daba, ghir hdar m3aya normal",
              ]),
          ]

          bad_help = [
              "comment puis-je t'aider",
              "comment je peux t'aider",
              "n9dar n3awnk",
              "kifash n9dar n3awnk",
              "how can i help",
          ]
          bad_awkward = ["ndardak"]
          failures = []
          results = []

          for idx, (language, turns) in enumerate(scenarios, start=1):
              history = []
              replies = []
              for message in turns:
                  payload = json.dumps({
                      "message": message,
                      "language": language,
                      "history": history,
                  }, ensure_ascii=False).encode("utf-8")
                  req = urllib.request.Request(
                      base + "/api/v1/demo/chat",
                      data=payload,
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = json.loads(response.read().decode("utf-8"))
                  reply = body.get("reply", "").strip()
                  if not reply:
                      failures.append(f"scenario{idx}:empty")
                      break
                  replies.append(reply)
                  history.extend([
                      {"role": "user", "content": message},
                      {"role": "assistant", "content": reply},
                  ])

              joined = " ".join(replies).lower()
              if any(x in joined for x in bad_help):
                  failures.append(f"scenario{idx}:help-desk-framing")
              if idx == 2:
                  if any("\u0600" <= ch <= "\u06ff" for ch in joined):
                      failures.append("scenario2:arabic-script-drift")
                  if any(x in joined for x in bad_awkward):
                      failures.append("scenario2:awkward-darija")

              results.append({"scenario": idx, "replies": replies})

          print(json.dumps({
              "production": True,
              "synthetic": True,
              "status": "PASS" if not failures else "FAIL",
              "failures": failures,
              "results": results,
          }, ensure_ascii=False))
          if failures:
              raise SystemExit("casual chat failures: " + ", ".join(failures))
          PY
