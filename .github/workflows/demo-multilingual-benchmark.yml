name: Demo multilingual Groq benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/demo-multilingual-benchmark.yml"
      - "backend/evaluation/demo_multilingual_benchmark.py"
      - "backend/companion/demo_model.py"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run bounded synthetic comparison through production path
        env:
          DJANGO_SETTINGS_MODULE: amina.settings
          SECRET_KEY: demo-benchmark-nonproduction
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: sqlite:///demo-benchmark.db
        working-directory: backend
        run: python evaluation/demo_multilingual_benchmark.py --output ../artifacts/demo-multilingual-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-multilingual-benchmark
          path: artifacts/demo-multilingual-benchmark.json
          retention-days: 14


  prod-food-permission-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reproduce food permission gap in production demo
        env:
          BASE_URL: https://iamina-certified.vercel.app
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          cases = [
              ("fr", "je peux manger un mille feuille !?"),
              ("en", "Can I eat a slice of cake?"),
              ("fr", "wach n9dar nakol gateau?"),
              ("ar", "هل أقدر آكل قطعة حلوى؟"),
          ]
          results = []
          for language, message in cases:
              payload = json.dumps({
                  "message": message,
                  "language": language,
                  "history": [],
              }, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(
                  base + "/api/v1/demo/chat",
                  data=payload,
                  headers={"Content-Type":"application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  body = json.loads(response.read().decode("utf-8"))
              results.append({
                  "language": language,
                  "message": message,
                  "reply": body.get("reply", "").strip(),
              })
          print(json.dumps({
              "production": True,
              "synthetic": True,
              "results": results,
          }, ensure_ascii=False))
          PY
