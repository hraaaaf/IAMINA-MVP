name: Demo multilingual Groq benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/demo-multilingual-benchmark.yml"
      - "backend/evaluation/demo_multilingual_benchmark.py"
      - "backend/companion/demo_model.py"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run bounded synthetic comparison through production path
        env:
          DJANGO_SETTINGS_MODULE: amina.settings
          SECRET_KEY: demo-benchmark-nonproduction
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: sqlite:///demo-benchmark.db
        working-directory: backend
        run: python evaluation/demo_multilingual_benchmark.py --output ../artifacts/demo-multilingual-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-multilingual-benchmark
          path: artifacts/demo-multilingual-benchmark.json
          retention-days: 14


  prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Smoke production demo continuity
        env:
          BASE_URL: https://iamina-certified.vercel.app
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          with urllib.request.urlopen(base + "/api/v1/demo/scenarios", timeout=30) as response:
              assert response.status == 200, response.status

          history = []
          turns = [
              ("fr", "Pour cette démo, retiens deux mots-clés : Atlas et Cèdre."),
              ("en", "What were the two keywords I mentioned?"),
              ("fr", "Ajoute maintenant Rivage aux deux mots-clés précédents."),
              ("en", "Which keyword did I add later?"),
              ("fr", "Rappelle les trois mots-clés dans leur ordre d'apparition, sans en inventer."),
          ]
          replies = []

          for index, (language, message) in enumerate(turns, start=1):
              payload = json.dumps(
                  {"message": message, "language": language, "history": history},
                  ensure_ascii=False,
              ).encode("utf-8")
              request = urllib.request.Request(
                  base + "/api/v1/demo/chat",
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  body = json.loads(response.read().decode("utf-8"))
              assert body.get("reply"), f"turn {index}: empty reply"
              assert not body.get("is_emergency"), f"turn {index}: emergency"
              replies.append(body["reply"])
              history.extend(
                  [
                      {"role": "user", "content": message},
                      {"role": "assistant", "content": body["reply"]},
                  ]
              )

          second = replies[1].lower()
          fourth = replies[3].lower()
          fifth = replies[4].lower()
          assert "atlas" in second and "cèdre" in second, second
          assert "rivage" in fourth, fourth
          positions = [fifth.find("atlas"), fifth.find("cèdre"), fifth.find("rivage")]
          assert all(position >= 0 for position in positions), fifth
          assert positions == sorted(positions), fifth

          print(json.dumps({
              "production": True,
              "synthetic": True,
              "continuity": "PASS",
              "turns": 5,
              "history_items_final": len(history),
              "replies": replies,
          }, ensure_ascii=False))
          PY
