name: Demo multilingual Groq benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/demo-multilingual-benchmark.yml"
      - "backend/evaluation/demo_multilingual_benchmark.py"
      - "backend/companion/demo_model.py"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run bounded synthetic comparison through production path
        env:
          DJANGO_SETTINGS_MODULE: amina.settings
          SECRET_KEY: demo-benchmark-nonproduction
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: sqlite:///demo-benchmark.db
        working-directory: backend
        run: python evaluation/demo_multilingual_benchmark.py --output ../artifacts/demo-multilingual-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-multilingual-benchmark
          path: artifacts/demo-multilingual-benchmark.json
          retention-days: 14


  prod-natural-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit production natural conversation variants
        env:
          BASE_URL: https://iamina-certified.vercel.app
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          scenarios = [
              ("fr", [
                  "Franchement j’ai pas envie de réfléchir, raconte-moi juste un truc léger.",
                  "Oui voilà, reste simple et pas trop sérieux.",
              ]),
              ("en", [
                  "I don't need fixing, just keep me company for a minute.",
                  "Exactly. Keep it casual and don't turn it into advice.",
              ]),
              ("fr", [
                  "salam, ma bghit ta chi 7al daba, ghir n9ssr m3ak chwia",
                  "iwa hakka mzyan, khlli lhdra khfifa",
              ]),
              ("ar", [
                  "هلا، ما أبي حلول الحين، بس ودي أسولف شوي.",
                  "إيه كذا أحسن، خلك خفيف وبسيط.",
              ]),
          ]

          failures = []
          results = []
          banned_help = (
              "how can i help",
              "what can i help",
              "comment puis-je t'aider",
              "comment je peux t'aider",
              "n9dar n3awnk",
              "kifash n9dar n3awnk",
              "كيف أقدر أساعدك",
              "كيف يمكنني مساعدتك",
          )
          advice_markers = (
              "you should",
              "i recommend",
              "tu devrais",
              "je te conseille",
              "أنصحك",
              "لازم",
          )
          gulf_bad = ("شو", "شنو", "بدك", "عنو", "واش", "بغيت")

          for idx, (language, turns) in enumerate(scenarios, start=1):
              history = []
              replies = []
              for message in turns:
                  payload = json.dumps({
                      "message": message,
                      "language": language,
                      "history": history,
                  }, ensure_ascii=False).encode("utf-8")
                  req = urllib.request.Request(
                      base + "/api/v1/demo/chat",
                      data=payload,
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = json.loads(response.read().decode("utf-8"))
                  reply = body.get("reply", "").strip()
                  if not reply:
                      failures.append(f"scenario{idx}:empty")
                      break
                  replies.append(reply)
                  history.extend([
                      {"role": "user", "content": message},
                      {"role": "assistant", "content": reply},
                  ])

              joined = " ".join(replies).lower()
              prefixes = [" ".join(re.findall(r"\w+", r.lower())[:4]) for r in replies]
              checks = {
                  "two_replies": len(replies) == 2,
                  "concise": all(len(r) <= 500 for r in replies),
                  "no_help_desk": not any(x in joined for x in banned_help),
                  "no_advice": not any(x in joined for x in advice_markers),
                  "no_repeated_prefix": len(prefixes) == len(set(prefixes)),
              }
              if idx == 3:
                  checks["darija_latin_only"] = all(
                      not any("\u0600" <= ch <= "\u06ff" for ch in r)
                      for r in replies
                  )
              if idx == 4:
                  checks["gulf_no_drift"] = all(
                      not any(x in r for x in gulf_bad)
                      for r in replies
                  )

              bad = [name for name, ok in checks.items() if not ok]
              failures.extend([f"scenario{idx}:{name}" for name in bad])
              results.append({
                  "scenario": idx,
                  "language": language,
                  "checks": checks,
                  "replies": replies,
              })

          print(json.dumps({
              "production": True,
              "synthetic": True,
              "request_count": 8,
              "status": "PASS" if not failures else "FAIL",
              "failures": failures,
              "results": results,
          }, ensure_ascii=False))
          if failures:
              raise SystemExit("natural variant failures: " + ", ".join(failures))
          PY
