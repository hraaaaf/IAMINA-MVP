name: Demo multilingual Groq benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/demo-multilingual-benchmark.yml"
      - "backend/evaluation/demo_multilingual_benchmark.py"
      - "backend/companion/demo_model.py"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run bounded synthetic comparison through production path
        env:
          DJANGO_SETTINGS_MODULE: amina.settings
          SECRET_KEY: demo-benchmark-nonproduction
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: sqlite:///demo-benchmark.db
        working-directory: backend
        run: python evaluation/demo_multilingual_benchmark.py --output ../artifacts/demo-multilingual-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-multilingual-benchmark
          path: artifacts/demo-multilingual-benchmark.json
          retention-days: 14


  prod-quality-postfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit production demo quality after dialect guard
        env:
          BASE_URL: https://iamina-certified.vercel.app
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          scenarios = [
              ("fr", [
                  "Salut, j’ai eu une longue journée et j’ai juste envie de souffler un peu.",
                  "Pas besoin d’un plan, juste parle-moi normalement.",
                  "Tu peux être un peu plus naturel et moins formel ?",
              ]),
              ("en", [
                  "Hey, today was a bit much. I just want a normal conversation.",
                  "No advice please, just talk to me like a person.",
                  "Keep it short and natural.",
              ]),
              ("fr", [
                  "salam, lyouma t3yit chwia bghit ghir nhder chwia",
                  "ma bghitch conseils daba, ghir hdar m3aya normal",
                  "khlliha basita o tabi3iya",
              ]),
              ("ar", [
                  "هلا، اليوم كان طويل شوي وأبغى بس أسولف.",
                  "ما أبغى نصائح الحين، بس كلمني بشكل طبيعي.",
                  "خلك مختصر وعفوي.",
              ]),
          ]

          all_results = []
          failures = []

          for index, (language, turns) in enumerate(scenarios, start=1):
              history = []
              replies = []
              for message in turns:
                  payload = json.dumps({
                      "message": message,
                      "language": language,
                      "history": history,
                  }, ensure_ascii=False).encode("utf-8")
                  req = urllib.request.Request(
                      base + "/api/v1/demo/chat",
                      data=payload,
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = json.loads(response.read().decode("utf-8"))
                  reply = body.get("reply", "").strip()
                  if not reply:
                      failures.append(f"scenario{index}:empty")
                      break
                  replies.append(reply)
                  history.extend([
                      {"role": "user", "content": message},
                      {"role": "assistant", "content": reply},
                  ])

              lower = " ".join(replies).lower()
              prefixes = [" ".join(re.findall(r"\w+", r.lower())[:4]) for r in replies]
              checks = {
                  "three_replies": len(replies) == 3,
                  "concise": all(len(r) <= 500 for r in replies),
                  "no_robotic_meta": not any(x in lower for x in ["as an ai", "je suis une ia", "public demo mode"]),
                  "no_unwanted_advice": not any(x in lower for x in ["you should", "i recommend", "je te conseille", "tu devrais", "أنصحك", "لازم"]),
                  "no_repeated_prefix": len(prefixes) == len(set(prefixes)),
              }

              if index == 3:
                  checks["darija_latin_only"] = all(
                      not any("\u0600" <= ch <= "\u06ff" for ch in reply)
                      for reply in replies
                  )
              if index == 4:
                  bad = ("شو", "شنو", "بدك", "عنو", "واش", "بغيت")
                  checks["gulf_no_drift_markers"] = all(
                      not any(token in reply for token in bad)
                      for reply in replies
                  )

              failed = [name for name, ok in checks.items() if not ok]
              failures.extend([f"scenario{index}:{name}" for name in failed])
              all_results.append({
                  "scenario": index,
                  "language": language,
                  "checks": checks,
                  "replies": replies,
              })

          print(json.dumps({
              "production": True,
              "synthetic": True,
              "status": "PASS" if not failures else "FAIL",
              "failures": failures,
              "results": all_results,
          }, ensure_ascii=False))
          if failures:
              raise SystemExit("quality failures: " + ", ".join(failures))
          PY
