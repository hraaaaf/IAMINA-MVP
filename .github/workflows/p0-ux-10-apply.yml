name: P0-UX-10 apply

on:
  push:
    branches:
      - fix/p0-ux-10-importer-document-entry
    paths:
      - .github/workflows/p0-ux-10-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-ux-10-importer-document-entry
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply consolidation
        run: python3 .github/scripts/p0_ux_10_importer_document_entry.py
      - name: Validate targeted contracts
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test --no-pub test/p0_ux_10_importer_document_entry_contract_test.dart test/p0_mobile_import_navigation_test.dart test/p0_audited_page_localization_contract_test.dart
      - name: Commit clean product diff
        run: |
          git rm .github/workflows/p0-ux-10-apply.yml
          git rm .github/scripts/p0_ux_10_importer_document_entry.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/lib/features/import/import_screen.dart frontend/lib/features/documents/document_import_screen.dart frontend/test/p0_ux_10_importer_document_entry_contract_test.dart
          git commit -m 'fix(ux): consolidate importer document entry point'
          git push origin HEAD:fix/p0-ux-10-importer-document-entry
