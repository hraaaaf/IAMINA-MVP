name: Companion real chat E2E screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/lib/features/companion/**'
      - 'frontend/lib/services/companion_service.dart'
      - 'frontend/lib/ui_companion_chat_e2e_main.dart'
      - 'frontend/lib/modules/diabetes_module.dart'
      - 'frontend/test/services/companion_service_chat_test.dart'
      - 'backend/ai/api/v1/ai.py'
      - 'backend/companion/**'
      - '.github/workflows/companion-chat-e2e-screenshot.yml'

permissions:
  contents: read

jobs:
  real-chat-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: iamina-companion-chat-e2e-nonproduction
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///iamina-companion-chat-e2e.db
      IAMINA_CONVERSATION_NETWORK_AUTHORIZED: 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Prepare proof directory
        run: mkdir -p companion-chat-e2e

      - name: Validate current Flutter chat implementation
        working-directory: frontend
        run: |
          flutter pub get
          dart format \
            lib/features/companion/companion_conversation_screen.dart \
            lib/services/companion_service.dart \
            lib/ui_companion_chat_e2e_main.dart \
            test/services/companion_service_chat_test.dart
          git diff -- \
            lib/features/companion/companion_conversation_screen.dart \
            lib/services/companion_service.dart \
            lib/ui_companion_chat_e2e_main.dart \
            test/services/companion_service_chat_test.dart
          flutter analyze --no-fatal-infos \
            lib/features/companion/companion_conversation_screen.dart \
            lib/services/companion_service.dart \
            lib/ui_companion_chat_e2e_main.dart \
            lib/modules/diabetes_module.dart
          flutter test test/services/companion_service_chat_test.dart

      - name: Start local IAMINA backend
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py runserver 127.0.0.1:8000 >/tmp/iamina-chat-backend.log 2>&1 &
          echo $! >/tmp/iamina-chat-backend.pid
          READY=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/docs >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != '1' ]; then
            cat /tmp/iamina-chat-backend.log >&2 || true
            exit 1
          fi

      - name: Register synthetic IAMINA identity
        shell: bash
        env:
          E2E_EMAIL: e2e-chat-${{ github.run_id }}-${{ github.run_attempt }}@example.invalid
          E2E_PASSWORD: IAMINA-E2E-2026!Synthetic#42
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/register-payload.json
          import json
          import os
          print(json.dumps({
              'email': os.environ['E2E_EMAIL'],
              'password': os.environ['E2E_PASSWORD'],
              'first_name': 'Synthetic',
              'last_name': 'E2E',
          }))
          PY
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/register-payload.json > /tmp/register-response.json
          python3 - <<'PY'
          import json
          payload = json.load(open('/tmp/register-response.json'))
          token = payload.get('access_token', '')
          assert token.startswith('iamina.'), 'synthetic native token missing'
          open('/tmp/iamina-e2e-token', 'w').write(token)
          print('Synthetic IAMINA identity created; token retained on runner only.')
          PY

      - name: Build current real chat browser entrypoint
        working-directory: frontend
        run: |
          flutter build web --release -t lib/ui_companion_chat_e2e_main.dart \
            --dart-define=API_BASE_URL=http://127.0.0.1:7358

      - name: Run Chrome real exchange and capture states
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client

          cat > /tmp/iamina_proxy.py <<'PY'
          import http.client
          import http.server
          import os
          from pathlib import Path

          root = Path(os.environ['STATIC_ROOT'])
          proof = Path(os.environ['PROOF_DIR'])
          token = Path('/tmp/iamina-e2e-token').read_text().strip()

          class Handler(http.server.SimpleHTTPRequestHandler):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, directory=str(root), **kwargs)

              def do_POST(self):
                  if not self.path.startswith('/api/'):
                      self.send_error(404)
                      return
                  length = int(self.headers.get('content-length', '0'))
                  body = self.rfile.read(length)
                  conn = http.client.HTTPConnection('127.0.0.1', 8000, timeout=30)
                  conn.request(
                      'POST',
                      self.path,
                      body=body,
                      headers={
                          'Authorization': f'Bearer {token}',
                          'Content-Type': self.headers.get('content-type', 'application/json'),
                      },
                  )
                  response = conn.getresponse()
                  payload = response.read()
                  self.send_response(response.status)
                  self.send_header(
                      'Content-Type',
                      response.getheader('Content-Type', 'application/json'),
                  )
                  self.send_header('Content-Length', str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)
                  if self.path == '/api/v1/ai/chat':
                      proof.mkdir(parents=True, exist_ok=True)
                      (proof / 'chat-request.json').write_bytes(body)
                      (proof / 'chat-response.json').write_bytes(payload)
                  conn.close()

              def log_message(self, fmt, *args):
                  return

          http.server.ThreadingHTTPServer(('127.0.0.1', 7358), Handler).serve_forever()
          PY

          STATIC_ROOT="$GITHUB_WORKSPACE/frontend/build/web" \
          PROOF_DIR="$GITHUB_WORKSPACE/companion-chat-e2e" \
            python3 /tmp/iamina_proxy.py >/tmp/iamina-e2e-proxy.log 2>&1 &
          PROXY_PID=$!

          cleanup_process() {
            local pid="$1"
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 10); do
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 0.2
            done
            kill -9 "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }

          cleanup_all() {
            if [ -n "${CHROME_PID:-}" ]; then cleanup_process "$CHROME_PID"; fi
            if [ -n "${PROXY_PID:-}" ]; then cleanup_process "$PROXY_PID"; fi
            if [ -f /tmp/iamina-chat-backend.pid ]; then
              cleanup_process "$(cat /tmp/iamina-chat-backend.pid)"
            fi
          }
          trap cleanup_all EXIT

          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7358 >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != '1' ]; then
            cat /tmp/iamina-e2e-proxy.log >&2 || true
            exit 1
          fi

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          PROFILE="$(mktemp -d)"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --enable-unsafe-swiftshader \
            --hide-scrollbars \
            --force-renderer-accessibility \
            --remote-allow-origins='*' \
            --remote-debugging-port=9222 \
            --user-data-dir="$PROFILE" \
            --window-size=390,844 \
            http://127.0.0.1:7358/ \
            >/tmp/iamina-chat-chrome.log 2>&1 &
          CHROME_PID=$!

          DEVTOOLS=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/list >/dev/null; then
              DEVTOOLS=1
              break
            fi
            sleep 1
          done
          if [ "$DEVTOOLS" != '1' ]; then
            cat /tmp/iamina-chat-chrome.log >&2 || true
            exit 1
          fi

          cat > /tmp/chat_cdp.py <<'PY'
          import base64
          import json
          import time
          import urllib.request
          from pathlib import Path
          from websocket import create_connection

          proof = Path('companion-chat-e2e')
          pages = json.load(urllib.request.urlopen('http://127.0.0.1:9222/json/list'))
          page = next(item for item in pages if item.get('type') == 'page')
          ws = create_connection(page['webSocketDebuggerUrl'], timeout=20)
          counter = 0

          def call(method, params=None):
              global counter
              counter += 1
              ws.send(json.dumps({'id': counter, 'method': method, 'params': params or {}}))
              while True:
                  response = json.loads(ws.recv())
                  if response.get('id') == counter:
                      if 'error' in response:
                          raise RuntimeError(response['error'])
                      return response.get('result', {})

          def screenshot(name):
              shot = call('Page.captureScreenshot', {
                  'format': 'png',
                  'captureBeyondViewport': False,
                  'fromSurface': True,
              })
              data = shot.get('data')
              if not data:
                  raise RuntimeError(f'No screenshot payload for {name}')
              (proof / name).write_bytes(base64.b64decode(data))

          def click(x, y):
              call('Input.dispatchMouseEvent', {
                  'type': 'mousePressed', 'x': x, 'y': y,
                  'button': 'left', 'clickCount': 1,
              })
              call('Input.dispatchMouseEvent', {
                  'type': 'mouseReleased', 'x': x, 'y': y,
                  'button': 'left', 'clickCount': 1,
              })

          call('Page.enable')
          call('Runtime.enable')
          call('Emulation.setDeviceMetricsOverride', {
              'width': 390,
              'height': 844,
              'deviceScaleFactor': 1,
              'mobile': True,
          })
          call('Page.reload', {'ignoreCache': True})
          time.sleep(10)
          screenshot('chat-empty-390x844.png')

          message = "Est-ce que tu peux me dire quelle dose d'insuline prendre ?"
          click(155, 793)
          time.sleep(0.7)
          call('Input.insertText', {'text': message})
          time.sleep(1)
          screenshot('chat-typed-390x844.png')
          click(354, 793)

          deadline = time.time() + 15
          while time.time() < deadline:
              if (proof / 'chat-response.json').exists():
                  break
              time.sleep(0.25)
          if not (proof / 'chat-response.json').exists():
              raise RuntimeError('No /api/v1/ai/chat response captured from the app')

          payload = json.loads((proof / 'chat-response.json').read_text())
          if not payload.get('reply') or payload.get('reply_language') != 'fr':
              raise RuntimeError(f'Unexpected real chat response: {payload}')
          time.sleep(2)
          screenshot('chat-reply-390x844.png')
          ws.close()
          PY

          python3 /tmp/chat_cdp.py

          python3 - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(Path('companion-chat-e2e/chat-request.json').read_text())
          response = json.loads(Path('companion-chat-e2e/chat-response.json').read_text())
          assert request == {
              'message': "Est-ce que tu peux me dire quelle dose d'insuline prendre ?",
              'context_days': 14,
          }
          assert response['reply']
          assert response['conversation_id'].startswith('conv-')
          assert response['reply_language'] == 'fr'
          for name in (
              'chat-empty-390x844.png',
              'chat-typed-390x844.png',
              'chat-reply-390x844.png',
          ):
              path = Path('companion-chat-e2e') / name
              assert path.stat().st_size > 10000, (name, path.stat().st_size)
          print('Real UI -> IAMINA API -> certified Companion exchange verified.')
          PY

          cleanup_process "$CHROME_PID"
          CHROME_PID=''
          rm -rf "$PROFILE" 2>/dev/null || true
          cleanup_process "$PROXY_PID"
          PROXY_PID=''
          cleanup_process "$(cat /tmp/iamina-chat-backend.pid)"
          rm -f /tmp/iamina-chat-backend.pid
          trap - EXIT

      - name: Upload real chat visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-companion-real-chat-e2e
          path: |
            companion-chat-e2e/*.png
            companion-chat-e2e/chat-request.json
            companion-chat-e2e/chat-response.json
          if-no-files-found: warn
          retention-days: 7
