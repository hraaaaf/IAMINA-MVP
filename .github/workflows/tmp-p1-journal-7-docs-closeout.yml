name: P1-JOURNAL-7 temporary docs closeout

on:
  push:
    branches:
      - agent/p1-journal-ramadan-v2
    paths:
      - .github/workflows/tmp-p1-journal-7-docs-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-journal-ramadan-v2
          fetch-depth: 0
      - name: Apply canonical pre-merge closeout
        run: python3 .github/scripts/tmp_p1_j7_docs_closeout.py
      - name: Validate and commit without temporary residue
        run: |
          git config user.name 'hraaaaf'
          git config user.email '123034021+hraaaaf@users.noreply.github.com'
          git rm .github/scripts/tmp_p1_j7_docs_closeout.py .github/workflows/tmp-p1-journal-7-docs-closeout.yml
          git add docs/ROADMAP.md docs/SPECS.md docs/MEDICAL_DATA_PLAN.md
          git diff --cached --check
          git commit -m 'docs(journal): certify Ramadan v2 pre-merge state'
          git fetch origin agent/p1-journal-ramadan-v2
          git rebase origin/agent/p1-journal-ramadan-v2
          git push origin HEAD:agent/p1-journal-ramadan-v2
