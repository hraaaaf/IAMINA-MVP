name: P0-UX-11 compact fix

on:
  push:
    branches:
      - fix/p0-ux-11-first-use-dashboard
    paths:
      - .github/workflows/p0-ux-11-compact-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-ux-11-first-use-dashboard
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply compact fix
        run: python3 scripts/apply_p0_ux_11_compact_fix.py
      - name: Validate targeted contracts
        working-directory: frontend
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze --no-fatal-infos
          flutter test test/p0_ux_11_first_use_dashboard_contract_test.dart test/p0_ux_9_small_screen_contract_test.dart test/p0_ux_7_desktop_tablet_contract_test.dart
      - name: Commit clean product diff
        run: |
          git checkout origin/main -- frontend/pubspec.lock frontend/.flutter-plugins-dependencies
          rm .github/workflows/p0-ux-11-compact-fix.yml scripts/apply_p0_ux_11_compact_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ux): keep first-use actions clear on short screens'
          git push origin HEAD:fix/p0-ux-11-first-use-dashboard