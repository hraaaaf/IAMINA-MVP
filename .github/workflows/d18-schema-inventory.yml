name: D18 scoped SQLite inventory tests
on:
  push:
    branches:
      - feat/iamina-d18-web-progressive-profile-20261031
    paths:
      - frontend/lib/data/drift/d18_schema_inventory.dart
      - frontend/test/data/drift/d18_schema_inventory_test.dart
      - frontend/test/data/drift/d18_real_web_vault_smoke_test.dart
      - .github/workflows/d18-schema-inventory.yml
  pull_request:
    paths:
      - frontend/lib/data/drift/d18_schema_inventory.dart
      - frontend/test/data/drift/d18_schema_inventory_test.dart
      - .github/workflows/d18-schema-inventory.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d18-schema-inventory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze D18 inventory files
        run: dart analyze lib/data/drift/d18_schema_inventory.dart test/data/drift/d18_schema_inventory_test.dart
      - name: Test D18 inventory and scope guard
        run: flutter test --no-pub test/data/drift/d18_schema_inventory_test.dart

  real-drift-web-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze real-browser smoke
        run: dart analyze test/data/drift/d18_real_web_vault_smoke_test.dart
      - name: Stage exact production SQLite WASM and Drift worker for Chrome test
        run: |
          set -euo pipefail
          test -s web/sqlite3.wasm
          test -s web/drift_worker.js
          mkdir -p lib/d18_ci_web_assets
          cp web/sqlite3.wasm lib/d18_ci_web_assets/sqlite3.wasm
          cp web/drift_worker.js lib/d18_ci_web_assets/drift_worker.js
          cmp web/sqlite3.wasm lib/d18_ci_web_assets/sqlite3.wasm
          cmp web/drift_worker.js lib/d18_ci_web_assets/drift_worker.js
      - name: Real Drift Web vault on Chromium (not native)
        run: |
          set -euo pipefail
          export CHROME_EXECUTABLE="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_EXECUTABLE"
          flutter test --no-pub --platform chrome --timeout 90s \
            --dart-define=D18_WEB_WASM_URI=packages/amina/d18_ci_web_assets/sqlite3.wasm \
            --dart-define=D18_WEB_WORKER_URI=packages/amina/d18_ci_web_assets/drift_worker.js \
            test/data/drift/d18_real_web_vault_smoke_test.dart
