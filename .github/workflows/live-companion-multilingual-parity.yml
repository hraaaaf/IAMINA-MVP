name: IAMINA Companion multilingual parity probe

on:
  push:
    branches:
      - audit/companion-multilingual-real-conversation
    paths:
      - "backend/evaluation/live_companion_multilingual_parity.py"
      - ".github/workflows/live-companion-multilingual-parity.yml"

permissions:
  contents: read

concurrency:
  group: iamina-companion-multilingual-parity
  cancel-in-progress: false

jobs:
  parity:
    name: Real Companion same-topic x9 locales
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: iamina-multilingual-parity-nonproduction
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///iamina-multilingual-parity.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      IAMINA_CONVERSATION_NETWORK_AUTHORIZED: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt ruff==0.15.17
      - name: Validate probe before network
        run: |
          ruff check evaluation/live_companion_multilingual_parity.py
          python -m py_compile evaluation/live_companion_multilingual_parity.py
          python manage.py shell -c "from evaluation.live_companion_multilingual_parity import validate_scenarios; print(validate_scenarios())"
      - name: Run bounded real multilingual Companion probe
        run: python manage.py shell -c "from evaluation.live_companion_multilingual_parity import main; main()"
      - name: Upload raw synthetic transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-companion-multilingual-parity
          path: artifacts/iamina-companion-multilingual-parity.json
          if-no-files-found: warn
          retention-days: 7
