name: UX10 nav helper

on:
  push:
    branches: [ux/10-dashboard-pixel-convergence]
    paths: [.github/workflows/ux10-nav-helper.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/10-dashboard-pixel-convergence
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: Recompose mobile nav with central Add FAB
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/lib/features/navigation/main_shell.dart')
          s = p.read_text()
          start = s.index('class _BottomNav extends StatelessWidget')
          prefix = s[:start]
          tail = r'''class _BottomNav extends StatelessWidget {
  final List<_NavEntry> entries;
  final int selectedIndex;

  const _BottomNav({required this.entries, required this.selectedIndex});

  _NavEntry? _entry(String route) {
    for (final entry in entries) {
      if (entry.route == route) return entry;
    }
    return null;
  }

  @override
  Widget build(BuildContext context) {
    final dark = AminaTheme.isDark(context);
    final dashboard = _entry('/dashboard');
    final journal = _entry('/journal');
    final importer = _entry('/importer');
    final profile = _entry('/profile');
    final visible = <_NavEntry?>[dashboard, journal, importer, profile];
    final surface = dark
        ? AminaTheme.darkCard.withValues(alpha: 0.97)
        : Colors.white.withValues(alpha: 0.98);

    return SafeArea(
      top: false,
      minimum: const EdgeInsetsDirectional.fromSTEB(12, 0, 12, 8),
      child: SizedBox(
        height: 82,
        child: Stack(
          alignment: Alignment.topCenter,
          clipBehavior: Clip.none,
          children: [
            Positioned.fill(
              top: 12,
              child: ClipRRect(
                borderRadius: BorderRadius.circular(24),
                child: BackdropFilter(
                  filter: ImageFilter.blur(sigmaX: 18, sigmaY: 18),
                  child: Container(
                    decoration: BoxDecoration(
                      color: surface,
                      borderRadius: BorderRadius.circular(24),
                      border: Border.all(
                        color: dark
                            ? Colors.white.withValues(alpha: 0.10)
                            : const Color(0xFFE7E5DE),
                      ),
                      boxShadow: [
                        BoxShadow(
                          color: Colors.black.withValues(alpha: dark ? 0.24 : 0.08),
                          blurRadius: 26,
                          offset: const Offset(0, 9),
                        ),
                      ],
                    ),
                    child: Row(
                      children: [
                        for (var i = 0; i < visible.length; i++) ...[
                          if (i == 2) const SizedBox(width: 68),
                          Expanded(
                            child: visible[i] == null
                                ? const SizedBox.shrink()
                                : _ReferenceNavDestination(entry: visible[i]!),
                          ),
                        ],
                      ],
                    ),
                  ),
                ),
              ),
            ),
            Positioned(
              top: 0,
              child: Semantics(
                button: true,
                label: AppLocalizations.of(context)!.addEntry,
                child: Tooltip(
                  message: AppLocalizations.of(context)!.addEntry,
                  child: InkWell(
                    key: const ValueKey('mobile-nav-add'),
                    onTap: () {
                      HapticFeedback.lightImpact();
                      GoRouter.of(context).go('/ajouter');
                    },
                    customBorder: const CircleBorder(),
                    child: Container(
                      width: 62,
                      height: 62,
                      decoration: BoxDecoration(
                        gradient: const LinearGradient(
                          colors: [Color(0xFF086263), Color(0xFF03484F)],
                          begin: AlignmentDirectional.topStart,
                          end: AlignmentDirectional.bottomEnd,
                        ),
                        shape: BoxShape.circle,
                        border: Border.all(
                          color: dark ? AminaTheme.darkCard : Colors.white,
                          width: 5,
                        ),
                        boxShadow: [
                          BoxShadow(
                            color: const Color(0xFF064D50).withValues(alpha: 0.30),
                            blurRadius: 18,
                            offset: const Offset(0, 8),
                          ),
                        ],
                      ),
                      child: const Icon(Icons.add_rounded, color: Colors.white, size: 30),
                    ),
                  ),
                ),
              ),
            ),
          ],
        ),
      ),
    );
  }
}

class _ReferenceNavDestination extends StatelessWidget {
  final _NavEntry entry;

  const _ReferenceNavDestination({required this.entry});

  @override
  Widget build(BuildContext context) {
    final dark = AminaTheme.isDark(context);
    final selected = GoRouterState.of(context).uri.path.startsWith(entry.route);
    final label = entry.label(AppLocalizations.of(context)!);
    final active = dark ? AminaTheme.teal400 : const Color(0xFF0A8765);
    final inactive = dark ? AminaTheme.dark400 : const Color(0xFF78807C);

    return Semantics(
      button: true,
      selected: selected,
      label: label,
      child: InkWell(
        key: ValueKey('mobile-nav-${entry.route}'),
        onTap: () {
          HapticFeedback.selectionClick();
          GoRouter.of(context).go(entry.route);
        },
        borderRadius: BorderRadius.circular(18),
        child: SizedBox(
          height: 70,
          child: Column(
            mainAxisAlignment: MainAxisAlignment.center,
            children: [
              Icon(
                selected ? entry.selectedIcon : entry.icon,
                color: selected ? active : inactive,
                size: 20,
              ),
              const SizedBox(height: 4),
              Text(
                label,
                maxLines: 1,
                overflow: TextOverflow.ellipsis,
                textAlign: TextAlign.center,
                style: TextStyle(
                  fontSize: 9.2,
                  height: 1,
                  fontWeight: selected ? FontWeight.w800 : FontWeight.w600,
                  color: selected ? active : inactive,
                ),
              ),
            ],
          ),
        ),
      ),
    );
  }
}
'''
          p.write_text(prefix + tail)
          PY

          cd frontend
          dart format lib/features/navigation/main_shell.dart
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test --no-pub test/p0_mobile_import_navigation_test.dart
          cd ..
          git diff --check

      - name: Commit nav convergence
        run: |
          git config user.name "hraaaaf"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git add frontend/lib/features/navigation/main_shell.dart
          git commit -m "feat(ux): converge mobile nav on dashboard reference"
          git push origin HEAD:ux/10-dashboard-pixel-convergence
