name: MENA C21 Arabic numeric hybrid

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mena-319-c21-arabic-numeric-hybrid*
    paths:
      - scripts/run_paddleocr_arabic_numeric_hybrid.py
      - .github/workflows/mena-c21-arabic-numeric-hybrid.yml

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local OCR runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.2 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.7.0 Pillow>=10.0
      - name: Run C21 benchmark
        run: python scripts/run_paddleocr_arabic_numeric_hybrid.py --output-dir /tmp/paddleocr-c21
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mena-c21-paddleocr-${{ github.sha }}
          path: /tmp/paddleocr-c21
          if-no-files-found: warn
          retention-days: 14
      - name: Publish durable result
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT_STATUS: ${{ job.status }}
        with:
          script: |
            const status = process.env.RESULT_STATUS.toUpperCase();
            const sha = context.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[MENA C21] ${status} Arabic numeric hybrid ${sha.slice(0, 12)}`,
              body: [
                `Local dual-pass Arabic + numeric OCR evidence.`,
                ``,
                `- SHA: \`${sha}\``,
                `- Result: **${status}**`,
                `- Workflow run: ${runUrl}`,
                `- Patient data: no`,
                `- Real-camera evidence: no`,
                `- Provider API / paid inference: no`,
                ``,
                `Artifact \`mena-c21-paddleocr-${sha}\` contains measured JSON and synthetic fixtures.`
              ].join('\n')
            });
