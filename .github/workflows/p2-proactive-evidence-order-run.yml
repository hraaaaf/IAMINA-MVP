name: P2 proactive evidence-order run

on:
  push:
    branches: [p2-proactive-attention-lifecycle]
    paths:
      - .github/workflows/p2-proactive-evidence-order-run.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2-proactive-attention-lifecycle
          fetch-depth: 0
      - name: Apply exact patch
        run: python scripts/_p2_proactive_evidence_order_patch.py
      - name: Commit patched service and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p2-proactive-evidence-order-run.yml
          git rm scripts/_p2_proactive_evidence_order_patch.py
          git add backend/diabetes/services/clinical/proactive_attention.py
          git commit -m "fix(p2-proactive): gate evidence before source refresh"
          git pull --rebase origin p2-proactive-attention-lifecycle
          git push origin HEAD:p2-proactive-attention-lifecycle
