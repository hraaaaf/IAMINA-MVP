name: CAL-12 native session liveness (no export, no deploy)

on:
  pull_request:
    paths:
      - '.github/workflows/cal12-native-session-liveness.yml'
      - 'backend/core/api/v1/auth.py'
      - 'backend/core/tests/test_cal12_native_session_liveness_http.py'
      - 'docs/api/openapi.json'
      - 'frontend/lib/services/cal12_server_session_liveness.dart'
      - 'frontend/test/services/cal12_server_session_liveness_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-http:
    name: Django native bearer revocation SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff==0.15.17
      - run: ruff check core/api/v1/auth.py core/tests/test_cal12_native_session_liveness_http.py
      - name: CAL12 server + bearer/logout regressions
        run: pytest -q -v core/tests/test_cal12_native_session_liveness_http.py core/tests/test_native_bearer.py core/tests/test_w01_native_logout_http.py
      - name: OpenAPI contract exact
        run: |
          set -euo pipefail
          python manage.py export_openapi > /tmp/cal12-openapi.json
          diff -q /tmp/cal12-openapi.json ../docs/api/openapi.json
      - name: Preserve generated OpenAPI for independent verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal12-session-liveness-openapi
          path: /tmp/cal12-openapi.json
          retention-days: 7
          if-no-files-found: warn

  postgres-http:
    name: Django native bearer revocation PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_ci
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: pytest -q -v core/tests/test_cal12_native_session_liveness_http.py core/tests/test_native_bearer.py core/tests/test_w01_native_logout_http.py

  flutter:
    name: Flutter liveness negative cases
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Patient export and UI wiring remain OFF
        run: |
          set -euo pipefail
          grep -Fq 'static const bool realPatientExportEnabled = false;' lib/services/cal12_server_session_liveness.dart
          for file in lib/main.dart lib/features/journal/reports_screen.dart lib/features/journal/reports_screen_presentation.dart; do
            if grep -Eq 'cal12_server_session_liveness|Cal12ServerSessionLiveness' "$file"; then
              echo 'CAL12 FAIL: unauthorized clinical export UI wiring'
              exit 1
            fi
          done
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib/services/cal12_server_session_liveness.dart test/services/cal12_server_session_liveness_test.dart
      - run: flutter test --no-pub test/services/cal12_server_session_liveness_test.dart
      - run: flutter test --no-pub test/services/cal12_authenticated_vault_probe_test.dart test/services/clinical_export_consent_contract_test.dart
