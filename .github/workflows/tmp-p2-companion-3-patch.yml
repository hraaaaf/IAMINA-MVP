name: Temporary P2 companion 3 patch

on:
  push:
    branches:
      - agent/p2-companion-3-evidence-uncertainty

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-companion-3-evidence-uncertainty
      - name: Fix change-item constructor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/diabetes/services/clinical/companion_change.py")
          text = path.read_text()
          old = """    return _build_change_item(\n        observation_key=observation_key,\n        change_kind=change_kind,\n        evidence_id=evidence_id,\n        producer=producer,\n        evidence_strength=evidence_strength,\n        first_seen_at=first_seen_at,\n        last_seen_at=last_seen_at,\n        baseline_delta_at_review_mg_dl=baseline_delta_at_review_mg_dl,\n        baseline_delta_now_mg_dl=baseline_delta_now_mg_dl,\n        limitations=limitations,\n        missing_data=missing_data,\n        evidence_context=evidence_context,\n    )\n"""
          new = """    return CompanionChangeItem(\n        observation_key=observation_key,\n        change_kind=change_kind,\n        evidence_id=evidence_id,\n        producer=producer,\n        evidence_strength=evidence_strength,\n        first_seen_at=first_seen_at,\n        last_seen_at=last_seen_at,\n        baseline_delta_at_review_mg_dl=baseline_delta_at_review_mg_dl,\n        baseline_delta_now_mg_dl=baseline_delta_now_mg_dl,\n        limitations=limitations,\n        missing_data=missing_data,\n        evidence_context=evidence_context,\n    )\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one recursive constructor anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/diabetes/services/clinical/companion_change.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(companion): use evidence-aware change constructor"
          git push origin HEAD:agent/p2-companion-3-evidence-uncertainty
