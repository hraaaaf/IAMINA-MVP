name: P2-JOURNAL-8 UX remediation

on:
  push:
    branches: [audit/p2-journal-8-ux-remediation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout remediation tools
        uses: actions/checkout@v4
        with:
          ref: audit/p2-journal-8-ux-remediation
          path: audit-tools

      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: agent/p2-journal-personal-response
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: product

      - name: Apply density remediation
        run: python audit-tools/.github/scripts/p2_journal_8_ux_remediate_v2.py product

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Regenerate and verify frontend
        working-directory: product/frontend
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib/features/journal/widgets/personal_response_section.dart test/features/personal_response_section_test.dart
          flutter analyze --no-fatal-infos
          flutter test test/features/personal_response_section_test.dart --no-pub

      - name: Restore dependency artifacts and push product commit
        working-directory: product
        run: |
          git checkout origin/main -- frontend/pubspec.lock frontend/.flutter-plugins-dependencies
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/lib frontend/test/features/personal_response_section_test.dart
          git commit -m 'fix(journal): keep personal responses compact by default'
          git push origin HEAD:agent/p2-journal-personal-response
