name: P1 JOURNAL 7 diagnostic

on:
  push:
    branches:
      - agent/p1-journal-ramadan-v2

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: journal7-ci
      DEBUG: 'True'
      DATABASE_URL: sqlite:///journal7-ci.db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-journal-ramadan-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Extract patch as a real Python file
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen

          source_commit = 'fc6faada2b6958e74469e0fcfa87daa5e130b7ce'
          url = (
              'https://raw.githubusercontent.com/hraaaaf/IAMINA-MVP/'
              f'{source_commit}/.github/workflows/p1-journal7-frontend.yml'
          )
          with urlopen(url, timeout=30) as response:
              raw = response.read().decode('utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = raw.index(start_marker) + len(start_marker)
          end = raw.index(end_marker, start)
          block = raw[start:end]

          output = []
          triple = None
          for raw_line in block.splitlines():
              line = raw_line
              if triple is None and line.startswith('          '):
                  line = line[10:]
              output.append(line)
              cursor = 0
              while cursor < len(line):
                  if triple is not None:
                      close = line.find(triple, cursor)
                      if close < 0:
                          break
                      cursor = close + 3
                      triple = None
                      continue
                  single = line.find("'''", cursor)
                  double = line.find('"""', cursor)
                  candidates = [
                      (pos, marker)
                      for pos, marker in ((single, "'''"), (double, '"""'))
                      if pos >= 0
                  ]
                  if not candidates:
                      break
                  pos, triple = min(candidates, key=lambda item: item[0])
                  cursor = pos + 3

          source = '\n'.join(output) + '\n'
          compile(source, '<journal7-extracted>', 'exec')
          Path('journal7-extracted.py').write_text(source)
          PY

      - name: Apply frontend patch
        shell: bash
        run: |
          python journal7-extracted.py

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt ruff==0.15.17

      - name: Backend Ruff
        working-directory: backend
        run: ruff check diabetes/models/patient.py diabetes/api/v1/profile.py diabetes/api/v1/schemas.py diabetes/tests/test_ramadan_profile_period.py

      - name: Backend migration drift
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Backend Ramadan tests
        working-directory: backend
        run: pytest diabetes/tests/test_ramadan_profile_period.py -q

      - name: Regenerate OpenAPI
        working-directory: backend
        run: python manage.py export_openapi > ../docs/api/openapi.json

      - name: Frontend dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Frontend l10n and Drift codegen
        working-directory: frontend
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Frontend format
        working-directory: frontend
        run: dart format lib/core/data/ramadan_context.dart lib/data/drift/database.dart lib/features/profile/profile_screen.dart lib/features/dashboard/widgets/add_log_sheet.dart lib/features/journal/journal_screen.dart lib/services/api_client.dart test/core/data/ramadan_context_test.dart test/features/ramadan_mode_v2_test.dart test/data/drift/ramadan_period_migration_test.dart

      - name: Frontend analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      - name: Frontend focused tests
        working-directory: frontend
        run: flutter test --no-pub test/core/data/ramadan_context_test.dart test/data/drift/ramadan_period_migration_test.dart test/features/ramadan_mode_v2_test.dart test/features/add_log_sheet_test.dart

      - name: Commit clean product patch
        run: |
          rm -f journal7-extracted.py journal7-error.txt .github/workflows/p1-journal7-diagnostic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(journal): add Ramadan profile context to journal"
          git push origin HEAD:agent/p1-journal-ramadan-v2
