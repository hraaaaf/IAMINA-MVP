name: P0-UX-7 apply responsive patch

on:
  push:
    branches:
      - fix/p0-ux-7-desktop-tablet-responsive
    paths:
      - .github/workflows/p0-ux-7-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-ux-7-desktop-tablet-responsive
          fetch-depth: 0

      - name: Apply responsive patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Shared route-surface constraint: fills tablet, caps over-wide desktop forms/workflows.
          Path('frontend/lib/core/widgets/responsive_content_surface.dart').write_text("""import 'dart:math' as math;

import 'package:flutter/material.dart';

/// Centers a route body on wide canvases while preserving the full available
/// width on tablet and mobile. The child still receives a finite, truthful
/// viewport and is never artificially scaled.
class ResponsiveContentSurface extends StatelessWidget {
  final Widget child;
  final double maxWidth;

  const ResponsiveContentSurface({
    super.key,
    required this.child,
    required this.maxWidth,
  });

  @override
  Widget build(BuildContext context) {
    return LayoutBuilder(
      builder: (context, constraints) {
        final width = math.min(constraints.maxWidth, maxWidth);
        return Align(
          alignment: AlignmentDirectional.topCenter,
          child: SizedBox(
            width: width,
            height: constraints.maxHeight,
            child: child,
          ),
        );
      },
    );
  }
}
""")

          # MainShell: descendants must reason from the width left after sidebar.
          replace_once(
              'frontend/lib/features/navigation/main_shell.dart',
              '          Expanded(child: child),',
              """          Expanded(
            child: LayoutBuilder(
              builder: (context, constraints) {
                final media = MediaQuery.of(context);
                return MediaQuery(
                  data: media.copyWith(
                    size: Size(constraints.maxWidth, constraints.maxHeight),
                  ),
                  child: child,
                );
              },
            ),
          ),""",
          )

          # Dashboard: data views gain width from truthful MediaQuery; first-use copy remains readable.
          replace_once(
              'frontend/lib/features/dashboard/dashboard_screen.dart',
              """                              _EmptyDashboard(
                                onAddTap:    () => GoRouter.of(context).go('/ajouter'),
                                onImportTap: () => GoRouter.of(context).go('/importer'),
                              ),""",
              """                              Align(
                                alignment: AlignmentDirectional.topCenter,
                                child: ConstrainedBox(
                                  constraints: const BoxConstraints(maxWidth: 900),
                                  child: _EmptyDashboard(
                                    onAddTap: () => GoRouter.of(context).go('/ajouter'),
                                    onImportTap: () => GoRouter.of(context).go('/importer'),
                                  ),
                                ),
                              ),""",
          )

          # Journal: keep long histories readable instead of stretching entries across desktop.
          replace_once(
              'frontend/lib/features/journal/journal_screen.dart',
              """    final targetHigh = profile?.targetRangeHigh ?? 180.0;

    final now = DateTime.now();""",
              """    final targetHigh = profile?.targetRangeHigh ?? 180.0;
    final viewportWidth = MediaQuery.sizeOf(context).width;
    final horizontalPadding = viewportWidth >= 1100
        ? (viewportWidth - 980) / 2
        : viewportWidth >= 700
        ? 28.0
        : 20.0;

    final now = DateTime.now();""",
          )
          replace_once(
              'frontend/lib/features/journal/journal_screen.dart',
              """                return const SliverPadding(
                  padding: EdgeInsetsDirectional.fromSTEB(20, 16, 20, 20),
                  sliver: _JournalSkeletonSliver(),
                );""",
              """                return SliverPadding(
                  padding: EdgeInsetsDirectional.fromSTEB(
                    horizontalPadding,
                    16,
                    horizontalPadding,
                    20,
                  ),
                  sliver: const _JournalSkeletonSliver(),
                );""",
          )
          replace_once(
              'frontend/lib/features/journal/journal_screen.dart',
              """              return SliverPadding(
                padding: const EdgeInsetsDirectional.fromSTEB(20, 0, 20, 100),""",
              """              return SliverPadding(
                padding: EdgeInsetsDirectional.fromSTEB(
                  horizontalPadding,
                  0,
                  horizontalPadding,
                  100,
                ),""",
          )

          # Importer: two direct integrations use the desktop width; tablet/mobile stay stacked.
          replace_once(
              'frontend/lib/features/import/import_screen.dart',
              "import '../../core/widgets/clinical_card.dart';",
              "import '../../core/widgets/clinical_card.dart';\nimport '../../core/widgets/responsive_content_surface.dart';",
          )
          replace_once(
              'frontend/lib/features/import/import_screen.dart',
              """          Expanded(
            child: SingleChildScrollView(""",
              """          Expanded(
            child: ResponsiveContentSurface(
              maxWidth: 1160,
              child: SingleChildScrollView(""",
          )
          replace_once(
              'frontend/lib/features/import/import_screen.dart',
              """                ],
              ),
            ),
          ),
        ],
      ),
    );
  }
}""",
              """                ],
              ),
            ),
            ),
          ),
        ],
      ),
    );
  }
}""",
          )
          replace_once(
              'frontend/lib/features/import/import_screen.dart',
              """                  _ImportOption(
                    icon: Icons.bluetooth,
                    title: 'Dexcom G6/G7',
                    subtitle: AuditedPageCopy.of(context).dexcomDescription,
                    badge: AuditedPageCopy.of(context).soon,
                    badgeBg: AminaTheme.ink50,
                    badgeFg: AminaTheme.ink500,
                    action: const _UnavailableAction(),
                  ),
                  const SizedBox(height: 12),
                  _ImportOption(
                    icon: Icons.sensors,
                    title: 'Abbott LibreLink',
                    subtitle: AuditedPageCopy.of(context).libreDescription,
                    badge: AuditedPageCopy.of(context).soon,
                    badgeBg: AminaTheme.ink50,
                    badgeFg: AminaTheme.ink500,
                    action: const _UnavailableAction(),
                  ),""",
              """                  LayoutBuilder(
                    builder: (context, constraints) {
                      final cards = <Widget>[
                        _ImportOption(
                          icon: Icons.bluetooth,
                          title: 'Dexcom G6/G7',
                          subtitle: AuditedPageCopy.of(context).dexcomDescription,
                          badge: AuditedPageCopy.of(context).soon,
                          badgeBg: AminaTheme.ink50,
                          badgeFg: AminaTheme.ink500,
                          action: const _UnavailableAction(),
                        ),
                        _ImportOption(
                          icon: Icons.sensors,
                          title: 'Abbott LibreLink',
                          subtitle: AuditedPageCopy.of(context).libreDescription,
                          badge: AuditedPageCopy.of(context).soon,
                          badgeBg: AminaTheme.ink50,
                          badgeFg: AminaTheme.ink500,
                          action: const _UnavailableAction(),
                        ),
                      ];
                      if (constraints.maxWidth >= 900) {
                        return Row(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Expanded(child: cards[0]),
                            const SizedBox(width: 16),
                            Expanded(child: cards[1]),
                          ],
                        );
                      }
                      return Column(
                        children: [
                          cards[0],
                          const SizedBox(height: 12),
                          cards[1],
                        ],
                      );
                    },
                  ),""",
          )

          # Profile: prevent desktop-wide form fields while tablet still fills available width.
          replace_once(
              'frontend/lib/features/profile/profile_screen.dart',
              "import '../../core/widgets/amina_text_field.dart';",
              "import '../../core/widgets/amina_text_field.dart';\nimport '../../core/widgets/responsive_content_surface.dart';",
          )
          replace_once(
              'frontend/lib/features/profile/profile_screen.dart',
              """      body: SingleChildScrollView(
        padding: const EdgeInsets.all(24),""",
              """      body: ResponsiveContentSurface(
        maxWidth: 1040,
        child: SingleChildScrollView(
        padding: const EdgeInsets.all(24),""",
          )
          replace_once(
              'frontend/lib/features/profile/profile_screen.dart',
              """            const SizedBox(height: 32),
          ],
        ),
      ),
    );
  }

  Widget _buildIASetupCard""",
              """            const SizedBox(height: 32),
          ],
        ),
        ),
      ),
    );
  }

  Widget _buildIASetupCard""",
          )

          # Pulper: full-screen route keeps chrome full width but caps the clinical workflow body.
          replace_once(
              'frontend/lib/features/documents/document_import_screen.dart',
              "import '../../core/theme/app_theme.dart';",
              "import '../../core/theme/app_theme.dart';\nimport '../../core/widgets/responsive_content_surface.dart';",
          )
          replace_once(
              'frontend/lib/features/documents/document_import_screen.dart',
              """      body: SafeArea(
        child: _loading""",
              """      body: ResponsiveContentSurface(
        maxWidth: 980,
        child: SafeArea(
        child: _loading""",
          )
          replace_once(
              'frontend/lib/features/documents/document_import_screen.dart',
              """                _Phase.done => _buildDone(),
              },
      ),
    );
  }

  // ── Phase 1""",
              """                _Phase.done => _buildDone(),
              },
        ),
      ),
    );
  }

  // ── Phase 1""",
          )

          Path('frontend/test/p0_ux_7_desktop_tablet_contract_test.dart').write_text("""import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

String _read(String path) => File(path).readAsStringSync();

void main() {
  test('shell exposes the actual post-sidebar viewport to routed pages', () {
    final shell = _read('lib/features/navigation/main_shell.dart');
    expect(shell, contains('LayoutBuilder('));
    expect(shell, contains('size: Size(constraints.maxWidth, constraints.maxHeight)'));
  });

  test('dashboard keeps first-use copy readable while data views gain width', () {
    final dashboard = _read('lib/features/dashboard/dashboard_screen.dart');
    expect(dashboard, contains('BoxConstraints(maxWidth: 900)'));
    expect(dashboard, contains("screenW >= 1400 ? (screenW - 1200) / 2"));
  });

  test('journal caps long-history reading width on desktop', () {
    final journal = _read('lib/features/journal/journal_screen.dart');
    expect(journal, contains('(viewportWidth - 980) / 2'));
    expect(journal, contains('viewportWidth >= 700'));
  });

  test('importer uses a desktop two-column connection layout', () {
    final source = _read('lib/features/import/import_screen.dart');
    expect(source, contains('ResponsiveContentSurface('));
    expect(source, contains('maxWidth: 1160'));
    expect(source, contains('constraints.maxWidth >= 900'));
    expect(source, contains('Expanded(child: cards[0])'));
    expect(source, contains('Expanded(child: cards[1])'));
  });

  test('profile and Pulper cap over-wide desktop bodies without shrinking tablet', () {
    final profile = _read('lib/features/profile/profile_screen.dart');
    final pulper = _read('lib/features/documents/document_import_screen.dart');
    final surface = _read('lib/core/widgets/responsive_content_surface.dart');
    expect(profile, contains('maxWidth: 1040'));
    expect(pulper, contains('maxWidth: 980'));
    expect(surface, contains('math.min(constraints.maxWidth, maxWidth)'));
    expect(surface, contains('AlignmentDirectional.topCenter'));
  });
}
""")
          PY

          rm .github/workflows/p0-ux-7-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend .github/workflows/p0-ux-7-apply.yml
          git diff --cached --check
          git commit -m "fix(ux): make desktop and tablet layouts responsive"
          git push origin HEAD:fix/p0-ux-7-desktop-tablet-responsive
