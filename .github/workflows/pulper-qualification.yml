name: Pulper Golden Corpus Qualification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pulper-qualification.yml
      - backend/requirements.txt
      - backend/diabetes/evals/**
      - backend/diabetes/services/documents/**
      - backend/diabetes/tests/test_pulper*.py
      - backend/media/documents/**
      - backend/llm/base.py
      - backend/llm/errors.py
      - backend/llm/factory.py
      - backend/llm/lowcost_openai_compatible.py
      - backend/llm/provider_registry.py
      - backend/llm/pseudonymizer.py
      - backend/llm/tests/pulper_qualification_provider.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulper-golden-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Synthetic bounded qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: pulper-qualification-nonproduction
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///pulper-qualification.db
      PULPER_SYNTHETIC_QUALIFICATION: "1"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install qualification dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "reportlab>=4.2,<5" "xlwt==1.3.0"
      - name: Verify deterministic qualification contracts
        working-directory: backend
        run: pytest diabetes/tests/test_pulper_qualification.py -q
      - name: Require live Groq credential
        shell: bash
        run: |
          if [[ -z "${GROQ_API_KEY}" ]]; then
            echo "Pulper qualification requires GROQ_API_KEY."
            exit 2
          fi
      - name: Run one bounded synthetic benchmark
        working-directory: backend
        run: |
          python -c 'import django; django.setup(); from diabetes.evals.pulper_qualification import main; raise SystemExit(main())' \
            --output ../artifacts/pulper-qualification.json
      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulper-qualification-${{ github.sha }}
          path: artifacts/pulper-qualification.json
          if-no-files-found: error
          retention-days: 14
