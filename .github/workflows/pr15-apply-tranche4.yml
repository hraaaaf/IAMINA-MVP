name: PR15 apply tranche 4

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/p0-mena-provider-runtime-resilience

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-provider-runtime-resilience
          fetch-depth: 0
      - name: Apply deterministic Flutter provider errors
        run: python scripts/apply_pr15_tranche4.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/lib/services/api_client.dart frontend/lib/features/journal/widgets/amina_chat_view.dart frontend/test/services/provider_api_error_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(flutter): add deterministic provider error UX"
          git push origin HEAD:feat/p0-mena-provider-runtime-resilience
