name: W01 D2 synthetic Flutter erasure QA
# Final QA checks vault consent evidence cleanup and HTML-200 denial.
on:
  push:
    branches:
      - test/w01-d2-safe-flutter-erasure-20261028
    paths:
      - .github/workflows/w01-d2-synthetic-erasure-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w01-d2-synthetic-erasure-qa
  cancel-in-progress: false
jobs:
  flutter-web-qa:
    if: github.ref == 'refs/heads/test/w01-d2-safe-flutter-erasure-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Flutter analyze and negative erasure scope tests
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test --no-pub test/services/w01_synthetic_preview_erasure_scope_test.dart
      - name: Compile Flutter Web Preview safely (no Vercel deploy)
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=API_BASE_URL=https://invalid.iamina-preview.invalid \
            --dart-define=IAMINA_PREVIEW_SAME_ORIGIN_API=true \
            --dart-define=IAMINA_REMOTE_ACCOUNT_ENROLLMENT=true
