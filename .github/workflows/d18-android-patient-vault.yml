name: D18 Android-native patient vault A-B-A (scoped only)

on:
  pull_request:
    paths:
      - '.github/workflows/d18-android-patient-vault.yml'
      - 'frontend/integration_test/d18_android_patient_profile_test.dart'
      - 'frontend/lib/features/profile/d18_profile_panel.dart'
      - 'frontend/lib/features/profile/profile_screen.dart'
      - 'frontend/lib/data/drift/patient_weight_history_store.dart'
      - 'frontend/lib/data/drift/patient_progressive_demographics_store.dart'
      - 'frontend/lib/data/drift/local_backup.dart'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d18-native-android-test
  cancel-in-progress: true

jobs:
  d18-android-native:
    name: Android emulator installed D18, disk A-B-A and Profile gate only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Flutter 3.41
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: frontend
        run: flutter pub get
      - name: KVM access
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
      - name: Boot Android and run ONLY D18 integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            cd frontend
            flutter test --no-pub --reporter expanded -d emulator-5554 integration_test/d18_android_patient_profile_test.dart
      - name: Record D18-only provenance
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/d18-native-android
          cat > artifacts/d18-native-android/PROVENANCE.txt <<'EOF'
          This CI runs the D18 integration test in an installed Android EMULATOR app.
          AppDatabase.forPatientVault => real on-device SQLite and separate
          Android-local sandbox files. Synthetic patient A and B, A-B-A reopen,
          history and optional declarations, forged cross-owner backup rejection.
          ProfileScreen runs with a synthetic AppLock unlocked/locked provider,
          NOT real platform biometric enrollment and NOT real authentication.
          Physical device: NOT VERIFIED.
          Android backup encryption: NOT VERIFIED by this test.
          Independent privacy or clinical review: NOT VERIFIED by this test.
          No user or patient real records, no remote API or rollout.
          EOF
      - name: Upload D18 native emulator provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d18-android-native-scoped-vault-evidence
          path: artifacts/d18-native-android/PROVENANCE.txt
          if-no-files-found: warn
          retention-days: 14
