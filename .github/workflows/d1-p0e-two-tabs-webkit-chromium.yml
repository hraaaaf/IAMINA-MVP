name: D1 P0-E exclusive web patient runtime admission (no deploy)

on:
  push:
    branches: [d1-p0e-browser-aba-20261111]
    paths:
      - 'tools/d1_p0e_two_tabs_aba_browser.js'
      - 'tools/d1_p0e_single_tab_lock_browser.js'
      - 'tools/d1_p0e_cold_persistence_browser.js'
      - 'frontend/web/flutter_bootstrap.js'
      - 'tools/d1_p0e_coop_coep_server.py'
      - '.github/workflows/d1-p0e-two-tabs-webkit-chromium.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-tabs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Build synthetic scoped Drift browser probe
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos lib/ui_w02_synthetic_vault_scope_probe_main.dart
          flutter build web --release --no-web-resources-cdn -t lib/ui_w02_synthetic_vault_scope_probe_main.dart
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser engine
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Reject concurrent second runtime and retain A/B vaults
        shell: bash
        env:
          D1_BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          node --check tools/d1_p0e_single_tab_lock_browser.js
          node --check tools/d1_p0e_cold_persistence_browser.js
          python3 tools/d1_p0e_coop_coep_server.py --port 7398 --directory frontend/build/web >/tmp/d1-p0e-http.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:7398/ >/dev/null
          curl -fsSI http://127.0.0.1:7398/ | grep -qi 'Cross-Origin-Opener-Policy: same-origin'
          curl -fsSI http://127.0.0.1:7398/ | grep -qi 'Cross-Origin-Embedder-Policy: require-corp'
          COLD=0
          LOCK=0
          node tools/d1_p0e_cold_persistence_browser.js || COLD=1
          node tools/d1_p0e_single_tab_lock_browser.js || LOCK=1
          echo "D1_P0E_VERDICT cold=${COLD} single_tab=${LOCK}"
          test "$COLD" -eq 0 && test "$LOCK" -eq 0
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-p0e-${{ matrix.browser }}-two-tab-evidence
          path: |
            d1-p0e-*-single-runtime-proof.json
            d1-p0e-*-cold-persistence-proof.json
          retention-days: 14
          if-no-files-found: warn
