name: D1-6 synthetic Web session fence (NO DEPLOY)

on:
  push:
    branches: [research/d1-client-session-fence-20261112]
    paths:
      - frontend/web/d1_research_session_fence.js
      - frontend/test_node/d1_research_session_fence.test.js
      - .github/workflows/d1-research-session-fence.yml
      - backend/core/d1_passkey_binding_research.py
      - backend/core/api/v1/d1_passkey_research.py
      - backend/core/tests/test_d1_passkey_http_research.py
  pull_request:
    branches: [research/d1-django-passkey-binding-20261112]
    paths:
      - frontend/web/d1_research_session_fence.js
      - frontend/test_node/d1_research_session_fence.test.js
      - .github/workflows/d1-research-session-fence.yml
      - backend/core/d1_passkey_binding_research.py
      - backend/core/api/v1/d1_passkey_research.py
      - backend/core/tests/test_d1_passkey_http_research.py

permissions:
  contents: read

concurrency:
  group: d1-synthetic-session-fence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-node:
    name: D1 client identity/epoch race tests — synthetic only
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check frontend/web/d1_research_session_fence.js
          node --check frontend/test_node/d1_research_session_fence.test.js
      - name: Fail-closed and race tests (no browser, no network, no patient data)
        run: node --test frontend/test_node/d1_research_session_fence.test.js
      - name: Assert exactly one active D1 client research fence
        run: |
          set -euo pipefail
          test ! -e frontend/web/d1_prf_session_fence_research.js
          test ! -e frontend/test_node/d1_prf_session_fence_research.test.js
          test ! -e .github/workflows/d1-client-session-fence-research.yml
          echo 'One D1 session fence module; all browser and Django identities remain synthetic.'
      - name: Verify no production API routing import
        run: |
          if grep -r 'd1_research_session_fence' frontend/web/index.html frontend/web/flutter_bootstrap.js frontend/api/index.js; then
            echo "::error::Research fence must not be mounted in production web entrypoints"
            exit 1
          fi

  django-identity:
    name: D1 real Django session context on ${{ matrix.database }} — synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_ci_d1
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_ci_d1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-synthetic-d1-not-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:postgres@127.0.0.1:5432/iamina_ci_d1' || 'sqlite:///d1-ci-research.db' }}
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: pip install -r requirements.txt ruff==0.15.17
      - name: Ruff only changed Django research files
        run: ruff check core/d1_passkey_binding_research.py core/api/v1/d1_passkey_research.py core/tests/test_d1_passkey_http_research.py
      - name: Verify migration state
        run: python manage.py makemigrations --check --dry-run
      - name: Test real Django A→B→A session/CSRF + research signature orchestration
        run: pytest -q --tb=short core/tests/test_d1_passkey_http_research.py core/tests/test_d1_passkey_binding_research.py
