name: P0-JOURNAL-2 closeout docs

on:
  push:
    branches: [feat/p0-journal-express-event]
    paths: [.github/workflows/p0-journal-2-closeout-docs.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-journal-express-event
          fetch-depth: 0
      - name: Update canonical and handoff markdown
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('docs/ROADMAP.md')
          s=p.read_text()
          s=s.replace(
            '> **Last updated:** 2026-08-09 — metabolic-event Journal redesign registered; P0-JOURNAL-1 clinical truthfulness is the first merge unit and P0-JOURNAL-2 is next.',
            '> **Last updated:** 2026-08-09 — P0-JOURNAL-1 is merged and post-merge certified; P0-JOURNAL-2 express metabolic event is certified pre-merge in PR #68.'
          )
          s=s.replace(
            '| Journal metabolic-event redesign | 11% | 🔵 P0-JOURNAL-1 merge unit | PR #67; truthful glucose/nutrition/insulin capture; P0-JOURNAL-2 next |',
            '| Journal metabolic-event redesign | 22% | 🔵 P0-JOURNAL-2 merge unit | P0-JOURNAL-1 closed via PR #67; PR #68 exact-head CI/drift green; UX 9.2/10; merge/post-merge still required |'
          )
          s=s.replace(
            '| P0-JOURNAL-1 | Clinical truthfulness | 🔵 PR #67 merge unit | no fabricated default glucose/target verdict; no fabricated carbs/IG/meal-impact score; insulin is already-taken logging only; deterministic `<54` vs `54–69` low-glucose safety; no automatic generative post-save verdict |',
            '| P0-JOURNAL-1 | Clinical truthfulness | ✅ Closed | PR #67 merged as `e8e94f1940d4fca14f6e022f1dac70fb3f161e64`; post-merge CI #1215 + drift #1031 green; no fabricated glucose/nutrition/insulin precision |'
          )
          s=s.replace(
            '| P0-JOURNAL-2 | Express metabolic event | ⏭️ Next | `glycaemia → context → optional meal → save`; glycaemic context separate from meal type; Sport removed from meal taxonomy; FR/EN/AR + RTL/responsive certification >9.0 |',
            '| P0-JOURNAL-2 | Express metabolic event | 🔵 PR #68 merge unit | `glycaemia → context → optional meal → save`; context separate from meal; Sport removed; additive Django + Drift persistence; FR/EN/AR + RTL; exact-head UX 9.2/10; merge/post-merge pending |'
          )
          old='''P0-JOURNAL-1 is not declared 100% merely by this roadmap entry: expected-head merge plus post-merge CI and migration drift remain mandatory. P0-JOURNAL-2 must branch from the verified merged main.\n\n---'''
          new='''P0-JOURNAL-1 is **100% closed**: PR #67 merged at `e8e94f1940d4fca14f6e022f1dac70fb3f161e64`, post-merge CI #1215 and migration drift #1031 both passed. P0-JOURNAL-2 branched from that verified main.\n\n### P0-JOURNAL-2 durable closeout contract\n\nPR #68 is the merge unit for the express metabolic-event LOT. The reachable add-log path is now `glycaemia → optional measurement context → optional meal → save`; measurement context and meal taxonomy are persisted separately and neither is inferred when unknown. `Sport` is no longer a meal, treatment details are secondary, insulin remains already-taken logging only, and fabricated nutrition/impact semantics do not return. Django migration `0020` and Drift schema 5→6 add `glycemic_context` without destructive backfill; a real legacy SQLite upgrade test preserves the existing row, legacy meal value and `client_uuid`. FR/EN/AR and RTL were recertified on desktop, tablet, mobile and 360×560.\n\n**Pre-merge evidence on product head `63d789fd89bf90a161ddf3bd52312d0f9c37673a`:** PR CI #1233 SUCCESS, PR migration drift #1049 SUCCESS; exact-head visual run `31307687092`, artifact `9036468515`, digest `sha256:6d8b2deab841b92772d13e62aff06d25bc287c6630473d9ae30b2b1900626f4e`; UX Auditor **9.2/10 PASS**; Clinical Safety Reviewer PASS; Database Migration Reviewer PASS.\n\nP0-JOURNAL-2 is **not 100% closed yet**: this documentation commit intentionally invalidates the preceding exact-head anchors. Final CI + migration drift and Reviewer/Release-Certifier re-anchoring must run on the documentation-final head, followed by expected-head merge and post-merge CI + drift.\n\n---'''
          if old not in s:
            raise SystemExit('ROADMAP closeout marker not found')
          s=s.replace(old,new)
          p.write_text(s)

          Path('status-Achraf.md').write_text('''# IAmina — Current Status for Achraf\n\n> **Updated:** 2026-08-09\n> **Authority:** `docs/ROADMAP.md` is the single forward tracker; this file is a concise handoff only.\n\n## Current LOT\n\n**P0-JOURNAL-2 — Express metabolic event**\n\n- Branch: `feat/p0-journal-express-event`\n- PR: #68\n- Base: verified P0-JOURNAL-1 merge `e8e94f1940d4fca14f6e022f1dac70fb3f161e64`\n- Product head before closeout docs: `63d789fd89bf90a161ddf3bd52312d0f9c37673a`\n- PR CI #1233: SUCCESS\n- PR migration drift #1049: SUCCESS\n- Exact visual matrix: run `31307687092`, artifact `9036468515`, 8/8 FR/AR views, zero runtime errors\n- UX Auditor: **9.2/10 PASS**\n- Clinical Safety Reviewer: PASS\n- Database Migration Reviewer: PASS\n\n## Delivered\n\n- Express path: glucose → optional measurement context → optional meal → save.\n- Measurement context separated from meal taxonomy; no inferred default context.\n- `Sport` removed from meal taxonomy.\n- Mobile/tablet progressive disclosure; desktop two-column composition.\n- FR/EN/AR localization with real RTL.\n- Insulin remains recording of an already-administered dose only.\n- Fabricated nutrition/IG/meal-impact semantics stay removed.\n- Additive Django `glycemic_context` migration and Drift v5→v6 migration.\n- Legacy-row migration test proves preservation of old meal value and `client_uuid`.\n\n## Remaining before 100%\n\nBecause this closeout documentation changes the head, rerun exact-final-head CI + drift, re-anchor applicable reviewers and Release Certifier, merge PR #68 with expected-head locking, then require post-merge CI + drift before declaring the LOT closed.\n\n## Next LOT after closure\n\n**P1-JOURNAL-3 — Meal capture**: recent/habitual/search + confirmed photo recognition, with user confirmation and no food-recommendation implication.\n''')

          Path('status.md').write_text('''# IAmina — Session Status\n\n> **Updated:** 2026-08-09\n> **Authority:** `docs/ROADMAP.md` is canonical. This file exists only as a restart handoff.\n\n## Active work\n\nP0-JOURNAL-2 is in PR #68 on `feat/p0-journal-express-event`. P0-JOURNAL-1 is already merged and post-merge certified at `e8e94f1940d4fca14f6e022f1dac70fb3f161e64`.\n\n## Verified pre-closeout state\n\n- Product SHA: `63d789fd89bf90a161ddf3bd52312d0f9c37673a`\n- PR CI #1233: SUCCESS\n- PR drift #1049: SUCCESS\n- Visual run `31307687092`: SUCCESS\n- Artifact `9036468515`, 8/8 FR/AR desktop/tablet/mobile/small renders, zero page/console errors\n- UX score: **9.2/10 PASS**\n- Clinical Safety review: PASS\n- Database Migration review: PASS\n\n## Do next\n\n1. Treat the closeout-doc commit as a new head; previous exact-head evidence becomes stale by governance rule.\n2. Run CI + migration drift on that exact head.\n3. Re-anchor UX/Clinical/DB reviewer conclusions to the final head after verifying no product code changed.\n4. Run Release Certifier.\n5. Merge PR #68 with `expected_head_sha`.\n6. Verify `main` exactly equals the merge result and wait for post-merge CI + migration drift.\n7. Only then mark P0-JOURNAL-2 100% and move to P1-JOURNAL-3.\n\n## Scope guard\n\nDo not fold P1-JOURNAL-3 nutrition/photo work, P1-JOURNAL-5 insulin-v2, Ramadan-v2 or longitudinal personalization into P0-JOURNAL-2.\n''')
          PY
      - name: Commit closeout docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md status-Achraf.md status.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(journal): record P0-JOURNAL-2 certification state'
          git push origin HEAD:feat/p0-journal-express-event
