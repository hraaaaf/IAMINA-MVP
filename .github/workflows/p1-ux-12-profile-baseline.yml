name: P1-UX-12 profile baseline

on:
  push:
    branches:
      - audit/p1-ux-12-profile-baseline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Build audit web app
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --dart-define=IAMINA_AUDIT_ACCESS=true

      - name: Install capture tooling
        run: |
          mkdir -p /tmp/iamina-profile-audit
          cd /tmp/iamina-profile-audit
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 serve@14.2.4 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Capture profile matrix
        run: |
          set -euo pipefail
          mkdir -p /tmp/iamina-profile-audit/out
          cd /tmp/iamina-profile-audit
          ./node_modules/.bin/serve -s "$GITHUB_WORKSPACE/frontend/build/web" -l 8080 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done

          cat > capture.cjs <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const matrix = [
            {name:'desktop-fr', locale:'fr-FR', width:1440, height:1000},
            {name:'desktop-ar', locale:'ar-MA', width:1440, height:1000},
            {name:'tablet-fr', locale:'fr-FR', width:768, height:1024},
            {name:'tablet-ar', locale:'ar-MA', width:768, height:1024},
            {name:'mobile-fr', locale:'fr-FR', width:390, height:844},
            {name:'mobile-ar', locale:'ar-MA', width:390, height:844},
            {name:'small-fr', locale:'fr-FR', width:360, height:560},
            {name:'small-ar', locale:'ar-MA', width:360, height:560},
          ];

          (async () => {
            const browser = await chromium.launch({headless:true});
            const report = [];
            for (const item of matrix) {
              const context = await browser.newContext({
                locale: item.locale,
                viewport: {width:item.width, height:item.height},
                deviceScaleFactor: 1,
              });
              const page = await context.newPage();
              const pageErrors = [];
              const consoleErrors = [];
              page.on('pageerror', e => pageErrors.push(String(e)));
              page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
              await page.goto('http://127.0.0.1:8080/profile', {waitUntil:'networkidle', timeout:60000});
              await page.waitForTimeout(1800);
              const flutterViews = await page.locator('flutter-view').count();
              await page.screenshot({
                path: path.join('/tmp/iamina-profile-audit/out', `${item.name}__profile.png`),
                fullPage: true,
              });
              report.push({...item, flutterViews, pageErrors, consoleErrors});
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('/tmp/iamina-profile-audit/out/report.json', JSON.stringify(report, null, 2));
            fs.writeFileSync('/tmp/iamina-profile-audit/out/source-sha.txt', process.env.GITHUB_SHA + '\n');
            if (report.some(r => r.flutterViews !== 1 || r.pageErrors.length > 0)) process.exit(1);
          })();
          EOF

          node capture.cjs
          cp server.log out/server.log

      - name: Upload baseline captures
        uses: actions/upload-artifact@v4
        with:
          name: p1-ux-12-profile-baseline
          path: /tmp/iamina-profile-audit/out
          retention-days: 14
          if-no-files-found: error
