name: PR17 finish sovereign auth

on:
  push:
    branches: [feat/p0-mena-sovereign-auth-migration]

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FIREBASE_CREDENTIALS_PATH: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-sovereign-auth-migration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
      - name: Patch native recovery and documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/core/api/v1/auth.py')
          text = path.read_text()
          text = text.replace(
              'from django.contrib.auth.password_validation import validate_password\n',
              'from django.contrib.auth.password_validation import validate_password\nfrom django.contrib.auth.tokens import default_token_generator\n'
          )
          text = text.replace(
              'from django.core.exceptions import ValidationError\n',
              'from django.conf import settings\nfrom django.core.exceptions import ValidationError\nfrom django.core.mail import send_mail\n'
          )
          text = text.replace(
              'from django.db import transaction\n',
              'from django.db import transaction\nfrom django.utils.encoding import force_bytes, force_str\nfrom django.utils.http import urlsafe_base64_decode, urlsafe_base64_encode\n'
          )
          marker = '''class SetPasswordRequest(BaseModel):
    new_password: str
    current_password: str | None = None
'''
          replacement = marker + '''\n\nclass PasswordResetRequest(BaseModel):
    email: str

    @field_validator("email")
    @classmethod
    def normalize_email(cls, value: str) -> str:
        return value.strip().lower()


class PasswordResetConfirmRequest(BaseModel):
    uid: str
    token: str
    new_password: str
'''
          text = text.replace(marker, replacement)
          endpoint_marker = '@router.post("/auth/firebase", response=AuthResponse)\n'
          endpoints = '''@router.post("/auth/password/reset/request")
def request_password_reset(request, data: PasswordResetRequest):
    """Send a native recovery link without disclosing account existence."""
    users = list(User.objects.filter(email__iexact=data.email, is_active=True)[:2])
    if len(users) == 1 and users[0].has_usable_password():
        user = users[0]
        uid = urlsafe_base64_encode(force_bytes(user.pk))
        token = default_token_generator.make_token(user)
        base_url = getattr(settings, "PASSWORD_RESET_FRONTEND_URL", "iamina://reset-password")
        separator = "&" if "?" in base_url else "?"
        reset_url = f"{base_url}{separator}uid={uid}&token={token}"
        send_mail(
            subject="Réinitialisation du mot de passe IAMINA",
            message=f"Utilisez ce lien pour définir un nouveau mot de passe : {reset_url}",
            from_email=getattr(settings, "DEFAULT_FROM_EMAIL", "noreply@iamina.health"),
            recipient_list=[user.email],
            fail_silently=True,
        )
    return {"detail": "If the account exists, recovery instructions were sent"}


@router.post("/auth/password/reset/confirm")
@transaction.atomic
def confirm_password_reset(request, data: PasswordResetConfirmRequest):
    """Consume a one-time Django recovery token and revoke prior IAMINA tokens."""
    try:
        user_id = force_str(urlsafe_base64_decode(data.uid))
        user = User.objects.get(pk=user_id, is_active=True)
    except (ValueError, TypeError, OverflowError, User.DoesNotExist) as exc:
        raise HttpError(400, "Invalid or expired recovery credential") from exc

    if not default_token_generator.check_token(user, data.token):
        raise HttpError(400, "Invalid or expired recovery credential")
    try:
        validate_password(data.new_password, user=user)
    except ValidationError as exc:
        raise HttpError(400, "Password does not meet security requirements") from exc

    user.set_password(data.new_password)
    user.save(update_fields=["password"])
    revoke_native_tokens(user)
    return {"detail": "Password reset completed"}


'''
          text = text.replace(endpoint_marker, endpoints + endpoint_marker)
          path.write_text(text)

          path = Path('frontend/lib/services/auth_service.dart')
          text = path.read_text()
          old = '''  Future<void> sendPasswordResetEmail(String email) async {
    // Temporary migration fallback until the native recovery mail flow is cut over.
    if (_firebaseAuth == null) throw StateError('Firebase non initialisé');
    await _firebaseAuth.sendPasswordResetEmail(email: email.trim());
  }
'''
          new = '''  Future<void> sendPasswordResetEmail(String email) async {
    final response = await _postJson(
      '/api/v1/auth/password/reset/request',
      {'email': email.trim().toLowerCase()},
    );
    if (response.statusCode < 200 || response.statusCode >= 300) {
      throw StateError('Password recovery request failed');
    }
  }
'''
          if old not in text:
              raise SystemExit('auth_service reset block not found')
          path.write_text(text.replace(old, new))

          Path('backend/core/tests/test_native_password_recovery.py').write_text('''"""Native password recovery remains enumeration-safe and revokes old tokens."""\n\nimport pytest\nfrom django.contrib.auth.models import User\nfrom django.contrib.auth.tokens import default_token_generator\nfrom django.utils.encoding import force_bytes\nfrom django.utils.http import urlsafe_base64_encode\nfrom ninja.errors import HttpError\n\nfrom core.api.v1.auth import (\n    PasswordResetConfirmRequest,\n    PasswordResetRequest,\n    confirm_password_reset,\n    request_password_reset,\n)\nfrom core.native_auth import issue_native_token, resolve_native_token\n\n\n@pytest.mark.django_db\ndef test_reset_request_does_not_disclose_account_existence(monkeypatch):\n    sent = []\n    monkeypatch.setattr("core.api.v1.auth.send_mail", lambda **kwargs: sent.append(kwargs))\n    missing = request_password_reset(None, PasswordResetRequest(email="missing@example.test"))\n    user = User.objects.create_user(\n        username="patient@example.test",\n        email="patient@example.test",\n        password="Current-passphrase-2026!",\n    )\n    existing = request_password_reset(None, PasswordResetRequest(email=user.email))\n    assert missing == existing\n    assert len(sent) == 1\n\n\n@pytest.mark.django_db\ndef test_reset_confirmation_changes_password_and_revokes_old_token():\n    user = User.objects.create_user(\n        username="patient@example.test",\n        email="patient@example.test",\n        password="Current-passphrase-2026!",\n    )\n    old_token = issue_native_token(user)\n    uid = urlsafe_base64_encode(force_bytes(user.pk))\n    reset_token = default_token_generator.make_token(user)\n    result = confirm_password_reset(\n        None,\n        PasswordResetConfirmRequest(\n            uid=uid,\n            token=reset_token,\n            new_password="Replacement-passphrase-2026!",\n        ),\n    )\n    user.refresh_from_db()\n    assert result == {"detail": "Password reset completed"}\n    assert user.check_password("Replacement-passphrase-2026!")\n    assert resolve_native_token(old_token) is None\n\n\n@pytest.mark.django_db\ndef test_reset_confirmation_rejects_invalid_token():\n    user = User.objects.create_user(username="patient", password="Current-passphrase-2026!")\n    uid = urlsafe_base64_encode(force_bytes(user.pk))\n    with pytest.raises(HttpError) as exc:\n        confirm_password_reset(\n            None,\n            PasswordResetConfirmRequest(\n                uid=uid,\n                token="invalid",\n                new_password="Replacement-passphrase-2026!",\n            ),\n        )\n    assert exc.value.status_code == 400\n''')

          contract = Path('docs/architecture/P0_MENA_3_AUTH_MIGRATION_CONTRACT.md')
          contract.write_text(contract.read_text() + '''\n\n## Completion checkpoint — 31 July 2026\n\n- Django registration, login, logout, password establishment and native recovery are implemented.\n- IAMINA bearer tokens are signed, expiring and globally revocable per user.\n- Flutter stores IAMINA credentials in secure storage and uses native auth first.\n- Firebase remains a temporary migration bridge and demo dependency only.\n- Explicit Firebase link/unlink is available; email is never a silent merge key.\n- Cutover audit command: `python manage.py audit_auth_migration`.\n- Final removal gate: `python manage.py audit_auth_migration --require-zero-firebase`.\n''')
          PY
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt ruff==0.15.17 import-linter bandit[toml]
      - name: Regenerate OpenAPI
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///ci-openapi.db
        run: python manage.py export_openapi > ../docs/api/openapi.json
      - name: Validate SQLite
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///ci-test.db
        run: |
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
          ruff check .
          lint-imports
          pytest --tb=short -q
      - name: Validate PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_ci
        run: |
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
          pytest --tb=short -q
      - name: Validate Flutter
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/pr17-finish-auth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(auth): complete sovereign lifecycle and recovery"
          git push origin HEAD:feat/p0-mena-sovereign-auth-migration
