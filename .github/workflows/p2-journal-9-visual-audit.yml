name: P2-JOURNAL-9 visual audit

on:
  push:
    branches: [audit/p2-journal-9-visual]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@v4
        with:
          path: audit

      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: cc529c378eea7cb4908a57fdad2e85db5bde75bd
          path: product

      - name: Overlay audit-only harness
        run: |
          mkdir -p product/frontend/test/audit
          cp audit/frontend/test/audit/p2_journal_9_visual_audit_test.dart product/frontend/test/audit/

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: product/frontend
        run: flutter pub get

      - name: Render FR/AR post-save matrix
        working-directory: product/frontend
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test/audit/goldens
          flutter test --update-goldens test/audit/p2_journal_9_visual_audit_test.dart 2>&1 \
            | tee test/audit/goldens/test-output.txt

      - name: Write audit manifest
        if: always()
        run: |
          mkdir -p product/frontend/test/audit/goldens
          cat > product/frontend/test/audit/goldens/manifest.txt <<'EOF'
          lot=P2-JOURNAL-9
          product_sha=cc529c378eea7cb4908a57fdad2e85db5bde75bd
          locales=fr,ar
          sizes=1440x1000,768x1024,390x844,360x560
          surfaces=minimal-receipt,rich-receipt
          expected_images=16
          font_fixture=DejaVuSans + Flutter MaterialIcons
          EOF

      - name: Upload rendered matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-journal-9-visual-matrix-cc529c3
          path: product/frontend/test/audit/goldens/*
          if-no-files-found: error
