name: UX-3 shell brand builder

on:
  push:
    branches:
      - ux/ux-3-shell-brand-signature
    paths:
      - .github/workflows/ux-3-builder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/ux-3-shell-brand-signature
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply bounded shell-brand patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/lib/features/navigation/main_shell.dart')
          source = path.read_text()
          old_title = 'AppLocalizations.of(context)!.brandName'
          old_subtitle = 'AppLocalizations.of(context)!.brandTagShort'
          if source.count(old_title) != 1 or source.count(old_subtitle) != 1:
              raise SystemExit('unexpected shell brand source shape')
          source = source.replace(old_title, 'AppLocalizations.of(context)!.appTitle', 1)
          source = source.replace(old_subtitle, 'AppLocalizations.of(context)!.appSubtitle', 1)
          path.write_text(source)
          PY
      - name: Validate UX-3
        working-directory: frontend
        run: |
          flutter pub get
          dart format lib/features/navigation/main_shell.dart test/ux_3_shell_brand_contract_test.dart
          flutter analyze --no-fatal-infos
          flutter test test/ux_3_shell_brand_contract_test.dart
      - name: Commit product patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/lib/features/navigation/main_shell.dart frontend/test/ux_3_shell_brand_contract_test.dart
          git commit -m 'fix(ux): unify IAmina shell brand signature'
          git push origin HEAD:ux/ux-3-shell-brand-signature
