name: D22 G7 — Synthetic SQLite migration rehearsal

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/d22_g7/**"
      - ".github/workflows/d22-g7-synthetic-sqlite-rehearsal.yml"

permissions:
  contents: read

concurrency:
  group: d22-g7-rehearsal-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-sqlite:
    name: G7 synthetic v12 backup/rollback and A/B vault
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify only disposable SQLite fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/d22_g7 -p 'test_*.py' -v
      - name: Record non-production scope
        if: always()
        run: |
          {
            echo '### D22 G7 isolated rehearsal'
            echo '- SQLite uses only Python tempfile synthetic fixtures.'
            echo '- No frontend or backend runtime migration is executed.'
            echo '- No production Vercel, database, or patient data is accessed.'
            echo '- This is NOT clinical, privacy, or auth certification.'
          } >> "$GITHUB_STEP_SUMMARY"
