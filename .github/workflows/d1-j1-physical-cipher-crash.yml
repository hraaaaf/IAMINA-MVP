name: D1 J1 physical SQLite3MC ciphertext export and crash gate (SYNTHETIC)

on:
  pull_request:
    branches: [fix/d1-p0-web-vault-fail-closed-20261113]
    paths:
      - '.github/workflows/d1-j1-physical-cipher-crash.yml'
      - 'tools/d1_j1_physical_cipher_backup_failure_browser.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-j1-physical-crypto-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  encrypted-idb-physical-restore:
    name: Real SQLite3MC physical encrypted IDB bytes and crash-quarantine test
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Resolve flutter dependencies and analyze source/target probe
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos tool/d1_recovery_fresh_profile_probe.dart
      - name: Compile actual SQLite3MC AppDatabase source/restore fixture
        working-directory: frontend
        run: flutter build web --release --no-web-resources-cdn -t tool/d1_recovery_fresh_profile_probe.dart
      - name: Install checksum-pinned SQLite3MC binary into disposable build
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-2.9.4/sqlite3mc.wasm' -o frontend/build/web/sqlite3mc.wasm
          echo '5a1cfe40252d05bbd174e66351d3c282f69784c6fd0c2d099bf7135c6e91b4ec  frontend/build/web/sqlite3mc.wasm' | sha256sum -c -
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium browser
        run: |
          node --check tools/d1_j1_physical_cipher_backup_failure_browser.js
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Test encrypted physical IDB bytes, SHA, crash staging and fresh recovery
        shell: bash
        env:
          D1_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$D1_CANDIDATE_SHA"
          python3 -m http.server 7476 --bind 127.0.0.1 --directory frontend/build/web >/tmp/d1-j1-physical-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:7476/ >/dev/null
          node tools/d1_j1_physical_cipher_backup_failure_browser.js
      - name: Preserve proof metadata without ciphertext or recovery code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-j1-encrypted-physical-recovery-proof
          path: |
            d1-j1-physical-cipher-crash-proof/proof.json
            /tmp/d1-j1-physical-http.log
          retention-days: 7
          if-no-files-found: warn
