name: P0 OpenAPI Refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/p0-ai-egress-consent-boundary'
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Regenerate OpenAPI
        run: python backend/manage.py export_openapi > docs/api/openapi.json
      - name: Commit schema if changed
        run: |
          if git diff --quiet -- docs/api/openapi.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/api/openapi.json
          git commit -m 'docs(api): refresh OpenAPI after P0 egress wrappers'
          git push origin HEAD:${{ github.head_ref }}
