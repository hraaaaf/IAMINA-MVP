name: D7 hosted Preview QA A-B-A authentication — protected manual gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/d7-qa-hosted-auth-gate.yml'
      - 'scripts/d7_qa_hosted_auth_gate.mjs'
      - 'frontend/test/qa/d7_hosted_auth_gate.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify synthetic gate (no secrets)
        run: |
          set -euo pipefail
          node --check scripts/d7_qa_hosted_auth_gate.mjs
          node --test frontend/test/qa/d7_hosted_auth_gate.test.mjs

  qa-hosted-identity:
    # Cannot run on a PR event, from Production/main, or without explicit
    # manual dispatch. The d7-qa Environment must require owner approval
    # and restrict execution to the QA branch before secrets are configured.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/cert/d7-web-fue-preview-20261029'
    runs-on: ubuntu-latest
    environment: d7-qa
    timeout-minutes: 10
    env:
      D7_QA_A_EMAIL: ${{ secrets.D7_QA_A_EMAIL }}
      D7_QA_A_PASSWORD: ${{ secrets.D7_QA_A_PASSWORD }}
      D7_QA_B_EMAIL: ${{ secrets.D7_QA_B_EMAIL }}
      D7_QA_B_PASSWORD: ${{ secrets.D7_QA_B_PASSWORD }}
      D7_QA_SSO_ACCESS: ${{ secrets.D7_QA_SSO_ACCESS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact pinned QA revision and synthetic contract
        run: |
          set -euo pipefail
          # A protected environment reviewer must check the deployed SHA
          # and this runner's commit before approving the gate.
          node --check scripts/d7_qa_hosted_auth_gate.mjs
          node --test frontend/test/qa/d7_hosted_auth_gate.test.mjs
      - name: Hosted A-B-A login, no clinical writes, no response bodies logged
        run: node scripts/d7_qa_hosted_auth_gate.mjs
