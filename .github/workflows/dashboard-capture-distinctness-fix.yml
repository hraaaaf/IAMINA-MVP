name: Dashboard capture distinctness fix

on:
  push:
    branches: [audit/dashboard-global-cert-20260909]
    paths:
      - '.github/workflows/dashboard-capture-distinctness-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-global-cert-20260909
          fetch-depth: 0
      - name: Harden responsive scroll capture proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/dashboard-global-cert-v2.yml')
          s = p.read_text()

          old = "              await page.mouse.wheel(0,Math.round(height*.7)); await page.waitForTimeout(1000); const midPath=path.join('dashboard-global-cert',`${name}-mid-${width}x${height}.png`); const mid=await page.screenshot({path:midPath});"
          new = "              await page.mouse.move(Math.max(320,Math.round(width*.62)),Math.round(height*.55));\n              await page.mouse.wheel(0,Math.round(height*.35)); await page.waitForTimeout(1000); const midPath=path.join('dashboard-global-cert',`${name}-mid-${width}x${height}.png`); const mid=await page.screenshot({path:midPath});"
          assert s.count(old) == 1, 'first scroll line not found exactly once'
          s = s.replace(old, new, 1)

          old = "              await page.mouse.wheel(0,Math.round(height*.85)); await page.waitForTimeout(1000); const lowerPath=path.join('dashboard-global-cert',`${name}-lower-${width}x${height}.png`); const lower=await page.screenshot({path:lowerPath});"
          new = "              await page.mouse.wheel(0,Math.round(height*.35)); await page.waitForTimeout(1000); const lowerPath=path.join('dashboard-global-cert',`${name}-lower-${width}x${height}.png`); const lower=await page.screenshot({path:lowerPath});"
          assert s.count(old) == 1, 'second scroll line not found exactly once'
          s = s.replace(old, new, 1)

          old = "              const screenshotBytes={top:top.length,mid:mid.length,lower:lower.length};\n              report[name]={url:page.url(),errors,consoleErrors,api,screenshotBytes}; persist(report);"
          new = "              const screenshotBytes={top:top.length,mid:mid.length,lower:lower.length};\n              const duplicateCaptures={topMid:top.equals(mid),midLower:mid.equals(lower),topLower:top.equals(lower)};\n              report[name]={url:page.url(),errors,consoleErrors,api,screenshotBytes,duplicateCaptures}; persist(report);"
          assert s.count(old) == 1, 'report block not found exactly once'
          s = s.replace(old, new, 1)

          old = "              if(Object.values(screenshotBytes).some(bytes=>bytes<minScreenshotBytes)) throw new Error(`${name}: blank/suspicious capture ${JSON.stringify(screenshotBytes)}`);"
          new = old + "\n              if(Object.values(duplicateCaptures).some(Boolean)) throw new Error(`${name}: duplicate viewport captures ${JSON.stringify(duplicateCaptures)}`);"
          assert s.count(old) == 1, 'capture validation line not found exactly once'
          s = s.replace(old, new, 1)

          p.write_text(s)
          assert 'page.mouse.move(Math.max(320' in s
          assert 'duplicateCaptures' in s
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/dashboard-global-cert-v2.yml
          git diff --cached --check
          git commit -m 'test: require distinct responsive dashboard captures'
          git push origin HEAD:audit/dashboard-global-cert-20260909
