name: D7 consent — QA-only safety and UI regressions

on:
  push:
    branches: [cert/d7-web-fue-preview-20261029]
    paths:
      - '.github/workflows/d7-consent-qa.yml'
      - 'frontend/api/preview-proxy.js'
      - 'frontend/lib/features/auth/consent_screen.dart'
      - 'frontend/lib/services/api_client.dart'
      - 'frontend/test/qa/preview_proxy.test.mjs'
      - 'frontend/test/services/d30_local_only_pilot_transport_test.dart'
      - 'frontend/test/services/d7_app_lock_chopper_boundary_test.dart'
      - 'frontend/test/features/auth/consent_screen_test.dart'
      - 'frontend/test/services/d7_preview_api_origin_test.dart'
      - 'frontend/lib/features/auth/app_lock_setup_screen.dart'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d7-consent-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consent-safe-ui:
    if: github.ref == 'refs/heads/cert/d7-web-fue-preview-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Proxy route and isolation contract — no network credentials
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund
          node --check api/preview-proxy.js
          node --test test/qa/preview_proxy.test.mjs
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Real consent widget and lock/pilot guards — synthetic
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter pub get
          flutter test --reporter expanded \
            test/features/auth/consent_screen_test.dart \
            test/services/d7_preview_api_origin_test.dart \
            test/services/d30_local_only_pilot_transport_test.dart \
            test/services/d7_app_lock_chopper_boundary_test.dart \
            test/services/consent_notice_contract_test.dart
