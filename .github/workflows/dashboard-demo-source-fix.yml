name: IAMINA dashboard demo source fix

on:
  push:
    branches:
      - audit/dashboard-demo-mobile-20260909
    paths:
      - '.github/workflows/dashboard-demo-source-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused reliability fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected source pattern not found: {path}')
              text = text.replace(old, new, 1)
              p.write_text(text)

          # 1) Dashboard must never mutate demo data as a side effect of rendering.
          replace_exact(
              'frontend/lib/features/dashboard/dashboard_convergent_screen.dart',
              "import 'package:flutter/foundation.dart' show kDebugMode;\n",
              '',
          )
          replace_exact(
              'frontend/lib/features/dashboard/dashboard_convergent_screen.dart',
              "  @override\n  void initState() {\n    super.initState();\n    WidgetsBinding.instance.addPostFrameCallback((_) async {\n      if (!mounted || !kDebugMode) return;\n      final db = context.read<AppDatabase>();\n      final count = await db\n          .select(db.logEntries)\n          .get()\n          .then((rows) => rows.length);\n      if (count == 0) await db.seedDemoData();\n    });\n  }\n\n",
              '',
          )

          # 2) Demo login owns seeding. Always complete the local deterministic
          # dataset before navigating; remote seed remains best-effort.
          replace_exact(
              'frontend/lib/features/auth/login_screen_fr_certified.dart',
              "        await auth.signInAnonymously();\n        await api.seedDemoData();\n        if (await db.countLogs() == 0) await db.seedDemoData();\n",
              "        await auth.signInAnonymously();\n        await api.seedDemoData(); // best-effort backend mirror\n        await db.seedDemoData(); // complete local dataset before navigation\n",
          )

          # 3) Drift transaction: watchers observe either the previous dataset or
          # the complete new demo dataset, never intermediate rows.
          replace_exact(
              'frontend/lib/data/drift/database.dart',
              "  Future<void> seedDemoData() async {\n    // Delete all existing log entries — demo data must be fresh (relative to now).\n",
              "  Future<void> seedDemoData() async {\n    return transaction(() async {\n      // Delete all existing log entries — demo data must be fresh (relative to now).\n",
          )
          replace_exact(
              'frontend/lib/data/drift/database.dart',
              "          unitPreference: const Value('mg/dL'),\n        ),\n      );\n    }\n  }\n}\n",
              "          unitPreference: const Value('mg/dL'),\n        ),\n      );\n    }\n    });\n  }\n}\n",
          )

          # 4) Release builds must receive an explicit backend URL. This prevents
          # silent fallback to localhost:8000 in Vercel production builds.
          p = Path('frontend/vercel_build.sh')
          text = p.read_text()
          old = 'flutter pub get\nflutter build web --release\n'
          new = '''flutter pub get\n\n: "${API_BASE_URL:?API_BASE_URL must be configured for IAMINA release builds}"\nflutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL"\n'''
          if old not in text:
              raise SystemExit('expected Vercel build pattern not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Format and test frontend
        working-directory: frontend
        run: |
          dart format lib/data/drift/database.dart lib/features/auth/login_screen_fr_certified.dart lib/features/dashboard/dashboard_convergent_screen.dart
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test --no-pub

      - name: Verify release build contract
        run: |
          grep -F -- '--dart-define=API_BASE_URL="$API_BASE_URL"' frontend/vercel_build.sh
          grep -F 'return transaction(() async {' frontend/lib/data/drift/database.dart
          if grep -Fq 'kDebugMode' frontend/lib/features/dashboard/dashboard_convergent_screen.dart; then
            echo 'Dashboard still contains debug auto-seeding' >&2
            exit 1
          fi

      - name: Commit tested fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/lib/data/drift/database.dart \
                  frontend/lib/features/auth/login_screen_fr_certified.dart \
                  frontend/lib/features/dashboard/dashboard_convergent_screen.dart \
                  frontend/vercel_build.sh
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: stabilize dashboard demo data and release API config'
          git push origin HEAD:audit/dashboard-demo-mobile-20260909
