name: UX-3 docs closeout builder

on:
  push:
    branches:
      - docs/ux-3-closeout
    paths:
      - .github/workflows/ux-3-docs-builder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ux-3-closeout
          fetch-depth: 1
      - name: Apply UX-3 ROADMAP closeout
        run: python3 .github/ux3_docs_patch.py
      - name: Verify canonical invariants
        run: |
          grep -F 'MENA critical-path completion:** 32 of 41' docs/ROADMAP.md
          grep -F 'UX-3 | Canonical IAmina shell brand signature | 100%' docs/ROADMAP.md
          grep -F 'UX-3 is 100% closed.' docs/ROADMAP.md
      - name: Commit ROADMAP closeout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ROADMAP.md
          git commit -m 'docs(ux): close UX-3 shell brand signature'
          git push origin HEAD:docs/ux-3-closeout
