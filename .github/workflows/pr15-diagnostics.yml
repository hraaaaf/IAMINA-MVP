name: PR15 diagnostics

on:
  push:
    branches:
      - feat/p0-mena-provider-runtime-resilience

jobs:
  provider-tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run provider tests with full diagnostics
        working-directory: backend
        shell: bash
        run: |
          set +e
          pytest core/tests/test_ai_provider_failures.py -vv --tb=long 2>&1 | tee /tmp/provider-tests.log
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > /tmp/provider-tests.status
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr15-provider-test-diagnostics
          path: |
            /tmp/provider-tests.log
            /tmp/provider-tests.status
