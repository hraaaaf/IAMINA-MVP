name: UX-5 CI fix

on:
  push:
    branches:
      - ux/ux-5-glass-mobile-nav
    paths:
      - .github/workflows/ux-5-ci-fix.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/ux-5-glass-mobile-nav
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply bounded UX-5 CI compatibility fix
        run: |
          python3 .github/ux5_ci_fix.py
          dart format frontend/lib/features/navigation/main_shell.dart \
            frontend/test/p0_ux_8_mobile_navigation_test.dart \
            frontend/test/p0_real_actions_contract_test.dart \
            frontend/test/p0_ux_6_4_rtl_accessibility_contract_test.dart
      - name: Validate targeted UX-5 contracts
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test --no-pub \
            test/ux_5_glass_mobile_nav_contract_test.dart \
            test/p0_ux_8_mobile_navigation_test.dart \
            test/p0_real_actions_contract_test.dart \
            test/p0_ux_6_4_rtl_accessibility_contract_test.dart \
            test/rtl_screen_contract_test.dart
      - name: Validate full frontend suite
        working-directory: frontend
        run: flutter test --no-pub
      - name: Commit product and contract fixes; remove temporary builder
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ux-5-ci-fix.yml .github/ux5_ci_fix.py
          git add frontend/lib/features/navigation/main_shell.dart \
            frontend/test/p0_ux_8_mobile_navigation_test.dart \
            frontend/test/p0_real_actions_contract_test.dart \
            frontend/test/p0_ux_6_4_rtl_accessibility_contract_test.dart
          git commit -m 'test(ux): align mobile navigation contracts with glass shell'
          git push origin HEAD:ux/ux-5-glass-mobile-nav
