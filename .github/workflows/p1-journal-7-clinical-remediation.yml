name: P1-JOURNAL-7 clinical remediation

on:
  push:
    branches: [audit/p1-journal-7-visual]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: agent/p1-journal-ramadan-v2
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply exact clinical-safety remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}')
              path.write_text(text.replace(old, new))

          old_db = ''.join([
              '  Future<void> setRamadanPeriod({DateTime? start, DateTime? end}) async {\n',
              "    if ((start == null) != (end == null)) {\n",
              "      throw ArgumentError('Ramadan period requires both dates or neither');\n",
              '    }\n',
              '    if (start != null && end != null && start.isAfter(end)) {\n',
              "      throw ArgumentError('Ramadan period start must not be after end');\n",
              '    }\n',
              '    final existing = await (select(\n',
              '      patientProfiles,\n',
              '    )..limit(1)).getSingleOrNull();\n',
              '    final userId = existing?.userId ?? 1;\n',
              '    await into(patientProfiles).insertOnConflictUpdate(\n',
              '      PatientProfilesCompanion.insert(\n',
              '        userId: Value(userId),\n',
              '        updatedAt: DateTime.now(),\n',
              '        ramadanStartDate: Value(start),\n',
              '        ramadanEndDate: Value(end),\n',
              '      ),\n',
              '    );\n',
              '  }\n',
          ])
          new_db = ''.join([
              '  Future<bool> setRamadanPeriod({DateTime? start, DateTime? end}) async {\n',
              "    if ((start == null) != (end == null)) {\n",
              "      throw ArgumentError('Ramadan period requires both dates or neither');\n",
              '    }\n',
              '    if (start != null && end != null && start.isAfter(end)) {\n',
              "      throw ArgumentError('Ramadan period start must not be after end');\n",
              '    }\n',
              '    final existing = await (select(\n',
              '      patientProfiles,\n',
              '    )..limit(1)).getSingleOrNull();\n',
              '    if (existing == null) return false;\n',
              '    final updated = await (update(\n',
              '      patientProfiles,\n',
              '    )..where((row) => row.userId.equals(existing.userId))).write(\n',
              '      PatientProfilesCompanion(\n',
              '        updatedAt: Value(DateTime.now()),\n',
              '        ramadanStartDate: Value(start),\n',
              '        ramadanEndDate: Value(end),\n',
              '      ),\n',
              '    );\n',
              '    return updated == 1;\n',
              '  }\n',
          ])
          replace_once('frontend/lib/data/drift/database.dart', old_db, new_db)

          old_profile = ''.join([
              '      await db.setRamadanPeriod(start: start, end: end);\n',
              '      final serverSaved = await api.patchProfile({\n',
              "        'ramadan_start_date': start == null ? null : _apiDate(start),\n",
              "        'ramadan_end_date': end == null ? null : _apiDate(end),\n",
              '      });\n',
              '      if (!mounted) return;\n',
              '      setState(() => _hasPersistedProfile = true);\n',
              '      ScaffoldMessenger.of(context).showSnackBar(\n',
              '        SnackBar(\n',
              '          content: Text(\n',
              '            serverSaved ? l10n.ramadanSaved : l10n.ramadanSavedLocalOnly,\n',
              '          ),\n',
              '          backgroundColor: serverSaved\n',
              '              ? AminaTheme.successEmerald\n',
              '              : AminaTheme.warningOrange,\n',
              '          behavior: SnackBarBehavior.floating,\n',
              '        ),\n',
              '      );\n',
          ])
          new_profile = ''.join([
              '      final localSaved = await db.setRamadanPeriod(start: start, end: end);\n',
              '      final serverSaved = await api.patchProfile({\n',
              "        'ramadan_start_date': start == null ? null : _apiDate(start),\n",
              "        'ramadan_end_date': end == null ? null : _apiDate(end),\n",
              '      });\n',
              '      if (!mounted) return;\n',
              '      if (localSaved) setState(() => _hasPersistedProfile = true);\n',
              '      late final String message;\n',
              '      late final Color backgroundColor;\n',
              '      if (localSaved && serverSaved) {\n',
              '        message = l10n.ramadanSaved;\n',
              '        backgroundColor = AminaTheme.successEmerald;\n',
              '      } else if (localSaved) {\n',
              '        message = l10n.ramadanSavedLocalOnly;\n',
              '        backgroundColor = AminaTheme.warningOrange;\n',
              '      } else if (serverSaved) {\n',
              '        message = l10n.ramadanSavedServerOnly;\n',
              '        backgroundColor = AminaTheme.warningOrange;\n',
              '      } else {\n',
              '        message = l10n.ramadanSaveFailed;\n',
              '        backgroundColor = AminaTheme.dangerFg;\n',
              '      }\n',
              '      ScaffoldMessenger.of(context).showSnackBar(\n',
              '        SnackBar(\n',
              '          content: Text(message),\n',
              '          backgroundColor: backgroundColor,\n',
              '          behavior: SnackBarBehavior.floating,\n',
              '        ),\n',
              '      );\n',
          ])
          replace_once('frontend/lib/features/profile/profile_screen.dart', old_profile, new_profile)

          additions = {
              'frontend/lib/l10n/app_en.arb': (
                  '  "ramadanSavedLocalOnly": "Saved on this device. The server was not updated.",\n',
                  '  "ramadanSavedLocalOnly": "Saved on this device. The server was not updated.",\n'
                  '  "ramadanSavedServerOnly": "Saved to your account. No local profile was available on this device.",\n'
                  '  "ramadanSaveFailed": "The Ramadan period was not saved. Retry after your profile is available or your connection is restored.",\n'
              ),
              'frontend/lib/l10n/app_fr.arb': (
                  '  "ramadanSavedLocalOnly": "Enregistrée sur cet appareil. Le serveur n’a pas été mis à jour.",\n',
                  '  "ramadanSavedLocalOnly": "Enregistrée sur cet appareil. Le serveur n’a pas été mis à jour.",\n'
                  '  "ramadanSavedServerOnly": "Enregistrée sur ton compte. Aucun profil local n’était disponible sur cet appareil.",\n'
                  '  "ramadanSaveFailed": "Impossible d’enregistrer la période. Réessaie lorsque ton profil est disponible ou que la connexion est rétablie.",\n'
              ),
              'frontend/lib/l10n/app_ar.arb': (
                  '  "ramadanSavedLocalOnly": "تم الحفظ على هذا الجهاز. لم يتم تحديث الخادم.",\n',
                  '  "ramadanSavedLocalOnly": "تم الحفظ على هذا الجهاز. لم يتم تحديث الخادم.",\n'
                  '  "ramadanSavedServerOnly": "تم الحفظ في حسابك. لم يكن هناك ملف محلي متاح على هذا الجهاز.",\n'
                  '  "ramadanSaveFailed": "تعذر حفظ فترة رمضان. أعد المحاولة عندما يصبح ملفك متاحًا أو يعود الاتصال.",\n'
              ),
          }
          for path, (old, new) in additions.items():
              replace_once(path, old, new)
          PY
      - name: Regenerate localization and format
        working-directory: frontend
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib/data/drift/database.dart lib/features/profile/profile_screen.dart
          flutter analyze
          flutter test test/features/ramadan_mode_v2_test.dart test/features/ramadan_profile_responsive_test.dart
      - name: Commit remediation only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/lib/data/drift/database.dart \
            frontend/lib/features/profile/profile_screen.dart \
            frontend/lib/l10n/app_ar.arb \
            frontend/lib/l10n/app_en.arb \
            frontend/lib/l10n/app_fr.arb \
            frontend/lib/l10n/app_localizations.dart \
            frontend/lib/l10n/app_localizations_ar.dart \
            frontend/lib/l10n/app_localizations_en.dart \
            frontend/lib/l10n/app_localizations_fr.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No remediation change produced'
            exit 1
          fi
          git commit -m "fix(journal): never fabricate profile defaults for Ramadan"
          git push origin HEAD:agent/p1-journal-ramadan-v2
