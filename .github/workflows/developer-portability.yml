name: Developer portability

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - IAMINA.py
      - IAMINA.bat
      - IAMINA.command
      - .github/workflows/developer-portability.yml
      - .tool-versions
      - backend/**
      - frontend/**
      - docs/DEPENDENCIES.md
      - docs/DEVELOPER_MACOS.md
      - docs/LAUNCHER.md

permissions:
  contents: read

concurrency:
  group: developer-portability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  launcher-smoke:
    name: ${{ matrix.os }} — native launcher full smoke
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: portability-ci-secret-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:8009
      DATABASE_URL: sqlite:///portability-ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Compile canonical launcher
        run: python -m py_compile IAMINA.py

      - name: Validate native wrappers stay thin
        run: >-
          python -c "from pathlib import Path; files=[Path('IAMINA.bat'),Path('IAMINA.command')]; forbidden=('8008','8009','flutter','manage.py','venv'); texts=[p.read_text(encoding='utf-8') for p in files]; assert all(p.exists() for p in files); assert all('IAMINA.py' in t for t in texts); assert all(len(t.encode()) < 1024 for t in texts); assert all(token not in t.lower() for t in texts for token in forbidden); print('OK: native wrappers delegate only to IAMINA.py')"

      - name: Launcher preflight
        run: python IAMINA.py --check

      - name: Windows native-wrapper smoke on 8008/8009
        if: runner.os == 'Windows'
        shell: cmd
        run: IAMINA.bat --smoke --no-browser --no-redis

      - name: macOS native-wrapper smoke on 8008/8009
        if: runner.os == 'macOS'
        run: ./IAMINA.command --smoke --no-browser --no-redis

      - name: Windows backend startup diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          Write-Host "=== Django check using launcher-created venv ==="
          & .\venv\Scripts\python.exe backend\manage.py check
          Write-Host "=== Django import timing ==="
          & .\venv\Scripts\python.exe -X importtime backend\manage.py check 2> windows-importtime.log
          Get-Content windows-importtime.log -Tail 120
          Write-Host "=== Direct runserver startup (expected to be terminated by step timeout if healthy) ==="
          $env:PYTHONUNBUFFERED = "1"
          Set-Location backend
          & ..\venv\Scripts\python.exe manage.py runserver 127.0.0.1:8008 --noreload

      - name: Verify launcher cleanup released ports
        if: success()
        run: python IAMINA.py --check

  macos-regression:
    name: macOS host regression
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: macos-ci-secret-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///macos-ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Record runner architecture
        run: |
          sw_vers
          uname -a
          uname -m | tee /tmp/iamina-macos-arch.txt

      - name: Reject case-insensitive tracked-path collisions
        run: |
          python3 - <<'PY'
          import subprocess
          from collections import defaultdict

          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          groups = defaultdict(list)
          for path in filter(None, paths):
              groups[path.casefold()].append(path)
          collisions = [items for items in groups.values() if len(items) > 1]
          if collisions:
              for items in collisions:
                  print("case-insensitive collision:", " | ".join(items))
              raise SystemExit(1)
          print(f"OK: {len(paths) - 1} tracked paths have no case-insensitive collisions")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies on macOS host
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Django host smoke
        run: python backend/manage.py check

      - name: Backend tests on macOS host
        run: python -m pytest backend --tb=short -q

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Flutter analyze on macOS
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests on macOS
        working-directory: frontend
        run: flutter test --no-pub

      - name: Publish architecture boundary
        if: always()
        run: |
          ARCH=$(cat /tmp/iamina-macos-arch.txt 2>/dev/null || uname -m)
          {
            echo "### macOS portability runner"
            echo "- architecture: \`$ARCH\`"
            echo "- Python target: \`3.12\`"
            echo "- Flutter target: \`3.41.7\`"
            if [ "$ARCH" = "arm64" ]; then
              echo "- Apple Silicon host semantics: observed on GitHub runner"
            else
              echo "- Apple Silicon Docker Desktop semantics: NOT proven by this runner"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
