name: D1 P0 WebKit capability safe gate (NO CLINICAL GO)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/d1-p0-webkit-capability-gate.yml'
      - 'tools/d1_webkit_capability_gate_browser.js'
      - 'frontend/web/d1_vault_crypto_candidate.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-webkit-safe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  webkit-synthetic-safe-gate:
    name: Playwright WebKit native WebCrypto and same-origin locks
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright WebKit and native dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Test real WebKit engine on synthetic secure loopback origin
        shell: bash
        env:
          D1_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$D1_CANDIDATE_SHA"
          mkdir -p /tmp/iamina-d1-webkit-fixture
          cp frontend/web/d1_vault_crypto_candidate.js /tmp/iamina-d1-webkit-fixture/
          printf '<!doctype html><meta charset="utf-8"><script src="/d1_vault_crypto_candidate.js"></script>' > /tmp/iamina-d1-webkit-fixture/index.html
          python3 -m http.server 7476 --bind 127.0.0.1 --directory /tmp/iamina-d1-webkit-fixture >/tmp/d1-webkit-gate.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:7476/ >/dev/null
          node tools/d1_webkit_capability_gate_browser.js
      - name: Preserve synthetic WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-webkit-safe-capability-no-clinical-go
          path: |
            d1-webkit-capability-proof/*
            /tmp/d1-webkit-gate.log
          if-no-files-found: warn
          retention-days: 7
