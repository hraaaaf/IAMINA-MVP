name: One-shot regenerate OpenAPI P5

on:
  push:
    branches:
      - agent/dashboard-p5-smart-insight
    paths:
      - .github/workflows/_oneshot_regen_openapi_p5.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dashboard-p5-smart-insight
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Regenerate canonical OpenAPI and self-remove workflow
        run: |
          python backend/manage.py export_openapi > docs/api/openapi.json
          rm .github/workflows/_oneshot_regen_openapi_p5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.json .github/workflows/_oneshot_regen_openapi_p5.yml
          git diff --cached --check
          git commit -m "docs(api): regenerate OpenAPI for proactive preview"
          git push origin HEAD:agent/dashboard-p5-smart-insight
