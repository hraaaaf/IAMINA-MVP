name: Intent Envelope runtime integration

on:
  workflow_dispatch:
  push:
    branches:
      - feat/companion-intent-envelope-runtime-integration-v1
    paths:
      - "backend/companion/intent_runtime.py"
      - "backend/companion/intent_envelope.py"
      - "backend/companion/intent_model.py"
      - "backend/companion/intent_pipeline.py"
      - "backend/companion/conversation.py"
      - "backend/companion/core.py"
      - "backend/companion/zero_model_router.py"
      - "backend/core/companion/clinical.py"
      - "backend/diabetes/services/clinical/engine.py"
      - "backend/diabetes/services/clinical/whole_app_context_decision.py"
      - "backend/companion/test_intent_runtime_integration.py"
      - "backend/diabetes/tests/test_whole_app_context_decision.py"
      - ".github/workflows/intent-envelope-runtime-integration.yml"

permissions:
  contents: read

jobs:
  runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///intent-runtime-ci.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.15.17 import-linter

      - name: Ruff
        run: |
          ruff check \
            companion/intent_runtime.py \
            companion/intent_envelope.py \
            companion/intent_model.py \
            companion/intent_pipeline.py \
            companion/conversation.py \
            companion/core.py \
            companion/zero_model_router.py \
            core/companion/clinical.py \
            diabetes/services/clinical/engine.py \
            diabetes/services/clinical/whole_app_context_decision.py \
            companion/test_intent_runtime_integration.py \
            diabetes/tests/test_whole_app_context_decision.py

      - name: Architecture boundaries
        run: lint-imports

      - name: AI egress anti-bypass
        run: |
          python ../scripts/check_ai_egress_boundaries.py --check gateway
          python ../scripts/check_ai_egress_boundaries.py --check egress

      - name: Runtime integration tests
        run: |
          pytest -q --tb=short \
            companion/test_intent_runtime_integration.py \
            companion/test_intent_envelope_pipeline.py \
            companion/test_zero_model_runtime.py \
            companion/test_policy_runtime.py \
            diabetes/tests/test_whole_app_context_decision.py
