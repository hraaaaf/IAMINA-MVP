name: FRUG-5 multilingual quality sample

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/evaluation/frug5_multilingual_quality_benchmark.py"
      - "backend/evaluation/tests/test_frug5_multilingual_quality_benchmark.py"
      - "backend/evaluation/fixtures/frug7_groq_text_price.json"
      - "backend/evaluation/provider_benchmark_preflight.py"

permissions:
  contents: read

concurrency:
  group: frug5-multilingual-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Groq bounded 10-locale quality sample
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: frug5-quality-nonproduction
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///frug5-quality.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      FRUG5_QUALITY_NETWORK_AUTHORIZED: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Validate quality contracts before network
        run: >-
          pytest -q
          evaluation/tests/test_frug5_multilingual_quality_benchmark.py
          companion/test_history_budget_benchmark.py
          companion/test_route_telemetry_runtime.py
      - name: Run one bounded per-locale multilingual sample
        run: >-
          python -m evaluation.frug5_multilingual_quality_benchmark
          --output ../artifacts/frug5-multilingual-quality.json
      - name: Upload human-review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frug5-multilingual-quality
          path: artifacts/frug5-multilingual-quality.json
          if-no-files-found: warn
          retention-days: 14
