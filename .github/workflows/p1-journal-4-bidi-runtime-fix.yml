name: P1-JOURNAL-4 runtime bidi fix

on:
  push:
    branches: [audit/p1-journal-4-visual]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply runtime bidi isolation on exact product head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/p1-journal-nutrition-v2
          test "$(git rev-parse origin/feat/p1-journal-nutrition-v2)" = "72bb0ad03ce6d2df431ab69cd4d6eca56c7dfcd2"
          git checkout --detach 72bb0ad03ce6d2df431ab69cd4d6eca56c7dfcd2
          git checkout e1e5c96973f58f8daba81731339fa56776af5d2c -- frontend/lib/l10n/app_ar.arb frontend/lib/l10n/app_localizations_ar.dart
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/lib/features/journal/widgets/nutrition_portion_editor.dart')
          text = p.read_text()
          old = """                  : l10n.journalNutritionCarbsRange(\n                      estimate.low.toStringAsFixed(1),\n                      estimate.high.toStringAsFixed(1),\n                    ),"""
          new = """                  : _localizedCarbRange(\n                      l10n,\n                      widget.locale,\n                      estimate.low.toStringAsFixed(1),\n                      estimate.high.toStringAsFixed(1),\n                    ),"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one range renderer, found {text.count(old)}')
          helper = """\nString _localizedCarbRange(\n  AppLocalizations l10n,\n  Locale locale,\n  String low,\n  String high,\n) {\n  if (locale.languageCode != 'ar') {\n    return l10n.journalNutritionCarbsRange(low, high);\n  }\n  final lri = String.fromCharCode(0x2066);\n  final pdi = String.fromCharCode(0x2069);\n  return l10n.journalNutritionCarbsRange('$lri$low', '$high$pdi');\n}\n\n"""
          text = text.replace(old, new)
          marker = 'class NutritionPortionEditor extends StatelessWidget {'
          if marker not in text:
              raise SystemExit('editor class marker missing')
          text = text.replace(marker, helper + marker, 1)
          p.write_text(text)
          PY
          cat > frontend/test/l10n/nutrition_bidi_contract_test.dart <<'DART'
          import 'package:amina/features/journal/widgets/nutrition_portion_editor.dart';
          import 'package:amina/l10n/app_localizations_ar.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            testWidgets('Arabic nutrition range keeps low-to-high order', (tester) async {
              late String rendered;
              await tester.pumpWidget(
                MaterialApp(
                  home: Builder(
                    builder: (context) {
                      rendered = debugNutritionCarbRangeForTest(
                        AppLocalizationsAr(),
                        const Locale('ar'),
                        '22.1',
                        '26.4',
                      );
                      return const SizedBox.shrink();
                    },
                  ),
                ),
              );
              expect(rendered, contains('${String.fromCharCode(0x2066)}22.1–26.4${String.fromCharCode(0x2069)}'));
              expect(rendered, isNot(contains('26.4–22.1')));
            });
          }
          DART
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/lib/features/journal/widgets/nutrition_portion_editor.dart')
          text = p.read_text()
          marker = "String _localizedCarbRange(\n"
          export = "String debugNutritionCarbRangeForTest(\n  AppLocalizations l10n,\n  Locale locale,\n  String low,\n  String high,\n) => _localizedCarbRange(l10n, locale, low, high);\n\n"
          if marker not in text:
              raise SystemExit('helper marker missing')
          text = text.replace(marker, export + marker, 1)
          p.write_text(text)
          PY
          cd frontend
          flutter pub get
          flutter gen-l10n
          dart format lib/features/journal/widgets/nutrition_portion_editor.dart test/l10n/nutrition_bidi_contract_test.dart
          flutter analyze --no-fatal-infos
          flutter test --no-pub test/l10n/nutrition_bidi_contract_test.dart test/core/data/nutrition_catalog_test.dart
          cd ..
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/lib/l10n/app_ar.arb frontend/lib/l10n/app_localizations_ar.dart frontend/lib/features/journal/widgets/nutrition_portion_editor.dart frontend/test/l10n/nutrition_bidi_contract_test.dart
          git commit -m 'fix(journal): render Arabic nutrition ranges safely'
          git push --force-with-lease=refs/heads/feat/p1-journal-nutrition-v2:72bb0ad03ce6d2df431ab69cd4d6eca56c7dfcd2 origin HEAD:refs/heads/feat/p1-journal-nutrition-v2
