name: TEMP Diagnose auth integrity migrations

on:
  push:
    branches:
      - fix/p0-auth-profile-integrity
    paths:
      - .github/workflows/generate-migrations-temp.yml

permissions:
  contents: write

jobs:
  diagnose-migrations:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -q -r backend/requirements.txt
      - name: Capture migration state without aborting diagnostics
        run: |
          set +e
          mkdir -p .ci
          cd backend
          {
            echo "=== makemigrations dry-run ==="
            python manage.py makemigrations core diabetes --dry-run --verbosity 3
            echo "dry_run_exit=$?"
            echo "=== showmigrations core diabetes ==="
            python manage.py showmigrations core diabetes
            echo "showmigrations_exit=$?"
            echo "=== real makemigrations ==="
            python manage.py makemigrations core diabetes
            echo "makemigrations_exit=$?"
          } > ../.ci/migration-diagnostic.txt 2>&1
          cd ..
          exit 0
      - name: Commit diagnostic and any generated migrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/migration-diagnostic.txt backend/core/migrations backend/diabetes/migrations
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "fix(db): capture and generate patient profile migration state"
          git push origin HEAD:fix/p0-auth-profile-integrity
