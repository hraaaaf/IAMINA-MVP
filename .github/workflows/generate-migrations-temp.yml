name: TEMP Generate auth integrity migrations

on:
  push:
    branches:
      - fix/p0-auth-profile-integrity
    paths:
      - .github/workflows/generate-migrations-temp.yml

permissions:
  contents: write

jobs:
  generate-migrations:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -q -r backend/requirements.txt
      - name: Generate Django migrations
        run: |
          cd backend
          python manage.py makemigrations core diabetes
      - name: Commit generated migrations
        run: |
          if git diff --quiet -- backend/core/migrations backend/diabetes/migrations; then
            echo "No migration changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/core/migrations backend/diabetes/migrations
          git commit -m "fix(db): migrate nullable patient profile facts"
          git push origin HEAD:fix/p0-auth-profile-integrity
