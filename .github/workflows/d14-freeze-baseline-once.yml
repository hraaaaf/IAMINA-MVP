name: D14 one-shot freeze of certified main visual baseline

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/d14-freeze-baseline-once.yml'

# Temporary, never merged: the workflow writes only the six SHA-verified
# historical synthetic screenshots into its own same-repository PR branch.
permissions:
  contents: write
  actions: read

concurrency:
  group: d14-freeze-baseline-1245
  cancel-in-progress: false

jobs:
  pin-historical-main-screenshots:
    if: ${{ github.event.pull_request.number == 1245 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/iamina-b-d14-meal-photo-20261103' && github.event.pull_request.base.sha == '6adf3fbeecb0f6645f9c7a9e3934177ef9eca6c7' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Freeze only current authorized D14 PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Retrieve exact certified historical screenshot artifact
        uses: actions/download-artifact@v4
        with:
          name: d14-photo-web-consent-before-after
          run-id: 41669280628
          repository: hraaaaf/IAMINA-MVP
          github-token: ${{ github.token }}
          path: /tmp/d14-certified-main

      - name: Verify base SHA and immutable SHA256 of every image
        run: |
          set -euo pipefail
          cd /tmp/d14-certified-main
          cat > baseline-sha256.txt <<'BASE'
          c0388022561a8bf9da88cfdcd89974f1afda591acbc1d573a7a84c6f8e2c7b37  before-desktop-ar-1280x900.png
          1dbbf919dfb8035f9c7c464f93695ad0413fafbd04a476a8e161d9585439da21  before-desktop-fr-1280x900.png
          aa75e6b245b1d96cbd82e31bffa5a424b88083b011698ef82f4e1374927872d4  before-mobile-ar-390x844.png
          35f27230f82d30ed702ac0faa89141bf489ca711ec8b716a140cf45f1ad662c5  before-mobile-fr-390x844.png
          f5d047b4d788f23e77252a1c861c9843616bd2ac781105b2e2cdedddd08c3181  before-tablet-ar-768x1024.png
          24b7133483d6721b92357819b5a0bf6a005e4df3e627b731d4084646ed101ac9  before-tablet-fr-768x1024.png
          BASE
          sha256sum --check baseline-sha256.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('browser-report.json').read_text())
          assert p['base']=='6adf3fbeecb0f6645f9c7a9e3934177ef9eca6c7'
          assert len(p['viewports'])==6 and len(p['scenarios'])==30
          assert all(p['viewports'][k]['before'].startswith('d14-web-cert/') or p['viewports'][k]['before'].startswith('before-') for k in p['viewports'])
          print('D14 six certified baseline screenshot hashes and source verified')
          PY

      - name: Persist only those six original screenshots on D14 PR branch
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          target=tools/fixtures/d14/main-6adf3fbe
          mkdir -p "$target"
          for f in /tmp/d14-certified-main/before-*.png; do
            cp "$f" "$target/"
          done
          cp /tmp/d14-certified-main/baseline-sha256.txt "$target/"
          cp /tmp/d14-certified-main/browser-report.json "$target/baseline-browser-report.json"
          git add -- "$target"
          if git diff --cached --quiet; then
            echo 'D14 baseline already pinned: nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(D14): freeze six original SHA256-certified main screenshots'
          # Scoped to same-repository PR branch, never main or any deployment.
          git push origin "HEAD:refs/heads/$PR_REF"
