name: PR18 exact Ruff fix

on:
  push:
    branches: [feat/p0-mena-provider-benchmark]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-provider-benchmark
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.15.17
      - name: Apply exact repository formatting
        working-directory: backend
        run: ruff check evaluation --fix
      - name: Commit and remove helper
        run: |
          rm .github/workflows/pr18-ruff-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(eval): apply canonical Ruff formatting"
          git push origin HEAD:feat/p0-mena-provider-benchmark
