              'dashboardLoadErrorTitle': 'تعذر عرض بياناتك',
              'dashboardLoadErrorBody': 'تعذر على لوحة المتابعة قراءة بياناتك المحلية. يمكنك إعادة المحاولة من دون إنشاء أي بيانات افتراضية.',
              'firstUseTruthNote': 'لن تظهر الاتجاهات والتحليلات إلا عند توفر بيانات حقيقية.'
            }
          }

          import json
          for file, vals in additions.items():
            path = Path(file)
            data = json.loads(path.read_text())
            data.update(vals)
            path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Validate targeted contracts
        working-directory: frontend
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze --no-fatal-infos
          flutter test test/p0_ux_11_first_use_dashboard_contract_test.dart test/p0_ux_9_small_screen_contract_test.dart test/p0_ux_7_desktop_tablet_contract_test.dart
      - name: Commit clean product diff
        run: |
          rm .github/workflows/p0-ux-11-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/lib/features/dashboard/dashboard_screen.dart frontend/lib/l10n/app_fr.arb frontend/lib/l10n/app_en.arb frontend/lib/l10n/app_ar.arb frontend/test/p0_ux_11_first_use_dashboard_contract_test.dart .github/workflows/p0-ux-11-apply.yml
          git commit -m 'fix(ux): guide truthful first-use dashboard'
          git push origin HEAD:fix/p0-ux-11-first-use-dashboard