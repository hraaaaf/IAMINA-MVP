name: Apply RTL directional layout codemod

on:
  push:
    branches: [feat/p0-mena-rtl-screen-certification]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-rtl-screen-certification
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - name: Apply directional conversions
        working-directory: frontend
        run: |
          python tool/rtl_directionalize.py
          dart format lib/features test/rtl_screen_contract_test.dart
      - name: Commit converted screens
        run: |
          if git diff --quiet; then
            echo "No RTL conversions required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib frontend/test frontend/tool
          git commit -m "fix(rtl): use directional layout primitives across screens"
          git push origin HEAD:feat/p0-mena-rtl-screen-certification
