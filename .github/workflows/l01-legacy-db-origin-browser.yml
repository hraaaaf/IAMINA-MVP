name: L01 legacy IndexedDB source (synthetic real Chrome)

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/lib/ui_l01_legacy_db_origin_probe_main.dart'
      - 'scripts/l01_legacy_db_origin_browser_probe.py'
      - '.github/workflows/l01-legacy-db-origin-browser.yml'

permissions:
  contents: read

concurrency:
  group: l01-legacy-db-origin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-chrome:
    name: Control vs legacy database-open, fresh Chrome, local only
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Analyze synthetic Web entrypoint
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos lib/ui_l01_legacy_db_origin_probe_main.dart
      - name: Build isolated experiment only — no patient app deploy
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter build web --release --no-web-resources-cdn \
            -t lib/ui_l01_legacy_db_origin_probe_main.dart \
            --dart-define=API_BASE_URL=http://127.0.0.1:9
          test -s build/web/main.dart.js
      - name: Fresh Chrome IndexedDB control vs legacy probe
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client
          python3 -m http.server 7391 --bind 127.0.0.1 \
            --directory frontend/build/web > /tmp/iamina-l01-legacy-local.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused \
            --retry-delay 1 http://127.0.0.1:7391/ > /dev/null
          python3 scripts/l01_legacy_db_origin_browser_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l01-legacy-db-origin-synthetic-chrome
          path: l01-legacy-db-origin-proof/
          retention-days: 14
          if-no-files-found: warn
