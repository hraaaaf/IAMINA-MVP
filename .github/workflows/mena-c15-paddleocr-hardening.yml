name: MENA C15 PaddleOCR hardening

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mena-319-c15-paddleocr-hardening*
    paths:
      - scripts/run_paddleocr_hardening_benchmark.py
      - .github/workflows/mena-c15-paddleocr-hardening.yml

permissions:
  contents: read
  issues: write

jobs:
  paddleocr-hardening:
    name: PP-OCRv6 synthetic hardening CPU benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local OCR runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.2 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.7.0 Pillow>=10.0
      - name: Run C15 hardening benchmark
        run: python scripts/run_paddleocr_hardening_benchmark.py --output-dir /tmp/paddleocr-c15
      - name: Upload C15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mena-c15-paddleocr-${{ github.sha }}
          path: /tmp/paddleocr-c15
          if-no-files-found: warn
          retention-days: 14
      - name: Publish durable C15 result
        if: always()
        uses: actions/github-script@v7
        env:
          C15_STATUS: ${{ job.status }}
        with:
          script: |
            const status = process.env.C15_STATUS.toUpperCase();
            const sha = context.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[MENA C15] ${status} PaddleOCR hardening ${sha.slice(0, 12)}`;
            const body = [
              `PP-OCRv6 synthetic hardening result.`,
              ``,
              `- SHA: \`${sha}\``,
              `- Result: **${status}**`,
              `- Workflow run: ${runUrl}`,
              `- Cases: rotated glucometer, low-contrast glucometer, blur/JPEG lab`,
              `- Patient data: no`,
              `- Provider API / paid inference: no`,
              ``,
              `Artifact \`mena-c15-paddleocr-${sha}\` contains measured JSON evidence and synthetic fixtures.`
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
