name: P1-JOURNAL-7 temporary remediation

on:
  push:
    branches:
      - agent/p1-journal-ramadan-v2
    paths:
      - .github/workflows/tmp-p1-journal-7-remediate.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-journal-ramadan-v2
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply fail-closed local profile remediation
        run: python3 .github/scripts/tmp_p1_j7_remediate.py
      - name: Format touched Dart files
        run: |
          dart format frontend/lib/data/drift/database.dart
          dart format frontend/lib/features/profile/profile_screen.dart
          dart format frontend/test/data/drift/ramadan_period_migration_test.dart
      - name: Focused regression gates
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze
          flutter test test/data/drift/ramadan_period_migration_test.dart
          flutter test test/core/data/ramadan_context_test.dart test/features/ramadan_mode_v2_test.dart test/features/ramadan_profile_responsive_test.dart
      - name: Commit remediation
        run: |
          git config user.name 'hraaaaf'
          git config user.email '123034021+hraaaaf@users.noreply.github.com'
          git add frontend/lib/data/drift/database.dart frontend/lib/features/profile/profile_screen.dart frontend/test/data/drift/ramadan_period_migration_test.dart
          git diff --cached --check
          git commit -m 'fix(profile): avoid fabricated defaults in Ramadan save'
          git push origin HEAD:agent/p1-journal-ramadan-v2
