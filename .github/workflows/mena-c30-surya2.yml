name: MENA C30 Surya2 Arabic document evidence

on:
  pull_request:
    paths:
      - ".github/workflows/mena-c30-surya2.yml"
      - "backend/evaluation/surya2_numeric_benchmark.py"
      - "backend/evaluation/tests/test_surya2_numeric_benchmark.py"
      - "backend/evaluation/misraj_numeric_benchmark.py"
      - "backend/evaluation/fixtures/c26_misraj_source.json"
      - "scripts/run_misraj_surya2_numeric_benchmark.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  C30_LLAMA_CPP_RELEASE: b10488
  SURYA_INFERENCE_BACKEND: llamacpp
  SURYA_INFERENCE_PARALLEL: "1"
  SURYA_INFERENCE_CTX_SIZE: "16384"
  SURYA_INFERENCE_LOGPROBS: "false"
  SURYA_INFERENCE_TIMEOUT_SECONDS: "900"
  SURYA_INFERENCE_STARTUP_TIMEOUT: "900"
  LLAMA_CPP_NGL: "0"

jobs:
  surya2-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned CPU Surya package
        run: |
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.13.0 torchvision==0.28.0
          python -m pip install --disable-pip-version-check surya-ocr==0.22.1
          python - <<'PY'
          import importlib.metadata
          import torch
          assert importlib.metadata.version("surya-ocr") == "0.22.1"
          assert torch.cuda.is_available() is False
          print("surya-ocr", importlib.metadata.version("surya-ocr"))
          print("torch", torch.__version__)
          PY

      - name: Install pinned llama.cpp CPU server
        shell: bash
        run: |
          set -euo pipefail
          asset="llama-${C30_LLAMA_CPP_RELEASE}-bin-ubuntu-x64.tar.gz"
          release_json="/tmp/llama-release.json"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 120 \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/${C30_LLAMA_CPP_RELEASE}" \
            --output "$release_json"
          asset_url="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .browser_download_url' "$release_json")"
          asset_digest="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .digest' "$release_json")"
          test -n "$asset_url" -a "$asset_url" != "null"
          test -n "$asset_digest" -a "$asset_digest" != "null"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            "$asset_url" --output /tmp/llama.tar.gz
          actual_sha="$(sha256sum /tmp/llama.tar.gz | awk '{print $1}')"
          test "$asset_digest" = "sha256:${actual_sha}"
          mkdir -p /tmp/llama
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          llama_bin="$(find /tmp/llama -type f -name llama-server -print -quit)"
          test -n "$llama_bin"
          chmod +x "$llama_bin"
          echo "LLAMA_CPP_BINARY=$llama_bin" >> "$GITHUB_ENV"
          echo "C30_LLAMA_CPP_SHA256=$actual_sha" >> "$GITHUB_ENV"
          "$llama_bin" --version

      - name: Download and verify pinned Surya GGUF weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/surya-model
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 1200 \
            'https://huggingface.co/datalab-to/surya-ocr-2-gguf/resolve/main/surya-2.gguf?download=true' \
            --output /tmp/surya-model/surya-2.gguf
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            'https://huggingface.co/datalab-to/surya-ocr-2-gguf/resolve/main/surya-2-mmproj.gguf?download=true' \
            --output /tmp/surya-model/surya-2-mmproj.gguf
          echo '1f18abe17b1ed8b4e47ee9b1ad0e274c93daf5efbb6b29a04ff1712e37051e05  /tmp/surya-model/surya-2.gguf' | sha256sum -c -
          echo '98c0563673b1657ff6d021d1e5f04af06cbf61bb40c63ac613e8bb71b42fb2c0  /tmp/surya-model/surya-2-mmproj.gguf' | sha256sum -c -
          echo 'SURYA_GGUF_LOCAL_MODEL_PATH=/tmp/surya-model/surya-2.gguf' >> "$GITHUB_ENV"
          echo 'SURYA_GGUF_LOCAL_MMPROJ_PATH=/tmp/surya-model/surya-2-mmproj.gguf' >> "$GITHUB_ENV"

      - name: Fetch pinned 10-row viewer slice
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output /tmp/misraj-viewer.json \
            'https://datasets-server.huggingface.co/rows?dataset=Misraj%2FMisraj-DocOCR&config=default&split=train&offset=0&length=10'

      - name: Run and validate Surya2 evidence
        run: |
          set +e
          python scripts/run_misraj_surya2_numeric_benchmark.py /tmp/misraj-viewer.json \
            --output c30-surya2.json
          benchmark_status=$?
          set -e
          test "$benchmark_status" -eq 0 -o "$benchmark_status" -eq 1
          BENCHMARK_STATUS="$benchmark_status" python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("c30-surya2.json").read_text(encoding="utf-8"))
          status = int(os.environ["BENCHMARK_STATUS"])
          assert result["benchmark"] == "c30-misraj-surya2-exact-numeric-safety"
          assert result["engine"] == "surya2"
          assert result["source_images_pinned"] is True
          assert result["sampled_rows"] == 10
          assert result["numeric_total"] == 10
          assert 0 <= result["numeric_safe_cases"] <= 10
          assert (status == 0) == result["numeric_safety_floor_passed"]
          assert result["raw_ground_truth_emitted"] is False
          assert result["raw_ocr_text_emitted"] is False
          assert result["provider_api"] is False
          assert result["paid_inference"] is False
          assert result["engine_config"]["package_version"] == "0.22.1"
          assert result["engine_config"]["model_sha256"] == "1f18abe17b1ed8b4e47ee9b1ad0e274c93daf5efbb6b29a04ff1712e37051e05"
          assert result["engine_config"]["mmproj_sha256"] == "98c0563673b1657ff6d021d1e5f04af06cbf61bb40c63ac613e8bb71b42fb2c0"
          assert result["engine_config"]["llama_cpp_release"] == "b10488"
          assert result["engine_config"]["llama_cpp_sha256"] == os.environ["C30_LLAMA_CPP_SHA256"]
          assert len(result["engine_config"]["llama_cpp_sha256"]) == 64
          PY

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mena-c30-surya2
          path: c30-surya2.json
          if-no-files-found: warn
          retention-days: 14
