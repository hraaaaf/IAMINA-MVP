name: P0 Pytest Debug

on:
  pull_request:
    branches: [main]

jobs:
  debug:
    if: github.head_ref == 'fix/p0-ai-egress-consent-boundary'
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Capture pytest failures
        run: |
          cd backend
          pytest --tb=short -q > ../pytest-p0-output.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-p0-output
          path: pytest-p0-output.txt
