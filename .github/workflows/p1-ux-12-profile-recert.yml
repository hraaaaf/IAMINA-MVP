name: P1-UX-12 profile recert

on:
  push:
    branches:
      - audit/p1-ux-12-profile-recert
    paths:
      - .github/workflows/p1-ux-12-profile-recert.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0e23c25485e5f9b23f480d4dfe2834baf5102c97

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Build certified Flutter Web bundle
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --dart-define=IAMINA_AUDIT_ACCESS=true

      - name: Install capture runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start local bundle
        working-directory: frontend/build/web
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/iamina-web.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/iamina-web.log
          exit 1

      - name: Capture exact-head Profile matrix
        run: |
          mkdir -p /tmp/p1-ux-12
          cat > /tmp/p1-ux-12/capture.cjs <<'EOF'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs = require('fs');
          const path = require('path');
          const profiles = [
            ['desktop-fr',1440,1000,'fr','fr-FR'], ['desktop-ar',1440,1000,'ar','ar-MA'],
            ['tablet-fr',768,1024,'fr','fr-FR'], ['tablet-ar',768,1024,'ar','ar-MA'],
            ['mobile-fr',390,844,'fr','fr-FR'], ['mobile-ar',390,844,'ar','ar-MA'],
            ['small-fr',360,560,'fr','fr-FR'], ['small-ar',360,560,'ar','ar-MA'],
          ];
          (async () => {
            const browser = await chromium.launch({headless:true});
            const report = [];
            for (const [profile,width,height,lang,locale] of profiles) {
              const context = await browser.newContext({viewport:{width,height},deviceScaleFactor:1,locale,timezoneId:'Africa/Casablanca'});
              const page = await context.newPage();
              const consoleErrors=[]; const pageErrors=[];
              page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });
              page.on('pageerror', e => pageErrors.push(String(e)));
              await page.goto(`http://127.0.0.1:8080/?audit=visual-cert&lang=${lang}#/profile`, {waitUntil:'domcontentloaded', timeout:30000});
              await page.waitForTimeout(6000);
              const file=`${profile}__profile.png`;
              await page.screenshot({path:path.join('/tmp/p1-ux-12',file),fullPage:true});
              const flutterViews=await page.locator('flutter-view').count();
              report.push({profile,lang,width,height,url:page.url(),flutterViews,consoleErrors,pageErrors,screenshot:file});
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('/tmp/p1-ux-12/report.json', JSON.stringify(report,null,2));
            const failures=report.filter(x=>x.flutterViews!==1 || x.pageErrors.length>0);
            if (failures.length) { console.error(JSON.stringify(failures,null,2)); process.exit(1); }
          })();
          EOF
          node /tmp/p1-ux-12/capture.cjs

      - name: Record source
        if: always()
        run: |
          echo 0e23c25485e5f9b23f480d4dfe2834baf5102c97 > /tmp/p1-ux-12/source-sha.txt
          cp /tmp/iamina-web.log /tmp/p1-ux-12/server.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-ux-12-profile-recert-v5
          path: /tmp/p1-ux-12
          retention-days: 14
          if-no-files-found: error
