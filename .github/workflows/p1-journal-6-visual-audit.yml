name: P1-JOURNAL-6 visual audit

on:
  push:
    branches: [audit/p1-journal-6-visual]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@v4
        with:
          path: audit
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: fccbdf5bf69bd72c2cf079091b96cd52dcdf3d0c
          path: product
      - name: Overlay audit-only harness
        run: |
          mkdir -p product/frontend/test/audit
          cp audit/frontend/test/audit/p1_journal_6_visual_audit_test.dart product/frontend/test/audit/
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: product/frontend
        run: flutter pub get
      - name: Render FR/AR Add+Edit context matrix
        working-directory: product/frontend
        run: flutter test --update-goldens test/audit/p1_journal_6_visual_audit_test.dart
      - name: Upload rendered matrix
        uses: actions/upload-artifact@v4
        with:
          name: p1-journal-6-visual-matrix-fccbdf5
          path: product/frontend/test/audit/goldens/*.png
          if-no-files-found: error
