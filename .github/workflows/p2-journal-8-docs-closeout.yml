name: P2-JOURNAL-8 docs closeout

on:
  push:
    branches: [audit/p2-journal-8-docs-closeout]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closeout-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout audit tools
        uses: actions/checkout@v4
        with:
          ref: audit/p2-journal-8-docs-closeout
          path: audit-tools

      - name: Checkout exact product branch
        uses: actions/checkout@v4
        with:
          ref: agent/p2-journal-personal-response
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: product

      - name: Patch canonical docs
        run: python audit-tools/.github/scripts/p2_journal_8_docs_closeout.py product

      - name: Verify and push docs-only closeout
        working-directory: product
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' docs/MEDICAL_DATA_PLAN.md docs/ROADMAP.md docs/SPECS.md | sort)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md docs/SPECS.md docs/MEDICAL_DATA_PLAN.md
          git commit -m 'docs(journal): certify personal response pre-merge state'
          git push origin HEAD:agent/p2-journal-personal-response
