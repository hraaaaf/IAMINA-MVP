name: P2-UX-14 minimal cleanup

on:
  push:
    branches: [fix/p2-ux-14-density-polish]
    paths:
      - .github/workflows/p2-ux-14-minimal-cleanup.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2-ux-14-density-polish
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Restore canonical source then apply minimal patch
        run: |
          git fetch origin main
          git checkout origin/main -- \
            frontend/.flutter-plugins-dependencies \
            frontend/pubspec.lock \
            frontend/lib/features/journal/ai_summary_screen.dart \
            frontend/lib/features/journal/journal_screen.dart \
            frontend/lib/features/profile/profile_screen.dart
          python3 .tmp/p2_ux_14_minimal.py
      - name: Analyze without rewriting source formatting
        working-directory: frontend
        run: |
          flutter pub get
          git checkout origin/main -- .flutter-plugins-dependencies pubspec.lock
          flutter analyze --no-fatal-infos
      - name: Focused and historical contracts
        working-directory: frontend
        run: |
          flutter test --no-pub \
            test/p2_ux_14_density_polish_contract_test.dart \
            test/p0_ux_7_desktop_tablet_contract_test.dart \
            test/p0_ux_9_small_screen_contract_test.dart \
            test/p0_ux_11_first_use_dashboard_contract_test.dart \
            test/p1_ux_12_progressive_profile_contract_test.dart \
            test/p1_ux_13_wording_contract_test.dart \
            test/p1_ux_13_compact_consent_contract_test.dart
      - name: Remove temporary cleanup transport
        run: rm -f .tmp/p2_ux_14_minimal.py .github/workflows/p2-ux-14-minimal-cleanup.yml
      - name: Commit minimized product diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'chore(ux): minimize P2-UX-14 diff'
          git push origin HEAD:fix/p2-ux-14-density-polish
