name: CGM V2 responsive fix

on:
  push:
    branches:
      - agent/cgm-gateway-v2-product-wiring
    paths:
      - .github/workflows/cgm-v2-responsive-fix.yml

permissions:
  contents: write

jobs:
  patch-responsive-row:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cgm-gateway-v2-product-wiring
      - name: Patch CGM reading row
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/lib/features/import/cgm_connections_section.dart')
          text = path.read_text()
          old = '''                child: Row(
                  children: [
                    Text(
                      '${latest.glucoseMgDl}',
                      style: const TextStyle(
                        fontSize: 24,
                        fontWeight: FontWeight.w800,
                        color: AminaTheme.ink900,
                      ),
                    ),
                    const SizedBox(width: 5),
                    const Text('mg/dL', style: TextStyle(fontSize: 11, color: AminaTheme.ink500)),
                    if (latest.trend.isNotEmpty) ...[
                      const SizedBox(width: 10),
                      Flexible(
                        child: Text(
                          latest.trend,
                          overflow: TextOverflow.ellipsis,
                          style: const TextStyle(
                            fontSize: 12,
                            fontWeight: FontWeight.w600,
                            color: AminaTheme.teal700,
                          ),
                        ),
                      ),
                    ],
                    const Spacer(),
                    Text(
                      _relative(latest.recordedAt, l10n),
                      style: const TextStyle(fontSize: 11, color: AminaTheme.ink500),
                    ),
                  ],
                ),'''
          new = '''                child: Wrap(
                  crossAxisAlignment: WrapCrossAlignment.center,
                  spacing: 6,
                  runSpacing: 4,
                  children: [
                    Text(
                      '${latest.glucoseMgDl}',
                      style: const TextStyle(
                        fontSize: 24,
                        fontWeight: FontWeight.w800,
                        color: AminaTheme.ink900,
                      ),
                    ),
                    const Text('mg/dL', style: TextStyle(fontSize: 11, color: AminaTheme.ink500)),
                    if (latest.trend.isNotEmpty)
                      Text(
                        latest.trend,
                        overflow: TextOverflow.ellipsis,
                        style: const TextStyle(
                          fontSize: 12,
                          fontWeight: FontWeight.w600,
                          color: AminaTheme.teal700,
                        ),
                      ),
                    Text(
                      _relative(latest.recordedAt, l10n),
                      style: const TextStyle(fontSize: 11, color: AminaTheme.ink500),
                    ),
                  ],
                ),'''
          if old not in text:
              raise SystemExit('responsive CGM row anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/features/import/cgm_connections_section.dart
          git commit -m "fix(cgm): make latest reading row responsive"
          git push origin HEAD:agent/cgm-gateway-v2-product-wiring
