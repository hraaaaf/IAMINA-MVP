name: Django migration drift

on:
  push:
    branches: [main, dev, feat/**, fix/**, chore/**, docs/**]
  pull_request:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  migration-drift:
    name: Django model/migration drift
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Reject model/migration drift
        run: python manage.py makemigrations --check --dry-run

  journal-4-final-cleanup:
    name: P1-JOURNAL-4 final runner cleanup
    if: github.event_name == 'push' && github.event.head_commit.message == 'activate P1-JOURNAL-4 final cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p1-journal-nutrition-v2
          fetch-depth: 0
      - name: Restore runner-only files after all validation
        run: |
          git fetch origin main
          git checkout origin/main -- frontend/pubspec.lock frontend/.flutter-plugins-dependencies .github/workflows/migration-drift.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'chore(journal): remove runner-only artifacts'
          git push origin HEAD:feat/p1-journal-nutrition-v2
