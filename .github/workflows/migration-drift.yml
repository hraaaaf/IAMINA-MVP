name: Django migration drift

on:
  push:
    branches: [main, dev, feat/**, fix/**, chore/**, docs/**]
  pull_request:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  migration-drift:
    name: Django model/migration drift
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Reject model/migration drift
        run: python manage.py makemigrations --check --dry-run

  p1-journal-3-closeout:
    name: P1-JOURNAL-3 closeout
    if: github.event_name == 'push' && github.event.head_commit.message == 'ci(temp): activate P1-JOURNAL-3 closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p1-journal-meal-capture
          fetch-depth: 0
      - name: Update docs and remove temporary plumbing
        run: |
          python3 .github/scripts/p1_journal_3_closeout.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/migration-drift.yml
          git rm .github/scripts/p1_journal_3_closeout.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md status-Achraf.md status.md .github/workflows/migration-drift.yml
          git commit -m 'docs(journal): record P1-JOURNAL-3 certification state'
          git push origin HEAD:feat/p1-journal-meal-capture
