name: Django migration drift

on:
  push:
    branches: [main, dev, feat/**, fix/**, chore/**, docs/**]
  pull_request:
    branches: [main, dev]

jobs:
  migration-drift:
    name: Django model/migration drift
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Reject model/migration drift
        run: python manage.py makemigrations --check --dry-run

  p1-journal-3-cleanup:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feat/p1-journal-meal-capture' &&
      github.event.head_commit.message == 'ci(temp): clean P1-JOURNAL-3 builder artifacts'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p1-journal-meal-capture
          fetch-depth: 0
      - name: Remove temporary builder and dependency noise
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/migration-drift.yml frontend/.flutter-plugins-dependencies frontend/pubspec.lock
          git rm .github/workflows/p1-journal-3-builder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/migration-drift.yml frontend/.flutter-plugins-dependencies frontend/pubspec.lock
          git commit -m 'chore(journal): remove temporary P1-JOURNAL-3 builder'
          git push origin HEAD:feat/p1-journal-meal-capture
