name: Django migration drift

on:
  push:
    branches: [main, dev, feat/**, fix/**, chore/**, docs/**]
  pull_request:
    branches: [main, dev]

jobs:
  migration-drift:
    name: Django model/migration drift
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Reject model/migration drift
        run: python manage.py makemigrations --check --dry-run

  p1-journal-3-builder:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feat/p1-journal-meal-capture' &&
      github.event.head_commit.message == 'ci(temp): run split P1-JOURNAL-3 gates on shared runner'
    name: P1-JOURNAL-3 branch-only builder
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p1-journal-meal-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply source patch stored in branch workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/p1-journal-3-builder.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          raw = source[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines()) + '\n'
          code = code.replace(
              "Path('frontend/test/data/drift/meal_items_migration_test.dart').write_text(r'''import 'dart:io';",
              "Path('frontend/test/data/drift/meal_items_migration_test.dart').write_text(r\"\"\"import 'dart:io';", 1)
          code = code.replace(
              "\n}\n''')\n\nPath('frontend/test/features/meal_capture_panel_test.dart')",
              "\n}\n\"\"\")\n\nPath('frontend/test/features/meal_capture_panel_test.dart')", 1)
          Path('/tmp/p1j3_apply.py').write_text(code)
          PY
          python3 /tmp/p1j3_apply.py
      - name: Apply compile and compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/lib/services/api_client.dart')
          s = p.read_text()
          a = s.find('  /// Identify visible foods in a meal photo. The server enforces the\n')
          b = s.find('  /// Web OCR: extract glucose value from a glucometer photo via Gemini Vision.\n', a)
          if a < 0 or b < 0: raise SystemExit('duplicate meal method markers missing')
          p.write_text(s[:a] + s[b:])

          p = Path('frontend/lib/features/journal/widgets/meal_capture_panel.dart')
          s = p.read_text().replace("import 'dart:convert';\n\n", '', 1)
          old = "return ApiClient().analyzeMealImage(base64Encode(bytes), mime);"
          if old not in s: raise SystemExit('meal photo call marker missing')
          p.write_text(s.replace(old, "return ApiClient().analyzeMealImage(bytes, mimeType: mime);", 1))

          p = Path('frontend/lib/data/drift/database.dart')
          s = p.read_text()
          old = "TextColumn get mealItemsJson => text().withDefault(const Constant('[]'))();"
          if old not in s: raise SystemExit('mealItemsJson marker missing')
          p.write_text(s.replace(old, 'TextColumn get mealItemsJson => text().nullable()();', 1))

          p = Path('frontend/lib/services/sync_service.dart')
          s = p.read_text().replace(
              '  List<String> _mealItems(String raw) {\n    try {',
              "  List<String> _mealItems(String? raw) {\n    if (raw == null || raw.trim().isEmpty) return const <String>[];\n    try {", 1)
          p.write_text(s)

          p = Path('frontend/test/data/drift/meal_items_migration_test.dart')
          s = p.read_text().replace(
              "import 'package:sqlite3/sqlite3.dart' as sqlite;",
              "// ignore: depend_on_referenced_packages\nimport 'package:sqlite3/sqlite3.dart' as sqlite;", 1)
          s = s.replace("expect(logs.single.mealItemsJson, '[]');", 'expect(logs.single.mealItemsJson, isNull);', 1)
          p.write_text(s)

          p = Path('frontend/test/features/meal_capture_panel_test.dart')
          s = p.read_text()
          if "package:drift/drift.dart" not in s:
              s = s.replace("import 'package:amina/l10n/app_localizations.dart';\n", "import 'package:amina/l10n/app_localizations.dart';\nimport 'package:drift/drift.dart';\n", 1)
          p.write_text(s.replace('bloodSugar: 120 + i,', 'bloodSugar: 120.0 + i,', 1))
          PY
      - name: Generate localization and Drift code
        working-directory: frontend
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          dart format lib/core/data/meal_food_catalog.dart lib/features/journal/widgets/meal_capture_panel.dart lib/features/dashboard/widgets/add_log_sheet.dart lib/features/journal/journal_screen.dart lib/services/api_client.dart lib/services/sync_service.dart test/features/meal_capture_panel_test.dart test/data/drift/meal_items_migration_test.dart test/data/drift/glycemic_context_migration_test.dart
      - name: Regenerate OpenAPI
        working-directory: backend
        run: |
          pip install -r requirements.txt >/dev/null
          python manage.py export_openapi > ../docs/api/openapi.json
      - name: Backend journal gate
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
          pytest -q diabetes/tests/test_journal_glycemic_context.py
      - name: Flutter analyze gate
        working-directory: frontend
        run: flutter analyze --no-fatal-infos
      - name: Add-log gate
        working-directory: frontend
        run: timeout 180s flutter test test/features/add_log_sheet_test.dart
      - name: Meal-capture gate
        working-directory: frontend
        run: timeout 180s flutter test test/features/meal_capture_panel_test.dart
      - name: Drift v5 gate
        working-directory: frontend
        run: timeout 180s flutter test test/data/drift/glycemic_context_migration_test.dart
      - name: Drift v6 gate
        working-directory: frontend
        run: timeout 180s flutter test test/data/drift/meal_items_migration_test.dart
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/diabetes/api/v1/schemas.py backend/diabetes/tests/test_journal_glycemic_context.py docs/api/openapi.json frontend
          git diff --cached --quiet && exit 0
          git commit -m 'feat(journal): add confirmed meal capture'
          git push origin HEAD:feat/p1-journal-meal-capture
