name: Django migration drift

on:
  push:
    branches: [main, dev, feat/**, fix/**, chore/**, docs/**]
  pull_request:
    branches: [main, dev]

jobs:
  migration-drift:
    name: Django model/migration drift
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Reject model/migration drift
        run: python manage.py makemigrations --check --dry-run

  p1-journal-3-builder:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feat/p1-journal-meal-capture' &&
      github.event.head_commit.message == 'ci(temp): invoke P1-JOURNAL-3 builder'
    name: P1-JOURNAL-3 branch-only builder
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p1-journal-meal-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply source patch stored in branch workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/p1-journal-3-builder.yml').read_text()
          start = source.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = source.index("\n          PY\n", start)
          code = textwrap.dedent(source[start:end])
          Path('/tmp/p1j3_apply.py').write_text(code)
          PY
          python3 /tmp/p1j3_apply.py
      - name: Generate localization and Drift code
        working-directory: frontend
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          dart format lib/core/data/meal_food_catalog.dart lib/features/journal/widgets/meal_capture_panel.dart lib/features/dashboard/widgets/add_log_sheet.dart lib/features/journal/journal_screen.dart lib/services/api_client.dart lib/services/sync_service.dart test/features/meal_capture_panel_test.dart test/data/drift/meal_items_migration_test.dart test/data/drift/glycemic_context_migration_test.dart
      - name: Regenerate OpenAPI
        working-directory: backend
        run: |
          pip install -r requirements.txt >/dev/null
          python manage.py export_openapi > ../docs/api/openapi.json
      - name: Focused verification
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
          pytest -q diabetes/tests/test_journal_glycemic_context.py
          cd ../frontend
          flutter analyze
          flutter test test/features/add_log_sheet_test.dart test/features/meal_capture_panel_test.dart test/data/drift/glycemic_context_migration_test.dart test/data/drift/meal_items_migration_test.dart
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/diabetes/api/v1/schemas.py backend/diabetes/tests/test_journal_glycemic_context.py docs/api/openapi.json frontend
          git diff --cached --quiet && exit 0
          git commit -m 'feat(journal): add confirmed meal capture'
          git push origin HEAD:feat/p1-journal-meal-capture
