name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-hygiene:
    name: Secret hygiene — tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked credentials and local secret files
        run: python scripts/check_secrets.py

  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # Pin linters so a new upstream release can't turn CI red without a code change.
        run: pip install -r requirements.txt ruff==0.15.17 bandit[toml] import-linter

      - name: Lint (ruff)
        run: ruff check .

      - name: Architecture boundaries (import-linter)
        # Enforces the chassis/module/companion seams (.importlinter). Pre-existing
        # core→diabetes leaks are allow-listed there as tracked debt.
        run: lint-imports

      - name: LLM gateway anti-bypass
        # Dependency-free tracked-file gate. Fails closed if Git/file enumeration
        # itself is unavailable; no missing search binary can silently turn this green.
        run: python ../scripts/check_ai_egress_boundaries.py --check gateway

      - name: AI egress authorization anti-bypass
        # Any network-capable model callsite outside provider adapters must prove it
        # passes through the central patient/purpose/modality authorization boundary.
        run: python ../scripts/check_ai_egress_boundaries.py --check egress

      - name: SAST (bandit)
        # HIGH severity only — skip B101 (assert) and B311 (random) which are dev-only patterns
        run: bandit -r . -ll -ii --skip B101,B311 -x ./tracking/tests,./amina/tests

      - name: OpenAPI schema is current
        # docs/api/openapi.json must match `manage.py export_openapi`. If this fails,
        # regenerate: `python backend/manage.py export_openapi > docs/api/openapi.json`
        run: |
          python manage.py export_openapi > /tmp/openapi.json
          if ! diff -q /tmp/openapi.json ../docs/api/openapi.json > /dev/null; then
            echo "::error::docs/api/openapi.json is stale. Regenerate: python backend/manage.py export_openapi > docs/api/openapi.json"
            diff ../docs/api/openapi.json /tmp/openapi.json | head -40 || true
            exit 1
          fi

      - name: Run tests
        run: pytest --tb=short -q

  backend-postgres:
    name: Backend — PostgreSQL source-of-truth
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_ci
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate migrations on PostgreSQL
        run: python manage.py migrate --noinput

      - name: Run full suite on PostgreSQL
        run: pytest --tb=short -q

  frontend:
    name: Frontend — analyze + tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --no-pub

  pr-size:
    name: PR size (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking: surfaces large/multi-unit PRs to the human dev without
    # stopping agent auto-merge. One PR should map to one ROADMAP unit.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Warn on large diff
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          CHANGED=$(git diff --numstat "$BASE"...HEAD -- . ':(exclude)docs/api/openapi.json' \
            | awk '{a+=$1; d+=$2} END {print a+d}')
          CHANGED=${CHANGED:-0}
          echo "Changed lines (excl. generated schema): $CHANGED"
          THRESHOLD=400
          if [ "$CHANGED" -gt "$THRESHOLD" ]; then
            echo "::warning::Large PR — $CHANGED changed lines (> $THRESHOLD). Confirm this is ONE ROADMAP unit; split if it bundles several."
            { echo "### ⚠️ Large PR — $CHANGED changed lines (> $THRESHOLD)";
              echo "One PR should map to one ROADMAP unit. If this bundles several steps, split it.";
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PR size OK ($CHANGED ≤ $THRESHOLD)."
          fi
