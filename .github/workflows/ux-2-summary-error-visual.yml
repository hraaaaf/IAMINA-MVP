name: UX-2 summary error visual

on:
  push:
    branches: [audit/ux-2-summary-error-visual]
    paths: [.github/workflows/ux-2-summary-error-visual.yml]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 97df55865a13916c9bdf7f01796a60ba2d827ee2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Build
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --dart-define=IAMINA_AUDIT_ACCESS=true
      - name: Install capture runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Serve
        working-directory: frontend/build/web
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/iamina-web.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Capture exact product matrix
        run: |
          mkdir -p /tmp/ux2summary
          cat >/tmp/ux2summary/capture.cjs <<'EOF'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs = require('fs'); const path = require('path');
          const views=[['desktop',1440,1000],['tablet',768,1024],['mobile',390,844],['small',360,560]];
          const langs=[['fr','fr-FR'],['ar','ar-MA']];
          (async()=>{const b=await chromium.launch({headless:true}); const report=[];
            for(const [vp,w,h] of views) for(const [lang,locale] of langs){
              const c=await b.newContext({viewport:{width:w,height:h},locale,timezoneId:'Africa/Casablanca'}); const p=await c.newPage();
              const pageErrors=[]; p.on('pageerror',e=>pageErrors.push(String(e)));
              await p.goto(`http://127.0.0.1:8080/?audit=visual-cert&lang=${lang}#/summary`,{waitUntil:'domcontentloaded',timeout:30000});
              await p.waitForTimeout(5000);
              const file=`${vp}-${lang}__summary-error.png`; await p.screenshot({path:path.join('/tmp/ux2summary',file),fullPage:true});
              report.push({vp,lang,w,h,url:p.url(),flutterViews:await p.locator('flutter-view').count(),pageErrors,screenshot:file}); await c.close();
            }
            await b.close(); fs.writeFileSync('/tmp/ux2summary/report.json',JSON.stringify(report,null,2));
            if(report.some(x=>x.flutterViews!==1||x.pageErrors.length)) process.exit(1);
          })();
          EOF
          node /tmp/ux2summary/capture.cjs
      - name: Record source
        if: always()
        run: echo 97df55865a13916c9bdf7f01796a60ba2d827ee2 >/tmp/ux2summary/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-2-summary-error-visual
          path: /tmp/ux2summary
          retention-days: 14
