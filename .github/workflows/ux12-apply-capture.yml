# UX-12 visual gate revision 6 — certified audit access
name: UX-12 global visual convergence

on:
  push:
    branches:
      - ux/12-global-visual-consistency
    paths:
      - .github/workflows/ux12-apply-capture.yml

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/12-global-visual-consistency
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Resolve dependencies and record source
        working-directory: frontend
        run: |
          flutter pub get
          git -C .. rev-parse HEAD > /tmp/ux12-source-sha.txt

      - name: Build audit web
        working-directory: frontend
        run: flutter build web --debug --dart-define=IAMINA_AUDIT_ACCESS=true

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve build
        run: |
          python3 -m http.server 4173 --directory frontend/build/web >/tmp/ux12-server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Capture primary mobile surfaces
        run: |
          mkdir -p /tmp/ux12-captures
          node scripts/ux12_capture.cjs
          cp /tmp/ux12-source-sha.txt /tmp/ux12-captures/source-sha.txt
          cp /tmp/ux12-server.log /tmp/ux12-captures/server.log

      - uses: actions/upload-artifact@v4
        with:
          name: ux12-global-visual-captures
          path: /tmp/ux12-captures
          retention-days: 14
