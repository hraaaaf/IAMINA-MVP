name: PR15 apply tranche 6

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/p0-mena-provider-runtime-resilience

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-provider-runtime-resilience
          fetch-depth: 0
      - name: Apply multimodal runtime boundary
        run: python scripts/run_pr15_tranche6.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/media/voice.py backend/media/vision.py backend/diabetes/services/documents/extractors/image.py backend/core/ai_processor_policy.py backend/diabetes/tests/test_sprint4_services.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(p0-mena): enforce multimodal provider runtime boundary"
          git push origin HEAD:feat/p0-mena-provider-runtime-resilience
