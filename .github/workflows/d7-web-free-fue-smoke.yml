name: D7 Web FUE free Chrome smoke — actual app + scoped tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/d7-web-free-fue-smoke.yml'
      - 'scripts/d7_web_actual_app_smoke.py'
      - 'frontend/test/features/profile/d7_profile_owner_save_widget_test.dart'
      - 'frontend/test/features/profile/d7_web_treatment_choice_responsive_test.dart'

permissions:
  contents: read

concurrency:
  group: d7-free-chrome-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  d7-free-browser:
    name: D7 free real Chrome renderer and actual Web app smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: ProfileScreen real widget and owner save (VM synthetic)
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter pub get
          flutter test --reporter expanded test/features/profile/d7_profile_owner_save_widget_test.dart
      - name: Treatment choices real Chrome (three viewports and locales)
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter test --platform chrome --reporter expanded test/features/profile/d7_web_treatment_choice_responsive_test.dart
      - name: Build actual IAMINA Web (local-only; no backend credentials)
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter build web --release --no-web-resources-cdn --dart-define=IAMINA_OFFLINE_DEMO=true
          test -s build/web/main.dart.js
          test -s build/web/index.html
      - name: Actual app Chrome boot, reload, and offline shell (no patient data)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client
          python3 -m http.server 7378 --bind 127.0.0.1 --directory frontend/build/web > /tmp/iamina-d7-smoke-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:7378/ > /dev/null
          python3 scripts/d7_web_actual_app_smoke.py
      - name: Upload bounded Chrome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d7-free-web-app-smoke-evidence
          path: d7-web-app-smoke-proof.json
          retention-days: 14
          if-no-files-found: warn
