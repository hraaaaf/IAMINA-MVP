name: W02 F09 temporary Ruff import diagnostics
on:
  pull_request:
    branches: [main, dev]
    paths:
      - backend/core/tests/test_w02_f09_cookie_parallel_authority.py
      - .github/workflows/w02-f09-ruff-diagnostic.yml
permissions:
  contents: read
jobs:
  ruff-imports:
    if: github.event.pull_request.number == 1301
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.15.17
      - name: Show exact isort fix (diagnostic only, no file mutation)
        run: ruff check --select I --fix --diff backend/core/tests/test_w02_f09_cookie_parallel_authority.py || true
