name: UX10 localization fix

"on":
  push:
    branches:
      - "ux/10-dashboard-pixel-convergence"
    paths:
      - ".github/workflows/ux10-fix-localization.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/10-dashboard-pixel-convergence
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: Fix existing localization getter and verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/lib/features/dashboard/dashboard_convergent_screen.dart')
          s = p.read_text()
          old = "label: l10n.navImport, route: '/importer'"
          new = "label: l10n.importDocument, route: '/importer'"
          if old not in s:
              raise SystemExit('expected navImport anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cd frontend
          dart format lib/features/dashboard/dashboard_convergent_screen.dart
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test --no-pub test/p0_mobile_import_navigation_test.dart
          cd ..
          git diff --check

      - name: Commit verified fix
        run: |
          git config user.name "hraaaaf"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git add frontend/lib/features/dashboard/dashboard_convergent_screen.dart
          git commit -m "fix(ux): use existing import localization"
          git push origin HEAD:ux/10-dashboard-pixel-convergence
