name: Onboarding sticky CTA real Chrome certification

on:
  pull_request:
    paths:
      - 'frontend/lib/features/auth/onboarding_chat_screen.dart'
      - 'frontend/lib/ui_browser_audit_main.dart'
      - 'frontend/test/onboarding_sticky_cta_test.dart'
      - 'tools/onboarding_sticky_cta_audit.js'
      - '.github/workflows/onboarding-sticky-cta-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding-sticky-cta:
    name: Onboarding CTA real Chrome 390 + 768 + 1280
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Static analysis of browser harness
        run: flutter analyze --no-fatal-infos lib/ui_browser_audit_main.dart
      - name: Test sticky CTA functionality
        run: flutter test test/onboarding_sticky_cta_test.dart
      - name: Build browser harness
        run: flutter build web --release -t lib/ui_browser_audit_main.dart
      - name: Capture all three real Chrome viewports
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 7366 --directory build/web >/tmp/iamina-onboarding-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7366 >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7366 >/dev/null
          NODE_PATH="$PWD/node_modules" \
          AUDIT_OUT="$GITHUB_WORKSPACE/onboarding-sticky-proof" \
            node ../tools/onboarding_sticky_cta_audit.js
      - name: Upload exact browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-onboarding-sticky-cta-390-768-1280
          path: |
            onboarding-sticky-proof/*
          if-no-files-found: warn
          retention-days: 14
