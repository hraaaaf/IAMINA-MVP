name: PR17 update auth contract tests

on:
  push:
    branches:
      - feat/p0-mena-sovereign-auth-migration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-sovereign-auth-migration
      - name: Update legacy auth expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/diabetes/tests/test_api.py')
          text = path.read_text()
          text = text.replace(
              'return_value={"uid": uid, "email": email or f"{uid}@ex.com"},',
              'return_value={"uid": uid, "email": email or f"{uid}@ex.com", "email_verified": True},',
          )
          text = text.replace(
              '''    def test_firebase_auth_existing_user(self):
        create_patient("existing", "existing@ex.com")
        with _mock_firebase(uid="uid-existing", email="existing@ex.com"):
            response = self.client.post(
                "/api/v1/auth/firebase",
                data={"id_token": "valid-jwt"},
                content_type="application/json",
            )
        self.assertEqual(response.status_code, 200)
''',
              '''    def test_firebase_auth_existing_email_requires_explicit_link(self):
        create_patient("existing", "existing@ex.com")
        with _mock_firebase(uid="uid-existing", email="existing@ex.com"):
            response = self.client.post(
                "/api/v1/auth/firebase",
                data={"id_token": "valid-jwt"},
                content_type="application/json",
            )
        self.assertEqual(response.status_code, 409)
        self.assertFalse(
            BasePatientProfile.objects.filter(firebase_uid="uid-existing").exists()
        )
''',
          )
          path.write_text(text)

          path = Path('backend/diabetes/tests/test_ninja_crud.py')
          text = path.read_text()
          text = text.replace(
              '''    def test_existing_user_is_returned(self):
        User.objects.create_user(username="existingninja", email="existing@ninja.com")
        with patch("firebase_admin.auth.verify_id_token",
                   return_value={"uid": "uid-ninja-existing", "email": "existing@ninja.com"}):
            resp = self.client.post(
                "/api/v1/auth/firebase",
                data={"id_token": "valid-jwt"},
                content_type="application/json",
            )
        self.assertEqual(resp.status_code, 200)
        # Must not duplicate the user
        self.assertEqual(User.objects.filter(email="existing@ninja.com").count(), 1)
''',
              '''    def test_existing_email_requires_explicit_link(self):
        User.objects.create_user(username="existingninja", email="existing@ninja.com")
        with patch("firebase_admin.auth.verify_id_token",
                   return_value={"uid": "uid-ninja-existing", "email": "existing@ninja.com", "email_verified": True}):
            resp = self.client.post(
                "/api/v1/auth/firebase",
                data={"id_token": "valid-jwt"},
                content_type="application/json",
            )
        self.assertEqual(resp.status_code, 409)
        self.assertEqual(User.objects.filter(email="existing@ninja.com").count(), 1)
        self.assertFalse(
            BasePatientProfile.objects.filter(firebase_uid="uid-ninja-existing").exists()
        )
''',
          )
          path.write_text(text)
          PY
      - name: Commit test contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/diabetes/tests/test_api.py backend/diabetes/tests/test_ninja_crud.py
          git commit -m "test(auth): require explicit Firebase account linking"
          git push origin HEAD:feat/p0-mena-sovereign-auth-migration
