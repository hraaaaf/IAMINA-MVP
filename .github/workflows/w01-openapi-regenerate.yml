name: W01 regenerate OpenAPI (temporary)
on:
  push:
    branches: [feat/w01-preview-same-origin-bff-20261017]
    paths:
      - .github/workflows/w01-openapi-regenerate.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/w01-preview-same-origin-bff-20261017
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Regenerate exact Django OpenAPI
        run: |
          set -euo pipefail
          pip install -r backend/requirements.txt
          (cd backend && python manage.py export_openapi) > docs/api/openapi.json
          python -m json.tool docs/api/openapi.json > /dev/null
      - name: Commit schema on feature branch only
        run: |
          set -euo pipefail
          git add docs/api/openapi.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(w01): regenerate OpenAPI schema from Django'
          git push origin HEAD:feat/w01-preview-same-origin-bff-20261017
