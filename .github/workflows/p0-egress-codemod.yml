name: P0 Egress Codemod

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  codemod:
    if: github.head_ref == 'fix/p0-ai-egress-consent-boundary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire authorization boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # core/llm_gateway.py — all sanctioned text egress must assert authorization.
          path = 'backend/core/llm_gateway.py'
          replace_once(path,
              'from core.contracts.companion_identity import CompanionIdentity\n',
              'from core.ai_egress import TEXT, assert_ai_egress_allowed\nfrom core.contracts.companion_identity import CompanionIdentity\n')
          replace_once(path,
              '    def complete(self, system: str, user: str):\n        safe_system = self._pseudonymizer.mask(system)\n',
              '    def complete(self, system: str, user: str):\n        assert_ai_egress_allowed(TEXT)\n        safe_system = self._pseudonymizer.mask(system)\n')
          replace_once(path,
              '            yield self.complete(system, user).content\n            return\n\n        safe_system = self._pseudonymizer.mask(system)\n',
              '            yield self.complete(system, user).content\n            return\n\n        assert_ai_egress_allowed(TEXT)\n        safe_system = self._pseudonymizer.mask(system)\n')
          replace_once(path,
              '    def think(self, system: str, user: str) -> tuple[str, str]:\n        safe_system = self._pseudonymizer.mask(system)\n',
              '    def think(self, system: str, user: str) -> tuple[str, str]:\n        assert_ai_egress_allowed(TEXT)\n        safe_system = self._pseudonymizer.mask(system)\n')
          replace_once(path,
              '    pseudonymizer = PHIPseudonymizer()\n    llm = LLMPipeline(get_llm(), [PHIStrippingMiddleware(), LoggingMiddleware()])\n',
              '    assert_ai_egress_allowed(TEXT)\n    pseudonymizer = PHIPseudonymizer()\n    llm = LLMPipeline(get_llm(), [PHIStrippingMiddleware(), LoggingMiddleware()])\n')

          # Patient-facing AI endpoints declare purpose/modalities; consent is checked lazily at egress.
          path = 'backend/ai/api/v1/ai.py'
          replace_once(path,
              'from pydantic import BaseModel\n\n',
              'from pydantic import BaseModel\n\nfrom core.ai_egress import IMAGE, TEXT, assert_ai_egress_allowed, patient_ai_egress_scope\n')
          for route, scope in [
              ('@router.post("/ai/summary", response=SummaryResponse)\n', '@patient_ai_egress_scope("clinical_summary", TEXT)\n'),
              ('@router.get("/ai/doctor-brief", response=DoctorBriefResponse)\n', '@patient_ai_egress_scope("doctor_brief", TEXT)\n'),
              ('@router.post("/ai/chat", response=ChatResponse)\n', '@patient_ai_egress_scope("companion_chat", TEXT)\n'),
              ('@router.post("/ai/analyze-glucometer-image", response=GlucometerOcrResponse)\n', '@patient_ai_egress_scope("glucometer_ocr", IMAGE)\n'),
              ('@router.post("/ai/analyze-meal-image", response=MealImageResponse)\n', '@patient_ai_egress_scope("meal_vision", IMAGE)\n'),
              ('@router.get("/ai/chat/stream")\n', '@patient_ai_egress_scope("companion_chat", TEXT)\n'),
          ]:
              replace_once(path, route, route + scope)
          replace_once(path,
              '    try:\n        result = llm.complete(system, user_prompt)\n',
              '    try:\n        assert_ai_egress_allowed(TEXT)\n        result = llm.complete(system, user_prompt)\n')

          # Voice: one operation can authorize audio STT and subsequent text companion call.
          path = 'backend/ai/api/v1/voice.py'
          replace_once(path,
              'from pydantic import BaseModel\n\n',
              'from pydantic import BaseModel\n\nfrom core.ai_egress import AUDIO, TEXT, patient_ai_egress_scope\n')
          replace_once(path,
              '@router.post("/ai/voice", response=VoiceChatResponse)\n',
              '@router.post("/ai/voice", response=VoiceChatResponse)\n@patient_ai_egress_scope("voice_chat", AUDIO, TEXT)\n')
          replace_once(path,
              '@router.post("/ai/transcribe", response=TranscribeResponse)\n',
              '@router.post("/ai/transcribe", response=TranscribeResponse)\n@patient_ai_egress_scope("voice_transcription", AUDIO)\n')

          # Documents may egress extracted text and raw image content.
          path = 'backend/diabetes/api/v1/documents.py'
          replace_once(path,
              'from ninja import File, Router, Schema, UploadedFile\n\n',
              'from ninja import File, Router, Schema, UploadedFile\n\nfrom core.ai_egress import IMAGE, TEXT, patient_ai_egress_scope\n')
          replace_once(path,
              '@router.post("/documents/ingest", response={200: PulperPreviewResponse, 422: dict})\n',
              '@router.post("/documents/ingest", response={200: PulperPreviewResponse, 422: dict})\n@patient_ai_egress_scope("document_ingest", TEXT, IMAGE)\n')

          # Structured clinical formatter direct LLM call.
          path = 'backend/diabetes/services/clinical/engine.py'
          replace_once(path,
              'from typing import TYPE_CHECKING\n\n',
              'from typing import TYPE_CHECKING\n\nfrom core.ai_egress import TEXT, assert_ai_egress_allowed\n')
          replace_once(path,
              '        provider = get_llm()\n        response_text = provider.complete(get_format_system(language), user_prompt).content\n',
              '        assert_ai_egress_allowed(TEXT)\n        provider = get_llm()\n        response_text = provider.complete(get_format_system(language), user_prompt).content\n')

          # Legacy direct summary call remains denied unless invoked inside an authorized scope.
          path = 'backend/diabetes/services/summary.py'
          replace_once(path,
              'from django.utils import timezone\n\n',
              'from django.utils import timezone\n\nfrom core.ai_egress import TEXT, assert_ai_egress_allowed\n')
          replace_once(path,
              '        provider = get_llm()\n        raw_summary_text = provider.complete(system_prompt, secure_prompt).content\n',
              '        assert_ai_egress_allowed(TEXT)\n        provider = get_llm()\n        raw_summary_text = provider.complete(system_prompt, secure_prompt).content\n')

          # Document parser text egress.
          path = 'backend/media/documents/pulper.py'
          replace_once(path,
              'from datetime import datetime\n\n',
              'from datetime import datetime\n\nfrom core.ai_egress import TEXT, assert_ai_egress_allowed\n')
          replace_once(path,
              '        llm = get_llm()\n        response = llm.complete(_SYSTEM_PROMPT, prompt)\n',
              '        assert_ai_egress_allowed(TEXT)\n        llm = get_llm()\n        response = llm.complete(_SYSTEM_PROMPT, prompt)\n')

          # STT raw audio egress.
          path = 'backend/media/voice.py'
          replace_once(path,
              'import os\n\n',
              'import os\n\nfrom core.ai_egress import AUDIO, assert_ai_egress_allowed\n')
          replace_once(path,
              '    try:\n        from google import genai\n\n        client = genai.Client(\n',
              '    try:\n        assert_ai_egress_allowed(AUDIO)\n        from google import genai\n\n        client = genai.Client(\n')

          # Meal/glucometer raw image egress — two provider callsites.
          path = 'backend/media/vision.py'
          replace_once(path,
              'from typing import Optional\n\n',
              'from typing import Optional\n\nfrom core.ai_egress import IMAGE, assert_ai_egress_allowed\n')
          p = Path(path)
          text = p.read_text()
          old = '    try:\n        from google import genai\n        from google.genai import types as genai_types\n\n        client = genai.Client(\n'
          if text.count(old) != 2:
              raise SystemExit(f'{path}: expected 2 Gemini client blocks, got {text.count(old)}')
          text = text.replace(old,
              '    try:\n        assert_ai_egress_allowed(IMAGE)\n        from google import genai\n        from google.genai import types as genai_types\n\n        client = genai.Client(\n')
          p.write_text(text)

          # Medical-document image OCR raw image egress.
          path = 'backend/diabetes/services/documents/extractors/image.py'
          replace_once(path,
              'import logging\n\n',
              'import logging\n\nfrom core.ai_egress import IMAGE, assert_ai_egress_allowed\n')
          replace_once(path,
              '    try:\n        import os\n\n        import google.generativeai as genai\n\n        genai.configure(api_key=os.environ[\'GEMINI_API_KEY\'])\n',
              '    try:\n        assert_ai_egress_allowed(IMAGE)\n        import os\n\n        import google.generativeai as genai\n\n        genai.configure(api_key=os.environ[\'GEMINI_API_KEY\'])\n')

          # CI: any direct provider/network-capable callsite outside llm adapters must carry the boundary assertion.
          path = '.github/workflows/ci.yml'
          replace_once(path,
              '      - name: SAST (bandit)\n',
              '''      - name: AI egress authorization anti-bypass\n        run: |\n          FILES=$(rg -l "get_llm\\(|genai\\.Client\\(|GenerativeModel\\(" . \\\n            -g '!llm/**' -g '!**/tests/**' -g '!**/migrations/**' || true)\n          for FILE in $FILES; do\n            if ! rg -q "assert_ai_egress_allowed" "$FILE"; then\n              echo "::error file=$FILE::External AI callsite lacks central egress authorization assertion."\n              exit 1\n            fi\n          done\n\n      - name: SAST (bandit)\n''')
          PY
      - name: Commit codemod
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend .github/workflows/ci.yml
          git commit -m 'feat(p0): wire AI egress authorization across live callsites'
          git push origin HEAD:${{ github.head_ref }}
