name: W02 F09 C7-C9 integrated offline-only security evidence

on:
  push:
    branches:
      - test/w02-f09-c7c8c9-integrated-security-20261107
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w02-f09-c7c8c9-integrated-synthetic
  cancel-in-progress: true

jobs:
  pg16-atomic:
    name: C7 atomic signed refresh, C6/C5 regressions and Django PG16
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_c789_ephemeral
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_c789_ephemeral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: c789-gha-disposable-only-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_c789_ephemeral
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install synthetic Python + PostgreSQL test dependencies
        run: python -m pip install -r requirements.txt ruff==0.15.17
      - name: Ruff, Python/Node syntax and schema drift
        run: |
          ruff check core/web_refresh_c7_atomic_candidate.py core/tests/test_w02_f09c7_atomic_bundle_pg.py
          python -m compileall -q core/web_refresh_c7_atomic_candidate.py core/tests/test_w02_f09c7_atomic_bundle_pg.py
          node --check ../frontend/api/w02_f09c7_verify_reply.js
          python manage.py makemigrations --check --dry-run
      - name: C7 Node22 Web response and existing deny-only contracts
        working-directory: .
        run: |
          node --test tools/w02_f09c6_response_contract.test.js
          node --test tools/w02_f09c5_cookie_contract.test.js
          node --test tools/w02_f09c4_signed_http_adapter.test.js
          node --test tools/w02_f09c1_web_refresh_deny_gate.test.js
          node --test tools/w02_f09_web_bff_isolation.test.js
          python scripts/check_web_topology_contract.py
      - name: C7 atomic failure rollback and two-tab PG16 race (Node22 verifier)
        run: python -m pytest -q -ra core/tests/test_w02_f09c7_atomic_bundle_pg.py
      - name: C6 C5 C4 C3 C2 PG16 regressions
        run: >
          python -m pytest -q -ra
          core/tests/test_w02_f09c6_http_auth_pg.py
          core/tests/test_w02_f09c5_family_bearer_pg.py
          core/tests/test_w02_f09c4_http_adapter_pg.py
          core/tests/test_w02_f09c3_oidc_atomic_tabs.py
          core/tests/test_w02_f09c2_signed_boundary.py
      - name: Full Django PostgreSQL16 regression, exact HEAD
        run: python -m pytest -q --tb=short

  flutter-browser:
    name: C8 Flutter VM/Chrome and C9 two real browser tabs Chrome/WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - name: Flutter dependencies, lint and candidate unit tests
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos \
            lib/services/web_refresh_c8_coordinator.dart \
            lib/services/web_refresh_c8_signal_contract.dart \
            lib/services/web_refresh_c8_signal_stub.dart \
            lib/services/web_refresh_c8_signal_web.dart \
            lib/ui_w02_c9_two_tab_probe_main.dart \
            test/services/w02_f09c8_candidate_coordinator_test.dart
          flutter test test/services/w02_f09c8_candidate_coordinator_test.dart
          flutter test --platform chrome test/services/w02_f09c8_candidate_coordinator_test.dart
      - name: Build only isolated Flutter Web browser proof
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter build web --release --no-web-resources-cdn \
            -t lib/ui_w02_c9_two_tab_probe_main.dart
          test -s build/web/main.dart.js
      - name: Install Playwright isolated browsers
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Run two genuine tabs FR/AR RTL, offline, refresh/logout race and cold reload
        run: |
          set -euo pipefail
          python -m http.server 7399 --bind 127.0.0.1 \
            --directory frontend/build/web > /tmp/w02-c9-local-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-delay 1 http://127.0.0.1:7399/ > /dev/null
          python scripts/w02_f09_c9_real_browser_probe.py
      - name: Preserve bounded non-PHI browser outcome even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w02-f09-c7c8c9-offline-real-browser-evidence
          path: w02-f09-c7c8c9-local-browser-proof.json
          retention-days: 14
          if-no-files-found: warn
