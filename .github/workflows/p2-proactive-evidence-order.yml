name: P2 proactive evidence-order patch

on:
  push:
    branches: [p2-proactive-attention-lifecycle]
    paths:
      - .github/workflows/p2-proactive-evidence-order.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2-proactive-attention-lifecycle
          fetch-depth: 0
      - name: Move evidence authority gate before source refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/diabetes/services/clinical/proactive_attention.py')
          text = path.read_text()
          old = '''    result = refresh_personal_response_memory(patient_id=patient_id)
    dataset_eligible = _dataset_eligible(result)
    now = timezone.now()

    evidence = get_evidence(PERSONAL_RESPONSE_EVIDENCE_ID)
    if evidence.clinical_authority is not ClinicalAuthority.GOVERNED_RULE:
        return ProactiveDecision(candidate=None, suppression_reason="source_rule_not_governed")
    if evidence.supersession_state != "current":
        return ProactiveDecision(candidate=None, suppression_reason="source_rule_superseded")
'''
          new = '''    evidence = get_evidence(PERSONAL_RESPONSE_EVIDENCE_ID)
    if evidence.clinical_authority is not ClinicalAuthority.GOVERNED_RULE:
        return ProactiveDecision(candidate=None, suppression_reason="source_rule_not_governed")
    if evidence.supersession_state != "current":
        return ProactiveDecision(candidate=None, suppression_reason="source_rule_superseded")

    result = refresh_personal_response_memory(patient_id=patient_id)
    dataset_eligible = _dataset_eligible(result)
    now = timezone.now()
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one evidence-order block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p2-proactive-evidence-order.yml
          git add backend/diabetes/services/clinical/proactive_attention.py
          git commit -m "fix(p2-proactive): gate evidence before source refresh"
          git pull --rebase origin p2-proactive-attention-lifecycle
          git push origin HEAD:p2-proactive-attention-lifecycle
