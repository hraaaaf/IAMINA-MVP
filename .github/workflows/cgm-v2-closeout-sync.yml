name: CGM V2 closeout roadmap sync

on:
  push:
    branches: [docs/cgm-v2-closeout]
    paths:
      - '.github/workflows/cgm-v2-closeout-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/cgm-v2-closeout
      - name: Close CGM V2 in canonical roadmap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/ROADMAP.md')
          text = path.read_text()
          old = '| CGM-GW-V2 — Product Wiring | 0% credited | 🟡 In progress | PR #285; authenticated connection/sync/readings persistence + Flutter wiring under exact-head certification; real-device proof remains a separate external gate |'
          new = '| CGM-GW-V2 — Product Wiring | 100% | ✅ Closed | Runtime PR #285 merge `8231be71…`; exact-head CI #2652 + drift #2464 + UI #265 + Chrome #230 green; post-merge CI #2653 + drift #2465 + UI #266 + Chrome #231 green; closeout `docs/assessments/2026-08-16-cgm-gateway-v2-closeout.md`; real-device proof remains a separate external gate |'
          if old not in text:
              raise SystemExit('Expected CGM-GW-V2 roadmap row not found')
          text = text.replace(old, new, 1)
          old_summary = 'CGM-GW-V1 is closed for Dexcom/Libre and CGM-GW-V1.1 is closed for explicit LinX provenance through an external Juggluco-to-Nightscout bridge; both remain parallel integration lanes and do not alter the 32/41 MENA critical-path numerator.'
          new_summary = 'CGM-GW-V1 is closed for Dexcom/Libre, CGM-GW-V1.1 is closed for explicit LinX provenance through an external Juggluco-to-Nightscout bridge, and CGM-GW-V2 product wiring is closed for authenticated connection/sync/persistence/API/Flutter integration; these remain parallel integration lanes and do not alter the 32/41 MENA critical-path numerator.'
          if old_summary not in text:
              raise SystemExit('Expected CGM roadmap summary not found')
          path.write_text(text.replace(old_summary, new_summary, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(cgm): close V2 product wiring in roadmap'
          git push origin HEAD:docs/cgm-v2-closeout
