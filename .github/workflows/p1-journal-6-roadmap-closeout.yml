name: P1-JOURNAL-6 roadmap closeout

on:
  push:
    branches: [docs/p1-journal-6-closeout]

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p1-journal-6-closeout
          fetch-depth: 0
      - name: Patch canonical closeout truth
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/ROADMAP.md')
          s = p.read_text()
          s = s.replace(
            '> **Last updated:** 2026-08-09 — P1-JOURNAL-5 is closed; P1-JOURNAL-6 Context intelligence is the active merge unit in PR #73.',
            '> **Last updated:** 2026-08-09 — P1-JOURNAL-6 Context intelligence is 100% closed; P1-JOURNAL-7 Ramadan mode v2 is next.'
          )
          s = s.replace(
            '| Journal metabolic-event redesign | 67% | 🔵 P1-JOURNAL-6 merge unit | P0-JOURNAL-1/2 + P1-JOURNAL-3/4/5 merged; PR #73 Context intelligence; unknown-by-default context, progressive capture, explicit sync, UX 9.2/10; final head certification + merge/post-merge required |',
            '| Journal metabolic-event redesign | 67% | 🟢 P1-JOURNAL-6 closed; P1-JOURNAL-7 next | P0-JOURNAL-1/2 + P1-JOURNAL-3/4/5/6 merged; PR #73; merge `95cf4d75226720386d7e8e55acc30c39fdd5017c`; post-merge CI #1342 + drift #1154 green; UX 9.2/10 |'
          )
          s = s.replace(
            '| P1-JOURNAL-6 | Context intelligence | 🔵 PR #73 merge unit | illness/stress/activity/poor sleep are optional positive observations; absence means unknown/not reported; progressive Add + correctable Edit; explicit legacy fatigue remains sync-compatible; UX 9.2/10 |',
            '| P1-JOURNAL-6 | Context intelligence | ✅ Closed | PR #73 merged as `95cf4d75226720386d7e8e55acc30c39fdd5017c`; post-merge CI #1342 + drift #1154 green; optional positive context, unknown-by-default omission, progressive Add + correctable Edit, legacy fatigue sync-compatible; UX 9.2/10 |'
          )
          old = '**Pre-closeout evidence on product head `e9634dc8974e37e8f87fdb1b07b8062a006caddc`:** CI #1338 SUCCESS; migration drift #1150 SUCCESS; visual audit run `31326091108` SUCCESS on Add/Edit FR/AR desktop/tablet/390×844/360×560; UX Auditor **9.2/10 PASS**. Final documentation changes make these anchors stale, so exact-final-head CI + drift + visual recertification, Reviewer/Release-Certifier re-anchoring, expected-head merge and post-merge gates remain required before the LOT is 100% closed.'
          new = '**Final certification evidence:** final product head `fccbdf5bf69bd72c2cf079091b96cd52dcdf3d0c`; CI #1341 SUCCESS; migration drift #1153 SUCCESS; exact-final-head visual audit run `31326260406` SUCCESS on Add/Edit FR/AR desktop/tablet/390×844/360×560; UX Auditor **9.2/10 PASS**; Clinical Safety, Persistence/Migration, Security/Privacy and UX/UI reviewers PASS; Release Certifier CERTIFIED; PR #73 merged with expected-head locking as `95cf4d75226720386d7e8e55acc30c39fdd5017c`; post-merge CI #1342 and migration drift #1154 SUCCESS. P1-JOURNAL-6 is **100% closed**. P1-JOURNAL-7 is next.'
          if old not in s:
            raise SystemExit('expected pre-closeout paragraph not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit roadmap closeout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ROADMAP.md
          git commit -m 'docs(journal): record P1-JOURNAL-6 verified closeout'
          git push origin HEAD:docs/p1-journal-6-closeout
