name: P0-UX-11 clean

on:
  push:
    branches:
      - fix/p0-ux-11-first-use-dashboard
    paths:
      - .github/workflows/p0-ux-11-clean.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-ux-11-first-use-dashboard
          fetch-depth: 0
      - name: Restore dependency noise
        run: |
          git fetch origin main
          git checkout origin/main -- frontend/pubspec.lock frontend/.flutter-plugins-dependencies
          rm .github/workflows/p0-ux-11-clean.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(ux): remove generated dependency noise'
          git push origin HEAD:fix/p0-ux-11-first-use-dashboard