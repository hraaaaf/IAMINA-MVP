name: MENA C24-W Tesseract web camera rejection

on:
  pull_request:
    paths:
      - ".github/workflows/mena-c24w-tesseract-web-camera.yml"
      - "backend/evaluation/fixtures/c24w_wikimedia_camera_sources.json"
      - "backend/evaluation/tesseract_arabic_camera_benchmark.py"
      - "backend/evaluation/wikimedia_camera_fixture.py"
      - "scripts/run_tesseract_arabic_wikimedia_camera_benchmark.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c24w-real-camera-arabic-rejection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Arabic OCR runtime using proven C23 setup
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara
          python -m pip install Pillow==11.3.0
          tesseract --version | head -1
          tesseract --list-langs | grep -Fx ara
      - name: Reproduce strict real-camera rejection
        run: |
          set +e
          python scripts/run_tesseract_arabic_wikimedia_camera_benchmark.py \
            --output c24w-result.json
          benchmark_status=$?
          set -e
          test "$benchmark_status" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("c24w-result.json").read_text(encoding="utf-8"))
          assert result["benchmark"] == "c24w-wikimedia-real-camera-arabic-numeric-safety"
          assert result["provenance_checked"] is True
          assert result["real_camera_only"] is True
          assert result["numeric_total"] == 1
          assert result["numeric_safe_cases"] == 0
          assert result["numeric_safety_floor_passed"] is False
          case = result["cases"][0]
          assert case["expected_numeric_tokens"] == ["90", "80", "70", "60"]
          assert case["numeric_ok"] is False
          PY
      - name: Upload negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mena-c24w-tesseract-web-camera-rejection
          path: c24w-result.json
          if-no-files-found: error
          retention-days: 14
