name: MENA C24-W Tesseract web camera

on:
  pull_request:
    paths:
      - ".github/workflows/mena-c24w-tesseract-web-camera.yml"
      - "backend/evaluation/fixtures/c24w_wikimedia_camera_sources.json"
      - "backend/evaluation/tesseract_arabic_camera_benchmark.py"
      - "backend/evaluation/wikimedia_camera_fixture.py"
      - "scripts/run_tesseract_arabic_wikimedia_camera_benchmark.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c24w-real-camera-arabic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic camera OCR dependencies
        run: |
          timeout 120s sudo apt-get update
          timeout 120s sudo apt-get install -y tesseract-ocr tesseract-ocr-ara
          python -m pip install --disable-pip-version-check --timeout 60 Pillow==11.3.0
          tesseract --version | head -1
          tesseract --list-langs | grep -Fx ara
      - name: Run provenance-gated real-camera benchmark
        run: |
          timeout 120s python scripts/run_tesseract_arabic_wikimedia_camera_benchmark.py \
            --output c24w-result.json
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mena-c24w-tesseract-web-camera
          path: c24w-result.json
          if-no-files-found: error
