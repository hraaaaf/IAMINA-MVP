name: Temporary P2 proactive roadmap closeout

on:
  push:
    branches:
      - agent/p2-proactive-closeout

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-proactive-closeout
      - name: Close P2 proactive canonically
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/ROADMAP.md')
          text = p.read_text()

          replacements = [
              (
                  '> **Last updated:** 2026-08-12 — P2-PROACTIVE has a reviewer-passed runtime candidate in PR #139. It remains open until exact-head certification, expected-head merge and post-merge CI + migration drift are complete. UX visual rebase remains closed through UX-11 at 9.8/10.',
                  '> **Last updated:** 2026-08-12 — P2-PROACTIVE is merged, certified and post-merge green. P2-DOCTOR — Consultation Intelligence is the next executable clinical-intelligence LOT. UX visual rebase remains closed through UX-11 at 9.8/10.'
              ),
              (
                  '| Clinical intelligence / proactivity | P0 audit + semantics + skills foundation + evidence registry + clinical twin closed; proactive runtime candidate ready | 🟡 P2-PROACTIVE merge gate | PR #139; final exact-head certification + post-merge proof remain |',
                  '| Clinical intelligence / proactivity | P0 audit + semantics + skills foundation + evidence registry + clinical twin + proactive lifecycle closed | 🟢 P2-DOCTOR ready | PR #139 merge `752f5543…`; post-merge CI #1845 + drift #1657 green |'
              ),
              (
                  '## 🟡 P2-PROACTIVE — Prioritization + Insight Lifecycle — RUNTIME CANDIDATE',
                  '## ✅ P2-PROACTIVE — Prioritization + Insight Lifecycle — CLOSED'
              ),
              ('Candidate contract:', 'Delivered contract:'),
              (
                  '**Closure gate:** P2-PROACTIVE remains open until the final docs-inclusive head passes exact-head CI + PostgreSQL + migration drift, Clinical Safety + Database/Migration review, Release Certifier GO, expected-head merge, and post-merge `main` CI + migration drift.',
                  '**Closure:** PR #139 head `28215cd9…` passed CI #1844 + drift #1656, Clinical Safety Reviewer, Database/Migration Reviewer, Final Diff/Architecture Reviewer and Release Certifier; merge `752f5543…` then passed post-merge `main` CI #1845 + drift #1657.'
              ),
              (
                  '| **P2-PROACTIVE** | **Prioritization + Insight Lifecycle** | 🟡 **RUNTIME CANDIDATE** | PR #139: explicit priority/lifecycle + attention budget implemented; final exact-head certification, merge and post-merge proof remain |',
                  '| **P2-PROACTIVE** | **Prioritization + Insight Lifecycle** | ✅ **CLOSED** | PR #139 merge `752f5543…`; post-merge CI #1845 + drift #1657 green |'
              ),
              (
                  '| P2-DOCTOR | Consultation Intelligence | ⏳ Planned | Clinician brief reports evidence-qualified change since last review with uncertainty and provenance |',
                  '| **P2-DOCTOR** | **Consultation Intelligence** | ▶️ **NEXT** | Clinician brief reports evidence-qualified change since last review with uncertainty and provenance |'
              ),
              (
                  '1. **Clinical intelligence product lane:** finish **P2-PROACTIVE — Prioritization + Insight Lifecycle** through docs-inclusive exact-head certification, expected-head merge and post-merge CI + migration drift. Do not start P2-DOCTOR before that closeout.',
                  '1. **Clinical intelligence product lane:** start **P2-DOCTOR — Consultation Intelligence** from the post-merge-green P2-PROACTIVE baseline. Keep clinician output evidence-qualified, provenance-visible and non-prescriptive.'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one anchor, found {count}: {old[:100]}')
              text = text.replace(old, new, 1)

          p.write_text(text)
          PY
      - name: Commit closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(clinical): close P2 proactive and advance P2 doctor"
          git push origin HEAD:agent/p2-proactive-closeout
