name: Production Demo multi-turn smoke

on:
  push:
    branches:
      - "smoke/prod-demo-multiturn-20260921"
    paths:
      - ".github/workflows/prod-demo-multiturn-smoke.yml"

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Smoke public demo production
        id: smoke
        continue-on-error: true
        env:
          BASE_URL: https://iamina-certified.vercel.app
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          import traceback
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          result = {
              "production": True,
              "synthetic": True,
              "base_url": base,
              "status": "FAIL",
              "turns_completed": 0,
              "replies": [],
          }

          try:
              with urllib.request.urlopen(base + "/api/v1/demo/scenarios", timeout=30) as response:
                  result["scenarios_status"] = response.status
                  if response.status != 200:
                      raise RuntimeError(f"scenario smoke failed: {response.status}")

              history = []
              turns = [
                  ("fr", "Pour cette démo, retiens deux mots-clés : Atlas et Cèdre."),
                  ("en", "What were the two keywords I mentioned?"),
                  ("fr", "Ajoute maintenant Rivage aux deux mots-clés précédents."),
                  ("en", "Which keyword did I add later?"),
                  ("fr", "Rappelle les trois mots-clés dans leur ordre d'apparition, sans en inventer."),
              ]

              for index, (language, message) in enumerate(turns, start=1):
                  payload = json.dumps(
                      {"message": message, "language": language, "history": history},
                      ensure_ascii=False,
                  ).encode("utf-8")
                  request = urllib.request.Request(
                      base + "/api/v1/demo/chat",
                      data=payload,
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = json.loads(response.read().decode("utf-8"))
                  if not body.get("reply"):
                      raise RuntimeError(f"turn {index}: empty reply")
                  if body.get("is_emergency"):
                      raise RuntimeError(f"turn {index}: unexpected emergency route")
                  result["replies"].append(body["reply"])
                  result["turns_completed"] = index
                  history.extend(
                      [
                          {"role": "user", "content": message},
                          {"role": "assistant", "content": body["reply"]},
                      ]
                  )

              second = result["replies"][1].lower()
              fourth = result["replies"][3].lower()
              fifth = result["replies"][4].lower()
              if "atlas" not in second or "cèdre" not in second:
                  raise RuntimeError("turn 2 did not recall Atlas + Cèdre")
              if "rivage" not in fourth:
                  raise RuntimeError("turn 4 did not identify Rivage")
              positions = [fifth.find("atlas"), fifth.find("cèdre"), fifth.find("rivage")]
              if any(position < 0 for position in positions) or positions != sorted(positions):
                  raise RuntimeError("turn 5 did not preserve Atlas → Cèdre → Rivage order")

              result["history_items_final"] = len(history)
              result["continuity"] = "PASS"
              result["status"] = "PASS"
          except Exception as exc:
              result["error_type"] = type(exc).__name__
              result["error"] = str(exc)
              result["traceback_tail"] = traceback.format_exc().splitlines()[-8:]

          with open("artifacts/prod-demo-smoke-result.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)

          print(json.dumps(result, ensure_ascii=False))
          if result["status"] != "PASS":
              raise SystemExit(1)
          PY

      - name: Publish smoke evidence as GitHub issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create             --title "PROD_DEMO_SMOKE_20260921"             --body-file artifacts/prod-demo-smoke-result.json

      - name: Enforce smoke result
        if: steps.smoke.outcome != 'success'
        run: exit 1
