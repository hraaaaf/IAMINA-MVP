name: W11 REA Android public APK research

on:
  pull_request:
    paths:
      - '.github/workflows/rea-android-synthetic-lab.yml'
  workflow_dispatch:

permissions: {}

jobs:
  public-apk-readonly:
    name: REA 6.7.0 / public APK / no patient data
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      REA_RELEASE: '6.7.0'
      FIXTURE_SHA256: 'a9eecf37b26cd084855c530db81c2bb1b91f4c1b095a04f47aa7c20e2791f686'
      JADX_SHA256: '6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75'
    steps:
      - name: Supported REA runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Full JDK for pinned JADX
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install exact REA release in isolated directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rea" "$RUNNER_TEMP/rea-evidence"
          npm install --prefix "$RUNNER_TEMP/rea" --no-save --ignore-scripts --no-audit --no-fund "rea-agents@$REA_RELEASE"
          echo "$RUNNER_TEMP/rea/node_modules/.bin" >> "$GITHUB_PATH"
          node -e "const p=require(process.env.RUNNER_TEMP+'/rea/node_modules/rea-agents/package.json');if(p.version!==process.env.REA_RELEASE)process.exit(1)"
      - name: Fetch and SHA-256 verify public artifacts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 -o "$RUNNER_TEMP/rea-evidence/ApiDemos-debug.apk" \
            'https://github.com/appium/android-apidemos/releases/download/v6.0.18/ApiDemos-debug.apk'
          printf '%s  %s\n' "$FIXTURE_SHA256" "$RUNNER_TEMP/rea-evidence/ApiDemos-debug.apk" | sha256sum --check --status
          curl --fail --location --retry 2 --max-time 120 -o "$RUNNER_TEMP/rea-evidence/jadx-headless-mcp-0.7.1-all.jar" \
            'https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar'
          printf '%s  %s\n' "$JADX_SHA256" "$RUNNER_TEMP/rea-evidence/jadx-headless-mcp-0.7.1-all.jar" | sha256sum --check --status
          echo "REA_JADX_MCP_JAR=$RUNNER_TEMP/rea-evidence/jadx-headless-mcp-0.7.1-all.jar" >> "$GITHUB_ENV"
          echo "Both SHA-256 checks passed"
      - name: Execute REA on public Appium demonstration APK
        shell: bash
        run: |
          set -euo pipefail
          rea --version
          rea doctor --json > "$RUNNER_TEMP/rea-evidence/doctor.json" || test -s "$RUNNER_TEMP/rea-evidence/doctor.json"
          timeout 300s rea inspect-android-package "$RUNNER_TEMP/rea-evidence/ApiDemos-debug.apk" --json > "$RUNNER_TEMP/rea-evidence/inspect.json"
          timeout 300s rea search-android-classes "$RUNNER_TEMP/rea-evidence/ApiDemos-debug.apk" ApiDemos --json > "$RUNNER_TEMP/rea-evidence/classes.json"
          python3 - <<'PY'
          import json, os, pathlib
          d = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rea-evidence'
          for name in ('doctor.json','inspect.json','classes.json'):
              p = d / name
              payload = json.loads(p.read_text(encoding='utf-8'))
              if not isinstance(payload, dict) or not payload or payload.get('error') or payload.get('ok') is False:
                  raise SystemExit(f'REA result invalid/error: {name}')
              print(f'{name}: valid JSON, bytes={p.stat().st_size}')
          diagnostics = json.loads((d / 'doctor.json').read_text(encoding='utf-8'))
          checks = {c.get('name'): c.get('ok') for c in diagnostics.get('scope_checks', [])}
          if checks.get('node') is not True or checks.get('jadx') is not True:
              raise SystemExit('Node/JADX prerequisite not healthy')
          print('REA doctor: Android prerequisites healthy (other engines optional)')
          (d / 'evidence-summary.json').write_text(json.dumps({
              'rea_version': os.environ['REA_RELEASE'],
              'fixture': 'appium/android-apidemos v6.0.18 Apache-2.0',
              'fixture_sha256': os.environ['FIXTURE_SHA256'],
              'jadx_sha256': os.environ['JADX_SHA256'],
              'scope': 'public demo only, no medical device or patient data'
          }, indent=2)+'\n')
          PY
      - name: Upload JSON evidence only (never APK/JAR)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w11-rea-public-apk-evidence
          path: |
            ${{ runner.temp }}/rea-evidence/doctor.json
            ${{ runner.temp }}/rea-evidence/inspect.json
            ${{ runner.temp }}/rea-evidence/classes.json
            ${{ runner.temp }}/rea-evidence/evidence-summary.json
          if-no-files-found: warn
          retention-days: 7
