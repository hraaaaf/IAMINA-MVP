name: UI browser screenshot certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/lib/**'
      - 'frontend/assets/**'
      - 'frontend/pubspec.yaml'
      - '.github/workflows/ui-browser-screenshot.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/lib/**'
      - 'frontend/assets/**'
      - 'frontend/pubspec.yaml'
      - '.github/workflows/ui-browser-screenshot.yml'

permissions:
  contents: read

jobs:
  browser-cert:
    name: Real Chrome patient surfaces mobile + desktop
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze isolated browser audit entrypoint
        run: flutter analyze --no-fatal-infos lib/ui_browser_audit_main.dart

      - name: Build isolated browser audit
        run: flutter build web --release -t lib/ui_browser_audit_main.dart

      - name: Capture real Chrome surfaces
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ui-browser-cert"
          python3 -m pip install --quiet websocket-client
          python3 -m http.server 7358 --directory build/web >/tmp/iamina-ui-browser-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7358 >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = "1"
          curl -fsSI http://127.0.0.1:7358/sqlite3.wasm >/dev/null
          curl -fsSI http://127.0.0.1:7358/drift_worker.js >/dev/null

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          cleanup_chrome() {
            local chrome_pid="$1"
            local profile_dir="$2"
            kill "$chrome_pid" 2>/dev/null || true
            for _ in $(seq 1 10); do
              if ! kill -0 "$chrome_pid" 2>/dev/null; then
                break
              fi
              sleep 0.2
            done
            kill -9 "$chrome_pid" 2>/dev/null || true
            wait "$chrome_pid" 2>/dev/null || true
            rm -rf "$profile_dir" 2>/dev/null || true
          }

          cat > /tmp/capture_cdp.py <<'PY'
          import base64
          import json
          import sys
          import time
          import urllib.request
          from websocket import create_connection

          target = sys.argv[1]
          width = int(sys.argv[2])
          height = int(sys.argv[3])
          mobile = sys.argv[4].lower() == 'true'
          endpoint = 'http://127.0.0.1:9222/json/list'
          pages = json.load(urllib.request.urlopen(endpoint))
          page = next(item for item in pages if item.get('type') == 'page')
          ws = create_connection(page['webSocketDebuggerUrl'], timeout=20)
          counter = 0

          def call(method, params=None):
              global counter
              counter += 1
              ws.send(json.dumps({'id': counter, 'method': method, 'params': params or {}}))
              while True:
                  response = json.loads(ws.recv())
                  if response.get('id') == counter:
                      return response

          call('Page.enable')
          call('Emulation.setDeviceMetricsOverride', {
              'width': width,
              'height': height,
              'deviceScaleFactor': 1,
              'mobile': mobile,
          })
          call('Page.reload', {'ignoreCache': True})
          time.sleep(12)
          shot = call('Page.captureScreenshot', {
              'format': 'png',
              'captureBeyondViewport': False,
              'fromSurface': True,
          })
          data = shot.get('result', {}).get('data')
          if not data:
              raise RuntimeError(f'No screenshot payload: {shot}')
          with open(target, 'wb') as fh:
              fh.write(base64.b64decode(data))
          ws.close()
          PY

          surfaces=(dashboard trend kpi insight next-action companion summary profile journal importer document-import add-log medications reminders)
          viewports=("390 844 true" "768 1024 false" "1280 900 false")

          for viewport in "${viewports[@]}"; do
            read -r width height mobile <<< "$viewport"
            for surface in "${surfaces[@]}"; do
              target="$GITHUB_WORKSPACE/ui-browser-cert/${surface}-${width}x${height}.png"
              profile_dir="$(mktemp -d)"
              "$CHROME" \
                --headless=new \
                --no-sandbox \
                --enable-unsafe-swiftshader \
                --hide-scrollbars \
                --remote-allow-origins='*' \
                --remote-debugging-port=9222 \
                --user-data-dir="$profile_dir" \
                --window-size=${width},${height} \
                "http://127.0.0.1:7358/?surface=${surface}" \
                >/tmp/iamina-chrome-${surface}-${width}x${height}.log 2>&1 &
              CHROME_PID=$!

              DEVTOOLS=0
              for _ in $(seq 1 30); do
                if curl -fsS http://127.0.0.1:9222/json/list >/dev/null; then
                  DEVTOOLS=1
                  break
                fi
                sleep 1
              done
              if [ "$DEVTOOLS" != "1" ]; then
                cat "/tmp/iamina-chrome-${surface}-${width}x${height}.log" >&2 || true
                cleanup_chrome "$CHROME_PID" "$profile_dir"
                exit 1
              fi

              python3 /tmp/capture_cdp.py "$target" "$width" "$height" "$mobile"
              cleanup_chrome "$CHROME_PID" "$profile_dir"

              test -s "$target"
              bytes="$(stat -c%s "$target")"
              if [ "$bytes" -lt 10000 ]; then
                echo "Capture ${surface}-${width}x${height} is suspiciously small (${bytes} bytes)" >&2
                exit 1
              fi
            done

            count="$(find "$GITHUB_WORKSPACE/ui-browser-cert" -name "*-${width}x${height}.png" | wc -l)"
            test "$count" -eq 14
            unique="$(sha256sum "$GITHUB_WORKSPACE"/ui-browser-cert/*-${width}x${height}.png | awk '{print $1}' | sort -u | wc -l)"
            if [ "$unique" -lt 12 ]; then
              echo "Browser certification at ${width}x${height} produced only ${unique} distinct renders" >&2
              exit 1
            fi
          done

          total="$(find "$GITHUB_WORKSPACE/ui-browser-cert" -name '*.png' | wc -l)"
          test "$total" -eq 42

      - name: Upload real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-ui-browser-cert-multi-viewport
          path: ui-browser-cert/*.png
          if-no-files-found: warn
          retention-days: 7
