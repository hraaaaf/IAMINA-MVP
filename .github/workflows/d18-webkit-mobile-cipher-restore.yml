name: D18 WebKit 390px encrypted SQLite restore — synthetic

on:
  pull_request:
    paths:
      - '.github/workflows/d18-webkit-mobile-cipher-restore.yml'
      - 'frontend/lib/d18_full_cipher_restore_probe_main.dart'
      - 'frontend/lib/d18_unpublished_cipher_restore_worker.dart'
      - 'tools/d18_physical_cipher_restore_probe.js'
      - 'tools/d18_cutover_idb_marker_probe.js'
      - 'tools/d18_dart_idb_marker_bridge_probe.js'
      - 'tools/d18_source_writer_barrier_probe.js'
      - 'tools/d18_real_source_interlock_probe.js'
      - 'tools/d18_source_lock_dart_browser_probe.js'
      - 'frontend/lib/d18_source_lock_probe_main.dart'
      - 'frontend/web/d18_source_interlock.js'
      - 'frontend/web/index.html'
      - 'frontend/lib/data/drift/d18_source_lock_*.dart'
      - 'tools/fixtures/d18_marker_idb_bridge.js'
      - 'frontend/lib/d18_dart_marker_bridge_probe_main.dart'
      - 'frontend/lib/data/drift/d18_pre_cutover_idb_marker_store_web.dart'
      - 'frontend/lib/data/drift/d18_full_cipher_archive.dart'
      - 'frontend/lib/d18_unpublished_cipher_worker.dart'
      - 'frontend/lib/data/drift/d18_unpublished_cipher_connector_web.dart'
      - 'frontend/d18_crypto/worker_lock_gate.js'
      - 'frontend/pubspec.yaml'
      - 'frontend/pubspec.lock'

permissions:
  contents: read

concurrency:
  group: d18-webkit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sealed-physical-restore:
    name: WebKit 390px physical ciphertext restore and Web Locks, strict all gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Resolve pinned Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Reject compiled CI-only workers committed into normal Web assets
        run: |
          for worker in d18_unpublished_cipher_worker.js d18_unpublished_cipher_restore_worker.js d18_cipher_worker_correct.js; do
            if test -e "frontend/web/$worker"; then
              echo "D18 TEST ONLY WORKER IN SHIPPED ASSETS: $worker"
              exit 1
            fi
          done
      - name: Compile encrypted source and isolated restore workers
        working-directory: frontend
        run: |
          dart compile js -O4 -o web/d18_unpublished_cipher_worker.js lib/d18_unpublished_cipher_worker.dart
          dart compile js -O4 -o web/d18_unpublished_cipher_restore_worker.js lib/d18_unpublished_cipher_restore_worker.dart
          dart compile js -O4 -o web/d18_cipher_worker_correct.js lib/d18_cipher_worker_correct.dart
      - name: Verify pinned sqlite3mc binary SHA256
        working-directory: frontend
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            -o web/d18_sqlite3mc.wasm \
            https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-2.9.4/sqlite3mc.wasm
          echo "5a1cfe40252d05bbd174e66351d3c282f69784c6fd0c2d099bf7135c6e91b4ec  web/d18_sqlite3mc.wasm" | sha256sum -c -
      - name: Analyze Dart source, guard, archive and restore probe
        working-directory: frontend
        run: |
          flutter analyze --no-fatal-infos \
            lib/d18_full_cipher_restore_probe_main.dart \
            lib/d18_unpublished_cipher_restore_worker.dart \
            lib/data/drift/d18_full_cipher_archive.dart
      - name: Build standalone PRE-CUTOVER Flutter web proof
        working-directory: frontend
        run: |
          flutter build web --release --no-web-resources-cdn \
            -t lib/d18_full_cipher_restore_probe_main.dart
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit engine on Linux
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: D18 REAL SOURCE SCRIPT cooperative canary (webkit, NOT CUTOVER)
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --check frontend/web/d18_source_interlock.js
          node --check tools/d18_real_source_interlock_probe.js
          D18_SOURCE_INTERLOCK_BROWSER=webkit node tools/d18_real_source_interlock_probe.js
      - name: Verify actual Flutter Dart to source Web Lock (webkit CI-only)
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          (cd frontend && flutter analyze --no-fatal-infos lib/d18_source_lock_probe_main.dart)
          (cd frontend && flutter build web --release --no-web-resources-cdn --output build/d18-source-gate-probe -t lib/d18_source_lock_probe_main.dart)
          python3 -m http.server 7409 --bind 127.0.0.1 --directory frontend/build/d18-source-gate-probe > /tmp/d18-source-dart-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          curl --fail --retry 8 --retry-delay 1 --retry-connrefused --silent http://127.0.0.1:7409/ > /dev/null
          node --check tools/d18_source_lock_dart_browser_probe.js
          D18_DART_SOURCE_BROWSER=webkit node tools/d18_source_lock_dart_browser_probe.js
      - name: D18 synthetic IndexedDB atomic marker CAS — WebKit Linux
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --check tools/d18_cutover_idb_marker_probe.js
          D18_MARKER_BROWSER=webkit node tools/d18_cutover_idb_marker_probe.js
      - name: WebKit 390px fresh-profile file restore and no-overwrite proof
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --check tools/d18_physical_cipher_restore_probe.js
          if test -e frontend/build/web/d18_unpublished_worker_lock_gate.js; then
            echo 'D18 lock test helper leaked into normal Web build'
            exit 1
          fi
          cp frontend/d18_crypto/worker_lock_gate.js frontend/build/web/d18_unpublished_worker_lock_gate.js
          python3 -m http.server 7398 --bind 127.0.0.1 \
            --directory frontend/build/web > /tmp/d18-restoration-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          curl --fail --retry 6 --retry-delay 1 --retry-connrefused \
            --silent http://127.0.0.1:7398/ > /dev/null
          D18_TEST_BROWSER=webkit node tools/d18_physical_cipher_restore_probe.js
          rm frontend/build/web/d18_unpublished_worker_lock_gate.js
      - name: Build D18 Flutter Dart bridge to IndexedDB (pre-cutover CI only)
        working-directory: frontend
        run: |
          flutter analyze --no-fatal-infos lib/data/drift/d18_pre_cutover_idb_marker_store_web.dart lib/d18_dart_marker_bridge_probe_main.dart
          flutter build web --release --no-web-resources-cdn -t lib/d18_dart_marker_bridge_probe_main.dart
      - name: Exercise Flutter Dart IndexedDB bridge — WebKit Linux
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --check tools/fixtures/d18_marker_idb_bridge.js
          node --check tools/d18_dart_idb_marker_bridge_probe.js
          python3 -m http.server 7397 --bind 127.0.0.1 --directory frontend/build/web > /tmp/d18-dart-idb-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          curl --fail --retry 6 --retry-delay 1 --retry-connrefused --silent http://127.0.0.1:7397/ > /dev/null
          D18_DART_IDB_BROWSER=webkit node tools/d18_dart_idb_marker_bridge_probe.js
      - name: D18 synthetic legacy + patient source lease — webkit (21 checks)
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --check tools/d18_source_writer_barrier_probe.js
          D18_SOURCE_BARRIER_BROWSER=webkit node tools/d18_source_writer_barrier_probe.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d18-webkit-mobile-restore-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            d18-physical-restore-proof/report.json
            d18-idb-marker-proof/report-webkit.json
            d18-dart-idb-marker-proof/report-webkit.json
            d18-source-barrier-proof/report-webkit.json
          if-no-files-found: warn
          retention-days: 14
