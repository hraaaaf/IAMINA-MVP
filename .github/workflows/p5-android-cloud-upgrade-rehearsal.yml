name: P5 Android cloud upgrade rehearsal

on:
  push:
    branches:
      - p5/android-cloud-upgrade-rehearsal
    paths:
      - .github/workflows/p5-android-cloud-upgrade-rehearsal.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-android-cloud-upgrade-rehearsal
  cancel-in-progress: true

jobs:
  signed-update-emulator:
    name: Signed N-1 to N Drift preservation on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_REPO: hraaaaf/IAMINA-MVP
      N1_SOURCE_SHA: 13b2159d14a211516262cfa96872dc9a722a6743
      N_SOURCE_SHA: fe4a18390921e7b0ea77f2fe14c28e2d7589d680
      APP_ID: ma.iamina.app
      FLUTTER_VERSION: 3.41.0
      SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64

    steps:
      - name: Guard zero-cost rehearsal scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "hraaaaf/IAMINA-MVP"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || test "$GITHUB_REF" = "refs/heads/p5/android-cloud-upgrade-rehearsal"
          [[ "$N1_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$N_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$N1_SOURCE_SHA" != "$N_SOURCE_SHA"
          mkdir -p rehearsal
          cat > rehearsal/evidence.txt <<EOF
          Test class: CI-only Android emulator upgrade rehearsal
          Production signing lineage: NOT USED in this workflow
          Signing key: ephemeral CI-only key, never retained
          Source N-1: $N1_SOURCE_SHA
          Source N: $N_SOURCE_SHA
          Application ID: $APP_ID
          Physical device: NOT PROVEN
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.41.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Clone exact N-1 and N sources
        shell: bash
        run: |
          set -euo pipefail
          for spec in "n1:$N1_SOURCE_SHA" "n:$N_SOURCE_SHA"; do
            name="${spec%%:*}"
            sha="${spec##*:}"
            git clone --quiet --filter=blob:none "https://github.com/${SOURCE_REPO}.git" "source-$name"
            git -C "source-$name" cat-file -e "${sha}^{commit}"
            git -C "source-$name" merge-base --is-ancestor "$sha" origin/main
            git -C "source-$name" checkout --quiet --detach "$sha"
            test "$(git -C "source-$name" rev-parse HEAD)" = "$sha"
          done
          python source-n/scripts/check_pilot_packaging_contract.py

      - name: Inject CI-only Drift seed and verification probe
        shell: bash
        run: |
          set -euo pipefail
          inject_probe() {
            local root="$1"
            cat > "$root/frontend/lib/p5_upgrade_probe.dart" <<'DART'
          import 'package:flutter/foundation.dart';

          import 'data/drift/database.dart';

          const String _mode = String.fromEnvironment(
            'IAMINA_P5_UPGRADE_MODE',
            defaultValue: '',
          );
          const String _medLabel = 'P5-UPGRADE-MED-20260830';
          const String _reminderTitle = 'P5-UPGRADE-REMINDER-20260830';

          Future<void> runP5UpgradeProbe(AppDatabase db) async {
            if (_mode == 'seed') {
              await db.seedDemoData();
              await db.addMedicationEvent(
                label: _medLabel,
                dose: 1.25,
                unit: 'u',
                takenAt: DateTime.utc(2026, 8, 30, 10),
              );
              await db.addReminder(
                title: _reminderTitle,
                dueAt: DateTime.utc(2026, 8, 31, 8),
              );
              final logs = await db.countLogs();
              final profile =
                  await (db.select(db.patientProfiles)..limit(1)).getSingleOrNull();
              if (logs < 60 || profile == null) {
                throw StateError(
                  'P5_SEED_FAIL logs=$logs profile=${profile != null}',
                );
              }
              debugPrint(
                'IAMINA_P5_UPGRADE_SEED_OK logs=$logs profile=true',
              );
              return;
            }

            if (_mode == 'verify') {
              final logs = await db.countLogs();
              final profile =
                  await (db.select(db.patientProfiles)..limit(1)).getSingleOrNull();
              final meds = await db.select(db.medicationEvents).get();
              final reminders = await db.select(db.reminders).get();
              final medOk = meds.any(
                (event) =>
                    event.label == _medLabel &&
                    event.dose == 1.25 &&
                    event.unit == 'u',
              );
              final reminderOk = reminders.any(
                (reminder) => reminder.title == _reminderTitle,
              );
              if (logs < 60 || profile == null || !medOk || !reminderOk) {
                throw StateError(
                  'P5_VERIFY_FAIL logs=$logs profile=${profile != null} '
                  'med=$medOk reminder=$reminderOk',
                );
              }
              debugPrint(
                'IAMINA_P5_UPGRADE_VERIFY_OK logs=$logs profile=true '
                'med=true reminder=true',
              );
            }
          }
          DART

            python - "$root/frontend/lib/main.dart" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          import_anchor = "import 'l10n/app_localizations.dart';\n"
          db_anchor = '  final db = AppDatabase.defaults();\n'
          if text.count(import_anchor) != 1 or text.count(db_anchor) != 1:
              raise SystemExit('P5 probe anchors changed; refusing instrumentation')
          text = text.replace(
              import_anchor,
              import_anchor + "import 'p5_upgrade_probe.dart';\n",
              1,
          )
          text = text.replace(
              db_anchor,
              db_anchor + '  await runP5UpgradeProbe(db);\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          }

          inject_probe source-n1
          inject_probe source-n
          grep -F "await runP5UpgradeProbe(db);" source-n1/frontend/lib/main.dart
          grep -F "await runP5UpgradeProbe(db);" source-n/frontend/lib/main.dart

      - name: Build N-1 and N with one ephemeral rehearsal signer
        shell: bash
        run: |
          set -euo pipefail
          JKS="$RUNNER_TEMP/iamina-ci-rehearsal.jks"
          PASS="$(openssl rand -hex 24)"
          ALIAS="iamina-ci-rehearsal"
          umask 077
          keytool -genkeypair -noprompt \
            -keystore "$JKS" \
            -storetype JKS \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 7 \
            -dname "CN=IAMINA CI Rehearsal, OU=Non Production, O=IAMINA, C=MA" >/dev/null 2>&1

          write_key_properties() {
            local root="$1"
            cat > "$root/frontend/android/key.properties" <<EOF
          storePassword=$PASS
          keyPassword=$PASS
          keyAlias=$ALIAS
          storeFile=$JKS
          EOF
          }
          write_key_properties source-n1
          write_key_properties source-n

          pushd source-n1/frontend >/dev/null
          flutter pub get
          flutter build apk --release \
            --build-number=1 \
            --dart-define=ENABLE_FIREBASE_MIGRATION=false \
            --dart-define=IAMINA_P5_UPGRADE_MODE=seed
          popd >/dev/null
          cp source-n1/frontend/build/app/outputs/flutter-apk/app-release.apk rehearsal/n1.apk
          rm -rf source-n1

          pushd source-n/frontend >/dev/null
          flutter pub get
          flutter build apk --release \
            --build-number=2 \
            --dart-define=ENABLE_FIREBASE_MIGRATION=false \
            --dart-define=IAMINA_P5_UPGRADE_MODE=verify
          popd >/dev/null
          cp source-n/frontend/build/app/outputs/flutter-apk/app-release.apk rehearsal/n.apk

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs rehearsal/n1.apk > rehearsal/n1-apksigner.txt
          "$APKSIGNER" verify --verbose --print-certs rehearsal/n.apk > rehearsal/n-apksigner.txt
          CERT1="$(sed -n 's/.*certificate SHA-256 digest: //p' rehearsal/n1-apksigner.txt | head -1 | tr -d '[:space:]:')"
          CERT2="$(sed -n 's/.*certificate SHA-256 digest: //p' rehearsal/n-apksigner.txt | head -1 | tr -d '[:space:]:')"
          test -n "$CERT1" && test "$CERT1" = "$CERT2"

          PKG1="$("$AAPT" dump badging rehearsal/n1.apk | head -1)"
          PKG2="$("$AAPT" dump badging rehearsal/n.apk | head -1)"
          NAME1="$(printf '%s\n' "$PKG1" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")"
          NAME2="$(printf '%s\n' "$PKG2" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")"
          CODE1="$(printf '%s\n' "$PKG1" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          CODE2="$(printf '%s\n' "$PKG2" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          test "$NAME1" = "$APP_ID" && test "$NAME2" = "$APP_ID"
          test "$CODE1" = "1" && test "$CODE2" = "2"

          {
            echo "N-1 APK SHA-256: $(sha256sum rehearsal/n1.apk | awk '{print $1}')"
            echo "N APK SHA-256: $(sha256sum rehearsal/n.apk | awk '{print $1}')"
            echo "Rehearsal signing certificate SHA-256: $CERT1"
            echo "N-1 versionCode: $CODE1"
            echo "N versionCode: $CODE2"
            echo "Same rehearsal signing lineage: PASS"
          } >> rehearsal/evidence.txt

          rm -f source-n/frontend/android/key.properties "$JKS"
          rm -rf source-n "$HOME/.gradle/caches"
          test ! -e "$JKS"
          echo "Plaintext rehearsal signing material removed before emulator phase."
          df -h .

      - name: Boot hardware-accelerated Android emulator
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          AVDMANAGER="$(command -v avdmanager)"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          test -x "$SDKMANAGER" && test -x "$AVDMANAGER" && test -x "$EMULATOR"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-35" "$SYSTEM_IMAGE" >/dev/null
          echo no | "$AVDMANAGER" create avd \
            --force \
            --name iamina-p5 \
            --package "$SYSTEM_IMAGE" \
            --device pixel_6 >/dev/null
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
          nohup "$EMULATOR" \
            -avd iamina-p5 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -no-metrics \
            > rehearsal/emulator.log 2>&1 &
          echo $! > rehearsal/emulator.pid
          adb wait-for-device
          timeout 180 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          echo "Emulator API: $(adb shell getprop ro.build.version.sdk | tr -d '\r')" >> rehearsal/evidence.txt
          echo "Emulator model: $(adb shell getprop ro.product.model | tr -d '\r')" >> rehearsal/evidence.txt

      - name: Install N-1 and seed real Drift data
        shell: bash
        run: |
          set -euo pipefail
          adb install rehearsal/n1.apk | tee rehearsal/install-n1.txt
          grep -Fq Success rehearsal/install-n1.txt
          adb logcat -c
          adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1 >/dev/null
          found=0
          for _ in $(seq 1 60); do
            if adb logcat -d | grep -Fq 'IAMINA_P5_UPGRADE_SEED_OK'; then found=1; break; fi
            sleep 2
          done
          if [[ "$found" != "1" ]]; then
            adb logcat -d > rehearsal/seed-logcat.txt
            echo "::error::N-1 Drift seed marker not observed"
            exit 1
          fi
          adb logcat -d > rehearsal/seed-logcat.txt
          PACKAGE_BEFORE="$(adb shell dumpsys package "$APP_ID" | tr -d '\r')"
          FIRST_INSTALL="$(printf '%s\n' "$PACKAGE_BEFORE" | sed -n 's/^[[:space:]]*firstInstallTime=//p' | head -1)"
          USER_ID="$(printf '%s\n' "$PACKAGE_BEFORE" | sed -n 's/^[[:space:]]*userId=//p' | head -1)"
          VERSION_BEFORE="$(printf '%s\n' "$PACKAGE_BEFORE" | sed -n 's/.*versionCode=\([0-9]*\).*/\1/p' | head -1)"
          test "$VERSION_BEFORE" = "1"
          test -n "$FIRST_INSTALL" && test -n "$USER_ID"
          printf '%s' "$FIRST_INSTALL" > rehearsal/first-install.txt
          printf '%s' "$USER_ID" > rehearsal/user-id.txt
          {
            echo "N-1 clean install: PASS"
            echo "N-1 Drift seed: PASS"
            echo "N-1 firstInstallTime: $FIRST_INSTALL"
            echo "N-1 userId: $USER_ID"
          } >> rehearsal/evidence.txt

      - name: Update in place to N and verify preserved Drift data
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_FIRST="$(cat rehearsal/first-install.txt)"
          BEFORE_UID="$(cat rehearsal/user-id.txt)"
          adb install -r rehearsal/n.apk | tee rehearsal/install-n.txt
          grep -Fq Success rehearsal/install-n.txt
          adb logcat -c
          adb shell am force-stop "$APP_ID"
          adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1 >/dev/null
          found=0
          for _ in $(seq 1 60); do
            if adb logcat -d | grep -Fq 'IAMINA_P5_UPGRADE_VERIFY_OK'; then found=1; break; fi
            sleep 2
          done
          if [[ "$found" != "1" ]]; then
            adb logcat -d > rehearsal/update-logcat.txt
            echo "::error::N Drift preservation marker not observed after adb install -r"
            exit 1
          fi
          adb logcat -d > rehearsal/update-logcat.txt
          PACKAGE_AFTER="$(adb shell dumpsys package "$APP_ID" | tr -d '\r')"
          AFTER_FIRST="$(printf '%s\n' "$PACKAGE_AFTER" | sed -n 's/^[[:space:]]*firstInstallTime=//p' | head -1)"
          AFTER_UID="$(printf '%s\n' "$PACKAGE_AFTER" | sed -n 's/^[[:space:]]*userId=//p' | head -1)"
          VERSION_AFTER="$(printf '%s\n' "$PACKAGE_AFTER" | sed -n 's/.*versionCode=\([0-9]*\).*/\1/p' | head -1)"
          test "$VERSION_AFTER" = "2"
          test "$AFTER_FIRST" = "$BEFORE_FIRST"
          test "$AFTER_UID" = "$BEFORE_UID"
          {
            echo "adb install -r update without uninstall/storage clear: PASS"
            echo "N versionCode 2: PASS"
            echo "firstInstallTime preserved: PASS"
            echo "Android package userId preserved: PASS"
            echo "Drift glucose/profile/medication/reminder preservation: PASS"
          } >> rehearsal/evidence.txt

      - name: Force offline state, relaunch N, and reverify Drift data
        shell: bash
        run: |
          set -euo pipefail
          adb shell cmd connectivity airplane-mode enable >/dev/null 2>&1 || {
            adb shell settings put global airplane_mode_on 1
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true >/dev/null
          }
          adb shell svc wifi disable >/dev/null 2>&1 || true
          adb shell svc data disable >/dev/null 2>&1 || true
          AIRPLANE="$(adb shell settings get global airplane_mode_on | tr -d '\r')"
          test "$AIRPLANE" = "1"

          NETWORK_BLOCKED=false
          if ! adb shell ping -c 1 -W 1 1.1.1.1 >/dev/null 2>&1; then
            NETWORK_BLOCKED=true
          fi

          adb logcat -c
          adb shell am force-stop "$APP_ID"
          adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1 >/dev/null
          found=0
          for _ in $(seq 1 45); do
            if adb logcat -d | grep -Fq 'IAMINA_P5_UPGRADE_VERIFY_OK'; then found=1; break; fi
            sleep 2
          done
          adb logcat -d > rehearsal/offline-logcat.txt
          test "$found" = "1"
          {
            echo "Airplane mode requested and observed: PASS"
            echo "Network reachability blocked by ping check: $NETWORK_BLOCKED"
            echo "Drift data survived force-stop/relaunch: PASS"
            if [[ "$NETWORK_BLOCKED" == "true" ]]; then
              echo "Offline reopen with preserved Drift data: PASS"
            else
              echo "Offline reopen with preserved Drift data: UNPROVEN (emulator network remained reachable)"
            fi
          } >> rehearsal/evidence.txt

      - name: Assert evidence contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'N-1 clean install: PASS' rehearsal/evidence.txt
          grep -Fq 'N-1 Drift seed: PASS' rehearsal/evidence.txt
          grep -Fq 'adb install -r update without uninstall/storage clear: PASS' rehearsal/evidence.txt
          grep -Fq 'Drift glucose/profile/medication/reminder preservation: PASS' rehearsal/evidence.txt
          grep -Fq 'Drift data survived force-stop/relaunch: PASS' rehearsal/evidence.txt
          if grep -Eq 'adb (uninstall|shell pm clear)' .github/workflows/p5-android-cloud-upgrade-rehearsal.yml; then
            echo '::error::Forbidden uninstall/storage-clear command detected'
            exit 1
          fi
          echo 'P5 Android cloud upgrade rehearsal evidence contract: PASS'
          cat rehearsal/evidence.txt

      - name: Upload synthetic rehearsal evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p5-android-cloud-upgrade-rehearsal-${{ github.run_id }}
          path: |
            rehearsal/evidence.txt
            rehearsal/*-logcat.txt
            rehearsal/install-*.txt
            rehearsal/emulator.log
            rehearsal/n1-apksigner.txt
            rehearsal/n-apksigner.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f source-n1/frontend/android/key.properties source-n/frontend/android/key.properties 2>/dev/null || true
          rm -f "$RUNNER_TEMP/iamina-ci-rehearsal.jks"
          if [[ -f rehearsal/emulator.pid ]]; then kill "$(cat rehearsal/emulator.pid)" 2>/dev/null || true; fi
          rm -f rehearsal/n1.apk rehearsal/n.apk
