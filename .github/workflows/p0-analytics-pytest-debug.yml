name: P0 Analytics Pytest Debug

on:
  pull_request:
    branches: [main]

jobs:
  sqlite-debug:
    if: github.head_ref == 'fix/p0-clinical-analytics-postgres'
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Capture SQLite failures
        run: |
          cd backend
          pytest --tb=short -q > ../pytest-sqlite.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-sqlite
          path: pytest-sqlite.txt

  postgres-debug:
    if: github.head_ref == 'fix/p0-clinical-analytics-postgres'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_ci
      FIREBASE_CREDENTIALS_PATH: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Capture PostgreSQL failures
        run: |
          cd backend
          pytest --tb=short -q > ../pytest-postgres.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-postgres
          path: pytest-postgres.txt
