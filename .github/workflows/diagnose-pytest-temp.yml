name: TEMP Diagnose pytest failures

on:
  push:
    branches:
      - fix/p0-auth-profile-integrity
    paths:
      - .github/workflows/diagnose-pytest-temp.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies quietly
        run: pip install -q -r backend/requirements.txt
      - name: Capture concise pytest failure summary
        run: |
          set +e
          cd backend
          pytest --tb=short -q > /tmp/pytest.txt 2>&1
          CODE=$?
          cd ..
          mkdir -p .ci
          {
            echo "pytest_exit_code=$CODE"
            echo "--- pytest tail ---"
            tail -250 /tmp/pytest.txt
          } > .ci/pytest-failure.txt
      - name: Commit diagnostic summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/pytest-failure.txt
          git commit -m "chore(ci): capture temporary pytest failure summary"
          git push origin HEAD:fix/p0-auth-profile-integrity
