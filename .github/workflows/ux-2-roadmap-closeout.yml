name: UX-2 roadmap pre-closeout

on:
  push:
    branches: [ux/ux-2-summary-error-state]
    paths: [.github/workflows/ux-2-roadmap-closeout.yml]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/ux-2-summary-error-state
      - name: Update canonical roadmap
        run: python3 .github/ux-2-roadmap-closeout.py
      - name: Remove temporary closeout machinery and commit
        run: |
          git rm .github/workflows/ux-2-roadmap-closeout.yml .github/ux-2-roadmap-closeout.py
          git add docs/ROADMAP.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(ux): record UX-2 certification evidence'
          git push origin HEAD:ux/ux-2-summary-error-state
