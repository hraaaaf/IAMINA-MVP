name: P2-JOURNAL-8 builder

on:
  push:
    branches: [audit/p2-journal-8-builder]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: builder-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///builder-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - name: Checkout audit tools
        uses: actions/checkout@v4
        with:
          ref: audit/p2-journal-8-builder
          path: audit-tools

      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: agent/p2-journal-personal-response
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: product

      - name: Patch integration surfaces
        run: python audit-tools/.github/scripts/p2_journal_8_patch.py product

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: product/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: product/backend
        run: pip install -r requirements.txt ruff==0.15.17

      - name: Format and test backend
        working-directory: product/backend
        run: |
          ruff format diabetes/services/clinical/personal_response.py diabetes/api/v1/personal_response.py diabetes/api/main.py diabetes/tests/test_personal_response.py
          ruff check diabetes/services/clinical/personal_response.py diabetes/api/v1/personal_response.py diabetes/api/main.py diabetes/tests/test_personal_response.py
          pytest diabetes/tests/test_personal_response.py --tb=short -q
          python manage.py export_openapi > ../docs/api/openapi.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: Generate localization and test frontend
        working-directory: product/frontend
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib/data/models/personal_response_models.dart lib/features/journal/widgets/personal_response_section.dart lib/features/journal/journal_screen.dart lib/services/api_client.dart test/features/personal_response_section_test.dart
          flutter analyze --no-fatal-infos
          flutter test test/features/personal_response_section_test.dart --no-pub

      - name: Verify and commit product branch
        working-directory: product
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend frontend docs/api/openapi.json
          git commit -m 'feat(journal): wire personal response experience'
          git push origin HEAD:agent/p2-journal-personal-response
