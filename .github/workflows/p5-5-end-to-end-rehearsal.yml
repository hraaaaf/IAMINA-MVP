name: P5-5 End-to-End Pilot Rehearsal

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p5-5-end-to-end-rehearsal.yml
      - scripts/p5_5_end_to_end_rehearsal.sh
      - frontend/lib/services/local_report_pdf.dart
      - frontend/test/services/local_report_pdf_test.dart
      - frontend/lib/data/drift/local_backup.dart
      - frontend/test/data/drift/local_backup_restore_test.dart
  push:
    branches: [main]
    paths:
      - .github/workflows/p5-5-end-to-end-rehearsal.yml
      - scripts/p5_5_end_to_end_rehearsal.sh
      - frontend/lib/services/local_report_pdf.dart
      - frontend/test/services/local_report_pdf_test.dart
      - frontend/lib/data/drift/local_backup.dart
      - frontend/test/data/drift/local_backup_restore_test.dart

permissions:
  contents: read

concurrency:
  group: p5-5-end-to-end-pilot-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    name: Synthetic retained pilot rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iamina
          POSTGRES_PASSWORD: iamina
          POSTGRES_DB: iamina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iamina -d iamina"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: p5-5-rehearsal-nonproduction
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://iamina:iamina@localhost:5432/iamina
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: stable
          cache: true

      - name: Install backend and local OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "Pillow>=10.0" "pytesseract>=0.3.10"

      - name: Prepare Django database
        working-directory: backend
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run P5-5 distributed synthetic rehearsal
        run: bash scripts/p5_5_end_to_end_rehearsal.sh artifacts/p5-5-rehearsal.txt

      - name: Upload retained textual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-5-end-to-end-rehearsal-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/p5-5-rehearsal.txt
          if-no-files-found: error
          retention-days: 30
