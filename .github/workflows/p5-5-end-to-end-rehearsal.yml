name: P5-5 End-to-End Pilot Rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-5-end-to-end-pilot-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    name: Synthetic retained pilot rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: p5-5-rehearsal-nonproduction
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///p5-5-rehearsal.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: Install backend and local OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "Pillow>=10.0" "pytesseract>=0.3.10"

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run P5-5 distributed synthetic rehearsal
        run: bash scripts/p5_5_end_to_end_rehearsal.sh artifacts/p5-5-rehearsal.txt

      - name: Upload retained textual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-5-end-to-end-rehearsal-${{ github.sha }}
          path: artifacts/p5-5-rehearsal.txt
          if-no-files-found: error
          retention-days: 30
