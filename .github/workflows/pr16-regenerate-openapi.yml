name: PR16 regenerate OpenAPI

on:
  push:
    branches:
      - feat/p0-mena-locale-safety-contract

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: locale-openapi-ci
      DEBUG: "True"
      DATABASE_URL: sqlite:///locale-openapi.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-locale-safety-contract
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Regenerate schema
        run: python backend/manage.py export_openapi > docs/api/openapi.json
      - name: Commit schema
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/api/openapi.json
          git commit -m "docs(api): regenerate locale preference contract"
          git push origin HEAD:feat/p0-mena-locale-safety-contract
