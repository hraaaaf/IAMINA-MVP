name: Dashboard responsive visual certification

on:
  workflow_dispatch:
  push:
    branches: [main, fix/dashboard-visual-cert-evidence-20260910]
    paths:
      - '.github/workflows/dashboard-responsive-visual-cert.yml'
      - 'tools/dashboard_capture.js'
      - 'tools/dashboard_cert_proxy.py'
      - 'frontend/lib/ui_dashboard_backend_cert_main.dart'
      - 'frontend/lib/features/dashboard/**'
      - 'frontend/lib/features/navigation/main_shell.dart'
      - 'frontend/test/dashboard_main_shell_auth_contract_test.dart'
      - 'frontend/test/features/dashboard_trend_contract_test.dart'
      - 'frontend/test/features/dashboard_responsive_convergence_contract_test.dart'

permissions:
  contents: read

jobs:
  certify-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_dashboard_visual_cert
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_dashboard_visual_cert"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: dashboard-visual-cert-nonproduction
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:7358,http://localhost:7358
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_dashboard_visual_cert
      FIREBASE_CREDENTIALS_PATH: ''
      GEMINI_API_KEY: ''
      IAMINA_CONVERSATION_NETWORK_AUTHORIZED: 'false'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Validate visual harness
        run: |
          python -m py_compile tools/dashboard_cert_proxy.py
          node --check tools/dashboard_capture.js

      - name: Start isolated PostgreSQL-backed backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py runserver 127.0.0.1:8000 >/tmp/iamina-dashboard-backend.log 2>&1 &
          echo $! >/tmp/iamina-dashboard-backend.pid
          for _ in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8000/api/docs >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat /tmp/iamina-dashboard-backend.log >&2 || true
          exit 1

      - name: Create and seed synthetic certification identity
        shell: bash
        run: |
          set -euo pipefail
          EMAIL="dashboard-visual-${GITHUB_RUN_ID}@example.invalid"
          PASSWORD='IAMINA-Dashboard-Cert-2026!Synthetic#42'
          echo "CERT_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "CERT_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          python3 - "$EMAIL" "$PASSWORD" <<'PY' >/tmp/register.json
          import json, sys
          print(json.dumps({'email':sys.argv[1],'password':sys.argv[2],'first_name':'Dashboard','last_name':'Visual'}))
          PY
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/register -H 'Content-Type: application/json' --data-binary @/tmp/register.json >/tmp/auth.json
          python3 - <<'PY'
          import json
          token=json.load(open('/tmp/auth.json')).get('access_token','')
          assert token.startswith('iamina.')
          open('/tmp/dashboard-token','w').write(token)
          PY
          TOKEN="$(cat /tmp/dashboard-token)"
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/demo/seed -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' >/tmp/demo-seed.json

      - name: Validate responsive and truthfulness contracts
        working-directory: frontend
        run: |
          flutter pub get
          flutter test --no-pub \
            test/dashboard_main_shell_auth_contract_test.dart \
            test/features/dashboard_trend_contract_test.dart \
            test/features/dashboard_responsive_convergence_contract_test.dart

      - name: Build canonical Dashboard
        working-directory: frontend
        run: |
          flutter build web --release -t lib/ui_dashboard_backend_cert_main.dart \
            --dart-define=API_BASE_URL=http://127.0.0.1:7358 \
            --dart-define=IAMINA_CERT_EMAIL="$CERT_EMAIL" \
            --dart-define=IAMINA_CERT_PASSWORD="$CERT_PASSWORD"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Capture nine distinct responsive views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dashboard-visual-cert
          STATIC_ROOT="$GITHUB_WORKSPACE/frontend/build/web" python3 tools/dashboard_cert_proxy.py >/tmp/iamina-dashboard-proxy.log 2>&1 &
          PROXY_PID=$!
          trap 'kill $PROXY_PID 2>/dev/null || true; kill $(cat /tmp/iamina-dashboard-backend.pid) 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:7358/ >/dev/null && break; sleep 1; done
          node tools/dashboard_capture.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageChops

          root = Path('dashboard-visual-cert')
          report_path = root / 'browser-report.json'
          report = json.loads(report_path.read_text())
          sizes = {'mobile': '390x844', 'tablet': '768x1024', 'desktop': '1280x900'}
          failures = []
          for name, size in sizes.items():
              images = {
                  pos: Image.open(root / f'{name}-{pos}-{size}.png').convert('RGB')
                  for pos in ('top', 'mid', 'lower')
              }
              pixel_dups = {
                  'topMid': ImageChops.difference(images['top'], images['mid']).getbbox() is None,
                  'midLower': ImageChops.difference(images['mid'], images['lower']).getbbox() is None,
                  'topLower': ImageChops.difference(images['top'], images['lower']).getbbox() is None,
              }
              report[name]['pixelDuplicateCaptures'] = pixel_dups
              if any(pixel_dups.values()):
                  failures.append(f'{name}: {pixel_dups}')
          report_path.write_text(json.dumps(report, indent=2))
          if failures:
              raise SystemExit('pixel-identical responsive captures: ' + '; '.join(failures))
          print('9/9 responsive captures are pixel-distinct')
          PY

      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-dashboard-responsive-visual-cert
          path: |
            dashboard-visual-cert/*
            /tmp/iamina-dashboard-backend.log
            /tmp/iamina-dashboard-proxy.log
          if-no-files-found: warn
          retention-days: 7
