name: D30 one-shot verified font import (isolated branch)

on:
  push:
    branches:
      - test/d30-local-reenrollment-lock-20261028
    paths:
      - .github/workflows/d30-import-fonts.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d30-font-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-licensed-fonts:
    if: github.ref == 'refs/heads/test/d30-local-reenrollment-lock-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/d30-local-reenrollment-lock-20261028
          persist-credentials: true
      - name: Fetch immutable Google Fonts assets and verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          upstream=9862abc066c9b83bf84c3e8ed1fc2d8d48f9bbf0
          root="https://raw.githubusercontent.com/google/fonts/${upstream}/ofl"
          cd frontend/assets/fonts
          curl -fLsS --retry 3 "$root/inter/Inter%5Bopsz%2Cwght%5D.ttf" -o Inter.ttf
          curl -fLsS --retry 3 "$root/intertight/InterTight%5Bwght%5D.ttf" -o InterTight.ttf
          curl -fLsS --retry 3 "$root/roboto/Roboto%5Bwdth%2Cwght%5D.ttf" -o Roboto.ttf
          curl -fLsS --retry 3 "$root/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf" -o NotoSansArabic.ttf
          curl -fLsS --retry 3 "$root/notosanssymbols/NotoSansSymbols%5Bwght%5D.ttf" -o NotoSansSymbols.ttf
          curl -fLsS --retry 3 "$root/notosanssymbols2/NotoSansSymbols2-Regular.ttf" -o NotoSansSymbols2.ttf
          cat <<'CHECKS' | sha256sum -c -
          29160a80ff49ddcab2c97711247e08b1fab27a484a329ce8b813d820dc559031  Inter.ttf
          b81b73dcb64df3c230cabade7df6c5773bf863233f24c9ee51087519f1f88b6f  InterTight.ttf
          d7598e12c5dbef095ff8272cfc55da0250bd07fbdecbac8a530b9b277872a134  Roboto.ttf
          63111b5b2e074dd48cc67692e0a2726d86ee94c1c37fe8598257b7e869e  NotoSansArabic.ttf
          f7e7e04b4a24b6c78893d50cbfd2b2f6cae49617ab047bfef668d252adb128f7  NotoSansSymbols.ttf
          7d5fb73b7ca67a6798101741f5d280a3d016a56a197afcd4199dbb57b4b82a21  NotoSansSymbols2.ttf
          CHECKS
      - name: Commit verified binary assets to isolated D30 branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontend/assets/fonts/*.ttf
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'D30 font assets already match verified upstream'
            exit 0
          fi
          git commit -m "fix(D30): import byte-verified OFL fonts for offline Web"
          git push origin HEAD:test/d30-local-reenrollment-lock-20261028
