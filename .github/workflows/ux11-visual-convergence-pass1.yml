name: UX-11 visual convergence pass 1

on:
  push:
    branches: [ux/11-dashboard-action-parity]
    paths:
      - .github/workflows/ux11-visual-convergence-pass1.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/11-dashboard-action-parity
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply mockup convergence pass
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('frontend/lib/features/dashboard/dashboard_convergent_screen.dart')
          s = p.read_text()

          replacements = {
            "SliverPadding(\n              padding: const EdgeInsetsDirectional.fromSTEB(18, 10, 18, 118),": "SliverPadding(\n              padding: const EdgeInsetsDirectional.fromSTEB(18, 8, 18, 98),",
            "const SizedBox(height: 22),\n                  Row(": "const SizedBox(height: 20),\n                  Row(",
            "const SizedBox(height: 15),\n                  _GlucoseHero(": "const SizedBox(height: 12),\n                  _GlucoseHero(",
            "const SizedBox(height: 14),\n                  _TrendsPanel(": "const SizedBox(height: 10),\n                  _TrendsPanel(",
            "const SizedBox(height: 18),\n                  Text(": "const SizedBox(height: 14),\n                  Text(",
            "fontSize: 15,\n                      fontWeight: FontWeight.w800,": "fontSize: 14,\n                      fontWeight: FontWeight.w800,",
            "const SizedBox(height: 9),\n                  const _QuickActionsRow(),": "const SizedBox(height: 8),\n                  const _QuickActionsRow(),",
            "const SizedBox(height: 26),\n                  _DetailedTrendCard(": "const SizedBox(height: 22),\n                  _DetailedTrendCard(",
            "width: 46,\n          height: 46,\n          child: CustomPaint(painter: _SealPainter()),": "width: 40,\n          height: 40,\n          child: CustomPaint(painter: _SealPainter()),",
            "const SizedBox(width: 11),": "const SizedBox(width: 10),",
            "fontSize: 24,\n                  height: 1,": "fontSize: 25,\n                  height: 1,",
            "l10n.appTagline,": "_t(context, 'Votre santé, notre mission', 'Your health, our mission', 'صحتك، مهمتنا'),",
            "fontSize: 10.5,\n                  fontWeight: FontWeight.w600,": "fontSize: 10,\n                  fontWeight: FontWeight.w600,",
            "key: const ValueKey('dashboard-import-action'),\n            onTap: () => GoRouter.of(context).go('/importer'),": "key: const ValueKey('dashboard-reminders-action'),\n            onTap: () => GoRouter.of(context).go('/reminders'),",
            "child: SizedBox(\n              width: 46,\n              height: 46,\n              child: Icon(\n                Icons.upload_file_outlined,\n                size: 21,": "child: SizedBox(\n              width: 42,\n              height: 42,\n              child: Stack(\n                clipBehavior: Clip.none,\n                children: [\n                  const Center(\n                    child: Icon(\n                      Icons.notifications_none_rounded,\n                      size: 21,\n                      color: Color(0xFF064E52),\n                    ),\n                  ),\n                  PositionedDirectional(\n                    top: 7,\n                    end: 7,\n                    child: Container(\n                      width: 7,\n                      height: 7,\n                      decoration: const BoxDecoration(\n                        color: Color(0xFF35C78A),\n                        shape: BoxShape.circle,\n                      ),\n                    ),\n                  ),\n                ],\n              ),\n              /* visual parity bell */\n              // ignore: dead_code\n              child: Icon(\n                Icons.notifications_none_rounded,\n                size: 21,",
          }

          # The previous replacement creates a duplicate child if applied literally; handle brand action as a block first.
          old_action = """        Material(\n          color: AminaTheme.surface(context),\n          shape: const CircleBorder(),\n          child: InkWell(\n            key: const ValueKey('dashboard-import-action'),\n            onTap: () => GoRouter.of(context).go('/importer'),\n            customBorder: const CircleBorder(),\n            child: SizedBox(\n              width: 46,\n              height: 46,\n              child: Icon(\n                Icons.upload_file_outlined,\n                size: 21,\n                color: AminaTheme.textPrimary(context),\n              ),\n            ),\n          ),\n        ),"""
          new_action = """        Material(\n          color: AminaTheme.surface(context),\n          shape: const CircleBorder(),\n          child: InkWell(\n            key: const ValueKey('dashboard-reminders-action'),\n            onTap: () => GoRouter.of(context).go('/reminders'),\n            customBorder: const CircleBorder(),\n            child: SizedBox(\n              width: 42,\n              height: 42,\n              child: Stack(\n                clipBehavior: Clip.none,\n                children: [\n                  const Center(\n                    child: Icon(\n                      Icons.notifications_none_rounded,\n                      size: 21,\n                      color: Color(0xFF064E52),\n                    ),\n                  ),\n                  PositionedDirectional(\n                    top: 7,\n                    end: 7,\n                    child: Container(\n                      width: 7,\n                      height: 7,\n                      decoration: const BoxDecoration(\n                        color: Color(0xFF35C78A),\n                        shape: BoxShape.circle,\n                      ),\n                    ),\n                  ),\n                ],\n              ),\n            ),\n          ),\n        ),"""
          if old_action not in s:
            raise SystemExit('brand action block not found')
          s = s.replace(old_action, new_action)

          # Apply safe scalar replacements.
          for old, new in list(replacements.items())[:15]:
            if old in s:
              s = s.replace(old, new, 1)

          scalar = [
            ("padding: const EdgeInsets.fromLTRB(18, 17, 18, 15),", "padding: const EdgeInsets.fromLTRB(16, 13, 16, 11),"),
            ("borderRadius: BorderRadius.circular(22),", "borderRadius: BorderRadius.circular(20),", 1),
            ("width: 38,\n                height: 38,", "width: 34,\n                height: 34,"),
            ("size: 19,", "size: 17,"),
            ("const SizedBox(width: 10),", "const SizedBox(width: 9),", 1),
            ("fontSize: 12.5,\n                        fontWeight: FontWeight.w800,", "fontSize: 12,\n                        fontWeight: FontWeight.w800,"),
            ("fontSize: 10.5,", "fontSize: 9.8,", 1),
            ("const SizedBox(height: 16),", "const SizedBox(height: 9),", 1),
            ("fontSize: 49,", "fontSize: 45,"),
            ("const SizedBox(height: 10),\n                    Container(", "const SizedBox(height: 7),\n                    Container("),
            ("horizontal: 11,\n                        vertical: 7,", "horizontal: 10,\n                        vertical: 5,"),
            ("fontSize: 11,\n                          fontWeight: FontWeight.w800,", "fontSize: 10.5,\n                          fontWeight: FontWeight.w800,"),
            ("const SizedBox(width: 12),", "const SizedBox(width: 10),", 1),
            ("height: 112,", "height: 82,"),
            ("const SizedBox(height: 14),\n          InkWell(", "const SizedBox(height: 9),\n          InkWell("),
            ("padding: const EdgeInsets.symmetric(horizontal: 13, vertical: 10),", "padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),"),
            ("fontSize: 10.2,", "fontSize: 9.5,"),
            ("padding: const EdgeInsets.fromLTRB(16, 14, 16, 14),", "padding: const EdgeInsets.fromLTRB(14, 11, 14, 11),"),
            ("borderRadius: BorderRadius.circular(20),", "borderRadius: BorderRadius.circular(18),", 1),
            ("const SizedBox(height: 2),", "const SizedBox(height: 0),"),
            ("const SizedBox(height: 13),", "const SizedBox(height: 9),"),
            ("padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 10),", "padding: const EdgeInsets.symmetric(horizontal: 11, vertical: 8),"),
            ("width: 34,\n                    height: 34,", "width: 30,\n                    height: 30,"),
            ("size: 17,", "size: 16,", 1),
            ("fontSize: 10.3,", "fontSize: 9.4,"),
            ("width: 34,\n            height: 34,", "width: 30,\n            height: 30,"),
            ("child: Icon(icon, size: 17,", "child: Icon(icon, size: 16,"),
            ("const SizedBox(height: 7),", "const SizedBox(height: 5),", 1),
            ("fontSize: 9.5,", "fontSize: 8.9,", 1),
            ("fontSize: 23,", "fontSize: 21,"),
            ("width: 48,\n                    height: 48,", "width: 46,\n                    height: 46,"),
            ("borderRadius: BorderRadius.circular(15),", "borderRadius: BorderRadius.circular(14),", 2),
            ("size: 20,\n                      color: const Color(0xFF064E52),", "size: 21,\n                      color: const Color(0xFF064E52),"),
            ("const SizedBox(height: 6),", "const SizedBox(height: 5),", 1),
            ("fontSize: 8.8,", "fontSize: 8.5,"),
          ]
          for item in scalar:
            old, new = item[0], item[1]
            count = item[2] if len(item) > 2 else 0
            if old not in s:
              raise SystemExit(f'missing scalar: {old!r}')
            s = s.replace(old, new, count) if count else s.replace(old, new)

          # Replace the seal with a denser square-kufic mark closer to the approved mockup.
          start = s.index('class _SealPainter extends CustomPainter {')
          end = s.index('class _ConvergentState extends StatelessWidget {')
          new_seal = r'''class _SealPainter extends CustomPainter {
  const _SealPainter();

  @override
  void paint(Canvas canvas, Size size) {
    final teal = Paint()..color = const Color(0xFF075A5D);
    final mint = Paint()..color = const Color(0xFF27B984);
    final cell = size.width / 7;
    final blocks = <(int, int, int, int)>[
      (0,0,3,1),(0,0,1,3),(2,1,1,2),(4,0,3,1),(6,0,1,3),(4,2,2,1),
      (0,4,1,3),(0,6,3,1),(2,4,1,2),(4,4,3,1),(4,6,3,1),(6,4,1,3),
      (1,3,2,1),(3,1,1,2),(3,4,1,2),(4,3,2,1),(1,5,1,1),(5,5,1,1),
    ];
    for (final b in blocks) {
      canvas.drawRect(
        Rect.fromLTWH(b.$1*cell, b.$2*cell, b.$3*cell, b.$4*cell),
        teal,
      );
    }
    canvas.drawRect(Rect.fromLTWH(3*cell, 3*cell, cell, cell), mint);
    canvas.drawRect(Rect.fromLTWH(5*cell, 1*cell, cell, cell), mint);
    canvas.drawRect(Rect.fromLTWH(1*cell, 4*cell, cell, cell), mint);
  }

  @override
  bool shouldRepaint(covariant CustomPainter oldDelegate) => false;
}

'''
          s = s[:start] + new_seal + s[end:]
          p.write_text(s)

          p = Path('frontend/lib/features/navigation/main_shell.dart')
          s = p.read_text()
          nav_replacements = [
            ("minimum: EdgeInsets.symmetric(horizontal: 12).copyWith(bottom: 10),", "minimum: EdgeInsets.symmetric(horizontal: 18).copyWith(bottom: 6),"),
            ("height: 92,", "height: 72,"),
            ("top: 20,", "top: 12,"),
            ("height: 72,", "height: 60,", 1),
            ("borderRadius: BorderRadius.circular(28),", "borderRadius: BorderRadius.circular(24),", 2),
            ("top: 8,", "top: 6,"),
            ("height: 56,", "height: 46,"),
            ("borderRadius: BorderRadius.circular(22),", "borderRadius: BorderRadius.circular(18),", 1),
            ("end: index == 1 ? 22 : 0,", "end: index == 1 ? 18 : 0,"),
            ("start: index == 2 ? 22 : 0,", "start: index == 2 ? 18 : 0,"),
            ("width: 52,", "width: 48,"),
            ("height: 52,", "height: 48,"),
            ("width: 5,", "width: 4,"),
            ("size: 27,", "size: 28,"),
            ("height: 72,", "height: 60,"),
            ("size: 20,", "size: 19,", 1),
            ("const SizedBox(height: 4),", "const SizedBox(height: 3),", 1),
            ("fontSize: 9.2,", "fontSize: 8.8,"),
          ]
          for item in nav_replacements:
            old, new = item[0], item[1]
            count = item[2] if len(item) > 2 else 0
            if old not in s:
              raise SystemExit(f'missing nav scalar: {old!r}')
            s = s.replace(old, new, count) if count else s.replace(old, new)
          p.write_text(s)

          p = Path('frontend/lib/modules/diabetes_module.dart')
          s = p.read_text()
          s = s.replace('icon: Icons.monitor_heart_outlined,\n      selectedIcon: Icons.monitor_heart_rounded,', 'icon: Icons.show_chart_rounded,\n      selectedIcon: Icons.show_chart_rounded,')
          s = s.replace('icon: Icons.insert_chart_outlined_rounded,\n      selectedIcon: Icons.insert_chart_rounded,', 'icon: Icons.description_outlined,\n      selectedIcon: Icons.description_rounded,')
          p.write_text(s)
          PY

      - name: Format changed Dart files
        run: dart format frontend/lib/features/dashboard/dashboard_convergent_screen.dart frontend/lib/features/navigation/main_shell.dart frontend/lib/modules/diabetes_module.dart

      - name: Validate frontend
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Commit convergence pass
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/lib/features/dashboard/dashboard_convergent_screen.dart frontend/lib/features/navigation/main_shell.dart frontend/lib/modules/diabetes_module.dart
          git commit -m 'feat(ux): converge dashboard proportions to approved mockup'
          git push origin HEAD:ux/11-dashboard-action-parity
