name: FRUG-5 bounded live Companion comparison

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/evaluation/frug5_companion_benchmark.py"
      - "backend/evaluation/tests/test_frug5_companion_benchmark.py"
      - "backend/evaluation/fixtures/frug7_groq_text_price.json"
      - ".github/workflows/frug5-live-companion-evidence.yml"

permissions:
  contents: read

concurrency:
  group: frug5-live-companion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Groq GPT-OSS paired 1800-vs-3000 synthetic comparison
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: frug5-benchmark-nonproduction
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///frug5-benchmark.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      FRUG5_NETWORK_AUTHORIZED: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Validate FRUG-5 benchmark contracts before network
        run: >-
          pytest -q
          evaluation/tests/test_frug5_companion_benchmark.py
          llm/tests/test_cost_metrics.py
      - name: Run one bounded live synthetic paired comparison
        run: >-
          python manage.py shell -c
          "from datetime import date; from pathlib import Path;
          import evaluation.frug5_companion_benchmark as b;
          original=b.companion_cases;
          b.companion_cases=lambda: tuple(c for c in original() if c.case_id != 'llm-darija-routine');
          b.run_benchmark(output_path=Path('../artifacts/frug5-live-companion.json'), today=date.today())"
      - name: Upload FRUG-5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frug5-live-companion
          path: artifacts/frug5-live-companion.json
          if-no-files-found: warn
          retention-days: 14
