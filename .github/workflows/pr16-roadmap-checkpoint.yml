name: PR16 roadmap checkpoint

on:
  push:
    branches:
      - feat/p0-mena-locale-safety-contract

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-locale-safety-contract
      - name: Update canonical roadmap
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/ROADMAP.md')
          text = path.read_text()
          replacements = {
              '> **Last updated:** 2026-07-30 — P0-MENA-2A and 2B implemented and validated in draft PR #16.': '> **Last updated:** 2026-07-30 — P0-MENA-2 automated scope implemented and validated through emergency registry and safety-corpus gates in draft PR #16.',
              '| P0-MENA-2 — locale + safety contract | 38% | 🟡 In progress | Canonical model, confirmation API and deterministic fallback implemented in PR #16 |': '| P0-MENA-2 — locale + safety contract | 50% | 🟡 Human review blocked | 4 of 8 tasks closed; native-speaker corpus approval and full RTL screen audit remain open |',
              '**MENA critical-path completion:** 15 of 41 explicit roadmap tasks closed, approximately **37%**.': '**MENA critical-path completion:** 16 of 41 explicit roadmap tasks closed, approximately **39%**.',
              '- [ ] Configure country-specific emergency resources with source/date ownership.': '- [x] Configure country-specific emergency resources with source/date ownership. **Morocco registry is versioned, confirmed-country-only and fails closed when absent or stale.**',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing roadmap anchor: {old}')
              text = text.replace(old, new, 1)
          additions = '''- **2C — Flutter locale/RTL foundation:** the application locale comes only from the confirmed server-resolved UI language, supports French/English/Arabic, defaults deterministically to French, and proves Arabic RTL directionality. Full screen-by-screen RTL coverage remains open.\n- **2D — emergency-resource registry:** Morocco contacts are stored with source ownership, verification/review dates and confirmed-country-only selection; absent, unknown or stale configuration fails closed.\n- **2E — automated corpus groundwork:** executable high-severity glycemic cases cover baseline languages, Darija Arabic script, Latin transliteration, mixed-language text and voice transcripts. Automated parity is green, but every locale remains `pending_native_review`; no native approval is claimed.\n'''
          anchor = '- **2C — runtime fallback wiring:** text and voice resolve only confirmed settings; historical silent Darija defaults are removed. RTL/rendering completion remains active.\n'
          if additions not in text:
              if anchor not in text:
                  raise SystemExit('checkpoint anchor missing')
              text = text.replace(anchor, anchor + additions, 1)
          path.write_text(text)
          PY
      - name: Commit roadmap checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ROADMAP.md
          git commit -m "docs(roadmap): record locale safety automated checkpoint"
          git push origin HEAD:feat/p0-mena-locale-safety-contract
