name: V1-01 edit glucose unit switch visual proof

on:
  pull_request:
    paths:
      - 'frontend/lib/features/journal/edit_log_screen.dart'
      - 'frontend/lib/features/dashboard/widgets/add_log_sheet.dart'
      - 'frontend/lib/core/utils/glucose_formatter.dart'
      - 'frontend/test/v1_01_unit_switch_visual_proof_test.dart'
      - '.github/workflows/ui-v1-01-edit-unit-switch-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-switch-before-after:
    name: Edit unit real widget 390 + 768 before/after
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact candidate HEAD and baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e a1ee4175b295cffe9514980975263c7637b0f5e2^{commit}
          git merge-base --is-ancestor a1ee4175b295cffe9514980975263c7637b0f5e2 HEAD
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Install Flutter packages
        working-directory: frontend
        run: flutter pub get
      - name: BEFORE — baseline product, current visual fixture
        shell: bash
        run: |
          set -euo pipefail
          for file in             frontend/lib/core/utils/glucose_formatter.dart             frontend/lib/features/journal/edit_log_screen.dart             frontend/lib/features/dashboard/widgets/add_log_sheet.dart; do
            git show "a1ee4175b295cffe9514980975263c7637b0f5e2:$file" > "$file"
          done
          cd frontend
          IAMINA_V101_PROOF_DIR="$GITHUB_WORKSPACE/v1-01-edit-unit-proof"             flutter test --no-pub --dart-define=V1_01_UNIT_PHASE=before             test/v1_01_unit_switch_visual_proof_test.dart
      - name: AFTER — restore and capture exact candidate HEAD
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --             frontend/lib/core/utils/glucose_formatter.dart             frontend/lib/features/journal/edit_log_screen.dart             frontend/lib/features/dashboard/widgets/add_log_sheet.dart
          cd frontend
          IAMINA_V101_PROOF_DIR="$GITHUB_WORKSPACE/v1-01-edit-unit-proof"             flutter test --no-pub --dart-define=V1_01_UNIT_PHASE=after             test/v1_01_unit_switch_visual_proof_test.dart
      - name: Check screenshot pair integrity
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, struct
          folder = pathlib.Path('v1-01-edit-unit-proof')
          for width, height in [(390, 844), (768, 1024)]:
              images = []
              for phase in ('before', 'after'):
                  path = folder / f'{phase}-edit-unit-switch-{width}x{height}.png'
                  data = path.read_bytes()
                  assert data[:8] == b'\x89PNG\r\n\x1a\n', path
                  got_width, got_height = struct.unpack('>II', data[16:24])
                  assert (got_width, got_height) == (width, height), (
                      path, got_width, got_height
                  )
                  assert len(data) > 5000
                  print(path, len(data), hashlib.sha256(data).hexdigest())
                  images.append(data)
              assert images[0] != images[1], f'Identical BEFORE/AFTER at {width}'
          PY
      - name: Upload real Flutter screenshots and source-comparable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-v1-01-edit-unit-switch-before-after-390-768
          path: v1-01-edit-unit-proof/*.png
          retention-days: 21
          if-no-files-found: warn
