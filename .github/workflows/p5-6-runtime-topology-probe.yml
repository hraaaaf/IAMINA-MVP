name: P5-6 runtime topology probe

on:
  push:
    branches:
      - ops/p5-6-runtime-topology-probe-20260913

permissions:
  contents: read
  issues: write

env:
  VERCEL_ORG_ID: team_NNhXPDOIfjGNBcn253btpyk0
  VERCEL_PROJECT_ID: prj_Pn9FnyconF3h2w9gOU74iV98kJoU
  FROZEN_RUNTIME_SHA: 5b27a22fc5c05a06e7eeeb0e841bb0e7dadce7f6

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Vercel environment metadata only
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          code="$(curl -sS -o /tmp/envs.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID")"
          test "$code" = "200"
          python - <<'PY'
          import json
          keys = ['DATABASE_URL','REDIS_URL','ENABLE_FIREBASE_MIGRATION','FIREBASE_CREDENTIALS_PATH','FIREBASE_STORAGE_BUCKET','FIREBASE_CREDENTIALS_JSON','EMAIL_BACKEND','EMAIL_HOST','EMAIL_PORT','EMAIL_HOST_USER','EMAIL_HOST_PASSWORD','DEFAULT_FROM_EMAIL']
          envs = json.load(open('/tmp/envs.json')).get('envs', [])
          by_key = {}
          for item in envs:
              key = item.get('key')
              if key not in keys:
                  continue
              target = item.get('target', [])
              targets = [target] if isinstance(target, str) else list(target or [])
              record = by_key.setdefault(key, {'targets': set(), 'types': set()})
              record['targets'].update(targets)
              if item.get('type'):
                  record['types'].add(item['type'])
          lines = []
          for key in keys:
              record = by_key.get(key)
              if not record:
                  lines.append(f'- `{key}`: absent')
              else:
                  targets = ','.join(sorted(record['targets'])) or 'none'
                  types = ','.join(sorted(record['types'])) or 'unknown'
                  lines.append(f'- `{key}`: present; targets={targets}; type={types}')
          open('/tmp/topology.txt', 'w').write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Retain sanitized topology evidence on issue 320
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          lines = open('/tmp/topology.txt').read().rstrip()
          body = '\n'.join(['P5-6B runtime environment metadata probe - sanitized, values never emitted.', '', f'Frozen runtime candidate: `{os.environ["FROZEN_RUNTIME_SHA"]}`', f'Probe control commit: `{os.environ["GITHUB_SHA"]}`', '', lines, '', 'Interpretation limits: this proves only Vercel environment-key presence/targets, not vendor contract, legal basis, data residency, processor approval, or functional delivery. Real-patient release remains unauthorized.'])
          open('/tmp/comment.json', 'w').write(json.dumps({'body': body}))
          PY
          code="$(curl -sS -o /tmp/comment-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/comment.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/320/comments")"
          echo "issue_comment_http=$code"
          test "$code" = "201"
