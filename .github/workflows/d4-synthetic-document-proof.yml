name: D4 synthetic PDF and CSV JSON proof (no deploy)

on:
  pull_request:
    paths:
      - '.github/workflows/d4-synthetic-document-proof.yml'
      - 'frontend/lib/services/synthetic_doctor_report.dart'
      - 'frontend/lib/services/synthetic_report_formatter.dart'
      - 'frontend/test/services/synthetic_doctor_report_test.dart'
      - 'frontend/test/services/synthetic_report_formatter_test.dart'
      - 'frontend/tool/d4_generate_synthetic_pdf.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only-documents:
    name: D4 offline doctor PDF FR EN AR and safe CSV JSON
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Flutter pinned SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Resolve and test pure synthetic contracts
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test --no-pub test/services/synthetic_report_formatter_test.dart test/services/synthetic_doctor_report_test.dart
      - name: Print offline synthetic HTML to FR EN AR PDFs with Chromium
        working-directory: frontend
        run: dart run tool/d4_generate_synthetic_pdf.dart
      - name: Install Poppler PDF verification tools on the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Render real PDFs and prove nonblank glyph pages
        working-directory: frontend
        run: |
          set -euo pipefail
          command -v pdftoppm >/dev/null || { echo "poppler pdftoppm required"; exit 1; }
          command -v pdftotext >/dev/null || { echo "poppler pdftotext required"; exit 1; }
          command -v pdffonts >/dev/null || { echo "poppler pdffonts required"; exit 1; }
          for variant in "" "-MAX"; do
            for locale in fr en ar; do
              name="D4-SYNTHETIC${variant}-${locale}"
              path="build/d4-synthetic-proof/${name}.pdf"
              txt="build/d4-synthetic-proof/${name}.txt"
              test -s "$path"
              test "$(pdfinfo "$path" | awk '/^Pages:/ {print $2}')" = "1"
              pdfinfo "$path" | grep -Fq '(A4)'
              pdffonts "$path" | grep -q 'Inter'
              if [ "$locale" = ar ]; then pdffonts "$path" | grep -q 'NotoSansArabic'; fi
              pdftotext "$path" "$txt"
              if [ "$variant" = "-MAX" ]; then grep -q '121' "$txt"; else grep -q '142' "$txt"; fi
              if [ "$locale" = fr ]; then grep -q 'NON CLINIQUE' "$txt"; fi
              if [ "$locale" = en ]; then grep -q 'NOT FOR CLINICAL USE' "$txt"; fi
              if [ "$locale" = ar ]; then grep -q 'بيانات' "$txt"; fi
              pdftoppm -f 1 -l 1 -singlefile -scale-to 1400 -png "$path" "build/d4-synthetic-proof/${name}"
              test -s "build/d4-synthetic-proof/${name}.png"
            done
          done
          python3 - <<'PY'
          import glob
          import os
          import struct
          import zlib
          from pathlib import Path
          for filename in glob.glob('build/d4-synthetic-proof/*.png'):
              data = Path(filename).read_bytes()
              assert data[:8] == bytes([137,80,78,71,13,10,26,10])
              width, height = struct.unpack('>II', data[16:24])
              assert width >= 850 and height >= 1100, (filename,width,height)
              assert len(data) > 10000, (filename,len(data))
              print('PDF_RENDER_OK', filename, width, height, len(data))
          assert len(glob.glob('build/d4-synthetic-proof/*.png')) == 6
          PY
      - name: Upload synthetic-only PDF and visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d4-synthetic-only-doctor-pdf-fr-en-ar
          path: |
            frontend/build/d4-synthetic-proof/*.pdf
            frontend/build/d4-synthetic-proof/*.png
            frontend/build/d4-synthetic-proof/*.txt
            frontend/build/d4-synthetic-proof/*.html
          retention-days: 14
          if-no-files-found: warn
