name: D4 synthetic PDF and CSV JSON proof (no deploy)

on:
  pull_request:
    paths:
      - '.github/workflows/d4-synthetic-document-proof.yml'
      - 'frontend/lib/services/synthetic_doctor_report.dart'
      - 'frontend/lib/services/synthetic_report_formatter.dart'
      - 'frontend/test/services/synthetic_doctor_report_test.dart'
      - 'frontend/test/services/synthetic_report_formatter_test.dart'
      - 'frontend/tool/d4_generate_synthetic_pdf.dart'
      - 'frontend/tool/d4_reprint_arabic_pdf_ua.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only-documents:
    name: D4 offline doctor PDF FR EN AR and safe CSV JSON
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Flutter pinned SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: CAL-12 source guard - patient Reports export stays disabled
        working-directory: frontend
        run: |
          set -euo pipefail
          for file in lib/features/journal/reports_screen.dart lib/features/journal/reports_screen_presentation.dart; do
            if grep -En 'synthetic_doctor_report|synthetic_report_formatter|SyntheticDoctorReport|SyntheticReportFormatter|SyntheticDoctorHtml|LocalReportPdf|share_plus|Printing[.]layoutPdf|Share[.]share' "$file"; then
              echo "CAL12 FAIL: unauthorized patient Reports export integration in $file"
              exit 1
            fi
          done
          echo CAL12_PATIENT_REPORT_EXPORT_OFF

      - name: Resolve and test pure synthetic contracts
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test --no-pub test/services/synthetic_report_formatter_test.dart test/services/synthetic_doctor_report_test.dart
      - name: Print offline synthetic HTML to FR EN AR PDFs with Chromium
        working-directory: frontend
        run: dart run tool/d4_generate_synthetic_pdf.dart
      - name: Print tagged text-faithful Arabic PDF in a CI-only sandbox
        working-directory: frontend
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-core libpango-1.0-0
          python3 -m venv /tmp/d4-arabic-pdf-venv
          /tmp/d4-arabic-pdf-venv/bin/python -m pip install --disable-pip-version-check 'weasyprint==68.0'
          /tmp/d4-arabic-pdf-venv/bin/python tool/d4_reprint_arabic_pdf_ua.py
      - name: Install Poppler PDF verification tools on the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Render real PDFs and prove nonblank glyph pages
        working-directory: frontend
        run: |
          set -euo pipefail
          command -v pdftoppm >/dev/null || { echo "poppler pdftoppm required"; exit 1; }
          command -v pdftotext >/dev/null || { echo "poppler pdftotext required"; exit 1; }
          command -v pdffonts >/dev/null || { echo "poppler pdffonts required"; exit 1; }
          for variant in "" "-MAX"; do
            for locale in fr en ar; do
              name="D4-SYNTHETIC${variant}-${locale}"
              path="build/d4-synthetic-proof/${name}.pdf"
              txt="build/d4-synthetic-proof/${name}.txt"
              test -s "$path"
              test "$(pdfinfo "$path" | awk '/^Pages:/ {print $2}')" = "1"
              pdfinfo "$path" | grep -Fq '(A4)'
              pdffonts "$path" | grep -q 'Inter'
              if [ "$locale" = ar ]; then
                pdffonts "$path" | grep -q 'D4Naskh'
                pdfinfo "$path" | grep -Eq '^Tagged:[[:space:]]+yes$'
              fi
              pdftotext "$path" "$txt"
              if [ "$variant" = "-MAX" ]; then grep -q '121' "$txt"; else grep -q '142' "$txt"; fi
              if [ "$locale" = fr ]; then grep -q 'NON CLINIQUE' "$txt"; fi
              if [ "$locale" = en ]; then grep -q 'NOT FOR CLINICAL USE' "$txt"; fi
              if [ "$locale" = ar ]; then
                grep -Fq 'تقرير متابعة' "$txt"
                grep -Fq 'بيانات تجريبية فقط' "$txt"
                grep -Fq 'غير صالحة للاستخدام الطبي' "$txt"
                grep -Fq 'تاريخ الإنشاء' "$txt"
                grep -Fq 'قياسات يدوية تجريبية' "$txt"
                grep -Fq 'لا توجد حسابات أو أهداف أو تشخيصات طبية' "$txt"
                if grep -Fq 'تقرير مت ابعة' "$txt"; then
                  echo "CAL-12: Arabic PDF text split is not acceptable"
                  exit 1
                fi
              fi
              pdftoppm -f 1 -l 1 -singlefile -scale-to 1400 -png "$path" "build/d4-synthetic-proof/${name}"
              test -s "build/d4-synthetic-proof/${name}.png"
            done
          done
          python3 - <<'PY'
          import glob
          import os
          import struct
          import zlib
          from pathlib import Path
          for filename in glob.glob('build/d4-synthetic-proof/*.png'):
              data = Path(filename).read_bytes()
              assert data[:8] == bytes([137,80,78,71,13,10,26,10])
              width, height = struct.unpack('>II', data[16:24])
              assert width >= 850 and height >= 1100, (filename,width,height)
              assert len(data) > 10000, (filename,len(data))
              print('PDF_RENDER_OK', filename, width, height, len(data))
          assert len(glob.glob('build/d4-synthetic-proof/*.png')) == 6
          PY
      - name: CAL-12 synthetic HTML isolation and no-egress proof
        working-directory: frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('build/d4-synthetic-proof')
          pages = sorted(root.glob('D4-SYNTHETIC*.html'))
          assert len(pages) == 6, f'expected six synthetic HTML proofs, got {len(pages)}'
          dangerous = re.compile(
              r'https?://|javascript:|data:|<script\b|<iframe\b|<object\b'
              r'|<embed\b|<form\b|@import\b|on(?:load|click|error)\s*=',
              re.I,
          )
          assert dangerous.search('<script>') is not None
          assert dangerous.search('https://example.invalid') is not None
          for path in pages:
              source = path.read_text(encoding='utf-8')
              locale = path.stem.rsplit('-', 1)[1]
              density = '-MAX-' in path.name
              expected_rows = 13 if density else 4  # table header + 12 or 3
              assert locale in ('fr', 'en', 'ar'), path
              direction = 'rtl' if locale == 'ar' else 'ltr'
              assert f'<html lang="{locale}" dir="{direction}">' in source, path
              assert source.count('<tr>') == expected_rows, path
              assert source.count('N/A') >= 2, path
              assert '2026-11-09T18:00:00.000Z' in source, path
              assert 'unicode-bidi:isolate' in source, path
              assert 'patient_id' not in source.lower(), path
              assert dangerous.search(source) is None, path
              assert '../../assets/fonts/Inter.ttf' in source, path
              assert '../../assets/fonts/NotoSansArabic.ttf' in source, path
              warning = {
                  'fr': 'DONNÉES SYNTHÉTIQUES UNIQUEMENT - NON CLINIQUE',
                  'en': 'SYNTHETIC ONLY - NOT FOR CLINICAL USE',
                  'ar': 'بيانات تجريبية فقط - غير صالحة للاستخدام الطبي',
              }[locale]
              assert warning in source, path
              print('CAL12_SYNTHETIC_HTML_ISOLATION_PASS', path.name)
          PY

      - name: Upload synthetic-only PDF and visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d4-synthetic-only-doctor-pdf-fr-en-ar
          path: |
            frontend/build/d4-synthetic-proof/*.pdf
            frontend/build/d4-synthetic-proof/*.png
            frontend/build/d4-synthetic-proof/*.txt
            frontend/build/d4-synthetic-proof/*.html
          retention-days: 14
          if-no-files-found: warn
