name: UX9 roadmap closeout helper

on:
  push:
    branches: [docs/ux9-dashboard-closeout]
    paths: [.github/workflows/ux9-roadmap-closeout.yml]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ux9-dashboard-closeout

      - name: Update canonical ROADMAP
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/ROADMAP.md')
          text = path.read_text()
          lines = text.splitlines()

          updated_header = False
          updated_row = False
          for i, line in enumerate(lines):
              if line.startswith('> **Last updated:**'):
                  lines[i] = '> **Last updated:** 2026-08-11 — UX visual rebase is closed through UX-9: UX-9 recomposed the populated Dashboard around a brand-led header, truthful latest-reading hero and compact mobile trends at 9.5/10; PR #101 merged as `662b6ce80695846e28788452ddc165e6ad9c8d07` and post-merge CI #1537 + drift #1349 are green.'
                  updated_header = True
              elif line.startswith('| UX visual rebase |'):
                  lines[i] = '| UX visual rebase | 100% | ✅ Closed | UX-0–8 remain closed; UX-9 PR #101 recomposed the populated Dashboard at **9.5/10** (merge `662b6ce80695846e28788452ddc165e6ad9c8d07`); post-merge CI #1537 + drift #1349 green |'
                  updated_row = True

          if not updated_header or not updated_row:
              raise SystemExit('ROADMAP anchors not found')

          text = '\n'.join(lines) + '\n'
          marker = '\nPreparation work does not close a live benchmark'
          closeout = (
              '\n**UX-9 closeout:** PR #101 recomposed the populated Dashboard without changing clinical calculations, persistence, routes, sync semantics, consent or AI safety behavior. '
              'Mobile now leads with IAmina identity, greeting/context, a truthful latest-reading hero with a real persisted-data sparkline, and one compact TIR/GMI/CV trends surface; desktop retains the detailed analytical cards. '
              'Fresh rendered audit run `31486722900` succeeded with artifact `9099498470`, digest `sha256:24571edfab9a10e3cce9a3d91f33c7596fc444f1a5e3dd7fe924f8ad723bd0a8`, six FR/AR captures across 390×844, 360×560 and 1440×1000, exactly one `flutter-view`, zero page errors and Product/UX **9.5/10**. '
              'Exact product head `a3684d03099e4502f0a2fdee1c63f0ea42a960df` passed CI #1536 / run `31487182393` and migration drift #1348 / run `31487182456`; PR #101 merged as `662b6ce80695846e28788452ddc165e6ad9c8d07`; post-merge CI #1537 / run `31487410893` and migration drift #1349 / run `31487410839` both passed. '
              '**UX-9 is 100% closed.** This UX work does not change the MENA critical-path numerator.\n'
          )
          if marker not in text:
              raise SystemExit('Preparation-work anchor not found')
          text = text.replace(marker, closeout + marker, 1)
          path.write_text(text)
          PY

          git diff --check
          git config user.name "hraaaaf"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git add docs/ROADMAP.md
          git commit -m "docs(ux): close UX-9 roadmap"
          git push origin HEAD:docs/ux9-dashboard-closeout
