name: Dashboard locale normalization fix

on:
  push:
    branches: [audit/dashboard-global-cert-20260909]
    paths:
      - '.github/workflows/dashboard-locale-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Normalize Dashboard date locale and add contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/lib/features/dashboard/dashboard_premium_screen.dart')
          s=p.read_text()
          old="""String _t(BuildContext context, String fr, String en, String ar) {\n  final code = Localizations.localeOf(context).languageCode;\n  if (code == 'ar') return ar;\n  if (code == 'en') return en;\n  return fr;\n}\n\n"""
          new=old+"""String _dashboardDateLocale(BuildContext context) {\n  final locale = Localizations.localeOf(context);\n  return switch (locale.languageCode) {\n    'fr' => 'fr_FR',\n    'ar' => 'ar_MA',\n    'en' => 'en_US',\n    _ => locale.toLanguageTag(),\n  };\n}\n\n"""
          if '_dashboardDateLocale' not in s:
              assert old in s, 'translation helper anchor not found'
              s=s.replace(old,new,1)
          s=s.replace("final locale = Localizations.localeOf(context).toLanguageTag();","final locale = _dashboardDateLocale(context);")
          p.write_text(s)

          t=Path('frontend/test/features/dashboard_latest_reading_contract_test.dart')
          ts=t.read_text()
          marker="""  test('Dashboard keeps configured target comparison deterministic', () {"""
          contract="""  test('Dashboard normalizes locale before Intl date formatting', () {\n    final source = File(\n      'lib/features/dashboard/dashboard_premium_screen.dart',\n    ).readAsStringSync();\n\n    expect(source, contains('_dashboardDateLocale'));\n    expect(source, contains("'fr' => 'fr_FR'"));\n    expect(source, contains("'ar' => 'ar_MA'"));\n    expect(source, contains("'en' => 'en_US'"));\n    expect(source, contains('final locale = _dashboardDateLocale(context);'));\n  });\n\n"""
          if 'Dashboard normalizes locale before Intl date formatting' not in ts:
              assert marker in ts, 'test insertion anchor not found'
              ts=ts.replace(marker,contract+marker,1)
          t.write_text(ts)
          PY
          cd frontend
          dart format lib/features/dashboard/dashboard_premium_screen.dart test/features/dashboard_latest_reading_contract_test.dart
          flutter pub get
          flutter analyze --no-fatal-infos lib/features/dashboard/dashboard_premium_screen.dart
          flutter test --no-pub test/features/dashboard_latest_reading_contract_test.dart
      - name: Commit verified locale fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/lib/features/dashboard/dashboard_premium_screen.dart frontend/test/features/dashboard_latest_reading_contract_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: normalize dashboard date locale for Intl'
          git push
