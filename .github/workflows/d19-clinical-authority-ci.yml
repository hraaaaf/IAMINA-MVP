name: D19 clinical calculation authority — isolated

on:
  push:
    branches:
      - audit/d19-web-clinical-authority-20261029
    paths:
      - .github/workflows/d19-clinical-authority-ci.yml
      - backend/diabetes/api/v1/kpis.py
      - backend/diabetes/tests/test_d19_fractional_target_cache.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d19-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fractional-target-cache:
    name: CAL-01 exact target cache isolation (SQLite, synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: d19-ci-non-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-d19-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install isolated backend test dependencies
        run: pip install -r requirements.txt
      - name: Compile and run D19 negative cache oracles
        run: |
          python -m compileall -q diabetes/api/v1/kpis.py diabetes/tests/test_d19_fractional_target_cache.py
          pytest -q diabetes/tests/test_d19_fractional_target_cache.py
      - name: No clinical thresholds changed
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('diabetes/api/v1/kpis.py').read_text()
          assert '_STANDARD_TARGET_LOW = 70.0' in source
          assert '_STANDARD_TARGET_HIGH = 180.0' in source
          assert 'l{float(target_low)!r}:h{float(target_high)!r}' in source
          print('D19 CAL-01 PASS: cache identity corrected; target constants unchanged')
          PY
