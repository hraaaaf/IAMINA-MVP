name: P1-EVIDENCE OpenAPI sync

on:
  push:
    branches: [agent/p1-evidence-registry]
    paths: [.github/workflows/p1-evidence-openapi-sync.yml]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-evidence-registry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Regenerate canonical OpenAPI snapshot
        run: python backend/manage.py export_openapi > docs/api/openapi.json
      - name: Commit generated snapshot
        run: |
          if git diff --quiet -- docs/api/openapi.json; then
            echo "OpenAPI snapshot already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.json
          git commit -m "docs(p1-evidence): regenerate OpenAPI snapshot"
          git push origin HEAD:agent/p1-evidence-registry
