name: CGM V2.1 compact dialog helper

on:
  push:
    branches:
      - agent/cgm-v2-1-how-to-use

permissions:
  contents: write

jobs:
  compact:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cgm-v2-1-how-to-use
      - name: Compact dialog and self-clean helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/lib/features/import/cgm_connections_section.dart')
          s = p.read_text()
          replacements = {
            "insetPadding: const EdgeInsets.symmetric(horizontal: 20, vertical: 24),": "insetPadding: const EdgeInsets.symmetric(horizontal: 20, vertical: 12),",
            "padding: const EdgeInsets.all(24),": "padding: const EdgeInsets.fromLTRB(20, 18, 20, 16),",
            "width: 42,\n                    height: 42,": "width: 38,\n                    height: 38,",
            "borderRadius: BorderRadius.circular(12),": "borderRadius: BorderRadius.circular(11),",
            "child: Icon(source.icon, size: 20, color: AminaTheme.teal700),": "child: Icon(source.icon, size: 18, color: AminaTheme.teal700),",
            "fontSize: 18,": "fontSize: 17,",
            "style: const TextStyle(fontSize: 12, height: 1.4, color: AminaTheme.ink500),": "style: const TextStyle(fontSize: 11.5, height: 1.3, color: AminaTheme.ink500),",
            "const SizedBox(height: 22),": "const SizedBox(height: 14),",
            "if (i < steps.length - 1) const SizedBox(height: 18),": "if (i < steps.length - 1) const SizedBox(height: 12),",
            "padding: const EdgeInsets.all(14),": "padding: const EdgeInsets.all(11),",
            "borderRadius: BorderRadius.circular(14),": "borderRadius: BorderRadius.circular(12),",
            "const Icon(Icons.shield_outlined, size: 18, color: AminaTheme.ink500),": "const Icon(Icons.shield_outlined, size: 16, color: AminaTheme.ink500),",
            "style: const TextStyle(fontSize: 11, height: 1.45, color: AminaTheme.ink700),": "style: const TextStyle(fontSize: 10.5, height: 1.3, color: AminaTheme.ink700),",
            "const SizedBox(height: 20),": "const SizedBox(height: 12),",
            "width: 28,\n          height: 28,": "width: 24,\n          height: 24,",
            "style: const TextStyle(fontSize: 12, fontWeight: FontWeight.w800, color: Colors.white),": "style: const TextStyle(fontSize: 11, fontWeight: FontWeight.w800, color: Colors.white),",
            "style: const TextStyle(fontSize: 13, fontWeight: FontWeight.w800, color: AminaTheme.ink900),": "style: const TextStyle(fontSize: 12.5, fontWeight: FontWeight.w800, color: AminaTheme.ink900),",
            "const SizedBox(height: 4),": "const SizedBox(height: 2),",
            "Text(body, style: const TextStyle(fontSize: 12, height: 1.45, color: AminaTheme.ink600)),": "Text(body, style: const TextStyle(fontSize: 11.5, height: 1.32, color: AminaTheme.ink600)),",
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing anchor: {old!r}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/cgm-v2-1-compact-helper.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(cgm): fit how-to dialog in mobile viewport"
          git push origin HEAD:agent/cgm-v2-1-how-to-use
