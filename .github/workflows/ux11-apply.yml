name: UX-11 apply action parity

on:
  push:
    branches:
      - ux/11-dashboard-action-parity
    paths:
      - .github/workflows/ux11-apply.yml
      - scripts/ux11_apply.py
      - scripts/ux11_fix_tests.py

permissions:
  contents: write

concurrency:
  group: ux11-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/11-dashboard-action-parity
          fetch-depth: 0

      - name: Apply UX-11 implementation
        run: |
          python scripts/ux11_apply.py
          python scripts/ux11_fix_tests.py
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/test/p0_ux_8_mobile_navigation_test.dart')
          text = path.read_text()
          text = text.replace(
              "Finder get addDestination => find.byKey(const ValueKey('mobile-nav-add'));",
              "Finder addDestination() => find.byKey(const ValueKey('mobile-nav-add'));",
          )
          text = text.replace('expect(addDestination, findsOneWidget);', 'expect(addDestination(), findsOneWidget);')
          text = text.replace('tester.getSize(addDestination)', 'tester.getSize(addDestination())')
          text = text.replace('tester.tap(addDestination)', 'tester.tap(addDestination())')
          path.write_text(text)
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Generate Drift + format
        working-directory: frontend
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart format lib test

      - name: Analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: frontend
        run: flutter test --no-pub

      - name: Commit verified UX-11 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git diff --cached --stat
          git commit -m "feat(ux): implement dashboard action parity" || exit 0
          git push origin HEAD:ux/11-dashboard-action-parity
