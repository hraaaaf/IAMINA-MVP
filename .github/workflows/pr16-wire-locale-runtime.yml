name: PR16 wire locale runtime

on:
  push:
    branches:
      - feat/p0-mena-locale-safety-contract

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-locale-safety-contract
      - name: Replace legacy language resolution and update roadmap
        run: |
          python - <<'PY'
          from pathlib import Path

          ai = Path('backend/ai/api/v1/ai.py')
          text = ai.read_text()
          text = text.replace(
              'from core.llm_gateway import (\n',
              'from core.locale import resolve_patient_locale\nfrom core.llm_gateway import (\n',
              1,
          )
          old = '''def _get_patient_language(user) -> str:\n    try:\n        base = BasePatientProfile.objects.get(patient=user)\n        return base.preferred_language or "ar-MA"\n    except BasePatientProfile.DoesNotExist:\n        return "fr"\n'''
          new = '''def _get_patient_language(user) -> str:\n    try:\n        base = BasePatientProfile.objects.get(patient=user)\n    except BasePatientProfile.DoesNotExist:\n        return "fr"\n    resolved = resolve_patient_locale(base)\n    return resolved.dialect or resolved.response_language\n'''
          if old not in text:
              raise SystemExit('ai language helper anchor missing')
          ai.write_text(text.replace(old, new, 1))

          voice = Path('backend/ai/api/v1/voice.py')
          text = voice.read_text()
          text = text.replace(
              'from core.ai_egress import AUDIO, TEXT, patient_ai_egress_scope\n',
              'from core.ai_egress import AUDIO, TEXT, patient_ai_egress_scope\nfrom core.locale import resolve_patient_locale\n',
              1,
          )
          old = '''def _get_language(user) -> str:\n    try:\n        return BasePatientProfile.objects.get(patient=user).preferred_language or "ar-MA"\n    except BasePatientProfile.DoesNotExist:\n        return "ar-MA"\n'''
          new = '''def _get_language(user) -> str:\n    try:\n        base = BasePatientProfile.objects.get(patient=user)\n    except BasePatientProfile.DoesNotExist:\n        return "fr"\n    resolved = resolve_patient_locale(base)\n    return resolved.dialect or resolved.response_language\n'''
          if old not in text:
              raise SystemExit('voice language helper anchor missing')
          voice.write_text(text.replace(old, new, 1))

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text()
          replacements = {
              '> **Last updated:** 2026-07-29 — P0-MENA-1F complete and validated in PR #15; ready for review.': '> **Last updated:** 2026-07-30 — P0-MENA-2A and 2B implemented and validated in draft PR #16.',
              '| P0-MENA-1 — outbound AI/data-egress contract | 100% | ✅ Complete in PR | 10 of 10 explicit controls complete; final merge remains pending review of PR #15 |': '| P0-MENA-1 — outbound AI/data-egress contract | 100% | ✅ Merged | 10 of 10 explicit controls merged through PR #15 |',
              '| P0-MENA-2 — locale + safety contract | 0% | ⚪ Not started | No roadmap task closed |': '| P0-MENA-2 — locale + safety contract | 38% | 🟡 In progress | Canonical model, confirmation API and deterministic fallback implemented in PR #16 |',
              '**MENA critical-path completion:** 12 of 41 explicit roadmap tasks closed, approximately **29%**.': '**MENA critical-path completion:** 15 of 41 explicit roadmap tasks closed, approximately **37%**.',
              '- [ ] Model country, UI language, response language, script/transliteration, dialect, units and timezone separately.': '- [x] Model country, UI language, response language, script/transliteration, dialect, units and timezone separately.',
              '- [ ] Require user confirmation; location may only suggest.': '- [x] Require user confirmation; location may only suggest.',
              '- [ ] Define deterministic fallback to MSA, English or French.': '- [x] Define deterministic fallback to MSA, English or French.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'roadmap anchor missing: {old}')
              text = text.replace(old, new, 1)
          checkpoint = '''\n### P0-MENA-2 checkpoints\n\n- **2A — canonical model:** one authoritative per-patient record separates country, UI language, response language, script, transliteration, dialect, glucose units and IANA timezone with independent provenance. Suggested/defaulted values cannot control runtime.\n- **2B — authenticated confirmation API:** GET/PATCH/DELETE operations derive ownership from `request.user`; explicit confirmation is dimension-scoped, revocation is isolated, invalid values fail closed, and no patient identifier is accepted.\n- **2C — runtime fallback wiring:** text and voice resolve only confirmed settings; historical silent Darija defaults are removed. RTL/rendering completion remains active.\n'''
          anchor = '\n## P0-MENA-3 — Sovereignty-critical authentication migration\n'
          if checkpoint not in text:
              text = text.replace(anchor, checkpoint + anchor, 1)
          roadmap.write_text(text)
          PY
      - name: Commit runtime wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/ai/api/v1/ai.py backend/ai/api/v1/voice.py docs/ROADMAP.md
          git commit -m "feat(locale): use confirmed preferences in text and voice"
          git push origin HEAD:feat/p0-mena-locale-safety-contract
