name: Local OCR smoke benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/run_local_ocr_smoke.py
      - .github/workflows/local-ocr-smoke.yml

permissions:
  contents: read

jobs:
  tesseract-smoke:
    name: Tesseract synthetic zero-egress baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install local OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-dejavu-core
          python -m pip install --disable-pip-version-check Pillow>=10.0 pytesseract>=0.3.10

      - name: Run synthetic OCR smoke benchmark
        run: python scripts/run_local_ocr_smoke.py --output /tmp/local-ocr-smoke.json

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ocr-smoke-${{ github.sha }}
          path: /tmp/local-ocr-smoke.json
          if-no-files-found: error
          retention-days: 14
