name: Final visual certification
on:
  push:
    branches: [audit/final-visual-cert-98fb6ce8]
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Build exact Flutter web bundle
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --dart-define=API_BASE_URL=http://127.0.0.1:8000
          echo "98fb6ce817cb65a6cd80474e9ebceae11c566a91" > build/web/CERTIFIED_COMMIT.txt
      - name: Install browser tooling
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Serve and capture authenticated journeys
        run: |
          cd frontend/build/web
          python3 -m http.server 4173 > /tmp/iamina-web.log 2>&1 &
          cd ../../..
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const out='visual-cert'; fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          async function settle(page, ms=3500){ await page.waitForLoadState('domcontentloaded'); await page.waitForTimeout(ms); }
          async function open(viewport, lang, prefix){
            const context=await browser.newContext({viewport, locale:lang==='ar'?'ar-MA':'fr-FR'});
            const page=await context.newPage();
            const errors=[];
            await page.route('**/api/v1/profile/locale', route => route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({resolved:{ui_language:lang}})}));
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error' && !m.text().includes('localhost:8000')) errors.push('console: '+m.text())});
            await page.goto('http://127.0.0.1:4173',{waitUntil:'domcontentloaded',timeout:30000}); await settle(page);
            const demoY=viewport.width<600 ? viewport.height*0.84 : viewport.height*0.745;
            await page.mouse.click(viewport.width/2,demoY); await page.waitForTimeout(6500);
            await page.screenshot({path:`${out}/${prefix}-post-demo.png`,fullPage:true});
            // Consent accept button sits in the lower action area when present.
            if(page.url().includes('consent')) { await page.mouse.click(viewport.width/2,viewport.height*0.78); await page.waitForTimeout(4500); }
            const paths=['dashboard','journal','importer','pulper','profile'];
            for(const p of paths){
              await page.goto('http://127.0.0.1:4173/#/'+p,{waitUntil:'domcontentloaded',timeout:30000}); await settle(page);
              await page.screenshot({path:`${out}/${prefix}-${p}.png`,fullPage:true});
            }
            fs.writeFileSync(`${out}/${prefix}-url.txt`,page.url());
            fs.writeFileSync(`${out}/${prefix}-errors.txt`,errors.join('\n'));
            await context.close();
          }
          await open({width:1440,height:1100},'fr','desktop-fr');
          await open({width:390,height:844},'fr','mobile-fr');
          await open({width:390,height:844},'ar','mobile-ar');
          await browser.close();
          EOF
          node capture.mjs
      - name: Structural audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('visual-cert'); findings=[]
          pngs=list(root.glob('*.png'))
          if len(pngs) != 18: findings.append(f'expected 18 captures, got {len(pngs)}')
          for err in root.glob('*-errors.txt'):
              txt=err.read_text(errors='ignore').strip()
              if txt: findings.append(f'{err.name}: {txt}')
          Path('visual-cert/AUDIT.txt').write_text('CERTIFIED_COMMIT='+Path('frontend/build/web/CERTIFIED_COMMIT.txt').read_text().strip()+'\nCAPTURES='+str(len(pngs))+'\nFINDINGS='+str(len(findings))+'\n'+'\n'.join(findings))
          print(Path('visual-cert/AUDIT.txt').read_text())
          if findings: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-visual-cert-authenticated-98fb6ce8
          path: visual-cert
          if-no-files-found: error
          retention-days: 7
