  MealFoodItem('amlou', 'Amlou', 'Amlou', 'أملو'),
  MealFoodItem('mint_tea', 'Thé à la menthe', 'Mint tea', 'شاي بالنعناع', ['thé', 'tea']),
  MealFoodItem('coffee', 'Café', 'Coffee', 'قهوة'),
  MealFoodItem('water', 'Eau', 'Water', 'ماء'),
  MealFoodItem('juice', 'Jus', 'Juice', 'عصير'),
  MealFoodItem('soup', 'Soupe', 'Soup', 'شوربة'),
  MealFoodItem('sandwich', 'Sandwich', 'Sandwich', 'ساندويتش'),
  MealFoodItem('pizza', 'Pizza', 'Pizza', 'بيتزا'),
  MealFoodItem('croissant', 'Croissant', 'Croissant', 'كرواسون'),
];

final Map<String, MealFoodItem> _mealFoodById = <String, MealFoodItem>{
  for (final item in mealFoodCatalog) item.id: item,
};

MealFoodItem? mealFoodById(String id) => _mealFoodById[id];

List<String> decodeMealItemIds(String? raw) {
  if (raw == null || raw.trim().isEmpty) return const <String>[];
  try {
    final decoded = jsonDecode(raw);
    if (decoded is! List) return const <String>[];
    return decoded.whereType<String>().where(_mealFoodById.containsKey).toList(growable: false);
  } catch (_) {
    return const <String>[];
  }
}

String encodeMealItemIds(Iterable<String> ids) => jsonEncode(
      ids.where(_mealFoodById.containsKey).toSet().toList(growable: false),
    );

String foldMealText(String value) => value
    .toLowerCase()
    .replaceAll('œ', 'oe')
    .replaceAll(RegExp('[àáâäãå]'), 'a')
    .replaceAll(RegExp('[ç]'), 'c')
    .replaceAll(RegExp('[èéêë]'), 'e')
    .replaceAll(RegExp('[ìíîï]'), 'i')
    .replaceAll(RegExp('[ñ]'), 'n')
    .replaceAll(RegExp('[òóôöõ]'), 'o')
    .replaceAll(RegExp('[ùúûü]'), 'u')
    .replaceAll(RegExp('[ýÿ]'), 'y')
    .replaceAll(RegExp(r'[^a-z0-9\u0600-\u06ff]+'), ' ')
    .trim();

List<MealFoodItem> searchMealFoods(String query, {int limit = 12}) {
  final folded = foldMealText(query);
  if (folded.length < 2) return const <MealFoodItem>[];
  return mealFoodCatalog
      .where((item) => foldMealText(item.searchable).contains(folded))
      .take(limit)
      .toList(growable: false);
}

List<MealFoodItem> matchRecognizedMealFoods(Iterable<String> recognized) {
  final found = <String, MealFoodItem>{};
  for (final raw in recognized) {
    final needle = foldMealText(raw);
    if (needle.isEmpty) continue;
    MealFoodItem? match;
    for (final item in mealFoodCatalog) {
      final french = foldMealText(item.fr);
      if (french == needle || french.contains(needle) || needle.contains(french)) {
        match = item;
        break;
      }
    }
    if (match == null) {
      final needleTokens = needle.split(' ').where((e) => e.length >= 3).toSet();
      int best = 0;
      for (final item in mealFoodCatalog) {
        final tokens = foldMealText(item.fr).split(' ').toSet();
        final score = needleTokens.intersection(tokens).length;
        if (score > best) {
          best = score;
          match = item;
        }
      }
      if (best == 0) match = null;
    }
    if (match != null) found[match.id] = match;
  }
  return found.values.take(8).toList(growable: false);
}
''')

          # Meal capture widget: search + recent/habitual + explicit photo confirmation.
          Path('frontend/lib/features/journal/widgets/meal_capture_panel.dart').write_text(r'''import 'dart:convert';

import 'package:flutter/material.dart';
import 'package:image_picker/image_picker.dart';
import 'package:provider/provider.dart';

import '../../../core/data/meal_food_catalog.dart';
import '../../../core/theme/app_theme.dart';
import '../../../data/drift/database.dart';
import '../../../data/models/ai_models.dart';
import '../../../l10n/app_localizations.dart';
import '../../../services/api_client.dart';

typedef MealPhotoRecognition = Future<MealAnalysisResult?> Function();

class MealCapturePanel extends StatefulWidget {
  final List<String> selectedIds;
  final ValueChanged<List<String>> onChanged;
  final bool canUsePhotoRecognition;
  final MealPhotoRecognition? photoRecognition;

  const MealCapturePanel({
    super.key,
    required this.selectedIds,
    required this.onChanged,
    required this.canUsePhotoRecognition,
    this.photoRecognition,
  });

  @override
  State<MealCapturePanel> createState() => _MealCapturePanelState();
}

class _MealCapturePanelState extends State<MealCapturePanel> {
  final _searchController = TextEditingController();
  String _query = '';
  bool _recognizing = false;
  List<MealFoodItem> _photoCandidates = const <MealFoodItem>[];
  final Set<String> _proposalSelection = <String>{};

  @override
  void dispose() {
    _searchController.dispose();
    super.dispose();
  }

  void _toggleItem(String id) {
    final next = widget.selectedIds.toSet();
    if (!next.add(id)) next.remove(id);
    widget.onChanged(next.toList(growable: false));
  }

  Future<MealAnalysisResult?> _pickAndRecognize() async {
    final file = await ImagePicker().pickImage(
      source: ImageSource.gallery,
      imageQuality: 85,
      maxWidth: 1600,
    );
    if (file == null) return null;
    final bytes = await file.readAsBytes();
    final lower = file.name.toLowerCase();
    final mime = lower.endsWith('.png')
        ? 'image/png'
        : lower.endsWith('.webp')
            ? 'image/webp'
            : 'image/jpeg';
    return ApiClient().analyzeMealImage(base64Encode(bytes), mime);
  }

  Future<void> _recognizePhoto(AppLocalizations l10n) async {
    if (!widget.canUsePhotoRecognition) {
      _message(l10n.journalMealPhotoConsent);
      return;
    }
    setState(() => _recognizing = true);
    try {
      final result = await (widget.photoRecognition ?? _pickAndRecognize)();
      if (!mounted) return;
      if (result == null || result.fallback || result.foods.isEmpty) {
        setState(() {
          _photoCandidates = const <MealFoodItem>[];
          _proposalSelection.clear();
        });
        _message(l10n.journalMealPhotoUnavailable);
        return;
      }
      final matches = matchRecognizedMealFoods(result.foods);
      setState(() {
        _photoCandidates = matches;
        _proposalSelection.clear();
      });
      if (matches.isEmpty) _message(l10n.journalMealPhotoUnavailable);
    } finally {
      if (mounted) setState(() => _recognizing = false);
    }
  }

  void _confirmProposal() {
    if (_proposalSelection.isEmpty) return;
    final next = <String>{...widget.selectedIds, ..._proposalSelection};
    widget.onChanged(next.toList(growable: false));
    setState(() {
      _photoCandidates = const <MealFoodItem>[];
      _proposalSelection.clear();
    });
  }

  void _message(String text) {
    ScaffoldMessenger.of(context).showSnackBar(
      SnackBar(content: Text(text), behavior: SnackBarBehavior.floating),
    );
  }

  @override
  Widget build(BuildContext context) {
    final l10n = AppLocalizations.of(context)!;
    final locale = Localizations.localeOf(context);
    final db = context.read<AppDatabase>();
    final selected = widget.selectedIds
        .map(mealFoodById)
        .whereType<MealFoodItem>()
        .toList(growable: false);
    final results = searchMealFoods(_query);

    return Column(
      crossAxisAlignment: CrossAxisAlignment.stretch,
      children: <Widget>[
        Text(
          l10n.journalMealCaptureTitle,
          style: TextStyle(
            color: AminaTheme.textSecondary(context),
            fontSize: 11,
            fontWeight: FontWeight.w800,
            letterSpacing: .55,
          ),
        ),
        const SizedBox(height: 5),
        Text(
          l10n.journalMealCaptureHint,
          style: TextStyle(
            color: AminaTheme.textSecondary(context),
            fontSize: 12,
            height: 1.4,
          ),
        ),
        if (selected.isNotEmpty) ...<Widget>[
          const SizedBox(height: 12),
          _subhead(l10n.journalMealSelected),
          const SizedBox(height: 7),
          Wrap(
            spacing: 7,
            runSpacing: 7,
            children: selected
                .map(
                  (item) => InputChip(
                    key: Key('meal-selected-${item.id}'),
                    label: Text(item.labelFor(locale)),
                    onDeleted: () => _toggleItem(item.id),
                  ),
                )
                .toList(),
          ),
        ],
        const SizedBox(height: 14),
        StreamBuilder<List<LogEntryData>>(
          stream: db.watchRecentLogs(limit: 100),
          builder: (context, snapshot) {
            final logs = snapshot.data ?? const <LogEntryData>[];
            final recent = _recentItems(logs);
            final habitual = _habitualItems(logs);
            return Column(
              crossAxisAlignment: CrossAxisAlignment.stretch,
              children: <Widget>[
                _historySection(
                  title: l10n.journalMealRecent,
                  empty: l10n.journalMealNoRecent,
                  items: recent,
                  locale: locale,
                ),
                const SizedBox(height: 12),
                _historySection(
                  title: l10n.journalMealHabitual,
                  empty: l10n.journalMealNoHabitual,
                  items: habitual,
                  locale: locale,
                ),
              ],
            );
          },
        ),
        const SizedBox(height: 14),
        TextField(
          key: const Key('meal-food-search'),
          controller: _searchController,
          onChanged: (value) => setState(() => _query = value),
          decoration: InputDecoration(
