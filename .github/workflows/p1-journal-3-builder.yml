name: P1-JOURNAL-3 builder

on:
  push:
    branches: [feat/p1-journal-meal-capture]
    paths: [.github/workflows/p1-journal-3-builder.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p1-journal-meal-capture
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Apply P1-JOURNAL-3 source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'marker not found in {path}: {old[:90]!r}')
              p.write_text(s.replace(old, new, 1))

          # Backend API contract: expose the already-existing model field.
          p = Path('backend/diabetes/api/v1/schemas.py')
          s = p.read_text()
          s = s.replace(
              '_BloodSugar = Annotated[float, Field(ge=30.0, le=600.0)]\n',
              '_BloodSugar = Annotated[float, Field(ge=30.0, le=600.0)]\n_MealItem = Annotated[str, Field(min_length=1, max_length=80)]\n',
          )
          s = s.replace(
              '    meal_description: str = ""\n    insulin_units: Optional[float] = None\n',
              '    meal_description: str = ""\n    meal_items: List[_MealItem] = Field(default_factory=list, max_length=20)\n    insulin_units: Optional[float] = None\n',
              1,
          )
          s = s.replace(
              '    meal_description: str = ""\n    insulin_units: Optional[float] = None\n',
              '    meal_description: str = ""\n    meal_items: List[_MealItem] = Field(default_factory=list, max_length=20)\n    insulin_units: Optional[float] = None\n',
              1,
          )
          s = s.replace(
              '    meal_description: Optional[str] = None\n    insulin_units: Optional[float] = None\n',
              '    meal_description: Optional[str] = None\n    meal_items: Optional[List[_MealItem]] = Field(default=None, max_length=20)\n    insulin_units: Optional[float] = None\n',
          )
          p.write_text(s)

          # Backend persistence contract tests.
          p = Path('backend/diabetes/tests/test_journal_glycemic_context.py')
          s = p.read_text()
          anchor = '''        self.assertEqual(entry.glycemic_context, "post_meal")\n        self.assertEqual(entry.meal_type, "dinner")\n'''
          addition = anchor + '''\n    def test_structured_meal_items_are_preserved_without_inference(self):\n        response = self.client.post(\n            "/api/v1/logs",\n            data={\n                "blood_sugar": 128,\n                "meal_type": "breakfast",\n                "meal_items": ["moroccan_bread", "egg", "mint_tea"],\n                "meal_description": "sans sucre",\n            },\n            content_type="application/json",\n        )\n        self.assertEqual(response.status_code, 200)\n        payload = loads(response.content)\n        self.assertEqual(\n            payload["meal_items"],\n            ["moroccan_bread", "egg", "mint_tea"],\n        )\n        entry = LogEntry.objects.get(patient=self.user)\n        self.assertEqual(\n            entry.meal_items,\n            ["moroccan_bread", "egg", "mint_tea"],\n        )\n        self.assertEqual(entry.meal_description, "sans sucre")\n\n    def test_batch_sync_preserves_structured_meal_items(self):\n        uuid = "66666666-6666-6666-6666-666666666666"\n        response = self.client.post(\n            "/api/v1/logs/batch",\n            data=[{\n                "blood_sugar": 154,\n                "meal_type": "lunch",\n                "meal_items": ["couscous", "vegetables"],\n                "client_uuid": uuid,\n            }],\n            content_type="application/json",\n        )\n        self.assertEqual(response.status_code, 200)\n        entry = LogEntry.objects.get(client_uuid=uuid)\n        self.assertEqual(entry.meal_items, ["couscous", "vegetables"])\n'''
          if anchor not in s:
              raise SystemExit('backend test anchor missing')
          p.write_text(s.replace(anchor, addition, 1))

          # Local Drift: additive structured meal item JSON, schema v7.
          replace(
              'frontend/lib/data/drift/database.dart',
              '  TextColumn get mealDescription => text().nullable()();\n  TextColumn get source',
              "  TextColumn get mealDescription => text().nullable()();\n  TextColumn get mealItemsJson => text().withDefault(const Constant('[]'))();\n  TextColumn get source",
          )
          replace(
              'frontend/lib/data/drift/database.dart',
              '  int get schemaVersion => 6;',
              '  int get schemaVersion => 7;',
          )
          replace(
              'frontend/lib/data/drift/database.dart',
              '      if (from < 6) {\n        await m.addColumn(logEntries, logEntries.glycemicContext);\n      }\n',
              "      if (from < 6) {\n        await m.addColumn(logEntries, logEntries.glycemicContext);\n      }\n      if (from < 7) {\n        await m.addColumn(logEntries, logEntries.mealItemsJson);\n      }\n",
          )

          # Sync structured IDs to the server's canonical meal_items JSON list.
          p = Path('frontend/lib/services/sync_service.dart')
          s = p.read_text()
          s = s.replace("import 'dart:async';\n", "import 'dart:async';\nimport 'dart:convert';\n")
          s = s.replace(
              "          'meal_description': log.mealDescription ?? '',\n",
              "          'meal_description': log.mealDescription ?? '',\n          'meal_items': _mealItems(log.mealItemsJson),\n",
          )
          marker = '  void dispose() {\n'
          helper = '''  List<String> _mealItems(String raw) {\n    try {\n      final decoded = jsonDecode(raw);\n      if (decoded is! List) return const <String>[];\n      return decoded.whereType<String>().toList(growable: false);\n    } catch (_) {\n      return const <String>[];\n    }\n  }\n\n'''
          if marker not in s:
              raise SystemExit('sync dispose marker missing')
          p.write_text(s.replace(marker, helper + marker, 1))

          # API client: use the existing governed meal-vision endpoint.
          p = Path('frontend/lib/services/api_client.dart')
          s = p.read_text()
          marker = '  /// Web OCR: extract glucose value from a glucometer photo via Gemini Vision.\n'
          method = '''  /// Identify visible foods in a meal photo. The server enforces the\n  /// patient AI-egress consent/purpose/modality boundary before provider use.\n  Future<MealAnalysisResult?> analyzeMealImage(\n    String base64Image,\n    String mimeType,\n  ) async {\n    try {\n      final token = await _authService.getIdToken();\n      final uri = Uri.parse('$baseUrl/api/v1/ai/analyze-meal-image');\n      final req = http.Request('POST', uri)\n        ..headers['Content-Type'] = 'application/json'\n        ..body = jsonEncode({\n          'image_base64': base64Image,\n          'mime_type': mimeType,\n        });\n      if (token != null && token.isNotEmpty) {\n        req.headers['Authorization'] = 'Bearer $token';\n      }\n      final streamed = await http.Client()\n          .send(req)\n          .timeout(TimeoutInterceptor._kTimeout);\n      final body = await streamed.stream.bytesToString();\n      if (streamed.statusCode >= 200 && streamed.statusCode < 300) {\n        return MealAnalysisResult.fromJson(\n          jsonDecode(body) as Map<String, dynamic>,\n        );\n      }\n      return null;\n    } catch (_) {\n      return null;\n    }\n  }\n\n'''
          if marker not in s:
              raise SystemExit('api client meal marker missing')
          p.write_text(s.replace(marker, method + marker, 1))

          # Trilingual, non-clinical capture catalog. No nutrition data in this LOT.
          Path('frontend/lib/core/data/meal_food_catalog.dart').write_text(r'''import 'dart:convert';
import 'package:flutter/widgets.dart';

class MealFoodItem {
  final String id;
  final String fr;
  final String en;
  final String ar;
  final List<String> aliases;

  const MealFoodItem(this.id, this.fr, this.en, this.ar, [this.aliases = const []]);

  String labelFor(Locale locale) {
    if (locale.languageCode == 'ar') return ar;
    if (locale.languageCode == 'en') return en;
    return fr;
  }

  String get searchable => <String>[id, fr, en, ar, ...aliases].join(' ');
}

const List<MealFoodItem> mealFoodCatalog = <MealFoodItem>[
