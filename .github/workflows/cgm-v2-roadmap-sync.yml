name: CGM V2 roadmap sync

on:
  push:
    branches:
      - agent/cgm-gateway-v2-product-wiring
    paths:
      - .github/workflows/cgm-v2-roadmap-sync.yml

permissions:
  contents: write

jobs:
  sync-roadmap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cgm-gateway-v2-product-wiring
      - name: Record active V2 lane
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/ROADMAP.md')
          text = path.read_text()
          anchor = "| CGM-GW-V1.1 — LinX provenance via external bridge | 100% | ✅ Closed | Runtime PR #281 exact head `da7b2079…`; exact-head CI #2589 + drift #2401 green; merge `8eaadc36…`; post-merge CI #2590 + drift #2402 green; qualification `docs/assessments/2026-08-16-cgm-gateway-v1-1-linx-qualification.md` |"
          row = "| CGM-GW-V2 — Product Wiring | 0% credited | 🟡 In progress | PR #285; authenticated connection/sync/readings persistence + Flutter wiring under exact-head certification; real-device proof remains a separate external gate |"
          if row not in text:
              if anchor not in text:
                  raise SystemExit('roadmap dashboard anchor not found')
              text = text.replace(anchor, anchor + '\n' + row, 1)
          old = "2. **CGM gateway:** V1 Dexcom/Libre and V1.1 LinX are closed and technically certified. Medtronic remains HOLD until a modern CareLink path is sufficiently canonical; no further CGM runtime work is queued unless a regression appears or a separately governed provider expansion is approved."
          new = "2. **CGM gateway:** V1 Dexcom/Libre and V1.1 LinX are closed. **CGM-GW-V2 Product Wiring is active in PR #285** to add authenticated patient configuration, encrypted credentials, explicit sync/persistence, bounded reading history and truthful Flutter controls; real-device/provider proof remains a separate external gate. Medtronic remains HOLD."
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit roadmap state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(cgm): register active V2 product wiring"
          git push origin HEAD:agent/cgm-gateway-v2-product-wiring
