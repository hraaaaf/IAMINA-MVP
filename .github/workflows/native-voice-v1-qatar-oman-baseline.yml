name: Native Voice V1 Qatar Oman baseline

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-voice-v1-qatar-oman-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-voice-v1-qatar-oman-baseline
  cancel-in-progress: false

jobs:
  baseline:
    name: Groq V1 baseline Qatar Oman
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: native-voice-v1-baseline-nonproduction
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///native-voice-v1-baseline.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NATIVE_VOICE_NETWORK_AUTHORIZED: "true"

    steps:
      - name: Checkout V1 semantic-contract implementation
        uses: actions/checkout@v4
        with:
          ref: 485723055eb1604fb3a742a0abddfca64c88346e

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate V1 benchmark before network
        working-directory: backend
        run: |
          pytest -q             evaluation/test_native_voice_batched_benchmark.py             evaluation/test_native_voice_semantic_contract.py

      - name: Run V1 Qatar Oman baseline only
        working-directory: backend
        run: |
          mkdir -p ../artifacts
          python -m evaluation.native_voice_batched_benchmark             --scenario-id qatari             --scenario-id omani             --output ../artifacts/native-voice-v1-qatar-oman-baseline.json

      - name: Upload V1 baseline packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-voice-v1-qatar-oman-baseline
          path: artifacts/native-voice-v1-qatar-oman-baseline.json
          if-no-files-found: warn
          retention-days: 14
