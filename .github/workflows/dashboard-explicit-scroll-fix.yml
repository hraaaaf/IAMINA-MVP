name: Dashboard explicit scroll wiring

on:
  push:
    branches: [audit/dashboard-global-cert-20260909]
    paths: ['.github/workflows/dashboard-explicit-scroll-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Wire certification controller explicitly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('frontend/lib/features/dashboard/dashboard_premium_screen.dart')
          s=p.read_text()
          reps=[
            ("class DashboardPremiumScreen extends StatelessWidget {\n  final CompanionService? companionService;\n\n  const DashboardPremiumScreen({super.key, this.companionService});",
             "class DashboardPremiumScreen extends StatelessWidget {\n  final CompanionService? companionService;\n  final ScrollController? scrollController;\n\n  const DashboardPremiumScreen({\n    super.key,\n    this.companionService,\n    this.scrollController,\n  });"),
            ("              companionService: companionService,\n            );",
             "              companionService: companionService,\n              scrollController: scrollController,\n            );"),
            ("  final CompanionService? companionService;\n\n  const _DashboardBody({\n    required this.logs,\n    required this.unit,\n    required this.low,\n    required this.high,\n    required this.companionService,\n  });",
             "  final CompanionService? companionService;\n  final ScrollController? scrollController;\n\n  const _DashboardBody({\n    required this.logs,\n    required this.unit,\n    required this.low,\n    required this.high,\n    required this.companionService,\n    required this.scrollController,\n  });"),
            ("                return CustomScrollView(\n                  physics: const BouncingScrollPhysics(),",
             "                return CustomScrollView(\n                  controller: scrollController,\n                  physics: const BouncingScrollPhysics(),"),
          ]
          for old,new in reps:
            if old not in s:
              raise SystemExit(f'premium replacement missing: {old[:80]}')
            s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('frontend/lib/features/dashboard/dashboard_companion_entry_screen.dart')
          s=p.read_text()
          old="  final CompanionService? companionService;\n\n  const DashboardCompanionEntryScreen({super.key, this.companionService});"
          new="  final CompanionService? companionService;\n  final ScrollController? scrollController;\n\n  const DashboardCompanionEntryScreen({\n    super.key,\n    this.companionService,\n    this.scrollController,\n  });"
          if old not in s: raise SystemExit('entry constructor replacement missing')
          s=s.replace(old,new,1)
          old="        DashboardPremiumScreen(companionService: companionService),"
          new="        DashboardPremiumScreen(\n          companionService: companionService,\n          scrollController: scrollController,\n        ),"
          if old not in s: raise SystemExit('entry pass-through replacement missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('frontend/lib/ui_dashboard_backend_cert_main.dart')
          s=p.read_text()
          old="              builder: (context, state) => PrimaryScrollController(\n                controller: _scrollController,\n                automaticallyInheritForPlatforms: TargetPlatform.values.toSet(),\n                scrollDirection: Axis.vertical,\n                child: DashboardCompanionEntryScreen(\n                  companionService: widget.companion,\n                ),\n              ),"
          new="              builder: (context, state) => DashboardCompanionEntryScreen(\n                companionService: widget.companion,\n                scrollController: _scrollController,\n              ),"
          if old not in s: raise SystemExit('cert entry replacement missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          dart format frontend/lib/features/dashboard/dashboard_premium_screen.dart frontend/lib/features/dashboard/dashboard_companion_entry_screen.dart frontend/lib/ui_dashboard_backend_cert_main.dart
          cd frontend
          flutter pub get
          flutter test --no-pub test/features/dashboard_responsive_convergence_contract_test.dart
          cd ..
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/lib/features/dashboard/dashboard_premium_screen.dart frontend/lib/features/dashboard/dashboard_companion_entry_screen.dart frontend/lib/ui_dashboard_backend_cert_main.dart
          git commit -m 'test: wire dashboard certification scroll explicitly'
          git push
