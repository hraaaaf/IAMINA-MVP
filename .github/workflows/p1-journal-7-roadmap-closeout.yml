name: P1-JOURNAL-7 roadmap closeout patch

on:
  push:
    branches: [audit/p1-journal-7-visual]

permissions:
  contents: write

jobs:
  patch-roadmap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: agent/p1-journal-ramadan-v2
          fetch-depth: 0
      - name: Patch canonical roadmap exactly
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/ROADMAP.md')
          text = path.read_text()

          replacements = {
            '> **Last updated:** 2026-08-09 — P1-JOURNAL-6 Context intelligence is 100% closed; P1-JOURNAL-7 Ramadan mode v2 is next.':
            '> **Last updated:** 2026-08-10 — P1-JOURNAL-6 is closed; P1-JOURNAL-7 Ramadan mode v2 is the active merge unit in PR #75.',
            '| Journal metabolic-event redesign | 67% | 🟢 P1-JOURNAL-6 closed; P1-JOURNAL-7 next | P0-JOURNAL-1/2 + P1-JOURNAL-3/4/5/6 merged; PR #73; merge `95cf4d75226720386d7e8e55acc30c39fdd5017c`; post-merge CI #1342 + drift #1154 green; UX 9.2/10 |':
            '| Journal metabolic-event redesign | 78% | 🔵 P1-JOURNAL-7 merge unit | P0-JOURNAL-1/2 + P1-JOURNAL-3/4/5/6 merged; PR #75 Ramadan mode v2; explicit profile period, neutral meal vocabulary, additive Django/Drift persistence; pre-closeout UX 9.3/10; final-head certification + merge/post-merge required |',
            '| P1-JOURNAL-7 | Ramadan mode v2 | ⬜ Planned | Ramadan becomes a profile/period context; meal vocabulary adapts automatically; no per-log pseudo-clinical toggle |':
            '| P1-JOURNAL-7 | Ramadan mode v2 | 🔵 PR #75 merge unit | explicit nullable profile period; Suhoor/Iftar/Snack/Other only inside the configured period; no fasting inference or meal preselection; additive Django 0023 + Drift v9; FR/EN/AR + RTL; pre-closeout UX 9.3/10 |',
            '6. In the product-quality lane, close P0-JOURNAL-1 through expected-head merge/post-merge verification, then execute P0-JOURNAL-2 as the next Journal LOT without changing the MENA critical-path numerator.':
            '6. In the product-quality lane, complete P1-JOURNAL-7 exact-final-head certification and expected-head merge/post-merge verification, then execute P2-JOURNAL-8 as the next Journal LOT without changing the MENA critical-path numerator.',
          }

          for old, new in replacements.items():
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]}')
            text = text.replace(old, new)

          anchor = "**Final certification evidence:** final product head `fccbdf5bf69bd72c2cf079091b96cd52dcdf3d0c`; CI #1341 SUCCESS; migration drift #1153 SUCCESS; exact-final-head visual audit run `31326260406` SUCCESS on Add/Edit FR/AR desktop/tablet/390×844/360×560; UX Auditor **9.2/10 PASS**; Clinical Safety, Persistence/Migration, Security/Privacy and UX/UI reviewers PASS; Release Certifier CERTIFIED; PR #73 merged with expected-head locking as `95cf4d75226720386d7e8e55acc30c39fdd5017c`; post-merge CI #1342 and migration drift #1154 SUCCESS. P1-JOURNAL-6 is **100% closed**. P1-JOURNAL-7 is next."
          if text.count(anchor) != 1:
            raise SystemExit(f'Expected JOURNAL-6 closeout anchor once, found {text.count(anchor)}')

          block = """

### P1-JOURNAL-7 durable merge-unit contract

PR #75 is the merge unit for Ramadan mode v2. Ramadan is now an optional profile-level period configured explicitly by the patient, not a per-log pseudo-clinical switch and not a state inferred from calendar, country, location, time or meal timing. Both dates are required together and must be ordered; missing, partial or inverted periods fail closed.

For an event whose logged date falls inside the explicitly configured period, Journal uses the neutral meal vocabulary **Suhoor / Iftar / Snack / Other**. No meal is preselected, and neither the configured period nor a meal label proves that the patient fasted. Outside the configured period, standard meal vocabulary remains authoritative. The LOT adds no diagnosis, glucose-threshold change, dose calculation, treatment optimization, causal claim or external AI/provider egress.

Persistence is additive: Django migration `0023` adds nullable profile dates and Drift v8→v9 adds the same local fields while preserving historical Journal rows and stable `client_uuid` values. The legacy per-log `ramadan_mode` column remains compatible but is not retrospectively rewritten or promoted into authoritative fasting evidence. FR/EN/AR copy and Arabic RTL are covered.

**Pre-closeout evidence on product head `f59f74d95bdc5e50186ffc9eab8ca1b315008596`:** CI #1354 SUCCESS; migration drift #1166 SUCCESS; visual audit run `31374280465` SUCCESS with 24/24 FR/AR Profile + Add Log renders across `1440×1000`, `768×1024`, `390×844` and hostile `360×560`; artifact `9057312311`, digest `sha256:58426aa23415d404d689ecf21dbf7c3fb64c1376fce5eb7916a270edec592430`; the first FR `360×560` pass exposed a real 2 px action overflow, which was remediated and protected by a permanent regression test; UX Auditor pre-closeout score **9.3/10 PASS**.

These canonical documentation changes intentionally make the pre-closeout anchors stale. Exact-final-head CI + migration drift + visual recertification, independent Clinical Safety / Database-Migration / UX review passes, Release Certifier verdict, expected-head merge and post-merge CI/drift remain mandatory before P1-JOURNAL-7 may be declared 100% closed.
"""
          text = text.replace(anchor, anchor + block)
          path.write_text(text)
      - name: Commit and push only ROADMAP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          git diff --cached --check
          git diff --cached --exit-code && { echo 'No roadmap change produced'; exit 1; } || true
          git commit -m "docs(journal): record Ramadan v2 pre-closeout"
          git push origin HEAD:agent/p1-journal-ramadan-v2
