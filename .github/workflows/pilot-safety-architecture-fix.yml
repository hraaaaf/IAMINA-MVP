name: Repair pilot safety architecture seam

on:
  push:
    branches: [feat/pilot-safety-certification]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pilot-safety-certification
      - name: Remove condition-dependent safety import from companion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/companion/conversation.py')
          text = path.read_text()

          old_import = '''from core.input_safety import (
    INSULIN_BLOCK,
    PRESCRIPTION_BLOCK,
    URGENT,
    evaluate_input_safety,
)
'''
          if old_import not in text:
              raise SystemExit('input safety import block not found')
          text = text.replace(old_import, '', 1)

          old_medical = '''from core.medical_safety import (
    apply_no_prescription_policy,
    medical_streaming_enabled,
    no_prescription_message,
)
'''
          new_medical = '''from core.medical_safety import (
    apply_no_prescription_policy,
    is_insulin_prescription_request,
    is_treatment_prescription_request,
    medical_streaming_enabled,
    no_prescription_message,
)
'''
          if old_medical not in text:
              raise SystemExit('medical safety import block not found')
          text = text.replace(old_medical, new_medical, 1)

          sync_old = '''    decision = evaluate_input_safety(message, language)
    if decision.action == URGENT:
        _append_turn(patient, "user", message)
        reply = _CHAT_EMERGENCY_AR if language == "ar-MA" else _CHAT_EMERGENCY_FR
        _append_turn(patient, "assistant", reply)
        return reply

    if decision.action in (INSULIN_BLOCK, PRESCRIPTION_BLOCK):
        _append_turn(patient, "user", message)
        reply = no_prescription_message(language)
        _append_turn(patient, "assistant", reply)
        return reply
'''
          sync_new = '''    if _is_chat_emergency(message):
        _append_turn(patient, "user", message)
        reply = _CHAT_EMERGENCY_AR if language == "ar-MA" else _CHAT_EMERGENCY_FR
        _append_turn(patient, "assistant", reply)
        return reply

    if is_insulin_prescription_request(message) or is_treatment_prescription_request(message):
        _append_turn(patient, "user", message)
        reply = no_prescription_message(language)
        _append_turn(patient, "assistant", reply)
        return reply
'''
          if sync_old not in text:
              raise SystemExit('sync guard block not found')
          text = text.replace(sync_old, sync_new, 1)

          stream_old = '''    decision = evaluate_input_safety(message, language)
    if decision.action == URGENT:
        _append_turn(patient, "user", message)
        reply = _CHAT_EMERGENCY_AR if language == "ar-MA" else _CHAT_EMERGENCY_FR
        _append_turn(patient, "assistant", reply)
        yield reply
        return

    if decision.action in (INSULIN_BLOCK, PRESCRIPTION_BLOCK):
        _append_turn(patient, "user", message)
        reply = no_prescription_message(language)
        _append_turn(patient, "assistant", reply)
        yield reply
        return
'''
          stream_new = '''    if _is_chat_emergency(message):
        _append_turn(patient, "user", message)
        reply = _CHAT_EMERGENCY_AR if language == "ar-MA" else _CHAT_EMERGENCY_FR
        _append_turn(patient, "assistant", reply)
        yield reply
        return

    if is_insulin_prescription_request(message) or is_treatment_prescription_request(message):
        _append_turn(patient, "user", message)
        reply = no_prescription_message(language)
        _append_turn(patient, "assistant", reply)
        yield reply
        return
'''
          if stream_old not in text:
              raise SystemExit('stream guard block not found')
          text = text.replace(stream_old, stream_new, 1)

          path.write_text(text)
          PY
          pip install ruff==0.15.17
          cd backend
          ruff check --fix companion/conversation.py
          ruff format companion/conversation.py
          cd ..
          rm .github/workflows/pilot-safety-architecture-fix.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(pilot-safety): preserve companion module boundary"
          git push origin HEAD:feat/pilot-safety-certification
