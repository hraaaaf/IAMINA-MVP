name: UI global missing routes certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/lib/features/auth/**'
      - 'frontend/lib/features/companion/**'
      - 'frontend/lib/features/import/cgm_screen.dart'
      - 'frontend/lib/features/journal/edit_log_screen.dart'
      - 'frontend/lib/ui_global_desktop_missing_audit_main.dart'
      - '.github/workflows/ui-global-missing-routes-cert.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/lib/features/auth/**'
      - 'frontend/lib/features/companion/**'
      - 'frontend/lib/features/import/cgm_screen.dart'
      - 'frontend/lib/features/journal/edit_log_screen.dart'
      - 'frontend/lib/ui_global_desktop_missing_audit_main.dart'
      - '.github/workflows/ui-global-missing-routes-cert.yml'

permissions:
  contents: read

jobs:
  browser-cert:
    name: Missing product routes 390 + 768 + 1280
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze missing-route audit entrypoint
        run: flutter analyze --no-fatal-infos lib/ui_global_desktop_missing_audit_main.dart

      - name: Build isolated missing-route audit
        run: flutter build web --release -t lib/ui_global_desktop_missing_audit_main.dart

      - name: Capture real Chrome missing product routes
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/ui-global-missing-routes-cert"
          mkdir -p "$OUT"
          python3 -m pip install --quiet websocket-client
          python3 -m http.server 7364 --directory build/web >/tmp/iamina-ui-missing-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7364 >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = "1"

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          cat > /tmp/capture_missing_routes.py <<'PY'
          import base64
          import json
          import sys
          import time
          import urllib.request
          from websocket import create_connection

          target = sys.argv[1]
          width = int(sys.argv[2])
          height = int(sys.argv[3])
          mobile = sys.argv[4].lower() == 'true'
          port = int(sys.argv[5])
          pages = json.load(urllib.request.urlopen(f'http://127.0.0.1:{port}/json/list'))
          page = next(item for item in pages if item.get('type') == 'page')
          ws = create_connection(page['webSocketDebuggerUrl'], timeout=20)
          counter = 0

          def call(method, params=None):
              global counter
              counter += 1
              ws.send(json.dumps({'id': counter, 'method': method, 'params': params or {}}))
              while True:
                  response = json.loads(ws.recv())
                  if response.get('id') == counter:
                      return response

          call('Page.enable')
          call('Emulation.setDeviceMetricsOverride', {
              'width': width,
              'height': height,
              'deviceScaleFactor': 1,
              'mobile': mobile,
          })
          call('Page.reload', {'ignoreCache': True})
          time.sleep(10)
          shot = call('Page.captureScreenshot', {
              'format': 'png',
              'captureBeyondViewport': False,
              'fromSurface': True,
          })
          data = shot.get('result', {}).get('data')
          if not data:
              raise RuntimeError(f'No screenshot payload: {shot}')
          with open(target, 'wb') as fh:
              fh.write(base64.b64decode(data))
          ws.close()
          PY

          cleanup_chrome() {
            local chrome_pid="$1"
            local profile_dir="$2"
            kill "$chrome_pid" 2>/dev/null || true
            for _ in $(seq 1 10); do
              if ! kill -0 "$chrome_pid" 2>/dev/null; then break; fi
              sleep 0.2
            done
            kill -9 "$chrome_pid" 2>/dev/null || true
            wait "$chrome_pid" 2>/dev/null || true
            rm -rf "$profile_dir" 2>/dev/null || true
          }

          surfaces=(login reset-password consent onboarding companion-chat cgm edit-log)
          viewports=("390 844 true" "768 1024 false" "1280 900 false")
          port=9230

          for viewport in "${viewports[@]}"; do
            read -r width height mobile <<< "$viewport"
            for surface in "${surfaces[@]}"; do
              target="$OUT/${surface}-${width}x${height}.png"
              profile_dir="$(mktemp -d)"
              "$CHROME" \
                --headless=new \
                --no-sandbox \
                --enable-unsafe-swiftshader \
                --hide-scrollbars \
                --remote-allow-origins='*' \
                --remote-debugging-port="$port" \
                --user-data-dir="$profile_dir" \
                --window-size=${width},${height} \
                "http://127.0.0.1:7364/?surface=${surface}" \
                >/tmp/iamina-missing-${surface}-${width}x${height}.log 2>&1 &
              CHROME_PID=$!

              DEVTOOLS=0
              for _ in $(seq 1 30); do
                if curl -fsS "http://127.0.0.1:${port}/json/list" >/dev/null; then
                  DEVTOOLS=1
                  break
                fi
                sleep 1
              done
              if [ "$DEVTOOLS" != "1" ]; then
                cat "/tmp/iamina-missing-${surface}-${width}x${height}.log" >&2 || true
                cleanup_chrome "$CHROME_PID" "$profile_dir"
                exit 1
              fi

              python3 /tmp/capture_missing_routes.py "$target" "$width" "$height" "$mobile" "$port"
              cleanup_chrome "$CHROME_PID" "$profile_dir"

              test -s "$target"
              bytes="$(stat -c%s "$target")"
              if [ "$bytes" -lt 10000 ]; then
                echo "Capture ${surface}-${width}x${height} is suspiciously small (${bytes} bytes)" >&2
                exit 1
              fi
            done

            count="$(find "$OUT" -name "*-${width}x${height}.png" | wc -l)"
            test "$count" -eq 7
            unique="$(sha256sum "$OUT"/*-${width}x${height}.png | awk '{print $1}' | sort -u | wc -l)"
            test "$unique" -eq 7
          done

          total="$(find "$OUT" -name '*.png' -type f | wc -l)"
          test "$total" -eq 21

      - name: Upload missing-route browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-ui-global-missing-routes-cert
          path: ui-global-missing-routes-cert/*.png
          if-no-files-found: warn
          retention-days: 14
