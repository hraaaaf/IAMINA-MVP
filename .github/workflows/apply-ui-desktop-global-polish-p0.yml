name: Apply desktop global P0 polish

on:
  push:
    branches: [polish/ui-desktop-global-20260911]
    paths:
      - 'scripts/apply_ui_desktop_global_polish_p0.py'
      - '.github/workflows/apply-ui-desktop-global-polish-p0.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/ui-desktop-global-20260911
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Apply deterministic desktop P0 patch
        run: python3 scripts/apply_ui_desktop_global_polish_p0.py

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply_ui_desktop_global_polish_p0.py
          rm .github/workflows/apply-ui-desktop-global-polish-p0.yml

      - name: Format touched Dart files
        working-directory: frontend
        run: |
          dart format \
            lib/core/widgets/mobile_page_header.dart \
            lib/features/dashboard/widgets/add_log_sheet.dart \
            lib/features/documents/document_import_screen.dart \
            lib/features/import/import_screen.dart \
            lib/features/medications/medication_screen.dart \
            lib/features/reminders/reminders_screen.dart \
            lib/features/companion/companion_premium_screen.dart \
            test/features/ui_desktop_global_polish_contract_test.dart

      - name: Get dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze touched production surfaces
        working-directory: frontend
        run: |
          flutter analyze --no-fatal-infos \
            lib/core/widgets/mobile_page_header.dart \
            lib/features/dashboard/widgets/add_log_sheet.dart \
            lib/features/documents/document_import_screen.dart \
            lib/features/import/import_screen.dart \
            lib/features/medications/medication_screen.dart \
            lib/features/reminders/reminders_screen.dart \
            lib/features/companion/companion_premium_screen.dart

      - name: Run proportional UI contracts
        working-directory: frontend
        run: |
          flutter test --reporter expanded \
            test/features/ui_desktop_global_polish_contract_test.dart \
            test/features/add_log_sheet_test.dart \
            test/features/medication_screen_test.dart \
            test/features/reminders_truthfulness_contract_test.dart \
            test/features/document_import_truthfulness_contract_test.dart \
            test/features/importer_truthfulness_contract_test.dart \
            test/features/companion_uncertainty_copy_contract_test.dart

      - name: Verify diff
        run: git diff --check

      - name: Commit verified production polish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'polish(ui): tame desktop density and action widths'
          git push origin HEAD:polish/ui-desktop-global-20260911
