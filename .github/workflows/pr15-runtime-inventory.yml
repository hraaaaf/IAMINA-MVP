name: PR15 runtime inventory

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/p0-mena-provider-runtime-resilience

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr15-inventory
          NETWORK='genai\.|GenerativeModel\(|OpenAI\(|Anthropic\(|chat\.completions|generate_content|generate_content_stream|transcribe|speech_to_text|vision|ocr|get_llm\(|\.complete\(|\.stream\(|\.think\('
          EGRESS='patient_ai_egress_scope|ai_egress_scope|assert_ai_egress_allowed|authorize_text_payload|authorize_processor_policy'
          TIMEOUT='timeout|Timeout|retry|max_retries|ThreadPoolExecutor|future\.result'
          {
            echo '# Network/model callsites'
            grep -RInE --include='*.py' "$NETWORK" backend || true
            echo
            echo '# Egress scopes and assertions'
            grep -RInE --include='*.py' "$EGRESS" backend || true
            echo
            echo '# Timeout and retry controls'
            grep -RInE --include='*.py' "$TIMEOUT" backend || true
          } > /tmp/pr15-inventory/runtime-inventory.txt
          find backend/llm backend/media backend/ai backend/companion backend/diabetes -type f -name '*.py' | sort > /tmp/pr15-inventory/python-files.txt
          test -s /tmp/pr15-inventory/runtime-inventory.txt
          grep -q 'backend/llm/gemini.py' /tmp/pr15-inventory/runtime-inventory.txt
          grep -q 'backend/llm/factory.py' /tmp/pr15-inventory/runtime-inventory.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr15-runtime-inventory
          path: /tmp/pr15-inventory
