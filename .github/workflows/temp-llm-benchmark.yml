name: Temporary LLM benchmark

on:
  push:
    branches:
      - bench/llm-free-temp-20260819
    paths:
      - '.github/workflows/temp-llm-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Benchmark anonymous OVH models
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          endpoint='https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions'
          models=['gpt-oss-120b','mistral@latest?context_size>100000','llama@biggest?input_cost<0.5','code_chat@latest']
          messages=[
            {'role':'system','content':'Tu es un assistant conversationnel de santé non diagnostique. Réponds avec naturel, concision, empathie sobre, sans inventer et dans la langue du dernier message. Données entièrement synthétiques.'},
            {'role':'user','content':'Je m’appelle Samir, j’ai 42 ans. Je veux surtout comprendre mes habitudes et poser des questions simples, pas recevoir un diagnostic.'},
            {'role':'assistant','content':'Compris. Je peux t’aider à clarifier tes habitudes et tes questions, sans poser de diagnostic.'},
            {'role':'user','content':'دابا إلى نسيت شنو قلت ليك قبل شوية، واش تقدر تذكرني بالعمر ديالي وباش بغيت نستعمل هاد الشات؟ جاوبني بالدارجة المغربية وبشكل طبيعي.'}
          ]
          out={'synthetic_only': True, 'provider':'OVHcloud AI Endpoints anonymous', 'results':[]}
          for model in models:
            payload=json.dumps({'model':model,'messages':messages,'temperature':0.4,'max_tokens':220}).encode()
            req=urllib.request.Request(endpoint,data=payload,headers={'content-type':'application/json','accept':'application/json'},method='POST')
            t=time.time()
            try:
              with urllib.request.urlopen(req,timeout=90) as r:
                raw=r.read().decode('utf-8','replace'); status=r.status
              data=json.loads(raw)
              out['results'].append({'model_requested':model,'status':status,'ok':200<=status<300,'elapsed_ms':round((time.time()-t)*1000),'model_resolved':data.get('model'),'text':(((data.get('choices') or [{}])[0].get('message') or {}).get('content')),'usage':data.get('usage')})
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              try: err=json.loads(raw)
              except: err={'raw':raw}
              out['results'].append({'model_requested':model,'status':e.code,'ok':False,'elapsed_ms':round((time.time()-t)*1000),'error':err})
            except Exception as e:
              out['results'].append({'model_requested':model,'ok':False,'elapsed_ms':round((time.time()-t)*1000),'error':str(e)})
          open('benchmark-result.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Publish benchmark evidence on PR 417
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          raw=Path('benchmark-result.json').read_text(encoding='utf-8',errors='replace')
          Path('benchmark-comment.md').write_text('### TEMP_LLM_DIRECT_RESULT\n\n```json\n'+raw[:60000]+'\n```\n\nSynthetic benchmark only. Temporary branch; do not merge.',encoding='utf-8')
          PY
          gh pr comment 417 --repo "$GITHUB_REPOSITORY" --body-file benchmark-comment.md
