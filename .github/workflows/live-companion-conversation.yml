name: IAMINA live synthetic conversation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/evaluation/live_companion_conversation.py"
      - ".github/workflows/live-companion-conversation.yml"

permissions:
  contents: read

concurrency:
  group: iamina-live-conversation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  conversation:
    name: Real Companion path + Groq GPT-OSS synthetic transcript
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: iamina-live-conversation-nonproduction
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///iamina-live-conversation.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      IAMINA_CONVERSATION_NETWORK_AUTHORIZED: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Validate synthetic conversation contract
        run: python -m evaluation.live_companion_conversation --validate-only
      - name: Run one bounded live multi-turn conversation
        run: >-
          python -m evaluation.live_companion_conversation
          --output ../artifacts/iamina-live-conversation.json
      - name: Upload synthetic transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-live-conversation
          path: artifacts/iamina-live-conversation.json
          if-no-files-found: warn
          retention-days: 7
