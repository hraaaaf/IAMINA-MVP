name: D18 isolated full-ciphertext archive proof (no clinical restore)

on:
  pull_request:
    paths:
      - '.github/workflows/d18-full-cipher-archive-poc.yml'
      - 'frontend/lib/data/drift/d18_full_cipher_archive.dart'
      - 'frontend/lib/data/drift/d18_streaming_cipher_archive.dart'
      - 'frontend/test/data/drift/d18_full_cipher_archive_test.dart'
      - 'frontend/test/data/drift/d18_streaming_cipher_archive_test.dart'
      - 'tools/d18_streaming_archive_reference.cjs'
      - 'frontend/lib/data/drift/d18_vault_key_policy.dart'
      - 'frontend/pubspec.yaml'
      - 'frontend/pubspec.lock'

permissions:
  contents: read

concurrency:
  group: d18-full-cipher-archive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  archive-contract:
    name: Synthetic full encrypted SQLite archive format (NOT physical recovery)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Analyze sealed archive and fail-closed tests
        working-directory: frontend
        run: |
          flutter analyze --no-fatal-infos lib/data/drift/d18_full_cipher_archive.dart test/data/drift/d18_full_cipher_archive_test.dart lib/data/drift/d18_streaming_cipher_archive.dart test/data/drift/d18_streaming_cipher_archive_test.dart
      - name: Strict authenticated archive tests, synthetic bytes only
        working-directory: frontend
        run: |
          flutter test test/data/drift/d18_full_cipher_archive_test.dart --reporter expanded
          flutter test test/data/drift/d18_streaming_cipher_archive_test.dart --reporter expanded
      - name: P0-D streaming archive over 16 MiB and fail-closed quarantine (Node reference only)
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --check tools/d18_streaming_archive_reference.cjs
          node tools/d18_streaming_archive_reference.cjs
