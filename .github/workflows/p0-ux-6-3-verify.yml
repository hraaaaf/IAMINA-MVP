name: P0-UX-6.3 verify

on:
  push:
    branches: [fix/p0-ux-6-3-locale-fallback-contract]
    paths:
      - frontend/lib/services/locale_preference_service.dart
      - frontend/test/p0_locale_resolution_contract_test.dart
      - .github/workflows/p0-ux-6-3-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Analyze and test
        working-directory: frontend
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib/services/locale_preference_service.dart test/p0_locale_resolution_contract_test.dart
          flutter analyze --no-fatal-infos
          flutter test test/p0_locale_resolution_contract_test.dart
          flutter test test/p0_localized_onboarding_contract_test.dart
