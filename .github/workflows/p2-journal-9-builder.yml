name: P2-JOURNAL-9 builder

on:
  push:
    branches: [audit/p2-journal-9-builder]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout builder tools
        uses: actions/checkout@v4
        with:
          path: audit

      - name: Checkout exact product branch
        uses: actions/checkout@v4
        with:
          ref: agent/p2-journal-post-save
          path: product
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply J9 product patch
        run: |
          mkdir -p product/frontend/lib/features/journal/widgets
          cp audit/frontend/lib/features/journal/widgets/post_save_receipt.dart \
             product/frontend/lib/features/journal/widgets/post_save_receipt.dart
          python audit/.github/scripts/p2_journal_9_patch.py product

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Resolve and generate localization
        working-directory: product/frontend
        run: |
          flutter pub get
          flutter gen-l10n
          dart format \
            lib/features/dashboard/widgets/add_log_sheet.dart \
            lib/features/journal/widgets/post_save_receipt.dart \
            test/features/add_log_sheet_test.dart

      - name: Focused frontend verification
        working-directory: product/frontend
        run: |
          flutter analyze --no-fatal-infos
          flutter test test/features/add_log_sheet_test.dart

      - name: Guard product scope and push
        working-directory: product
        shell: bash
        run: |
          git checkout HEAD -- frontend/pubspec.lock frontend/.flutter-plugins-dependencies 2>/dev/null || true
          test -z "$(git status --porcelain | grep -E '(^|/)(.*\.db|.*\.sqlite|pubspec\.lock|\.flutter-plugins-dependencies)$' || true)"
          git status --short
          git add \
            frontend/lib/features/dashboard/widgets/add_log_sheet.dart \
            frontend/lib/features/journal/widgets/post_save_receipt.dart \
            frontend/lib/l10n/app_fr.arb \
            frontend/lib/l10n/app_en.arb \
            frontend/lib/l10n/app_ar.arb \
            frontend/lib/l10n/app_localizations.dart \
            frontend/lib/l10n/app_localizations_fr.dart \
            frontend/lib/l10n/app_localizations_en.dart \
            frontend/lib/l10n/app_localizations_ar.dart \
            frontend/test/features/add_log_sheet_test.dart
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat(journal): add factual post-save receipt"
          git push origin HEAD:agent/p2-journal-post-save
