name: Scope historical credential exposure

on:
  push:
    branches: [feat/pilot-secret-history-certification]

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report commits, safe key labels and provider hosts
        env:
          AFFECTED_BLOB: ce2972a27159
        run: |
          FULL_BLOB=$(git rev-list --objects --all | awk -v prefix="$AFFECTED_BLOB" '$1 ~ "^" prefix {print $1; exit}')
          test -n "$FULL_BLOB"
          echo "### Reachable commits containing affected blob"
          git log --all --format='commit=%H date=%aI refs=%D' --find-object="$FULL_BLOB"
          echo
          echo "### Safe credential classification"
          python - "$FULL_BLOB" <<'PY'
          import json
          import re
          import subprocess
          import sys
          from urllib.parse import urlparse

          blob = sys.argv[1]
          content = subprocess.run(
              ["git", "cat-file", "blob", blob],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout.decode("utf-8", errors="replace")

          patterns = (
              ("Anthropic API key", re.compile(r"\bsk-ant-[A-Za-z0-9_-]{20,}\b")),
              ("generic sk token", re.compile(r"\bsk-[A-Za-z0-9_-]{20,}\b")),
          )
          assignment = re.compile(
              r"\b([A-Z][A-Z0-9_]{2,})\s*=\s*(?:['\"])?sk-[A-Za-z0-9_-]{20,}"
          )
          url_pattern = re.compile(r"https?://[^\s'\"()]+")

          try:
              root = json.loads(content)
          except json.JSONDecodeError:
              root = {"raw_lines": content.splitlines()}

          findings = []

          def walk(value, path):
              if isinstance(value, dict):
                  for key, item in value.items():
                      walk(item, path + [str(key)])
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      walk(item, path + [f"[{index}]"])
              elif isinstance(value, str):
                  labels = []
                  for label, pattern in patterns:
                      if pattern.search(value):
                          labels.append(label)
                          if label == "Anthropic API key":
                              break
                  if not labels:
                      return
                  names = sorted(set(assignment.findall(value)))
                  hosts = []
                  for raw_url in url_pattern.findall(value):
                      host = urlparse(raw_url).hostname
                      if host:
                          hosts.append(host.lower())
                  findings.append(
                      {
                          "json_path": ".".join(path),
                          "category": labels[0],
                          "assignment_names": names,
                          "provider_hosts": sorted(set(hosts)),
                      }
                  )

          walk(root, ["root"])
          print(json.dumps(findings, ensure_ascii=False, indent=2))
          print(f"finding_count={len(findings)}")
          PY
