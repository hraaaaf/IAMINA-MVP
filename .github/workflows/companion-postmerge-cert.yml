name: Companion post-merge exact-SHA certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/companion-postmerge-cert.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: companion-postmerge-cert-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    name: Certify ${{ matrix.label }} @ ${{ matrix.target_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: P3
            target_sha: 852d66bc51d42749cefb3381b07f18a18ae2ff28
          - label: P4
            target_sha: a9c54858781e901389bbb476c647e523b92fc907

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""

    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target_sha }}
          fetch-depth: 1

      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Requested SHA: ${{ matrix.target_sha }}"
          echo "Checked out SHA: ${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${{ matrix.target_sha }}"
          {
            echo "## Companion exact-SHA certification"
            echo "- Label: ${{ matrix.label }}"
            echo "- Requested SHA: ${{ matrix.target_sha }}"
            echo "- Checked out SHA: ${ACTUAL_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Secret hygiene — tracked files
        run: python scripts/check_secrets.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend certification dependencies
        working-directory: backend
        run: pip install -r requirements.txt ruff==0.15.17 bandit[toml] import-linter

      - name: Backend — ruff
        working-directory: backend
        run: ruff check .

      - name: Architecture boundaries
        working-directory: backend
        run: lint-imports

      - name: LLM gateway anti-bypass
        working-directory: backend
        run: python ../scripts/check_ai_egress_boundaries.py --check gateway

      - name: AI egress authorization anti-bypass
        working-directory: backend
        run: python ../scripts/check_ai_egress_boundaries.py --check egress

      - name: SAST — bandit
        working-directory: backend
        run: bandit -r . -ll -ii --skip B101,B311 -x ./tracking/tests,./amina/tests

      - name: OpenAPI schema is current
        working-directory: backend
        run: |
          python manage.py export_openapi > /tmp/openapi.json
          if ! diff -q /tmp/openapi.json ../docs/api/openapi.json > /dev/null; then
            echo "::error::docs/api/openapi.json is stale"
            diff ../docs/api/openapi.json /tmp/openapi.json | head -40 || true
            exit 1
          fi

      - name: Django model/migration drift
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///ci-test.db
        run: python manage.py makemigrations --check --dry-run

      - name: Backend — SQLite pytest
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///ci-test.db
        run: pytest --tb=short -q

      - name: PostgreSQL — migrate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_ci
        run: python manage.py migrate --noinput

      - name: PostgreSQL — full pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_ci
        run: pytest --tb=short -q

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: Frontend — dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Frontend — analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      - name: Frontend — tests
        working-directory: frontend
        run: flutter test --no-pub

      - name: Publish durable certification evidence
        if: always()
        uses: actions/github-script@v7
        env:
          CERT_LABEL: ${{ matrix.label }}
          TARGET_SHA: ${{ matrix.target_sha }}
          CERT_STATUS: ${{ job.status }}
        with:
          script: |
            const status = process.env.CERT_STATUS.toUpperCase();
            const label = process.env.CERT_LABEL;
            const sha = process.env.TARGET_SHA;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[Companion cert] ${label} ${status} ${sha.slice(0, 12)}`;
            const body = [
              `Exact-SHA Companion certification result.`,
              ``,
              `- Phase: ${label}`,
              `- SHA: \`${sha}\``,
              `- Result: **${status}**`,
              `- Workflow run: ${runUrl}`,
              `- Event: \`${context.eventName}\``,
              `- Workflow source ref: \`${context.ref}\``,
              ``,
              `The workflow checked out and asserted the exact target SHA before running secret hygiene, backend lint/architecture/AI-egress/SAST/OpenAPI checks, Django migration drift, SQLite pytest, PostgreSQL migrate + full pytest, Flutter analyze and Flutter tests.`
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
