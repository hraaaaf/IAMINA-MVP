name: W01 + D2 isolated Preview integration gate
on:
  push:
    branches:
      - integration/w01-d2-preview-only-20261027
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  backend-sqlite:
    name: D2 + W01 backend contracts (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt ruff==0.15.17 bandit[toml] import-linter
      - name: Ruff, import boundaries, egress guards, SAST
        run: |
          ruff check .
          lint-imports
          python ../scripts/check_ai_egress_boundaries.py --check gateway
          python ../scripts/check_ai_egress_boundaries.py --check egress
          bandit -r . -ll -ii --skip B101,B311
      - name: Schema and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py export_openapi > /tmp/w01-d2-openapi.json
          diff -q /tmp/w01-d2-openapi.json ../docs/api/openapi.json
      - name: Synthetic D2 + W01 focused tests
        run: |
          pytest --tb=short -q core/tests/test_d2_preview_consent.py core/tests/test_d2_in_app_inbox.py core/tests/test_d2_expired_notice_purge.py core/tests/test_w01_g5_preview_db_identity.py
      - name: Full Django test suite
        run: pytest --tb=short -q
  backend-postgres:
    name: D2 + W01 PostgreSQL migrate + full tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_ci
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Fresh schema migration chain and drift
        run: |
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
      - name: Full Django PostgreSQL suite
        run: pytest --tb=short -q
  frontend:
    name: W01 BFF + D2 Flutter and PWA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - name: Flutter analyze + tests + Web
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test --no-pub
          flutter build web --release --no-web-resources-cdn
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: W01 BFF transport + topology contract
        run: |
          npm install --no-audit --no-fund
          node --check api/preview-proxy.js
          node --test ../scripts/tests/test_w01_preview_bff.mjs ../scripts/tests/test_w01_g5_preview_web_harness.mjs
          python ../scripts/check_web_topology_contract.py
          python -m unittest discover -s ../scripts/tests -p test_w01_web_topology_contract.py -v
