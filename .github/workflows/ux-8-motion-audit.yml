name: UX-8 motion audit

on:
  push:
    branches:
      - audit/ux-8-motion-9f8bd4e
    paths:
      - .github/workflows/ux-8-motion-audit.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify product source is exact
        run: git diff --quiet 9f8bd4e6e4427e6ec6d7d8dced9936b5abec3ccc -- frontend
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Build audited web product
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --dart-define=IAMINA_AUDIT_ACCESS=true
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve Flutter web
        run: |
          nohup python3 -m http.server 8080 --directory frontend/build/web >/tmp/ux8-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ux8-server.log
          exit 1
      - name: Capture FR/AR normal and reduced motion
        run: node .github/ux8_motion_capture.js
      - name: Upload motion artifact
        uses: actions/upload-artifact@v4
        with:
          name: ux-8-motion-evidence
          path: ux8-motion
          if-no-files-found: error
          retention-days: 14
