name: P0-JOURNAL-2 apply Drift codegen

on:
  push:
    branches: [feat/p0-journal-express-event]
    paths: [.github/workflows/p0-journal-2-apply-drift-codegen.yml]

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-journal-express-event
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply intended additive local schema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/lib/data/drift/database.dart')
          s = p.read_text()
          if 'TextColumn get glycemicContext' not in s:
              s = s.replace(
                  "  TextColumn get mealType => text().nullable()();\n",
                  "  TextColumn get glycemicContext => text().nullable()();\n  TextColumn get mealType => text().nullable()();\n",
              )
          s = s.replace("  int get schemaVersion => 5;", "  int get schemaVersion => 6;")
          marker = "      if (from < 5) {\n        await m.addColumn(patientProfiles, patientProfiles.aiConsentGivenAt);\n      }\n"
          addition = "      if (from < 6) {\n        await m.addColumn(logEntries, logEntries.glycemicContext);\n      }\n"
          if addition not in s:
              if marker not in s:
                  raise SystemExit('migration marker not found')
              s = s.replace(marker, marker + addition)
          old = """    final mealSlots = [\n      // (hour, minute, mealType, baseGlucose, insulinBase)\n      (7,  15, 'À jeun',      95.0, 0.0),\n      (8,  30, 'Avant repas', 100.0, 0.0),\n      (9,  45, 'Après repas', 145.0, 0.0),\n      (13,  0, 'Avant repas', 110.0, 4.0),\n      (14, 30, 'Après repas', 170.0, 0.0),\n      (19,  0, 'Avant repas', 105.0, 6.0),\n      (20, 30, 'Après repas', 160.0, 0.0),\n      (23,  0, 'Nuit',        115.0, 0.0),\n    ];\n"""
          new = """    final mealSlots = [\n      // (hour, minute, glycemicContext, mealType, baseGlucose, insulinBase)\n      (7,  15, 'fasting',   null,        95.0, 0.0),\n      (8,  30, 'pre_meal',  'breakfast', 100.0, 0.0),\n      (9,  45, 'post_meal', 'breakfast', 145.0, 0.0),\n      (13,  0, 'pre_meal',  'lunch',     110.0, 4.0),\n      (14, 30, 'post_meal', 'lunch',     170.0, 0.0),\n      (19,  0, 'pre_meal',  'dinner',    105.0, 6.0),\n      (20, 30, 'post_meal', 'dinner',    160.0, 0.0),\n      (23,  0, 'other',     null,         115.0, 0.0),\n    ];\n"""
          if old in s:
              s = s.replace(old, new)
          s = s.replace(
              "        final (hour, minute, mealType, base, insulinBase) = slot;",
              "        final (hour, minute, glycemicContext, mealType, base, insulinBase) = slot;",
          )
          if 'glycemicContext: Value(glycemicContext)' not in s:
              s = s.replace(
                  "            mealType: Value(mealType),\n",
                  "            glycemicContext: Value(glycemicContext),\n            mealType: Value(mealType),\n",
                  1,
              )
          s = s.replace(
              "        mealType: const Value('Après repas'),\n",
              "        glycemicContext: const Value('post_meal'),\n        mealType: const Value('dinner'),\n",
          )
          p.write_text(s)
          PY
      - name: Generate Drift code
        working-directory: frontend
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart format lib/data/drift/database.dart lib/data/drift/database.g.dart
      - name: Commit generated pair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/lib/data/drift/database.dart frontend/lib/data/drift/database.g.dart
          git diff --cached --quiet && exit 0
          git commit -m 'feat(journal): persist separate glycemic context locally'
          git push origin HEAD:feat/p0-journal-express-event
