name: LLM provider comparison

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/evaluation/provider_multilingual_comparison.py"
      - "backend/evaluation/fixtures/provider_comparison_prices_2026-08-26.json"
      - "backend/evaluation/tests/test_provider_multilingual_comparison.py"
      - ".github/workflows/llm-provider-comparison.yml"

permissions:
  contents: read

concurrency:
  group: llm-provider-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: DeepInfra Together Cloudflare with Groq control
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: provider-comparison-nonproduction
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///provider-comparison.db
      LLM_PROVIDER_BENCHMARK_NETWORK_AUTHORIZED: "true"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      DEEPINFRA_TOKEN: ${{ secrets.DEEPINFRA_TOKEN }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Validate comparison contracts before network
        run: >-
          pytest -q
          evaluation/tests/test_provider_multilingual_comparison.py
          evaluation/tests/test_frug5_multilingual_quality_benchmark.py
          evaluation/tests/test_nonstt_evidence_gates.py
      - name: Run one bounded no-retry provider comparison
        run: >-
          python -m evaluation.provider_multilingual_comparison
          --output ../artifacts/llm-provider-comparison.json
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-provider-comparison
          path: artifacts/llm-provider-comparison.json
          if-no-files-found: warn
          retention-days: 14
