name: TEMP Migration Drift Inventory

on:
  push:
    branches:
      - fix/p0-migration-drift
    paths:
      - .github/workflows/migration-drift-temp.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -q -r backend/requirements.txt
      - name: Inventory model-to-migration drift
        run: |
          mkdir -p .ci
          cd backend
          set +e
          python manage.py makemigrations --check --dry-run --verbosity 3 > ../.ci/migration-drift.txt 2>&1
          CODE=$?
          echo "exit_code=$CODE" >> ../.ci/migration-drift.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/migration-drift.txt
          git commit -m "chore(p0): capture migration drift inventory"
          git push origin HEAD:fix/p0-migration-drift
