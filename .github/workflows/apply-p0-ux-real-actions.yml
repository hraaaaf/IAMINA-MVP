name: Apply P0 UX real-actions patch

on:
  push:
    branches: [fix/p0-ux-real-actions]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-ux-real-actions
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - name: Apply scoped patch
        run: python scripts/apply_p0_ux_real_actions.py

      - name: Format changed Dart files
        working-directory: frontend
        run: dart format lib/features/journal/ai_summary_screen.dart lib/features/import/import_screen.dart

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/lib/features/journal/ai_summary_screen.dart frontend/lib/features/import/import_screen.dart
          git commit -m "fix(p0-ux): replace no-op actions with truthful behavior"
          git push origin HEAD:fix/p0-ux-real-actions
