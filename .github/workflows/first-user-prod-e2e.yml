name: First-user production E2E

on:
  pull_request:
    paths:
      - 'tools/first_user_prod_e2e.js'
      - '.github/workflows/first-user-prod-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-first-user-prod:
    name: Real prod first-user 390x844
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IAMINA_PROD_URL: https://iamina-review.vercel.app
      E2E_OUT: first-user-prod-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Instrument signup result capture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/first_user_prod_e2e.js')
          s=p.read_text()
          needle="    await page.getByText('Créer',{exact:true}).last().click();\n"
          repl=needle+"    const postSignupEnd=Date.now()+25000; while(Date.now()<postSignupEnd && !routeOf(page).includes('/app-lock/setup') && !routeOf(page).includes('/onboarding')){ await sleep(250); }\n    await capture(page,'02-signup-result');\n    if(routeOf(page).includes('/app-lock/setup')){ await enableFlutterSemantics(page); await capture(page,'02-device-security'); await clickEnabledButton(page,20000); await waitPath(page,'/onboarding',20000); await sleep(1200); await enableFlutterSemantics(page); }\n"
          if needle not in s:
              raise SystemExit('signup click marker missing')
          s=s.replace(needle,repl,1)
          s=s.replace("    await page.getByText('Créer',{exact:true}).last().click();\n", "    await page.getByRole('button',{name:'Créer',exact:true}).click();\n", 1)
          s=s.replace("    await waitPath(page,'/onboarding',25000);\n", "", 1)
          override="expectText=async function(page,text,timeout=15000){const end=Date.now()+timeout;while(Date.now()<end){const dom=page.getByText(text,{exact:false});const n=await dom.count();for(let i=0;i<n;i++){if(await dom.nth(i).isVisible().catch(()=>false))return;}const labels=await page.locator('flt-semantics[aria-label]').evaluateAll((els,needle)=>els.map(e=>e.getAttribute('aria-label')||'').some(v=>v.includes(needle)),text).catch(()=>false);if(labels)return;await sleep(250);}throw new Error('Expected visible text or Flutter aria-label: '+text);};\n\n"
          s=s.replace("(async()=>{",override+"(async()=>{",1)
          p.write_text(s)
          PY
      - name: Run real production first-user journey
        run: node tools/first_user_prod_e2e.js
      - name: Upload E2E proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-real-first-user-prod-390x844
          path: first-user-prod-e2e/*
          if-no-files-found: warn
          retention-days: 14
