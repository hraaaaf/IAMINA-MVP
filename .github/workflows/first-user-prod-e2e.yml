name: First-user production E2E

on:
  pull_request:
    paths:
      - 'tools/first_user_prod_e2e.js'
      - 'tools/ux95_first_user_proof_check.js'
      - 'tools/ux95_live_demo_chat.js'
      - 'tools/ux95_signup_diagnostic.js'
      - '.github/workflows/first-user-prod-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  real-first-user-prod:
    # Never auto-create remote accounts on PRs; require an explicit manual gate.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.IAMINA_ALLOW_REAL_PROD_E2E == 'true' }}
    name: Real prod first-user 390x844
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IAMINA_PROD_URL: https://iamina-review.vercel.app
      E2E_OUT: first-user-prod-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run real production first-user journey
        run: node tools/first_user_prod_e2e.js
      - name: Diagnose synthetic pointer signup even when first-user fails
        if: always()
        run: node tools/ux95_signup_diagnostic.js
      - name: Independently verify demo chat with real browser text
        run: node tools/ux95_live_demo_chat.js
      - name: Verify local glucose and sync provenance in real deployed chat
        run: node tools/ux95_first_user_proof_check.js
      - name: Upload E2E proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-real-first-user-prod-390x844
          path: first-user-prod-e2e/*
          if-no-files-found: warn
          retention-days: 14
