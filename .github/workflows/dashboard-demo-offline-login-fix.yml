name: IAMINA certified offline demo login fix

on:
  push:
    branches:
      - audit/dashboard-demo-mobile-20260909
    paths:
      - '.github/workflows/dashboard-demo-offline-login-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-demo-mobile-20260909
          fetch-depth: 0
      - name: Guard certified backend mirror in offline demo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/lib/features/auth/login_screen_fr_certified.dart')
          text = p.read_text()
          old = '        await api.seedDemoData(); // best-effort backend mirror'
          new = """        if (!kOfflineDemo) {\n          await api.seedDemoData(); // best-effort backend mirror\n        }"""
          if new in text:
              print('already guarded')
          elif old in text:
              p.write_text(text.replace(old, new, 1))
          else:
              raise SystemExit('certified demo backend mirror line not found')
          PY
          git diff --check
          git diff -- frontend/lib/features/auth/login_screen_fr_certified.dart
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/lib/features/auth/login_screen_fr_certified.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: keep certified demo seed local offline'
          git push origin HEAD:audit/dashboard-demo-mobile-20260909
