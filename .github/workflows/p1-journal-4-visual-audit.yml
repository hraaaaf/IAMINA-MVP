name: P1-JOURNAL-4 visual audit

on:
  push:
    branches: [audit/p1-journal-4-visual]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@v4
        with:
          path: audit
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: 6293335446708c22a8b24df75e38caa299609953
          path: product
      - name: Overlay audit-only harness
        run: |
          mkdir -p product/frontend/test/audit product/frontend/lib/audit
          cp audit/frontend/test/audit/p1_journal_4_visual_audit_test.dart product/frontend/test/audit/
          cp audit/frontend/lib/audit/p1_journal_4_visual_main.dart product/frontend/lib/audit/
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: product/frontend
        run: flutter pub get
      - name: Render exact product matrix
        working-directory: product/frontend
        run: flutter test --update-goldens test/audit/p1_journal_4_visual_audit_test.dart
      - name: Build real-font audit surface
        working-directory: product/frontend
        run: flutter build web --release -t lib/audit/p1_journal_4_visual_main.dart
      - name: Capture Chromium FR/AR typography and RTL
        working-directory: product/frontend
        run: |
          python3 -m http.server 8080 -d build/web >/tmp/iamina-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          npx --yes playwright@1.55.0 install chromium
          mkdir -p test/audit/web-captures
          for LANG in fr ar; do
            npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "720,900" --wait-for-timeout 2500 "http://127.0.0.1:8080/?lang=$LANG" "test/audit/web-captures/${LANG}-720x900.png"
            npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "360,560" --wait-for-timeout 2500 "http://127.0.0.1:8080/?lang=$LANG" "test/audit/web-captures/${LANG}-360x560.png"
          done
      - name: Upload rendered matrix
        uses: actions/upload-artifact@v4
        with:
          name: p1-journal-4-visual-matrix-6293335
          path: |
            product/frontend/test/audit/goldens/*.png
            product/frontend/test/audit/web-captures/*.png
          if-no-files-found: error
