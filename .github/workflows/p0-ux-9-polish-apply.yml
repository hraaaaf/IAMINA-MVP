name: P0-UX-9 visual audit remediation

on:
  push:
    branches:
      - fix/p0-ux-9-small-screen
    paths:
      - .github/workflows/p0-ux-9-polish-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-ux-9-small-screen
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Apply audited small-screen polish
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          # Dashboard: compact first-use composition at <=600px height.
          p = Path('frontend/lib/features/dashboard/dashboard_screen.dart')
          s = p.read_text()
          s = replace_once(s,
              "  Widget build(BuildContext context) {\n    return Padding(\n      padding: const EdgeInsets.only(top: 40, bottom: 32),\n      child: Column(children: [\n        // Illustration\n        Container(\n          width: 96, height: 96,",
              "  Widget build(BuildContext context) {\n    final compactHeight = MediaQuery.sizeOf(context).height <= 600;\n    return Padding(\n      padding: EdgeInsets.only(\n        top: compactHeight ? 12 : 40,\n        bottom: compactHeight ? 16 : 32,\n      ),\n      child: Column(children: [\n        // Illustration\n        Container(\n          width: compactHeight ? 68 : 96,\n          height: compactHeight ? 68 : 96,",
              'dashboard compact shell')
          s = replace_once(s,
              "          child: const Center(child: Text('🩺', style: TextStyle(fontSize: 44))),\n        ),\n        const SizedBox(height: 28),",
              "          child: Center(\n            child: Text('🩺', style: TextStyle(fontSize: compactHeight ? 32 : 44)),\n          ),\n        ),\n        SizedBox(height: compactHeight ? 16 : 28),",
              'dashboard compact illustration')
          s = replace_once(s,
              "          style: const TextStyle(fontSize: 22, fontWeight: FontWeight.w800, color: AminaTheme.ink900, letterSpacing: -0.4),",
              "          style: TextStyle(fontSize: compactHeight ? 20 : 22, fontWeight: FontWeight.w800, color: AminaTheme.ink900, letterSpacing: -0.4),",
              'dashboard compact title')
          s = replace_once(s,
              "        const SizedBox(height: 10),\n        Padding(\n          padding: const EdgeInsets.symmetric(horizontal: 32),",
              "        SizedBox(height: compactHeight ? 6 : 10),\n        Padding(\n          padding: EdgeInsets.symmetric(horizontal: compactHeight ? 16 : 32),",
              'dashboard compact body spacing')
          s = replace_once(s,
              "        const SizedBox(height: 36),\n\n        // CTAs",
              "        SizedBox(height: compactHeight ? 18 : 36),\n\n        // CTAs",
              'dashboard compact CTA gap')
          s = replace_once(s,
              "                  padding: const EdgeInsets.symmetric(vertical: 16),",
              "                  padding: EdgeInsets.symmetric(vertical: compactHeight ? 13 : 16),",
              'dashboard compact primary CTA')
          s = replace_once(s,
              "                  padding: const EdgeInsets.symmetric(vertical: 15),",
              "                  padding: EdgeInsets.symmetric(vertical: compactHeight ? 12 : 15),",
              'dashboard compact secondary CTA')
          s = replace_once(s,
              "        const SizedBox(height: 32),\n        Wrap(spacing: 8, runSpacing: 8, alignment: WrapAlignment.center, children: [",
              "        SizedBox(height: compactHeight ? 18 : 32),\n        Wrap(spacing: 8, runSpacing: 8, alignment: WrapAlignment.center, children: [",
              'dashboard compact feature gap')
          p.write_text(s)

          # Summary: mobile product header, localized period labels and premium error card.
          p = Path('frontend/lib/features/journal/ai_summary_screen.dart')
          s = p.read_text()
          s = replace_once(s,
              "import '../../l10n/app_localizations.dart';\n",
              "import '../../l10n/app_localizations.dart';\nimport '../../l10n/audited_page_copy.dart';\n",
              'summary audited copy import')
          s = replace_once(s,
              "      // Floating chat button (bottom right)\n      floatingActionButton: _ChatFab(onTap: _openChat),\n",
              "",
              'summary redundant FAB')

          error_pattern = re.compile(r"  Widget _buildError\(\) \{.*?\n  \}\n\n  Widget _buildContent\(\) \{", re.S)
          error_replacement = '''  Widget _buildError() {
    final l10n = AppLocalizations.of(context)!;
    return Align(
      alignment: Alignment.topCenter,
      child: Padding(
        padding: const EdgeInsetsDirectional.fromSTEB(20, 32, 20, 24),
        child: ConstrainedBox(
          constraints: const BoxConstraints(maxWidth: 420),
          child: Container(
            width: double.infinity,
            padding: const EdgeInsets.all(24),
            decoration: BoxDecoration(
              color: AminaTheme.surface(context),
              borderRadius: BorderRadius.circular(20),
              border: Border.all(color: AminaTheme.divider(context)),
              boxShadow: AminaTheme.shadowClinical,
            ),
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                Container(
                  width: 48,
                  height: 48,
                  decoration: BoxDecoration(
                    color: AminaTheme.dangerBg,
                    borderRadius: BorderRadius.circular(14),
                  ),
                  child: const Icon(
                    Icons.cloud_off_outlined,
                    color: AminaTheme.dangerFg,
                    size: 24,
                  ),
                ),
                const SizedBox(height: 16),
                Text(
                  l10n.analysisUnavailableTitle,
                  textAlign: TextAlign.center,
                  style: TextStyle(
                    fontSize: 16,
                    fontWeight: FontWeight.w800,
                    color: AminaTheme.textPrimary(context),
                  ),
                ),
                const SizedBox(height: 8),
                Text(
                  _errorMessage!,
                  textAlign: TextAlign.center,
                  style: TextStyle(
                    fontSize: 13,
                    height: 1.45,
                    color: AminaTheme.textSecondary(context),
                  ),
                ),
                const SizedBox(height: 18),
                SizedBox(
                  width: double.infinity,
                  child: FilledButton.icon(
                    onPressed: _fetchData,
                    icon: const Icon(Icons.refresh, size: 17),
                    label: Text(l10n.retry),
                    style: FilledButton.styleFrom(
                      minimumSize: const Size.fromHeight(48),
                      shape: RoundedRectangleBorder(
                        borderRadius: BorderRadius.circular(14),
                      ),
                    ),
                  ),
                ),
              ],
            ),
          ),
        ),
      ),
    );
  }

  Widget _buildContent() {'''
          s, n = error_pattern.subn(error_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'summary error card: expected 1 block, found {n}')

          marker = 'class _SummaryTopBar extends StatelessWidget {'
          idx = s.index(marker)
          before, topbar = s[:idx], s[idx:]
          topbar = replace_once(topbar,
              "  Widget build(BuildContext context) {\n    return Container(",
              "  Widget build(BuildContext context) {\n    final l10n = AppLocalizations.of(context)!;\n    final isCompact = MediaQuery.sizeOf(context).width < 600;\n    return Container(",
              'summary topbar locals')
          rich_pattern = re.compile(r"              Expanded\(\n                child: RichText\(.*?\n              \),\n              Row\(", re.S)
          rich_replacement = '''              Expanded(
                child: Text(
                  isCompact ? l10n.navIamina : l10n.breadcrumb,
                  maxLines: 1,
                  overflow: TextOverflow.ellipsis,
                  style: TextStyle(
                    fontSize: isCompact ? 15 : 13,
                    fontWeight: isCompact ? FontWeight.w800 : FontWeight.w600,
                    color: AminaTheme.textPrimary(context),
                  ),
                ),
              ),
              Row('''
          topbar, n = rich_pattern.subn(rich_replacement, topbar, count=1)
          if n != 1:
              raise SystemExit(f'summary breadcrumb: expected 1 block, found {n}')
          topbar = replace_once(topbar, "label: '7j',", "label: l10n.period7Days,", 'summary 7d')
          topbar = replace_once(topbar, "label: '21j',", "label: l10n.period21Days,", 'summary 21d')
          topbar = replace_once(topbar, "label: '90j',", "label: l10n.period90Days,", 'summary 90d')
          s = before + topbar

          greeting_marker = 'class _GreetingHeader extends StatelessWidget {'
          idx = s.index(greeting_marker)
          before, greeting = s[:idx], s[idx:]
          greeting = replace_once(greeting,
              "    final name = _firstName();\n    return Column(",
              "    final copy = AuditedPageCopy.of(context);\n    final name = _firstName();\n    final hour = DateTime.now().hour;\n    return Column(",
              'summary greeting locals')
          greeting = replace_once(greeting,
              "          name.isNotEmpty ? 'Bonjour, $name.' : 'Bonjour !',",
              "          copy.greeting(hour, name),",
              'summary localized greeting')
          greeting = replace_once(greeting,
              "          'Voici ce qu\\'IAmina a observé sur vos $periodDays derniers jours.',",
              "          copy.observation(periodDays),",
              'summary localized observation')
          s = before + greeting
          p.write_text(s)

          # Profile: reduce promotional elevation and remove duplicate completion percentage.
          p = Path('frontend/lib/features/profile/profile_screen.dart')
          s = p.read_text()
          s = replace_once(s, '          boxShadow: AminaTheme.shadowCardLG,', '          boxShadow: AminaTheme.shadowCard,', 'profile IA card shadow')
          s = replace_once(s,
              '    final label = copy.profileCompletionLabel(pct);',
              '    final label = pct >= 100 ? copy.profileComplete : AppLocalizations.of(context)!.profile;',
              'profile non-duplicated completion label')
          p.write_text(s)

          # Canonical localization additions without reformatting ARBs.
          additions = {
              'fr': [
                  ('analysisUnavailableTitle', 'Analyse momentanément indisponible'),
                  ('period7Days', '7 j'), ('period21Days', '21 j'), ('period90Days', '90 j'),
              ],
              'en': [
                  ('analysisUnavailableTitle', 'Analysis temporarily unavailable'),
                  ('period7Days', '7 d'), ('period21Days', '21 d'), ('period90Days', '90 d'),
              ],
              'ar': [
                  ('analysisUnavailableTitle', 'التحليل غير متاح مؤقتًا'),
                  ('period7Days', '٧ أيام'), ('period21Days', '٢١ يومًا'), ('period90Days', '٩٠ يومًا'),
              ],
          }
          for locale, pairs in additions.items():
              p = Path(f'frontend/lib/l10n/app_{locale}.arb')
              s = p.read_text()
              anchor = '  "analysisLoading": '
              pos = s.find(anchor)
              if pos < 0:
                  raise SystemExit(f'{locale}: analysisLoading anchor missing')
              for key, _ in pairs:
                  if f'"{key}"' in s:
                      raise SystemExit(f'{locale}: {key} already exists unexpectedly')
              block = ''.join(f'  "{key}": "{value}",\n' for key, value in pairs)
              s = s[:pos] + block + s[pos:]
              p.write_text(s)
          PY

          cd frontend
          flutter pub get
          flutter gen-l10n
          flutter analyze --no-fatal-infos
          flutter test --no-pub test/p0_ux_9_small_screen_contract_test.dart test/p0_ux_7_desktop_tablet_contract_test.dart test/p0_audited_page_localization_contract_test.dart
          cd ..

          git rm .github/workflows/p0-ux-9-polish-apply.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/lib/features/dashboard/dashboard_screen.dart \
                  frontend/lib/features/journal/ai_summary_screen.dart \
                  frontend/lib/features/profile/profile_screen.dart \
                  frontend/lib/l10n/app_fr.arb frontend/lib/l10n/app_en.arb frontend/lib/l10n/app_ar.arb \
                  frontend/lib/l10n/app_localizations.dart frontend/lib/l10n/app_localizations_fr.dart \
                  frontend/lib/l10n/app_localizations_en.dart frontend/lib/l10n/app_localizations_ar.dart
          git commit -m 'fix(ux): polish certified 360x560 flows after visual audit'
          git push origin HEAD:fix/p0-ux-9-small-screen
