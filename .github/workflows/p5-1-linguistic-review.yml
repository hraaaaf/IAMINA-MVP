name: P5-1 exact-SHA linguistic review packet

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/evaluation/p5_1_linguistic_review_benchmark.py"
      - "backend/evaluation/tests/test_p5_1_linguistic_review_benchmark.py"
      - "backend/evaluation/fixtures/frug7_groq_text_price.json"
      - "backend/evaluation/provider_benchmark_preflight.py"
      - ".github/workflows/p5-1-linguistic-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-1-linguistic-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  packet:
    name: Groq one-call 10-lane native-review packet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: p5-1-linguistic-review-nonproduction
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///p5-1-linguistic-review.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      P5_1_NETWORK_AUTHORIZED: "true"
      BENCHMARK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Validate P5-1 packet contracts before network
        run: pytest -q evaluation/tests/test_p5_1_linguistic_review_benchmark.py
      - name: Run one bounded 10-lane batch
        run: >-
          python -m evaluation.p5_1_linguistic_review_benchmark
          --output ../artifacts/p5-1-linguistic-review.json
      - name: Upload native-review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-1-current-sha-linguistic-review
          path: artifacts/p5-1-linguistic-review.json
          if-no-files-found: warn
          retention-days: 14
