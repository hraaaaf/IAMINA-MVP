name: D1 P0 legacy offline writer quarantine (synthetic / NO CLINICAL GO)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/d1-p0-legacy-offline-quarantine.yml'
      - 'frontend/lib/data/drift/web_patient_vault_cipher_candidate.dart'
      - 'frontend/tool/d1_legacy_offline_quarantine_probe.dart'
      - 'frontend/web/d1_vault_crypto_candidate.js'
      - 'tools/d1_legacy_offline_quarantine_browser.js'
      - 'tools/d1_installed_pwa_offline_writer_browser.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-legacy-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-quarantine:
    name: Old PWA offline writer detection / non-deletion / NO-GO
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Resolve dependencies and analyze synthetic quarantine probe
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos tool/d1_legacy_offline_quarantine_probe.dart
      - name: Compile candidate using actual AppDatabase (NO DEPLOY)
        working-directory: frontend
        run: flutter build web --release --no-web-resources-cdn -t tool/d1_legacy_offline_quarantine_probe.dart
      - name: Vendor SHA-pinned SQLite3MC only into disposable build
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            'https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-2.9.4/sqlite3mc.wasm' \
            -o frontend/build/web/sqlite3mc.wasm
          echo '5a1cfe40252d05bbd174e66351d3c282f69784c6fd0c2d099bf7135c6e91b4ec  frontend/build/web/sqlite3mc.wasm' | sha256sum -c -
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Emulate late offline legacy IndexedDB writer then demand deny-on-reopen
        shell: bash
        env:
          D1_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$D1_CANDIDATE_SHA"
          python3 -m http.server 7475 --bind 127.0.0.1 \
            --directory frontend/build/web >/tmp/d1-legacy-offline-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:7475/ >/dev/null
          node tools/d1_legacy_offline_quarantine_browser.js
          node tools/d1_installed_pwa_offline_writer_browser.js
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-legacy-offline-quarantine-evidence
          path: |
            d1-legacy-offline-quarantine-proof/*
            d1-installed-pwa-offline-proof/*
            /tmp/d1-legacy-offline-http.log
          retention-days: 7
