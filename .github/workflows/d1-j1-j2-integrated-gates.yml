name: D1 J1 J2 synthetic restore witness / crash fence (NO CLINICAL GO)

on:
  pull_request:
    branches: [test/d1-j1-synthetic-backup-restore-20261114]
    paths:
      - '.github/workflows/d1-j1-j2-integrated-gates.yml'
      - 'tools/d1_j1_synthetic_backup_restore_browser.js'
      - 'tools/d1_j2_migration_preflight_candidate.js'
      - 'tools/d1_j1_j2_integrated_witness_browser.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-j1-j2-integrated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-cross-evidence:
    name: Trust-bound receipt simulation, fresh restore and crash quarantine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify harness syntax and install Chromium
        run: |
          node --check tools/d1_j1_synthetic_backup_restore_browser.js
          node --check tools/d1_j2_migration_preflight_candidate.js
          node --check tools/d1_j1_j2_integrated_witness_browser.js
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Independent logical backup, J1-to-J2 witness and negative safety gates
        shell: bash
        env:
          D1_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$D1_CANDIDATE_SHA"
          mkdir -p /tmp/iamina-d1-j1-j2-fixture
          cp tools/d1_j2_migration_preflight_candidate.js /tmp/iamina-d1-j1-j2-fixture/
          printf '<!doctype html><meta charset="utf-8"><script src="/d1_j2_migration_preflight_candidate.js"></script>' > /tmp/iamina-d1-j1-j2-fixture/index.html
          printf 'self.addEventListener("install",()=>self.skipWaiting());' > /tmp/iamina-d1-j1-j2-fixture/j2-legacy-sw.js
          python3 -m http.server 7481 --bind 127.0.0.1 --directory /tmp/iamina-d1-j1-j2-fixture >/tmp/d1-j1-j2-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:7481/ >/dev/null
          node tools/d1_j1_synthetic_backup_restore_browser.js
          node tools/d1_j1_j2_integrated_witness_browser.js
      - name: Preserve proof metadata only (no archived patient records)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-j1-j2-integrated-synthetic-proof
          path: |
            d1-j1-synthetic-backup-proof/proof.json
            d1-j1-j2-integrated-proof/proof.json
            /tmp/d1-j1-j2-http.log
          retention-days: 7
          if-no-files-found: warn
