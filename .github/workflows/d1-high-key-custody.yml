name: D1 owner-bound device key custody and 256-bit recovery (NO DEPLOY)

on:
  push:
    branches: [research/d1-key-custody-device-recovery-20261112]
    paths:
      - 'frontend/web/d1_device_key_custody_v1.js'
      - 'frontend/web/d1_device_key_harness.html'
      - 'tools/d1_full/device_key_browser.cjs'
      - 'frontend/lib/data/drift/d1_web_vault_key_admission.dart'
      - 'frontend/lib/d1_high_key_custody_probe_main.dart'
      - '.github/workflows/d1-high-key-custody.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-key-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse JS without executing patient UI
        shell: bash
        run: |
          set -euo pipefail
          node --check frontend/web/d1_device_key_custody_v1.js
          node --check tools/d1_full/device_key_browser.cjs
      - name: Install pinned Playwright
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          if [ "${{ matrix.browser }}" = chromium ]; then npx playwright install chromium; fi
      - name: Real WebCrypto non-exportable CryptoKey and IndexedDB persistence
        env:
          D1_BROWSER: ${{ matrix.browser }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 7417 --bind 127.0.0.1 \
            --directory frontend/web >/tmp/d1-key-custody.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:7417/d1_device_key_harness.html >/dev/null
          if [ "$D1_BROWSER" = webkit ]; then
            docker run --rm --network host \
              --env D1_BROWSER=webkit \
              --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
              --volume "$PWD:/work" --workdir /work \
              mcr.microsoft.com/playwright:v1.55.0-noble \
              node tools/d1_full/device_key_browser.cjs
          else
            node tools/d1_full/device_key_browser.cjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-device-key-${{ matrix.browser }}-synthetic-no-go
          path: d1-device-key-*.json
          retention-days: 30
          if-no-files-found: warn
