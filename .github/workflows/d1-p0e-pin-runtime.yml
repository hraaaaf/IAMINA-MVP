name: D1 P0-E materialize pinned Web runtime (staging branch only)

on:
  push:
    branches: [integration/d1-p0e-drift-2354-clean-web-20261111]
    paths:
      - '.github/workflows/d1-p0e-pin-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin:
    if: github.ref == 'refs/heads/integration/d1-p0e-drift-2354-clean-web-20261111' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
      - name: Resolve actual pubspec.lock and verify official Web runtime SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          flutter pub get
          grep -A 6 '^  drift:' pubspec.lock
          grep -A 6 '^  drift_flutter:' pubspec.lock
          grep -A 6 '^  sqlite3:' pubspec.lock
          bash scripts/verify_drift_web_assets.sh fetch
          cd ..
          git add -- frontend/pubspec.lock frontend/web/drift_worker.js frontend/web/sqlite3.wasm
          if git diff --cached --quiet; then
            echo 'Pinned assets and lockfile already match'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(d1-p0e): commit locked deps and SHA-pinned Web runtime [skip ci]'
          # Fast forward only; never rewrite another contributor's changes.
          git push origin HEAD:refs/heads/integration/d1-p0e-drift-2354-clean-web-20261111
          echo "PINNED_HEAD=$(git rev-parse HEAD)"
