name: P2 8 docs sync

on:
  push:
    branches: [agent/p2-companion-8-closeout]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-companion-8-closeout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync canonical status
        run: |
          python - <<'PY'
          from pathlib import Path

          road = Path('docs/ROADMAP.md')
          lines = road.read_text().splitlines()
          out = []
          skip_next = False
          for line in lines:
              if skip_next:
                  skip_next = False
                  continue
              if line.startswith('> **Last updated:**'):
                  out.append('> **Last updated:** 2026-08-13 — P2-COMPANION-8 is certified, merged and post-merge green. **P3-HORIZON — Evidence Horizon Scanner is NEXT.** UX visual rebase remains closed through UX-11 at 9.8/10.')
              elif line.startswith('| Companion intelligence / proactivity |'):
                  out.append('| Companion intelligence / proactivity | P0 foundation + Clinical Twin + proactive lifecycle + P2-COMPANION-0..8 | ✅ P2-COMPANION closed — P3-HORIZON next | P2-8 merge `7e4bfe36…`; post-merge CI #1980 + drift #1792 green |')
              elif line.startswith('### ▶️ P2-COMPANION-8'):
                  out.append('### ✅ P2-COMPANION-8 — Safety + Certification — CLOSED')
                  skip_next = True
              elif line.startswith('| **P2-COMPANION-8** |'):
                  out.append('| **P2-COMPANION-8** | **Safety + Certification** | ✅ **CLOSED** | PR #166 merge `7e4bfe36…`; release matrix + pytest manifest; post-merge CI #1980 + drift #1792 green |')
              elif line.startswith('| P3-HORIZON |'):
                  out.append('| **P3-HORIZON** | **Evidence Horizon Scanner** | ▶️ **NEXT** | Keep maturity classes separated; external sources cannot alter runtime rules without separate promotion review |')
              elif line.startswith('1. **Companion intelligence product lane:**'):
                  out.append('1. **Companion intelligence product lane:** P2-COMPANION-0..8 is closed; execute **P3-HORIZON — Evidence Horizon Scanner** next.')
              else:
                  out.append(line)
          road.write_text('\n'.join(out) + '\n')

          contract = Path('docs/COMPANION_INTELLIGENCE_CONTRACT.md')
          lines = contract.read_text().splitlines()
          out = []
          inserted = False
          for line in lines:
              if line.startswith('| **P2-COMPANION-8** |'):
                  out.append('| **P2-COMPANION-8** | **Safety + Certification** | ✅ Certified in PR #166; merge `7e4bfe36…`; post-merge CI #1980 + drift #1792 green |')
              elif line.startswith('## 6.') and not inserted:
                  out.extend([
                      '### 5.7 Safety + Certification closure',
                      '',
                      'P2-COMPANION-8 makes the certified companion boundaries permanent release evidence through `docs/P2_COMPANION_8_CERTIFICATION_MATRIX.md` and the pytest release manifest. No runtime behavior changed in this lot. PR #166 merged as `7e4bfe367c9cdd908024c9ca8dbd907add84fc49`; post-merge CI #1980 and migration drift #1792 passed.',
                      '',
                  ])
                  inserted = True
                  out.append(line)
              else:
                  out.append(line)
          contract.write_text('\n'.join(out) + '\n')

          closeout = Path('docs/P2_COMPANION_8_CLOSEOUT.md')
          lines = closeout.read_text().splitlines()
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line == 'Status: PENDING POST-MERGE':
                  out.append('Status: CLOSED')
                  i += 1
              elif line == '## Remaining closeout gate':
                  out.extend(['## Post-merge evidence', '', '- CI #1980: SUCCESS', '- Django migration drift #1792: SUCCESS'])
                  i += 1
                  while i < len(lines) and not lines[i].startswith('## '):
                      i += 1
              else:
                  out.append(line)
                  i += 1
          closeout.write_text('\n'.join(out) + '\n')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ROADMAP.md docs/COMPANION_INTELLIGENCE_CONTRACT.md docs/P2_COMPANION_8_CLOSEOUT.md
          git commit -m "docs: sync P2-8 status"
          git push
