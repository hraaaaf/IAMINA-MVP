name: Temporary fix P2 doctor assembler test fixture

on:
  push:
    branches:
      - agent/p2-doctor-deterministic-assembler

permissions:
  contents: write

jobs:
  fix-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-doctor-deterministic-assembler
      - name: Fix checkpoint-at-window-end fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/diabetes/tests/test_p2_doctor_assembler.py')
          text = p.read_text()
          old = '''        checkpoint = ConsultationReviewCheckpoint(
            reviewed_at=self.end,
            source="test.explicit-clinician-review",
        )
        with self.assertRaisesRegex(ValueError, "checkpoint must precede"):
            assemble_consultation_brief(
                patient_id=self.patient.id,
                window_start=self.end,
                window_end=self.end + timedelta(days=1),
                review_checkpoint=checkpoint,
            )
'''
          new = '''        window_end = self.end + timedelta(days=1)
        checkpoint = ConsultationReviewCheckpoint(
            reviewed_at=window_end,
            source="test.explicit-clinician-review",
        )
        with self.assertRaisesRegex(ValueError, "checkpoint must precede"):
            assemble_consultation_brief(
                patient_id=self.patient.id,
                window_start=self.end,
                window_end=window_end,
                review_checkpoint=checkpoint,
            )
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one fixture anchor, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fixture fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/diabetes/tests/test_p2_doctor_assembler.py
          git diff --cached --quiet && exit 0
          git commit -m "test(clinical): correct assembler checkpoint fixture"
          git push origin HEAD:agent/p2-doctor-deterministic-assembler
