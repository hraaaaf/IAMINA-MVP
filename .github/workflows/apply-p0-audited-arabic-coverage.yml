name: Finalize audited-page Arabic coverage

on:
  push:
    branches:
      - fix/p0-audited-pages-arabic-coverage-v2
    paths:
      - scripts/fix_p0_profile_completion_localization.py
      - .github/workflows/apply-p0-audited-arabic-coverage.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-audited-pages-arabic-coverage-v2
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Close residual Profile completion copy
        run: python scripts/fix_p0_profile_completion_localization.py

      - name: Format and validate final product state
        working-directory: frontend
        run: |
          flutter pub get
          dart format lib/l10n/audited_page_copy.dart lib/features/profile/profile_screen.dart test/p0_audited_page_localization_contract_test.dart
          flutter analyze --no-fatal-infos
          flutter test test/p0_audited_page_localization_contract_test.dart
          flutter test test/p0_clinical_explainability_contract_test.dart
          flutter test test/p0_mobile_import_navigation_test.dart

      - name: Commit final product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/l10n/audited_page_copy.dart frontend/lib/features/profile/profile_screen.dart frontend/test/p0_audited_page_localization_contract_test.dart
          git commit -m "fix(l10n): localize Profile completion copy"
          git push origin HEAD:fix/p0-audited-pages-arabic-coverage-v2
