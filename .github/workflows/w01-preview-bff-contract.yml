name: W01 Web Preview same-origin BFF contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/api/preview-proxy.js'
      - 'frontend/vercel.json'
      - 'frontend/vercel_build.sh'
      - 'frontend/lib/services/api_client.dart'
      - 'frontend/lib/services/auth_service.dart'
      - 'frontend/lib/services/preview_api_origin.dart'
      - 'scripts/check_web_topology_contract.py'
      - 'scripts/tests/test_w01_web_topology_contract.py'
      - 'scripts/tests/test_w01_preview_bff.mjs'
      - 'docs/assessments/2026-10-17-w01-preview-bff-adversarial-review.md'
      - 'docs/assessments/2026-10-16-w01-before-w02-gates.md'
      - '.github/workflows/w01-preview-bff-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bff-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Vercel OIDC helper for runtime contract
        run: npm install --prefix frontend --no-audit --no-fund
      - name: Assert Node parse and adversarial BFF transport
        run: |
          node --check frontend/api/preview-proxy.js
          node --test scripts/tests/test_w01_preview_bff.mjs
      - name: Reject topology, bypass and Flutter Preview regressions
        run: |
          python scripts/check_web_topology_contract.py
          python -m unittest discover -s scripts/tests -p test_w01_web_topology_contract.py -v
