name: Temporary companion doc truth

on:
  push:
    branches:
      - agent/p2-companion-change-since-review

permissions:
  contents: write

jobs:
  fix-doc-truth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-companion-change-since-review
      - name: Remove superseded P2 doctor framing
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "docs/SPECS.md": [
                  (
                      "- P2-DOCTOR begins with versioned structured contract `consultation-brief.v1`; this contract is downstream review support and does not create new clinical truth;",
                      "- the certified PR #143 `consultation-brief.v1` contract is preserved as the restricted P2-COMPANION-5 consultation-support sub-contract; it is downstream review support and does not create new clinical truth;",
                  ),
                  (
                      "- P2-DOCTOR-0 does not replace the existing `/api/v1/ai/doctor-brief`, create a persisted review checkpoint, assemble a live brief, or add clinician/patient UX. Those capabilities require later separately certified LOTs.",
                      "- the inherited PR #143 contract does not by itself replace the existing `/api/v1/ai/doctor-brief`, assemble a live brief, or add clinician/patient UX. P2-COMPANION-1 companion-review anchors are not clinician-consultation checkpoints; consultation assembly and UX remain later P2-COMPANION-5 work.",
                  ),
              ],
              "docs/MEDICAL_DATA_PLAN.md": [
                  (
                      "- P2-DOCTOR-0 defines this contract only. Persistence of review checkpoints, deterministic assembly, endpoint replacement and clinician UX require separate release-gated work.",
                      "- the certified PR #143 contract is retained as restricted P2-COMPANION-5 consultation support. P2-COMPANION-1 companion-review anchors do not establish clinician consultation history; consultation assembly, endpoint replacement and clinician UX remain separate release-gated work.",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              p = Path(path)
              text = p.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"expected one anchor in {path}, found {count}: {old[:60]}")
                  text = text.replace(old, new, 1)
              p.write_text(text)
          PY
      - name: Commit doc truth fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SPECS.md docs/MEDICAL_DATA_PLAN.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(companion): remove superseded doctor framing"
          git push origin HEAD:agent/p2-companion-change-since-review
