name: P5-6 Vercel exact-source probe

on:
  push:
    branches:
      - ops/p5-6-vercel-deploy-52c0238

permissions:
  contents: read

concurrency:
  group: p5-6-vercel-exact-candidate-deploy
  cancel-in-progress: false

env:
  TARGET_SHA: 5b27a22fc5c05a06e7eeeb0e841bb0e7dadce7f6
  TARGET_REF: main
  VERCEL_ORG_ID: team_NNhXPDOIfjGNBcn253btpyk0
  VERCEL_PROJECT_ID: prj_Pn9FnyconF3h2w9gOU74iV98kJoU
  VERCEL_PROJECT_NAME: iamina-certified

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "exact_source=$actual"

      - name: Verify deployment credential and project access
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          code="$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          echo "vercel_project_read_http=$code"
          test "$code" = "200"

      - name: Audit runtime env metadata and provision required non-DB settings
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/envs.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID")"
          echo "vercel_env_list_http=$code"
          test "$code" = "200"

          python - <<'PY'
          import json, secrets
          data = json.load(open('/tmp/envs.json'))
          envs = data.get('envs', [])

          def targets_of(item):
              target = item.get('target', [])
              if isinstance(target, str):
                  return {target}
              return set(target or [])

          target_map = {}
          for item in envs:
              key = item.get('key')
              if not key:
                  continue
              target_map.setdefault(key, set()).update(targets_of(item))

          for key in sorted(target_map):
              print(f"env_key={key};targets={','.join(sorted(target_map[key]))}")

          db_targets = target_map.get('DATABASE_URL', set())
          print('database_url_preview=' + str('preview' in db_targets).lower())
          print('database_url_production=' + str('production' in db_targets).lower())

          payload = [
              {
                  'key': 'DEBUG',
                  'value': 'False',
                  'type': 'plain',
                  'target': ['preview', 'production'],
                  'comment': 'IAMINA Vercel production-safe runtime setting',
              },
              {
                  'key': 'ALLOWED_HOSTS',
                  'value': 'iamina-certified.vercel.app',
                  'type': 'plain',
                  'target': ['preview', 'production'],
                  'comment': 'IAMINA stable backend host; exact VERCEL_URL is appended at runtime',
              },
              {
                  'key': 'CORS_ALLOWED_ORIGINS',
                  'value': 'https://iamina-review.vercel.app',
                  'type': 'plain',
                  'target': ['preview', 'production'],
                  'comment': 'IAMINA approved HTTPS frontend origin',
              },
              {
                  'key': 'CSRF_TRUSTED_ORIGINS',
                  'value': 'https://iamina-review.vercel.app',
                  'type': 'plain',
                  'target': ['preview', 'production'],
                  'comment': 'IAMINA approved HTTPS frontend origin',
              },
          ]

          secret_targets = target_map.get('SECRET_KEY', set())
          missing_secret_targets = [t for t in ('preview', 'production') if t not in secret_targets]
          if missing_secret_targets:
              payload.append({
                  'key': 'SECRET_KEY',
                  'value': secrets.token_urlsafe(64),
                  'type': 'sensitive',
                  'target': missing_secret_targets,
                  'comment': 'Generated inside CI and stored only by Vercel; value is never logged',
              })

          with open('/tmp/runtime-env-payload.json', 'w') as f:
              json.dump(payload, f, separators=(',', ':'))
          print('runtime_env_upsert_keys=' + ','.join(item['key'] for item in payload))
          PY

          code="$(curl -sS -o /tmp/env-upsert.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/runtime-env-payload.json \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&upsert=true")"
          echo "vercel_env_upsert_http=$code"
          case "$code" in
            200|201) ;;
            *) exit 1 ;;
          esac
          python - <<'PY'
          import json
          data = json.load(open('/tmp/env-upsert.json'))
          failed = data.get('failed') or []
          print('runtime_env_failed_count=' + str(len(failed)))
          for item in failed:
              safe = {k: item.get(k) for k in ('key','error','message') if k in item}
              print('runtime_env_failure=' + json.dumps(safe, separators=(',', ':')))
          if failed:
              raise SystemExit(1)
          PY

      - name: Create exact preview deployment through Vercel API
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          sha = os.environ['TARGET_SHA']
          ref = os.environ['TARGET_REF']
          payload = {
              'name': os.environ['VERCEL_PROJECT_NAME'],
              'project': os.environ['VERCEL_PROJECT_ID'],
              'gitSource': {
                  'type': 'github',
                  'org': 'hraaaaf',
                  'repo': 'IAMINA-MVP',
                  'ref': ref,
                  'sha': sha,
              },
              'gitMetadata': {
                  'remoteUrl': 'https://github.com/hraaaaf/IAMINA-MVP',
                  'commitRef': ref,
                  'commitSha': sha,
                  'dirty': False,
                  'ci': True,
                  'ciType': 'github-actions',
                  'rootDirectory': 'backend',
              },
              'projectSettings': {
                  'rootDirectory': 'backend',
                  'serverlessFunctionRegion': 'cdg1',
              },
          }
          with open('/tmp/deploy-payload.json', 'w') as f:
              json.dump(payload, f, separators=(',', ':'))
          PY
          code="$(curl -sS -o /tmp/deploy.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/deploy-payload.json \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID&forceNew=1")"
          echo "vercel_create_http=$code"
          python - <<'PY'
          import json
          data = json.load(open('/tmp/deploy.json'))
          safe = {k: data.get(k) for k in ('id','name','url','status','readyState','errorCode','errorMessage') if k in data}
          print('vercel_create_response=' + json.dumps(safe, separators=(',', ':')))
          if not data.get('id'):
              raise SystemExit(1)
          print('deployment_id=' + data['id'])
          print('deployment_url=https://' + data['url'])
          PY
          case "$code" in
            200|201) ;;
            *) exit 1 ;;
          esac
