name: P5-6 exact Vercel candidate deploy

on:
  push:
    branches:
      - ops/p5-6-vercel-deploy-52c0238

permissions:
  contents: read

concurrency:
  group: p5-6-vercel-exact-candidate-deploy
  cancel-in-progress: false

env:
  TARGET_SHA: 52c0238fede74a1ba85fd3df32b1e89268bbe8f7
  VERCEL_ORG_ID: team_NNhXPDOIfjGNBcn253btpyk0
  VERCEL_PROJECT_ID: prj_Pn9FnyconF3h2w9gOU74iV98kJoU
  VERCEL_PROJECT_NAME: iamina-certified

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "exact_candidate=$actual"

      - name: Verify deployment credential exists
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN repository secret is missing" >&2; exit 78; }

      - name: Verify token can read exact project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          echo "vercel_project_read_http=$code"
          test "$code" = "200"
          python - <<'PY'
          import json
          data = json.load(open('/tmp/project.json'))
          print('vercel_project_name=' + str(data.get('name')))
          print('vercel_project_id=' + str(data.get('id')))
          PY

      - name: Create exact production deployment through Vercel API
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          sha = os.environ['TARGET_SHA']
          payload = {
              'name': os.environ['VERCEL_PROJECT_NAME'],
              'project': os.environ['VERCEL_PROJECT_ID'],
              'target': 'production',
              'gitSource': {
                  'type': 'github',
                  'org': 'hraaaaf',
                  'repo': 'IAMINA-MVP',
                  'ref': 'main',
                  'sha': sha,
              },
              'gitMetadata': {
                  'remoteUrl': 'https://github.com/hraaaaf/IAMINA-MVP',
                  'commitRef': 'main',
                  'commitSha': sha,
                  'dirty': False,
                  'ci': True,
                  'ciType': 'github-actions',
                  'rootDirectory': 'backend',
              },
              'projectSettings': {
                  'rootDirectory': 'backend',
                  'serverlessFunctionRegion': 'cdg1',
              },
          }
          with open('/tmp/deploy-payload.json', 'w') as f:
              json.dump(payload, f, separators=(',', ':'))
          PY
          code="$(curl -sS -o /tmp/deploy.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/deploy-payload.json \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID&forceNew=1")"
          echo "vercel_create_http=$code"
          python - <<'PY'
          import json
          data = json.load(open('/tmp/deploy.json'))
          safe = {k: data.get(k) for k in ('id','name','url','status','readyState','errorCode','errorMessage') if k in data}
          print('vercel_create_response=' + json.dumps(safe, separators=(',', ':')))
          if not data.get('id'):
              raise SystemExit(1)
          with open('/tmp/deployment-id', 'w') as f:
              f.write(data['id'])
          with open('/tmp/deployment-url', 'w') as f:
              f.write('https://' + data['url'])
          PY
          case "$code" in
            200|201) ;;
            *) exit 1 ;;
          esac
          echo "deployment_id=$(cat /tmp/deployment-id)" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$(cat /tmp/deployment-url)" >> "$GITHUB_OUTPUT"

      - name: Deployment evidence
        shell: bash
        run: |
          echo "candidate_sha=$TARGET_SHA"
          echo "deployment_id=${{ steps.deploy.outputs.deployment_id }}"
          echo "deployment_url=${{ steps.deploy.outputs.deployment_url }}"
