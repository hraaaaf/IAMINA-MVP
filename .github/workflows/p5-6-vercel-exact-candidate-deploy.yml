name: P5-6 Vercel exact-candidate production

on:
  push:
    branches:
      - ops/p5-6-vercel-deploy-52c0238

permissions:
  contents: read

concurrency:
  group: p5-6-vercel-exact-candidate-deploy
  cancel-in-progress: false

env:
  TARGET_SHA: 5b27a22fc5c05a06e7eeeb0e841bb0e7dadce7f6
  TARGET_REF: main
  VERCEL_ORG_ID: team_NNhXPDOIfjGNBcn253btpyk0
  VERCEL_PROJECT_ID: prj_Pn9FnyconF3h2w9gOU74iV98kJoU
  VERCEL_PROJECT_NAME: iamina-certified

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "exact_source=$actual"

      - name: Verify Vercel project and DATABASE_URL targets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          code="$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          echo "vercel_project_read_http=$code"
          test "$code" = "200"

          code="$(curl -sS -o /tmp/envs.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID")"
          echo "vercel_env_list_http=$code"
          test "$code" = "200"

          python - <<'PY'
          import json
          envs = json.load(open('/tmp/envs.json')).get('envs', [])
          targets = set()
          for item in envs:
              if item.get('key') != 'DATABASE_URL':
                  continue
              target = item.get('target', [])
              targets.update([target] if isinstance(target, str) else (target or []))
          print('database_url_preview=' + str('preview' in targets).lower())
          print('database_url_production=' + str('production' in targets).lower())
          if not {'preview', 'production'}.issubset(targets):
              raise SystemExit('DATABASE_URL must target preview and production')
          PY

      - name: Prepare migration DATABASE_URL from GitHub secret
        shell: bash
        env:
          IAMINA_DATABASE_URL: ${{ secrets.IAMINA_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${IAMINA_DATABASE_URL:-}" ]; then
            echo "IAMINA_DATABASE_URL repository secret is required for one-time migration"
            exit 1
          fi
          python - <<'PY'
          import os
          from urllib.parse import quote, urlsplit, urlunsplit

          value = os.environ['IAMINA_DATABASE_URL'].strip()
          parts = urlsplit(value)
          if parts.scheme not in {'postgres', 'postgresql'} or not parts.hostname:
              raise SystemExit('IAMINA_DATABASE_URL is not PostgreSQL')
          print('::add-mask::' + value)
          direct_host = parts.hostname.replace('-pooler', '')
          netloc = ''
          if parts.username:
              netloc += quote(parts.username, safe='')
              if parts.password is not None:
                  netloc += ':' + quote(parts.password, safe='')
              netloc += '@'
          netloc += direct_host
          if parts.port:
              netloc += ':' + str(parts.port)
          direct = urlunsplit((parts.scheme, netloc, parts.path, parts.query, parts.fragment))
          print('::add-mask::' + direct)
          with open('/tmp/database-url-direct', 'w') as f:
              f.write(direct)
          print('database_url_direct_ready=true')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Apply and verify Django migrations on dedicated Neon database
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="$(cat /tmp/database-url-direct)"
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export DEBUG=False
          export ALLOWED_HOSTS=iamina-certified.vercel.app
          export CORS_ALLOWED_ORIGINS=https://iamina-review.vercel.app
          export CSRF_TRUSTED_ORIGINS=https://iamina-review.vercel.app
          export DJANGO_SETTINGS_MODULE=amina.vercel_settings
          cd backend
          python manage.py migrate --noinput
          python manage.py migrate --check
          python manage.py shell -c "from django.db import connection; connection.ensure_connection(); print('db_connectivity=ok')"
          echo "django_migrations=applied_and_current"

      - name: Create exact production deployment through Vercel API
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          sha = os.environ['TARGET_SHA']
          ref = os.environ['TARGET_REF']
          payload = {
              'name': os.environ['VERCEL_PROJECT_NAME'],
              'project': os.environ['VERCEL_PROJECT_ID'],
              'target': 'production',
              'gitSource': {
                  'type': 'github',
                  'org': 'hraaaaf',
                  'repo': 'IAMINA-MVP',
                  'ref': ref,
                  'sha': sha,
              },
              'gitMetadata': {
                  'remoteUrl': 'https://github.com/hraaaaf/IAMINA-MVP',
                  'commitRef': ref,
                  'commitSha': sha,
                  'dirty': False,
                  'ci': True,
                  'ciType': 'github-actions',
                  'rootDirectory': 'backend',
              },
              'projectSettings': {
                  'rootDirectory': 'backend',
                  'serverlessFunctionRegion': 'cdg1',
              },
          }
          with open('/tmp/deploy-payload.json', 'w') as f:
              json.dump(payload, f, separators=(',', ':'))
          PY
          code="$(curl -sS -o /tmp/deploy.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/deploy-payload.json \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID&forceNew=1")"
          echo "vercel_create_http=$code"
          python - <<'PY'
          import json
          data = json.load(open('/tmp/deploy.json'))
          safe = {k: data.get(k) for k in ('id','name','url','status','readyState','errorCode','errorMessage') if k in data}
          print('vercel_create_response=' + json.dumps(safe, separators=(',', ':')))
          if not data.get('id'):
              raise SystemExit(1)
          print('deployment_id=' + data['id'])
          print('deployment_url=https://' + data['url'])
          PY
          case "$code" in
            200|201) ;;
            *) exit 1 ;;
          esac
