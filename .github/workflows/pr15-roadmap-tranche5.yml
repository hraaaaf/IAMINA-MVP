name: PR15 roadmap tranche 5

on:
  push:
    branches:
      - feat/p0-mena-provider-runtime-resilience

permissions:
  contents: write

jobs:
  update-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-provider-runtime-resilience
      - name: Update roadmap checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/ROADMAP.md')
          text = path.read_text()
          text = text.replace(
              'P0-MENA-1F tranches 1–4 implemented and validated in draft PR #15.',
              'P0-MENA-1F tranches 1–5 implemented and validated in draft PR #15.',
          )
          text = text.replace(
              '- [ ] Ensure streaming cancellation and partial failures close safely.',
              '- [x] Ensure streaming cancellation and partial failures close safely. **The authorized wrapper closes the underlying provider iterator on cancellation, normal completion and partial failure; vendor failures after partial output remain typed and non-sensitive.**',
          )
          checkpoint = '- **Tranche 5 — stream cancellation, partial failure and fallback non-bypass:** implemented and validated on 2026-07-29. Provider iterators are closed deterministically on consumer cancellation and partial failure; failures are normalized without vendor leakage; processor-policy denial and missing egress scope stop streaming before the provider iterator starts. SQLite, PostgreSQL, OpenAPI, security, Flutter analyze and migration-drift gates passed before this checkpoint was closed.\n'
          anchor = '### Acceptance gate\n'
          if checkpoint not in text:
              text = text.replace(anchor, checkpoint + '\n' + anchor)
          path.write_text(text)
          PY
      - name: Commit roadmap
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ROADMAP.md
          git commit -m "docs(roadmap): close provider stream safety tranche"
          git push origin HEAD:feat/p0-mena-provider-runtime-resilience
