name: P6 OpenAPI regenerate

on:
  push:
    branches:
      - release/dashboard-p6-next-best-action-clean
    paths:
      - 'backend/diabetes/api/v1/companion.py'
      - '.github/workflows/p6-openapi-regenerate.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/dashboard-p6-next-best-action-clean

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Regenerate canonical OpenAPI
        run: python backend/manage.py export_openapi > docs/api/openapi.json

      - name: Commit generated schema
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.json
          if git diff --cached --quiet; then
            echo "OpenAPI already current"
            exit 0
          fi
          git commit -m "docs(api): regenerate OpenAPI for P6"
          git push origin HEAD:release/dashboard-p6-next-best-action-clean
