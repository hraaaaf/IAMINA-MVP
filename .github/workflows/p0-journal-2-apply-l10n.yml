name: P0-JOURNAL-2 apply l10n

on:
  push:
    branches: [feat/p0-journal-express-event]
    paths: [.github/workflows/p0-journal-2-apply-l10n.yml]

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-journal-express-event
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Add Journal ARB messages
