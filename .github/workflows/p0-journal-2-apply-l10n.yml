          for lang, values in messages.items():
              p = Path(f'frontend/lib/l10n/app_{lang}.arb')
              data = json.loads(p.read_text())
              data.update(values)
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Generate localization Dart
        working-directory: frontend
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib/l10n/app_localizations*.dart
      - name: Commit ARB and generated localization files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/lib/l10n/app_en.arb frontend/lib/l10n/app_fr.arb frontend/lib/l10n/app_ar.arb frontend/lib/l10n/app_localizations.dart frontend/lib/l10n/app_localizations_en.dart frontend/lib/l10n/app_localizations_fr.dart frontend/lib/l10n/app_localizations_ar.dart
          git diff --cached --quiet && exit 0
          git commit -m 'feat(journal): localize express metabolic event'
          git push origin HEAD:feat/p0-journal-express-event
