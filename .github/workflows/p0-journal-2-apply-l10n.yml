              'journalLowSafety': 'تفعّل هذه القيمة مسار الأمان لانخفاض سكر الدم. تحقّق من القياس واتبع خطة التعامل مع انخفاض السكر المتفق عليها مع فريقك المعالج.',
              'journalBackToEntry': 'العودة إلى الإدخال',
              'journalSaveAnyway': 'الحفظ على أي حال',
