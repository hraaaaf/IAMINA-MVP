name: D2 J4-J7 isolated candidate validation (no deploy)

on:
  push:
    branches:
      - feat/d2-j4-j7-notifications-stack-20261108
  pull_request:
    branches:
      - feat/d2-notification-center-web-20261108
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d2-j4-j7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: D2 source, consent and security SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt ruff==0.15.17 import-linter
      - name: Ruff source lint
        run: ruff check .
      - name: Architecture boundaries
        run: lint-imports
      - name: Migration model drift
        run: python manage.py makemigrations --check --dry-run
      - name: D2 adversarial test suite
        run: pytest -v --tb=short core/tests/test_d2_notifications.py
      - name: D2 FUE HTTP session journeys (A-B-A / CSRF / consent)
        run: pytest -v --tb=short core/tests/test_d2_fue_http.py core/tests/test_d2_http_session_a_b_a.py
      - name: Full backend SQLite regression
        run: pytest --tb=short -q
      - name: Export updated OpenAPI for review
        run: python manage.py export_openapi > /tmp/iamina-d2-openapi.json
      - name: Preserve generated OpenAPI without committing or deploying
        uses: actions/upload-artifact@v4
        with:
          name: d2-j4-j7-openapi-exact-sha
          path: /tmp/iamina-d2-openapi.json
          retention-days: 7

  backend-postgres:
    name: D2 PostgreSQL synthetic source-of-truth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_ci
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Apply schema to ephemeral CI PostgreSQL only
        run: python manage.py migrate --noinput
      - name: D2 owner isolation and concurrency tests
        run: pytest -v --tb=short core/tests/test_d2_notifications.py
      - name: D2 FUE HTTP PostgreSQL journeys (synthetic only)
        run: pytest -v --tb=short core/tests/test_d2_fue_http.py core/tests/test_d2_http_session_a_b_a.py
      - name: Full backend PostgreSQL regression
        run: pytest --tb=short -q

  flutter:
    name: D2 Web Flutter contracts and PWA build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Flutter
        run: flutter analyze --no-fatal-infos
      - name: D2 gateway + UI + RTL contract tests
        run: >-
          flutter test --no-pub --timeout 90s
          test/services/d2_notification_gateway_test.dart
          test/features/notifications/d2_live_notifications_screen_test.dart
          test/features/dashboard/d2_notification_center_web_test.dart
          test/rtl_screen_contract_test.dart
      - name: Full Flutter regression
        run: flutter test --no-pub
      - name: Build self-contained PWA bundle (not deploy)
        run: flutter build web --release --no-web-resources-cdn
      - name: Check PWA artifacts
        run: |
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/sqlite3.wasm
