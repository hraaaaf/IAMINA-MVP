name: PR 591 OpenAPI snapshot sync

on:
  push:
    branches:
      - fix/p5-6-consent-evidence-contract-20260912

permissions:
  contents: write

jobs:
  sync-openapi:
    if: ${{ !contains(github.event.head_commit.message, '[openapi-sync]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p5-6-consent-evidence-contract-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Generate canonical OpenAPI snapshot
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: amina.settings
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          DATABASE_URL: sqlite:///ci-openapi.db
          FIREBASE_CREDENTIALS_PATH: ''
          GEMINI_API_KEY: ''
        run: python manage.py export_openapi > ../docs/api/openapi.json
      - name: Commit exact generated snapshot
        run: |
          if git diff --quiet -- docs/api/openapi.json; then
            echo 'OpenAPI snapshot already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/api/openapi.json
          git commit -m 'docs: refresh consent OpenAPI contract [openapi-sync]'
          git push origin HEAD:fix/p5-6-consent-evidence-contract-20260912
