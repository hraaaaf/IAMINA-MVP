name: D7 Web patient declarations — Chrome IndexedDB A-B-A

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/lib/ui_d7_synthetic_treatment_vault_probe_main.dart'
      - 'scripts/d7_web_treatment_vault_browser_probe.py'
      - '.github/workflows/d7-web-treatment-indexeddb-browser.yml'

permissions:
  contents: read

concurrency:
  group: d7-web-indexeddb-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  d7-chrome-indexeddb:
    name: D7 physical vault treatment persistence and reload (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Build synthetic D7 browser-only application
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos lib/ui_d7_synthetic_treatment_vault_probe_main.dart
          flutter build web --release --no-web-resources-cdn -t lib/ui_d7_synthetic_treatment_vault_probe_main.dart
      - name: Chrome real IndexedDB A-B-A declaration and hard reload
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client
          python3 -m http.server 7377 --bind 127.0.0.1 --directory frontend/build/web > /tmp/iamina-d7-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:7377/ > /dev/null
          python3 scripts/d7_web_treatment_vault_browser_probe.py
          test -s d7-web-indexeddb-proof.json
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-d7-chrome-indexeddb-declarations
          path: d7-web-indexeddb-proof.json
          if-no-files-found: warn
          retention-days: 14
