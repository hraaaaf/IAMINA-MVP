name: P0-UX-11 roadmap finalize

on:
  push:
    branches:
      - fix/p0-ux-11-first-use-dashboard
    paths:
      - .github/workflows/p0-ux-11-roadmap.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-ux-11-first-use-dashboard
          fetch-depth: 0
      - name: Update roadmap
        run: python3 scripts/finalize_p0_ux_11_roadmap.py
      - name: Commit clean documentation diff
        run: |
          rm .github/workflows/p0-ux-11-roadmap.yml scripts/finalize_p0_ux_11_roadmap.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md .github/workflows/p0-ux-11-roadmap.yml scripts/finalize_p0_ux_11_roadmap.py
          git commit -m 'docs(roadmap): certify P0-UX-11 above 9/10'
          git push origin HEAD:fix/p0-ux-11-first-use-dashboard