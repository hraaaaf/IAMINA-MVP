name: UX-2 desktop composition builder

on:
  push:
    branches: [ux/ux-2-desktop-composition]
    paths: [.github/workflows/ux-2-builder.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/ux-2-desktop-composition
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply bounded UX-2 patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          profile_path = Path('frontend/lib/features/profile/profile_screen.dart')
          profile = profile_path.read_text()
          old = '''              final sections = Column(
                crossAxisAlignment: CrossAxisAlignment.stretch,
                children: [
                  _buildMedicalSection(l10n),
                  const SizedBox(height: 14),
                  _buildRamadanSection(l10n),
                  const SizedBox(height: 14),
                  _buildProfileSection(
                    key: const ValueKey('profile-iamina-section'),
                    icon: Icons.auto_awesome_outlined,
                    title: l10n.profileIaminaSection,
                    subtitle: l10n.profileIaminaSectionHint,
                    initiallyExpanded: false,
                    children: [_buildIASetupCard(l10n)],
                  ),
                  const SizedBox(height: 14),
                  _buildAccountSection(l10n),
                ],
              );
              if (constraints.maxWidth < 900) return sections;
              return Container(
                padding: const EdgeInsets.all(16),
                decoration: BoxDecoration(
                  color: AminaTheme.ink50,
                  borderRadius: BorderRadius.circular(AminaTheme.radius3XL),
                  border: Border.all(color: AminaTheme.ink100),
                ),
                child: sections,
              );'''
          new = '''              final medicalSection = _buildMedicalSection(l10n);
              final ramadanSection = _buildRamadanSection(l10n);
              final iaminaSection = _buildProfileSection(
                key: const ValueKey('profile-iamina-section'),
                icon: Icons.auto_awesome_outlined,
                title: l10n.profileIaminaSection,
                subtitle: l10n.profileIaminaSectionHint,
                initiallyExpanded: false,
                children: [_buildIASetupCard(l10n)],
              );
              final accountSection = _buildAccountSection(l10n);

              if (constraints.maxWidth < 900) {
                return Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    medicalSection,
                    const SizedBox(height: 14),
                    ramadanSection,
                    const SizedBox(height: 14),
                    iaminaSection,
                    const SizedBox(height: 14),
                    accountSection,
                  ],
                );
              }

              return Container(
                padding: const EdgeInsets.all(16),
                decoration: BoxDecoration(
                  color: AminaTheme.ink50,
                  borderRadius: BorderRadius.circular(AminaTheme.radius3XL),
                  border: Border.all(color: AminaTheme.ink100),
                ),
                child: Row(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Expanded(
                      child: Column(
                        key: const ValueKey('profile-desktop-health-column'),
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          medicalSection,
                          const SizedBox(height: 14),
                          ramadanSection,
                        ],
                      ),
                    ),
                    const SizedBox(width: 14),
                    Expanded(
                      child: Column(
                        key: const ValueKey('profile-desktop-account-column'),
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          iaminaSection,
                          const SizedBox(height: 14),
                          accountSection,
                        ],
                      ),
                    ),
                  ],
                ),
              );'''
          if old not in profile:
              raise SystemExit('profile build block not found')
          profile_path.write_text(profile.replace(old, new, 1))

          summary_path = Path('frontend/lib/features/journal/ai_summary_screen.dart')
          summary = summary_path.read_text()
          pattern = re.compile(r"  Widget _buildError\(\) \{.*?\n  \}\n\n  Widget _buildContent\(\)", re.S)
          replacement = '''  Widget _buildError() {
    final l10n = AppLocalizations.of(context)!;
    return LayoutBuilder(
      builder: (context, constraints) {
        final isWide = constraints.maxWidth >= 720;
        final icon = Container(
          width: isWide ? 60 : 48,
          height: isWide ? 60 : 48,
          decoration: BoxDecoration(
            color: AminaTheme.dangerBg,
            borderRadius: BorderRadius.circular(AminaTheme.radiusXL),
          ),
          child: Icon(
            Icons.cloud_off_outlined,
            color: AminaTheme.dangerFg,
            size: isWide ? 30 : 24,
          ),
        );
        final message = Text(
          l10n.analysisLoadError,
          textAlign: isWide ? TextAlign.start : TextAlign.center,
          style: TextStyle(
            fontSize: isWide ? 17 : 15,
            height: 1.35,
            fontWeight: FontWeight.w800,
            color: AminaTheme.textPrimary(context),
          ),
        );
        final retry = FilledButton.icon(
          onPressed: _fetchData,
          icon: const Icon(Icons.refresh, size: 17),
          label: Text(l10n.retry),
          style: FilledButton.styleFrom(
            minimumSize: const Size.fromHeight(48),
            shape: RoundedRectangleBorder(
              borderRadius: BorderRadius.circular(AminaTheme.radiusXL),
            ),
          ),
        );
        final card = Container(
          width: double.infinity,
          padding: EdgeInsets.all(isWide ? 32 : 24),
          decoration: BoxDecoration(
            color: AminaTheme.surface(context),
            borderRadius: BorderRadius.circular(AminaTheme.radius2XL),
            border: Border.all(color: AminaTheme.divider(context)),
            boxShadow: AminaTheme.shadowClinical,
          ),
          child: isWide
              ? Row(
                  crossAxisAlignment: CrossAxisAlignment.center,
                  children: [
                    icon,
                    const SizedBox(width: 22),
                    Expanded(child: message),
                    const SizedBox(width: 28),
                    SizedBox(width: 210, child: retry),
                  ],
                )
              : Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    icon,
                    const SizedBox(height: 16),
                    message,
                    const SizedBox(height: 18),
                    SizedBox(width: double.infinity, child: retry),
                  ],
                ),
        );

        if (!isWide) {
          return Align(
            alignment: Alignment.topCenter,
            child: Padding(
              padding: const EdgeInsetsDirectional.fromSTEB(20, 32, 20, 24),
              child: ConstrainedBox(
                constraints: const BoxConstraints(maxWidth: 420),
                child: card,
              ),
            ),
          );
        }

        return Center(
          child: Padding(
            padding: const EdgeInsetsDirectional.fromSTEB(28, 24, 28, 56),
            child: ConstrainedBox(
              constraints: const BoxConstraints(maxWidth: 820),
              child: card,
            ),
          ),
        );
      },
    );
  }

  Widget _buildContent()'''
          summary, count = pattern.subn(replacement, summary, count=1)
          if count != 1:
              raise SystemExit(f'summary error block replacements={count}')
          summary_path.write_text(summary)

          test_path = Path('frontend/test/features/ramadan_profile_responsive_test.dart')
          test = test_path.read_text()
          insert = r'''

  testWidgets('Profile uses two balanced columns on wide desktop', (tester) async {
    tester.view.physicalSize = const Size(1200, 900);
    tester.view.devicePixelRatio = 1;
    addTearDown(tester.view.resetPhysicalSize);
    addTearDown(tester.view.resetDevicePixelRatio);

    final db = AppDatabase(NativeDatabase.memory());
    addTearDown(db.close);
    final consent = ConsentService();
    addTearDown(consent.dispose);

    await tester.pumpWidget(
      MaterialApp(
        locale: const Locale('fr'),
        localizationsDelegates: AppLocalizations.localizationsDelegates,
        supportedLocales: AppLocalizations.supportedLocales,
        home: MultiProvider(
          providers: [
            Provider<AppDatabase>.value(value: db),
            ChangeNotifierProvider<ConsentService>.value(value: consent),
          ],
          child: const ProfileScreen(),
        ),
      ),
    );
    await tester.pumpAndSettle();

    final health = find.byKey(
      const ValueKey('profile-desktop-health-column'),
    );
    final account = find.byKey(
      const ValueKey('profile-desktop-account-column'),
    );
    expect(health, findsOneWidget);
    expect(account, findsOneWidget);

    final healthRect = tester.getRect(health);
    final accountRect = tester.getRect(account);
    expect((healthRect.top - accountRect.top).abs(), lessThan(1));
    expect((healthRect.width - accountRect.width).abs(), lessThan(1));
    expect(tester.takeException(), isNull);
  });
'''
          if "Profile uses two balanced columns on wide desktop" in test:
              raise SystemExit('desktop profile test already present')
          idx = test.rfind('\n}')
          if idx < 0:
              raise SystemExit('test file closing brace not found')
          test_path.write_text(test[:idx] + insert + test[idx:])
          PY
      - name: Format and targeted validation
        working-directory: frontend
        run: |
          flutter pub get
          dart format lib/features/profile/profile_screen.dart lib/features/journal/ai_summary_screen.dart test/features/ramadan_profile_responsive_test.dart
          flutter analyze
          flutter test test/features/ramadan_profile_responsive_test.dart
      - name: Commit product patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/lib/features/profile/profile_screen.dart frontend/lib/features/journal/ai_summary_screen.dart frontend/test/features/ramadan_profile_responsive_test.dart
          git commit -m 'fix(ux): rebalance desktop error and profile states'
          git push origin HEAD:ux/ux-2-desktop-composition
