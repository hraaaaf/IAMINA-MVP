name: UX-2 summary error builder

on:
  push:
    branches: [ux/ux-2-summary-error-state]
    paths: [.github/workflows/ux-2-builder.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/ux-2-summary-error-state
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply scoped UX-2 remediation
        run: python3 .github/ux-2-summary-error-builder.py
      - name: Format
        working-directory: frontend
        run: dart format lib/features/journal/ai_summary_screen.dart test/p2_ux_14_density_polish_contract_test.dart
      - name: Validate focused frontend contract
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze
          flutter test test/p2_ux_14_density_polish_contract_test.dart
      - name: Remove temporary builder and commit product diff
        run: |
          git rm .github/workflows/ux-2-builder.yml .github/ux-2-summary-error-builder.py
          git add frontend/lib/features/journal/ai_summary_screen.dart frontend/test/p2_ux_14_density_polish_contract_test.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ux): rebalance summary error state'
          git push origin HEAD:ux/ux-2-summary-error-state
