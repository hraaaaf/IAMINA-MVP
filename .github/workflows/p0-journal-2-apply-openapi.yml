name: P0-JOURNAL-2 apply OpenAPI

on:
  push:
    branches: [feat/p0-journal-express-event]
    paths: [.github/workflows/p0-journal-2-apply-openapi.yml]

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-journal-express-event
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Regenerate OpenAPI
        working-directory: backend
        run: python manage.py export_openapi > ../docs/api/openapi.json
      - name: Commit generated contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/api/openapi.json
          git diff --cached --quiet && exit 0
          git commit -m 'docs(api): regenerate log glycemic-context contract'
          git push origin HEAD:feat/p0-journal-express-event
