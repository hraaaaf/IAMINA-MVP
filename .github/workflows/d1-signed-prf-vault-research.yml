name: D1-6 signed WebAuthn PRF synthetic vault (NO DEPLOY)
on:
  push:
    branches: [research/d1-signed-prf-synthetic-vault-20261112]
  pull_request:
    branches: [research/d1-client-session-fence-20261112]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-crypto-synthetic:
    name: Node WebCrypto signed assertion + local PRF vault (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check frontend/web/d1_signed_prf_synthetic_research.js
          node --check frontend/test_node/d1_signed_prf_synthetic_research.test.js
      - name: ECDSA WebCrypto + AES-GCM encrypted vault test (no network)
        run: node --test frontend/test_node/d1_signed_prf_synthetic_research.test.js
      - name: Assert production PWA does not mount research bridge
        run: |
          set -euo pipefail
          if grep -r 'd1_signed_prf_synthetic_research'             frontend/web/index.html frontend/web/flutter_bootstrap.js frontend/api/index.js; then
            echo "::error::Research bridge must not be mounted in production"
            exit 1
          fi

  django-real-ecdsa:
    name: Django WebAuthn real ECDSA verification / ${{ matrix.database }} (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_ci_d1_real
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_ci_d1_real"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-d1-synthetic-ecdsa-not-prod
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:postgres@127.0.0.1:5432/iamina_ci_d1_real' || 'sqlite:///d1-ci-real.db' }}
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install required dependencies
        run: pip install -r requirements.txt ruff==0.15.17
      - name: Lint new crypto fixture
        run: ruff check core/tests/test_d1_real_signed_assertion_research.py
      - name: Verify no migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Real py_webauthn signature validation, A→B→A and replay
        run: pytest -q --tb=short core/tests/test_d1_real_signed_assertion_research.py core/tests/test_d1_passkey_http_research.py
