name: D1 P0 encrypted recovery fresh browser profile (synthetic / NO CLINICAL GO)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/d1-p0-fresh-profile-encrypted-recovery.yml'
      - 'frontend/lib/data/drift/web_patient_vault_cipher_candidate.dart'
      - 'frontend/tool/d1_recovery_fresh_profile_probe.dart'
      - 'frontend/web/d1_vault_crypto_candidate.js'
      - 'tools/d1_recovery_fresh_profile_browser.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-fresh-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-clean-profile:
    name: Actual encrypted Drift bytes to fresh Chrome context, owner recovery
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Resolve Flutter and analyze recovery fixture
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos tool/d1_recovery_fresh_profile_probe.dart
      - name: Compile actual encrypted AppDatabase restoration fixture (NO DEPLOY)
        working-directory: frontend
        run: flutter build web --release --no-web-resources-cdn -t tool/d1_recovery_fresh_profile_probe.dart
      - name: Install checksum-pinned sqlite3MC in disposable Flutter build
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            'https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-2.9.4/sqlite3mc.wasm' \
            -o frontend/build/web/sqlite3mc.wasm
          echo '5a1cfe40252d05bbd174e66351d3c282f69784c6fd0c2d099bf7135c6e91b4ec  frontend/build/web/sqlite3mc.wasm' | sha256sum -c -
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Restore encrypted physical store into a separate disposable Chromium profile
        env:
          D1_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$D1_CANDIDATE_SHA"
          python3 -m http.server 7476 --bind 127.0.0.1 \
            --directory frontend/build/web > /tmp/d1-fresh-recovery-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:7476/ > /dev/null
          node tools/d1_recovery_fresh_profile_browser.js
      - name: Keep key-free summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-fresh-profile-synthetic-recovery-proof
          path: |
            d1-fresh-profile-recovery-proof/proof.json
            /tmp/d1-fresh-recovery-http.log
          retention-days: 7
