name: UX-11 populated visual parity gate

on:
  push:
    branches:
      - ux/11-dashboard-action-parity
    paths:
      - .github/workflows/ux11-populated-visual-gate.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/11-dashboard-action-parity
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Apply visual convergence pass
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dash_path = Path('frontend/lib/features/dashboard/dashboard_convergent_screen.dart')
          s = dash_path.read_text()

          exact = [
            ("padding: const EdgeInsetsDirectional.fromSTEB(18, 10, 18, 118),", "padding: const EdgeInsetsDirectional.fromSTEB(18, 8, 18, 96),"),
            ("const SizedBox(height: 22),\n                  Row(", "const SizedBox(height: 18),\n                  Row("),
            ("const SizedBox(height: 15),\n                  _GlucoseHero(", "const SizedBox(height: 11),\n                  _GlucoseHero("),
            ("const SizedBox(height: 14),\n                  _TrendsPanel(", "const SizedBox(height: 10),\n                  _TrendsPanel("),
            ("const SizedBox(height: 18),\n                  Text(", "const SizedBox(height: 14),\n                  Text("),
            ("const SizedBox(height: 9),\n                  const _QuickActionsRow(),", "const SizedBox(height: 7),\n                  const _QuickActionsRow(),"),
            ("const SizedBox(height: 26),\n                  _DetailedTrendCard(", "const SizedBox(height: 20),\n                  _DetailedTrendCard("),
            ("width: 46,\n          height: 46,\n          child: CustomPaint(painter: _SealPainter()),", "width: 40,\n          height: 40,\n          child: CustomPaint(painter: _SealPainter()),"),
            ("l10n.appTagline,", "_t(context, 'Votre santé, notre mission', 'Your health, our mission', 'صحتك، مهمتنا'),"),
            ("padding: const EdgeInsets.fromLTRB(18, 17, 18, 15),", "padding: const EdgeInsets.fromLTRB(16, 12, 16, 10),"),
            ("width: 38,\n                height: 38,", "width: 34,\n                height: 34,"),
            ("const SizedBox(height: 16),", "const SizedBox(height: 8),"),
            ("fontSize: 49,", "fontSize: 44,"),
            ("height: 112,", "height: 80,"),
            ("padding: const EdgeInsets.symmetric(horizontal: 13, vertical: 10),", "padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),"),
            ("padding: const EdgeInsets.fromLTRB(16, 14, 16, 14),", "padding: const EdgeInsets.fromLTRB(14, 10, 14, 10),"),
            ("const SizedBox(height: 13),", "const SizedBox(height: 8),"),
            ("width: 34,\n            height: 34,", "width: 30,\n            height: 30,"),
            ("fontSize: 23,", "fontSize: 20,"),
            ("width: 48,\n                    height: 48,", "width: 46,\n                    height: 46,"),
            ("fontSize: 8.8,", "fontSize: 8.5,"),
          ]
          for old, new in exact:
            if old not in s:
              raise SystemExit(f'dashboard convergence target missing: {old!r}')
            s = s.replace(old, new, 1)

          # Exact mockup semantics: bell opens real reminders, not Importer.
          old = """        Material(
          color: AminaTheme.surface(context),
          shape: const CircleBorder(),
          child: InkWell(
            key: const ValueKey('dashboard-import-action'),
            onTap: () => GoRouter.of(context).go('/importer'),
            customBorder: const CircleBorder(),
            child: SizedBox(
              width: 46,
              height: 46,
              child: Icon(
                Icons.upload_file_outlined,
                size: 21,
                color: AminaTheme.textPrimary(context),
              ),
            ),
          ),
        ),"""
          new = """        Material(
          color: AminaTheme.surface(context),
          shape: const CircleBorder(),
          child: InkWell(
            key: const ValueKey('dashboard-reminders-action'),
            onTap: () => GoRouter.of(context).go('/reminders'),
            customBorder: const CircleBorder(),
            child: SizedBox(
              width: 42,
              height: 42,
              child: Stack(
                clipBehavior: Clip.none,
                children: [
                  const Center(
                    child: Icon(
                      Icons.notifications_none_rounded,
                      size: 21,
                      color: Color(0xFF064E52),
                    ),
                  ),
                  PositionedDirectional(
                    top: 7,
                    end: 7,
                    child: Container(
                      width: 7,
                      height: 7,
                      decoration: const BoxDecoration(
                        color: Color(0xFF35C78A),
                        shape: BoxShape.circle,
                      ),
                    ),
                  ),
                ],
              ),
            ),
          ),
        ),"""
          if old not in s:
            raise SystemExit('dashboard header action target missing')
          s = s.replace(old, new, 1)

          # Dense square mark matching the approved mockup family more closely.
          start = s.index('class _SealPainter extends CustomPainter {')
          end = s.index('class _ConvergentState extends StatelessWidget {')
          seal = '''class _SealPainter extends CustomPainter {
  const _SealPainter();

  @override
  void paint(Canvas canvas, Size size) {
    final teal = Paint()..color = const Color(0xFF075A5D);
    final mint = Paint()..color = const Color(0xFF27B984);
    final c = size.width / 7;
    final blocks = <(int, int, int, int)>[
      (0, 0, 3, 1), (0, 0, 1, 3), (2, 1, 1, 2),
      (4, 0, 3, 1), (6, 0, 1, 3), (4, 2, 2, 1),
      (0, 4, 1, 3), (0, 6, 3, 1), (2, 4, 1, 2),
      (4, 4, 3, 1), (4, 6, 3, 1), (6, 4, 1, 3),
      (1, 3, 2, 1), (3, 1, 1, 2), (3, 4, 1, 2),
      (4, 3, 2, 1), (1, 5, 1, 1), (5, 5, 1, 1),
    ];
    for (final b in blocks) {
      canvas.drawRect(Rect.fromLTWH(b.$1 * c, b.$2 * c, b.$3 * c, b.$4 * c), teal);
    }
    canvas.drawRect(Rect.fromLTWH(3 * c, 3 * c, c, c), mint);
    canvas.drawRect(Rect.fromLTWH(5 * c, 1 * c, c, c), mint);
    canvas.drawRect(Rect.fromLTWH(1 * c, 4 * c, c, c), mint);
  }

  @override
  bool shouldRepaint(covariant CustomPainter oldDelegate) => false;
}

'''
          s = s[:start] + seal + s[end:]
          # l10n is no longer needed in the brand row after tagline convergence.
          brand_start = s.index('class _BrandRow extends StatelessWidget {')
          brand_end = s.index('class _RangePill extends StatelessWidget {')
          brand = s[brand_start:brand_end].replace('    final l10n = AppLocalizations.of(context)!;\n', '')
          s = s[:brand_start] + brand + s[brand_end:]
          dash_path.write_text(s)

          nav_path = Path('frontend/lib/features/navigation/main_shell.dart')
          s = nav_path.read_text()
          nav = [
            ("minimum: EdgeInsets.symmetric(horizontal: 12).copyWith(bottom: 10),", "minimum: EdgeInsets.symmetric(horizontal: 18).copyWith(bottom: 6),"),
            ("height: 92,", "height: 72,"),
            ("top: 20,", "top: 12,"),
            ("width: 52,", "width: 48,"),
            ("height: 52,", "height: 48,"),
            ("size: 27,", "size: 28,"),
            ("fontSize: 9.2,", "fontSize: 8.8,"),
          ]
          for old, new in nav:
            if old not in s:
              raise SystemExit(f'nav convergence target missing: {old!r}')
            s = s.replace(old, new, 1)
          nav_path.write_text(s)

          module_path = Path('frontend/lib/modules/diabetes_module.dart')
          s = module_path.read_text()
          s = s.replace(
            'icon: Icons.monitor_heart_outlined,\n      selectedIcon: Icons.monitor_heart_rounded,',
            'icon: Icons.show_chart_rounded,\n      selectedIcon: Icons.show_chart_rounded,',
            1,
          )
          s = s.replace(
            'icon: Icons.insert_chart_outlined_rounded,\n      selectedIcon: Icons.insert_chart_rounded,',
            'icon: Icons.description_outlined,\n      selectedIcon: Icons.description_rounded,',
            1,
          )
          module_path.write_text(s)

          # Update contracts: header bell is a real Reminders action; Importer remains a real route.
          t = Path('frontend/test/p0_real_actions_contract_test.dart')
          x = t.read_text()
          x = x.replace(
            "expect(dashboard, contains(\"ValueKey('dashboard-import-action')\"));\n    expect(dashboard, contains(\"GoRouter.of(context).go('/importer')\"));",
            "expect(dashboard, contains(\"ValueKey('dashboard-reminders-action')\"));\n    expect(dashboard, contains(\"GoRouter.of(context).go('/reminders')\"));\n    expect(module, contains(\"route: '/importer'\"));",
          )
          t.write_text(x)

          t = Path('frontend/test/p0_mobile_import_navigation_test.dart')
          x = t.read_text()
          old = """      final importerAction = find.byKey(
        const ValueKey('dashboard-import-action'),
      );
      expect(importerAction, findsOneWidget);
      expect(find.byKey(const ValueKey('mobile-nav-/importer')), findsNothing);
      expect(tester.takeException(), isNull);

      await tester.tap(importerAction);
      await tester.pumpAndSettle();
"""
          new = """      expect(find.byKey(const ValueKey('mobile-nav-/importer')), findsNothing);
      expect(find.byKey(const ValueKey('dashboard-reminders-action')), findsOneWidget);
      expect(tester.takeException(), isNull);

      router.go('/importer');
      await tester.pumpAndSettle();
"""
          if old not in x:
            raise SystemExit('mobile importer contract target missing')
          x = x.replace(old, new, 1)
          x = x.replace(
            "'390px user can navigate to Importer and open the document review flow'",
            "'390px Importer route remains functional outside approved bottom navigation'",
            1,
          )
          t.write_text(x)
          PY

      - name: Format and validate convergence
        working-directory: frontend
        run: |
          flutter pub get
          dart format lib test
          flutter analyze --no-fatal-infos
          flutter test --no-pub

      - name: Commit validated convergence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/lib/features/dashboard/dashboard_convergent_screen.dart frontend/lib/features/navigation/main_shell.dart frontend/lib/modules/diabetes_module.dart frontend/test/p0_real_actions_contract_test.dart frontend/test/p0_mobile_import_navigation_test.dart
          git diff --cached --stat
          git commit -m 'feat(ux): converge dashboard to approved mockup proportions' || true
          git push origin HEAD:ux/11-dashboard-action-parity

      - name: Build debug Flutter Web bundle with audit access
        working-directory: frontend
        run: flutter build web --debug --dart-define=IAMINA_AUDIT_ACCESS=true

      - name: Install capture runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps

      - name: Start local bundle
        working-directory: frontend/build/web
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/iamina-web.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/iamina-web.log
          exit 1

      - name: Seed real local demo data then capture dashboard
        run: |
          mkdir -p /tmp/ux11-populated
          cat > /tmp/ux11-populated/capture.cjs <<'EOF'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs = require('fs');
          const path = require('path');
          const profiles = [
            ['mobile-fr',390,844,'fr','fr-FR'],
            ['mobile-ar',390,844,'ar','ar-MA'],
            ['small-fr',360,560,'fr','fr-FR'],
            ['small-ar',360,560,'ar','ar-MA'],
          ];
          (async () => {
            const browser = await chromium.launch({headless:true});
            const report=[];
            for (const [profile,width,height,lang,locale] of profiles) {
              const context = await browser.newContext({viewport:{width,height},deviceScaleFactor:1,locale,timezoneId:'Africa/Casablanca'});
              const page = await context.newPage();
              const consoleErrors=[]; const pageErrors=[];
              page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });
              page.on('pageerror', e => pageErrors.push(String(e)));
              await page.goto(`http://127.0.0.1:8080/?audit=visual-cert&lang=${lang}#/importer`, {waitUntil:'domcontentloaded', timeout:30000});
              await page.waitForTimeout(5000);
              const load = page.getByText('Charger', {exact:true});
              if (await load.count()) {
                await load.first().click();
                await page.waitForTimeout(3500);
              }
              await page.goto(`http://127.0.0.1:8080/?audit=visual-cert&lang=${lang}#/dashboard`, {waitUntil:'domcontentloaded', timeout:30000});
              await page.waitForTimeout(6000);
              const file=`${profile}__dashboard-populated.png`;
              await page.screenshot({path:path.join('/tmp/ux11-populated',file),fullPage:false});
              report.push({profile,width,height,lang,url:page.url(),flutterViews:await page.locator('flutter-view').count(),consoleErrors,pageErrors,screenshot:file});
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('/tmp/ux11-populated/report.json', JSON.stringify(report,null,2));
            const failures=report.filter(x=>x.flutterViews===0 || x.pageErrors.length>0);
            if (failures.length) { console.error(JSON.stringify(failures,null,2)); process.exit(1); }
          })();
          EOF
          node /tmp/ux11-populated/capture.cjs

      - name: Record source
        if: always()
        run: |
          git rev-parse HEAD > /tmp/ux11-populated/source-sha.txt
          cp /tmp/iamina-web.log /tmp/ux11-populated/server.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux11-populated-visual-parity-captures-v2
          path: /tmp/ux11-populated
          retention-days: 14
          if-no-files-found: error
