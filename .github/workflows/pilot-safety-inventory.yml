name: Pilot safety inventory

on:
  push:
    branches: [feat/pilot-safety-certification]

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pilot-safety-certification
      - name: Inventory therapeutic and AI paths
        run: |
          mkdir -p docs/internal
          {
            echo '# Pilot Safety Inventory'
            echo
            echo '## Candidate files'
            find backend frontend -type f \( -name '*.py' -o -name '*.dart' \) | sort | while read -r file; do
              if grep -Eiq 'insulin|dose|prescri|traitement|treatment|summary|resume|résumé|llm|gateway|provider|triage|hypogly|hypergly' "$file"; then
                echo "- $file"
              fi
            done
            echo
            echo '## High-signal matches'
            grep -RInE --include='*.py' --include='*.dart' 'insulin|dose|prescri|traitement|treatment|summary|resume|résumé|llm|gateway|provider|triage|hypogly|hypergly' backend frontend 2>/dev/null | head -n 1200 || true
            echo
            echo '## Provider callsites'
            grep -RInE --include='*.py' --include='*.dart' 'generate_content|chat\.completions|responses\.create|client\.|invoke\(|provider\.|gateway\.' backend frontend 2>/dev/null | head -n 800 || true
          } > docs/internal/PILOT_SAFETY_INVENTORY.md
          rm .github/workflows/pilot-safety-inventory.yml
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(pilot-safety): record therapeutic and AI path inventory"
          git push origin HEAD:feat/pilot-safety-certification
