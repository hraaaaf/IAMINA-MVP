name: Apply clean audited-page localization

on:
  push:
    branches:
      - fix/p0-audited-pages-arabic-coverage-v3
    paths:
      - scripts/apply_clean_audited_page_localization.py
      - scripts/run_clean_audited_page_localization.py
      - .github/workflows/apply-clean-audited-page-localization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-audited-pages-arabic-coverage-v3
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Apply precise product replacements
        run: python scripts/run_clean_audited_page_localization.py

      - name: Validate without reformatting existing product files
        working-directory: frontend
        run: |
          flutter pub get
          dart format lib/l10n/audited_page_copy.dart test/p0_audited_page_localization_contract_test.dart test/p0_clinical_explainability_contract_test.dart
          flutter analyze --no-fatal-infos
          flutter test test/p0_audited_page_localization_contract_test.dart
          flutter test test/p0_clinical_explainability_contract_test.dart
          flutter test test/p0_mobile_import_navigation_test.dart

      - name: Commit product state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib frontend/test
          git commit -m "feat(l10n): localize audited pages without format noise"
          git push origin HEAD:fix/p0-audited-pages-arabic-coverage-v3
