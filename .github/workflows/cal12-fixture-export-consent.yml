name: CAL-12 synthetic export consent ledger (no patient release)

on:
  pull_request:
    paths:
      - '.github/workflows/cal12-fixture-export-consent.yml'
      - 'backend/core/cal12_export_consent_ledger.py'
      - 'backend/core/models/cal12_export_consent.py'
      - 'backend/core/models/__init__.py'
      - 'backend/core/migrations/0021_cal12_export_consent_fixture_ledger.py'
      - 'backend/core/tests/test_cal12_export_consent_ledger.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    name: Consent ledger SQLite, migrations, anti-wiring
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-not-for-production
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ''
      GEMINI_API_KEY: ''
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dependencies
        run: pip install -r requirements.txt ruff==0.15.17
      - name: No export API, no patient UI wiring, test gate OFF by default
        run: |
          set -euo pipefail
          grep -Fq 'REAL_PATIENT_EXPORT_ENABLED = False' core/cal12_export_consent_ledger.py
          grep -Fq 'CAL12_SYNTHETIC_EXPORT_LEDGER_ENABLED' core/cal12_export_consent_ledger.py
          if grep -R -E 'cal12_export_consent_ledger|Cal12ExportConsentFixtureReceipt' core/api diabetes/api; then
            echo 'CAL12 FAIL: export consent rehearsal imported by a live API'
            exit 1
          fi
          if grep -R -E 'cal12_export_consent_ledger' ../frontend/lib; then
            echo 'CAL12 FAIL: patient-facing client wiring'
            exit 1
          fi
      - name: Ruff and schema diff
        run: |
          ruff check core/cal12_export_consent_ledger.py core/models/cal12_export_consent.py core/models/__init__.py core/tests/test_cal12_export_consent_ledger.py core/migrations/0021_cal12_export_consent_fixture_ledger.py
          python manage.py makemigrations --check --dry-run
      - name: Fictional Django ledger, native bearer and consent regressions
        run: pytest -q -v core/tests/test_cal12_export_consent_ledger.py core/tests/test_native_bearer.py core/tests/test_account_consent_identity_safety.py core/tests/test_media_consent_api.py

  postgres:
    name: Consent ledger PostgreSQL 16 and schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-not-for-production
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_ci
      FIREBASE_CREDENTIALS_PATH: ''
      GEMINI_API_KEY: ''
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - name: Owner-revision, revoke and erasure on PostgreSQL
        run: pytest -q -v core/tests/test_cal12_export_consent_ledger.py core/tests/test_native_bearer.py

  flutter-regression:
    name: Existing CAL12 FR EN AR notice and preview regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --no-pub test/services/clinical_export_consent_contract_test.dart test/services/synthetic_doctor_export_gate_test.dart
