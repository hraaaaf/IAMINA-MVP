name: UX-4 builder

on:
  push:
    branches:
      - ux/ux-4-summary-degraded-continuity
    paths:
      - .github/workflows/ux-4-builder.yml

permissions:
  contents: write

jobs:
  build-ux4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/ux-4-summary-degraded-continuity
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply bounded UX-4 patch
        run: |
          python3 .github/ux4_patch.py
          dart format frontend/lib/features/journal/ai_summary_screen.dart frontend/test/ux_4_summary_degraded_contract_test.dart
      - name: Validate UX-4
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test test/ux_4_summary_degraded_contract_test.dart
      - name: Commit product patch and remove builder
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ux-4-builder.yml .github/ux4_patch.py
          git add frontend/lib/features/journal/ai_summary_screen.dart frontend/test/ux_4_summary_degraded_contract_test.dart
          git commit -m 'fix(ux): integrate Summary degraded state'
          git push origin HEAD:ux/ux-4-summary-degraded-continuity
