name: P5-4A PWA offline app-shell proof

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/web/**'
      - 'frontend/lib/ui_pwa_persistence_probe_main.dart'
      - 'frontend/lib/data/drift/**'
      - 'frontend/pubspec.yaml'
      - 'frontend/pubspec.lock'
      - '.github/workflows/p5-4a-pwa-offline-proof.yml'

permissions:
  contents: read

concurrency:
  group: p5-4a-pwa-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chrome-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Build self-contained CI probe
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter pub get
          flutter build web --release --no-web-resources-cdn -t lib/ui_pwa_persistence_probe_main.dart

      - name: Prove app-shell survives true offline hard reload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p5-4a-pwa-offline-proof
          python3 -m pip install --quiet websocket-client

          python3 -m http.server 7361 --directory frontend/build/web >/tmp/iamina-pwa-offline-http.log 2>&1 &
          SERVER_PID=$!

          cleanup_process() {
            local pid="$1"
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 10); do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 0.2
            done
            kill -9 "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          cleanup_all() {
            if [ -n "${CHROME_PID:-}" ]; then cleanup_process "$CHROME_PID"; fi
            if [ -n "${SERVER_PID:-}" ]; then cleanup_process "$SERVER_PID"; fi
          }
          trap cleanup_all EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7361/manifest.json >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7361/manifest.json >/dev/null

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          PROFILE="$(mktemp -d)"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --enable-unsafe-swiftshader \
            --remote-allow-origins='*' \
            --remote-debugging-port=9224 \
            --user-data-dir="$PROFILE" \
            http://127.0.0.1:7361/?phase=seed \
            >/tmp/iamina-pwa-offline-chrome.log 2>&1 &
          CHROME_PID=$!

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9224/json/list >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9224/json/list >/dev/null

          cat > /tmp/pwa_offline_cdp.py <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path
          from websocket import create_connection

          proof = Path('p5-4a-pwa-offline-proof')
          pages = json.load(urllib.request.urlopen('http://127.0.0.1:9224/json/list'))
          page = next(item for item in pages if item.get('type') == 'page')
          ws = create_connection(page['webSocketDebuggerUrl'], timeout=20)
          counter = 0

          def call(method, params=None):
              global counter
              counter += 1
              ws.send(json.dumps({'id': counter, 'method': method, 'params': params or {}}))
              while True:
                  response = json.loads(ws.recv())
                  if response.get('id') == counter:
                      if 'error' in response:
                          raise RuntimeError(f"{method}: {response['error']}")
                      return response.get('result', {})

          def evaluate(expression, await_promise=False):
              result = call('Runtime.evaluate', {
                  'expression': expression,
                  'returnByValue': True,
                  'awaitPromise': await_promise,
              })
              return result['result'].get('value')

          def title():
              return evaluate('document.title') or ''

          def wait_title(prefix, timeout=30):
              deadline = time.time() + timeout
              last = ''
              while time.time() < deadline:
                  last = title()
                  if last.startswith(prefix):
                      return last
                  if last.startswith('IAMINA_PWA_ERROR:'):
                      raise RuntimeError(last)
                  time.sleep(0.25)
              raise RuntimeError(f'Expected title {prefix!r}, got {last!r}')

          call('Page.enable')
          call('Runtime.enable')
          call('Network.enable')

          seeded = wait_title('IAMINA_PWA_SEEDED:')
          storage = seeded.split(':', 1)[1]
          if storage in ('', 'unknown', 'inMemory'):
              raise RuntimeError(f'Non-persistent Drift storage: {storage!r}')

          deadline = time.time() + 15
          sw_state = None
          cache_names = []
          while time.time() < deadline:
              sw_state = evaluate("navigator.serviceWorker.getRegistrations().then(r => ({count:r.length, controller:!!navigator.serviceWorker.controller, active:r.some(x => !!x.active)}))", True)
              cache_names = evaluate('caches.keys()', True) or []
              if sw_state and sw_state.get('count', 0) > 0 and sw_state.get('active') and sw_state.get('controller') and cache_names:
                  break
              time.sleep(0.25)

          if not sw_state or sw_state.get('count', 0) < 1 or not sw_state.get('active') or not sw_state.get('controller'):
              raise RuntimeError(f'No controlling active service worker: {sw_state!r}')
          if not cache_names:
              raise RuntimeError('Service worker did not populate CacheStorage')

          call('Page.navigate', {'url': 'http://127.0.0.1:7361/?phase=verify'})
          restored_online = wait_title('IAMINA_PWA_RESTORED:')

          call('Network.setCacheDisabled', {'cacheDisabled': True})
          call('Network.emulateNetworkConditions', {
              'offline': True,
              'latency': 0,
              'downloadThroughput': 0,
              'uploadThroughput': 0,
          })
          call('Page.reload', {'ignoreCache': True})
          restored_offline = wait_title('IAMINA_PWA_RESTORED:', timeout=30)

          result = {
              'evidence_class': 'synthetic-non-patient-browser',
              'storage_implementation': storage,
              'service_worker': sw_state,
              'cache_names': cache_names,
              'online_restore_title': restored_online,
              'offline_hard_reload_title': restored_offline,
              'http_cache_disabled': True,
              'network_offline': True,
              'result': 'PASS',
          }
          proof.joinpath('pwa-offline-proof.json').write_text(
              json.dumps(result, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          ws.close()
          PY

          python3 /tmp/pwa_offline_cdp.py

          cleanup_process "$CHROME_PID"
          CHROME_PID=''
          rm -rf "$PROFILE" 2>/dev/null || true
          cleanup_process "$SERVER_PID"
          SERVER_PID=''
          trap - EXIT

      - name: Upload retained offline proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-4a-pwa-offline-proof
          path: p5-4a-pwa-offline-proof/pwa-offline-proof.json
          if-no-files-found: warn
          retention-days: 14
