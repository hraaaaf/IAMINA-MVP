name: P1-JOURNAL-3 visual certification final

on:
  push:
    branches: [audit/p1-journal-3-visual-final]
    paths: [.github/workflows/p1-journal-3-visual-final.yml]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cdabee39073f074360ab983a9756a303c7cdcb68
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Build
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --dart-define=IAMINA_AUDIT_ACCESS=true
      - name: Install capture runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Serve
        working-directory: frontend/build/web
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/iamina-web.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Capture expanded meal matrix
        run: |
          mkdir -p /tmp/p1journal3visualfinal
          cat >/tmp/p1journal3visualfinal/capture.cjs <<'EOF'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs=require('fs'); const path=require('path');
          const views=[['desktop',1440,1000],['tablet',768,1024],['mobile',390,844],['small',360,560]];
          const langs=[['fr','fr-FR'],['ar','ar-MA']];
          (async()=>{
            const b=await chromium.launch({headless:true}); const report=[];
            for(const [vp,w,h] of views) for(const [lang,locale] of langs){
              const c=await b.newContext({viewport:{width:w,height:h},locale,timezoneId:'Africa/Casablanca'}); const p=await c.newPage();
              const pageErrors=[]; const consoleErrors=[];
              p.on('pageerror',e=>pageErrors.push(String(e)));
              p.on('console',m=>{if(m.type()==='error'&&!String(m.text()).includes('ERR_CONNECTION_REFUSED')) consoleErrors.push(m.text())});
              await p.goto(`http://127.0.0.1:8080/?audit=visual-cert&lang=${lang}#/ajouter`,{waitUntil:'domcontentloaded',timeout:30000});
              await p.waitForTimeout(4500);
              const candidates=lang==='ar'?['إضافة وجبة','إضافة وجبة · اختياري']:['Ajouter un repas','Ajouter un repas · Facultatif'];
              let expanded=false;
              for(const text of candidates){
                const loc=p.getByText(text,{exact:false}).first();
                if(await loc.count()){await loc.click({force:true}).catch(()=>{});await p.waitForTimeout(800);expanded=true;break;}
              }
              if(!expanded){
                const selector=lang==='ar'?'[aria-label*="وجبة"]':'[aria-label*="repas"]';
                const loc=p.locator(selector).first();
                if(await loc.count()){await loc.click({force:true}).catch(()=>{});await p.waitForTimeout(800);expanded=true;}
              }
              const file=`${vp}-${lang}__meal-expanded.png`;
              await p.screenshot({path:path.join('/tmp/p1journal3visualfinal',file),fullPage:true});
              report.push({vp,lang,w,h,url:p.url(),expanded,flutterViews:await p.locator('flutter-view').count(),pageErrors,consoleErrors,screenshot:file});
              await c.close();
            }
            await b.close();
            fs.writeFileSync('/tmp/p1journal3visualfinal/report.json',JSON.stringify(report,null,2));
            if(report.some(x=>!x.expanded||x.flutterViews!==1||x.pageErrors.length||x.consoleErrors.length)) process.exit(1);
          })();
          EOF
          node /tmp/p1journal3visualfinal/capture.cjs
      - name: Record source
        if: always()
        run: echo cdabee39073f074360ab983a9756a303c7cdcb68 >/tmp/p1journal3visualfinal/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-journal-3-visual-final
          path: /tmp/p1journal3visualfinal
          retention-days: 14
