name: P1-JOURNAL-3 visual certification final

on:
  push:
    branches: [audit/p1-journal-3-visual-final]
    paths: [.github/workflows/p1-journal-3-visual-final.yml]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a62502fbeb81c861ebbb3a87c72c02ecede2fa65
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Build
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --dart-define=IAMINA_AUDIT_ACCESS=true
      - name: Install capture runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Serve
        working-directory: frontend/build/web
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/iamina-web.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Capture expanded meal matrix
        run: |
          mkdir -p /tmp/p1journal3release
          cat >/tmp/p1journal3release/capture.cjs <<'EOF'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs=require('fs'); const path=require('path');
          const views=[['desktop',1440,1000],['tablet',768,1024],['mobile',390,844],['small',360,560]];
          const langs=[['fr','fr-FR'],['ar','ar-MA']];
          (async()=>{
            const b=await chromium.launch({headless:true}); const report=[];
            for(const [vp,w,h] of views) for(const [lang,locale] of langs){
              const c=await b.newContext({viewport:{width:w,height:h},locale,timezoneId:'Africa/Casablanca'}); const p=await c.newPage();
              const pageErrors=[]; const consoleErrors=[];
              p.on('pageerror',e=>pageErrors.push(String(e)));
              p.on('console',m=>{if(m.type()==='error'&&!String(m.text()).includes('ERR_CONNECTION_REFUSED')) consoleErrors.push(m.text())});
              await p.goto(`http://127.0.0.1:8080/?audit=visual-cert&lang=${lang}#/ajouter`,{waitUntil:'domcontentloaded',timeout:30000});
              await p.waitForTimeout(4500);
              let click;
              if(vp==='desktop') click=lang==='ar'?[1040,394]:[400,394];
              else if(vp==='tablet') click=[384,394];
              else click=[Math.floor(w/2),436];
              const before=await p.screenshot();
              await p.mouse.click(click[0],click[1]);
              await p.waitForTimeout(900);
              const after=await p.screenshot();
              const expanded=!before.equals(after);
              const topFile=`${vp}-${lang}__meal-top.png`;
              await p.screenshot({path:path.join('/tmp/p1journal3release',topFile)});
              await p.mouse.move(Math.floor(w/2),Math.floor(h*.65));
              await p.mouse.wheel(0,650);
              await p.waitForTimeout(700);
              const lowerFile=`${vp}-${lang}__meal-lower.png`;
              await p.screenshot({path:path.join('/tmp/p1journal3release',lowerFile)});
              report.push({vp,lang,w,h,url:p.url(),click,expanded,flutterViews:await p.locator('flutter-view').count(),pageErrors,consoleErrors,topFile,lowerFile});
              await c.close();
            }
            await b.close();
            fs.writeFileSync('/tmp/p1journal3release/report.json',JSON.stringify(report,null,2));
            if(report.some(x=>!x.expanded||x.flutterViews!==1||x.pageErrors.length||x.consoleErrors.length)) process.exit(1);
          })();
          EOF
          node /tmp/p1journal3release/capture.cjs
      - name: Record source
        if: always()
        run: echo a62502fbeb81c861ebbb3a87c72c02ecede2fa65 >/tmp/p1journal3release/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-journal-3-release-cert
          path: /tmp/p1journal3release
          retention-days: 14
