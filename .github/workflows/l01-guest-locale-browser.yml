name: L01 guest bootstrap locale egress (real Chrome, local only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/lib/main.dart'
      - 'frontend/lib/services/locale_preference_service.dart'
      - 'scripts/l01_guest_locale_browser_probe.py'
      - '.github/workflows/l01-guest-locale-browser.yml'

permissions:
  contents: read

concurrency:
  group: l01-guest-locale-chrome-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chrome-guest-locale:
    name: Actual Flutter Web guest profile-locale zero-egress and BEFORE viewports
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Resolve Web dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Analyze affected Flutter code
        working-directory: frontend
        run: flutter analyze --no-fatal-infos lib/main.dart lib/services/locale_preference_service.dart
      - name: Build production Web entrypoint locally, no backend or hosted deploy
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter build web --release --no-web-resources-cdn \
            --dart-define=API_BASE_URL=http://127.0.0.1:9
          test -s build/web/main.dart.js
      - name: Actual Chrome guest boot/reload, request capture and BEFORE
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client
          python3 -m http.server 7387 --bind 127.0.0.1 \
            --directory frontend/build/web > /tmp/iamina-l01-chrome-local.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused \
            --retry-delay 1 http://127.0.0.1:7387/ > /dev/null
          python3 scripts/l01_guest_locale_browser_probe.py
      - name: Upload bounded synthetic Chrome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l01-guest-locale-real-chrome-before
          path: l01-guest-locale-browser-proof/
          retention-days: 14
          if-no-files-found: warn
