name: D14 real Django auth photo Web A-B-A PG16 (synthetic image)

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/lib/ui_d14_real_auth_photo_web_main.dart'
      - 'frontend/lib/features/journal/widgets/meal_capture_panel.dart'
      - 'tools/d14_real_auth_photo_web_check.js'
      - '.github/workflows/d14-real-auth-photo-web-pg.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d14-real-auth-pg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  d14-owner-photo-real-auth:
    name: Chrome FR/AR 390-768-1280 + real Django PG16 A-B-A
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_d14_photo_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_d14_photo_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-d14-photo-auth-synthetic-only
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:7387
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_d14_photo_ci
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Verify exact branch and static code hygiene
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          node --check tools/d14_real_auth_photo_web_check.js

      - name: Create masked ephemeral Django A/B identities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,secrets
          identities = {
              'D14_CI_A': 'd14-a@example.invalid',
              'D14_CI_B': 'd14-b@example.invalid',
              'D14_CI_PASS': secrets.token_urlsafe(35) + '_A1!',
          }
          print('::add-mask::'+identities['D14_CI_PASS'])
          with open(os.path.join(os.environ['RUNNER_TEMP'],'d14-ci-credentials.json'),'w') as f:
              json.dump(identities,f)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for k,v in identities.items():f.write(k+'='+v+'\n')
          PY

      - name: Create disposable PostgreSQL accounts; no clinical records
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py shell -c "import os; from django.contrib.auth.models import User; [User.objects.create_user(username=os.environ[name], email=os.environ[name], password=os.environ['D14_CI_PASS']) for name in ('D14_CI_A','D14_CI_B')]; assert User.objects.count()==2"
          python manage.py shell -c "from diabetes.models import LogEntry; assert LogEntry.objects.count()==0; print('D14_ZERO_REAL_CLINICAL_DATA=PASS')"

      - name: Build isolated REAL AuthService + MealCapturePanel for Flutter Web
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos lib/ui_d14_real_auth_photo_web_main.dart
          flutter build web --release --no-web-resources-cdn \
            -t lib/ui_d14_real_auth_photo_web_main.dart \
            --dart-define=API_BASE_URL=http://127.0.0.1:8000 \
            --dart-define-from-file="$RUNNER_TEMP/d14-ci-credentials.json"

      - name: Install Chromium Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Exercise 6 true browser A-B-A journeys; reject all provider calls
        run: |
          set -euo pipefail
          (cd backend && exec python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/d14-auth-api.log 2>&1) &
          API_PID=$!
          python3 -m http.server 7387 --bind 127.0.0.1 --directory frontend/build/web > /tmp/d14-auth-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          curl -fsS --retry 25 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/api/v1/health >/dev/null
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:7387/ >/dev/null
          node tools/d14_real_auth_photo_web_check.js

      - name: Upload proof only, no identity or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d14-real-auth-photo-a-b-a-pg16-web
          path: d14-real-auth-photo-proof/*
          if-no-files-found: warn
          retention-days: 7
