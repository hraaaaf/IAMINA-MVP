name: P2-JOURNAL-8 hardening

on:
  push:
    branches: [audit/p2-journal-8-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: hardening-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///hardening-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-journal-personal-response
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Assert exact product head
        run: test "$(git rev-parse HEAD)" = "39275617eb99d2c5d1324ff1373d30ba716e5ec2"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend gates
        working-directory: backend
        run: |
          pip install -r requirements.txt ruff==0.15.17
          ruff format diabetes/services/clinical/personal_response.py diabetes/api/v1/personal_response.py diabetes/tests/test_personal_response.py diabetes/tests/test_personal_response_api.py
          ruff check diabetes/services/clinical/personal_response.py diabetes/api/v1/personal_response.py diabetes/tests/test_personal_response.py diabetes/tests/test_personal_response_api.py
          python manage.py makemigrations --check --dry-run
          pytest diabetes/tests/test_personal_response.py diabetes/tests/test_personal_response_api.py --tb=short -q

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: Frontend focused gates
        working-directory: frontend
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze --no-fatal-infos
          flutter test test/features/personal_response_section_test.dart --no-pub

      - name: Restore dependency artifacts and commit
        run: |
          git checkout origin/main -- frontend/pubspec.lock frontend/.flutter-plugins-dependencies
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend frontend docs/api/openapi.json
          git commit -m 'test(journal): harden personal response boundary'
          git push origin HEAD:agent/p2-journal-personal-response
