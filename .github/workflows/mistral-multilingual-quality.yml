name: Free LLM benchmark - Mistral Small 4

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/evaluation/mistral_multilingual_quality_benchmark.py"
      - "backend/evaluation/tests/test_mistral_multilingual_quality_benchmark.py"
      - "backend/evaluation/fixtures/mistral_small4_text_price.json"
      - ".github/workflows/mistral-multilingual-quality.yml"

permissions:
  contents: read

concurrency:
  group: mistral-free-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Mistral Small 4 bounded 10-locale sample
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: mistral-benchmark-nonproduction
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///mistral-benchmark.db
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_BENCHMARK_NETWORK_AUTHORIZED: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Validate benchmark contracts before network
        run: >-
          pytest -q
          evaluation/tests/test_mistral_multilingual_quality_benchmark.py
          evaluation/tests/test_frug5_multilingual_quality_benchmark.py
          evaluation/tests/test_nonstt_evidence_gates.py
          llm/tests/test_lowcost_provider_adapters.py
      - name: Run one bounded no-retry Mistral benchmark
        run: >-
          python -m evaluation.mistral_multilingual_quality_benchmark
          --output ../artifacts/mistral-small4-multilingual-quality.json
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mistral-small4-multilingual-quality
          path: artifacts/mistral-small4-multilingual-quality.json
          if-no-files-found: warn
          retention-days: 14
