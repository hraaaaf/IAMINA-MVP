name: P2 Companion docs closeout sync
on:
  push:
    branches: [agent/p2-companion-7-dashboard-entry]
    paths: [.github/workflows/p2-companion-docs-closeout.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-companion-7-dashboard-entry
      - name: Update canonical companion docs
        shell: python
        run: |
          from pathlib import Path
          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text()
          text = text.replace('P2-COMPANION-6 — After-Visit Continuity is NEXT.', 'P2-COMPANION-8 — Safety + Certification is NEXT.')
          text = text.replace('### ▶️ P2-COMPANION-6 — After-Visit Continuity — NEXT', '### ✅ P2-COMPANION-6 — After-Visit Continuity — CLOSED')
          text = text.replace('### ⏳ P2-COMPANION-7 — Companion UX', '### ✅ P2-COMPANION-7 — Companion UX — CLOSED')
          text = text.replace('### ⏳ P2-COMPANION-8 — Safety + Certification', '### ▶️ P2-COMPANION-8 — Safety + Certification — NEXT')
          text = text.replace('| **P2-COMPANION-6** | **After-Visit Continuity** | ▶️ **NEXT** | Interval follow-up records change without judging/altering treatment |', '| **P2-COMPANION-6** | **After-Visit Continuity** | ✅ **CLOSED** | Explicit visit/fact provenance; no treatment-efficacy inference; runtime merged and post-merge green |')
          text = text.replace('| P2-COMPANION-7 | Companion UX | ⏳ Planned | Patient-first Understand → Follow → Prepare surfaces; no virtual-doctor framing |', '| **P2-COMPANION-7** | **Companion UX** | ✅ **CLOSED** | P2-7A/B/C/D delivered; final merge `bb5b9cb8…`; post-merge CI #1966 + drift #1778 green |')
          text = text.replace('| P2-COMPANION-8 | Safety + Certification | ⏳ Planned | Permanent boundary/false-positive/longitudinal release gates |', '| **P2-COMPANION-8** | **Safety + Certification** | ▶️ **NEXT** | Permanent boundary/false-positive/longitudinal release gates |')
          text = text.replace('execute **P2-COMPANION-6 — After-Visit Continuity**', 'execute **P2-COMPANION-8 — Safety + Certification**')
          roadmap.write_text(text)
          contract = Path('docs/COMPANION_INTELLIGENCE_CONTRACT.md')
          text = contract.read_text()
          text = text.replace('| **P2-COMPANION-6** | **After-Visit Continuity** | ▶️ NEXT: record and compare the post-consultation interval without judging, overriding or optimizing treatment |', '| **P2-COMPANION-6** | **After-Visit Continuity** | ✅ Certified: explicit visit/fact continuity with provenance and no treatment-efficacy inference from chronology |')
          text = text.replace('| P2-COMPANION-7 | Companion UX | Patient-first surfaces organized around understand, follow and prepare rather than medical-software authority |', '| **P2-COMPANION-7** | **Companion UX** | ✅ Certified: read-only overview API + FR/EN/AR patient-first Flutter surface + dashboard discoverability; final merge `bb5b9cb8…`; post-merge CI #1966 + drift #1778 green |')
          text = text.replace('| P2-COMPANION-8 | Safety + Certification | Permanent negative/safety evals prevent diagnosis, prescription, dosing, treatment-change and doctor-replacement drift |', '| **P2-COMPANION-8** | **Safety + Certification** | ▶️ NEXT: permanent negative/safety evals prevent diagnosis, prescription, dosing, treatment-change, false-certainty and doctor-replacement drift |')
          marker = '## 10. Permanent regression expectations\n'
          insert = '''### 5.6 After-Visit Continuity and Companion UX closure\n\nP2-COMPANION-6 and P2-COMPANION-7 preserve the same authority ceiling through persistence, API and patient UX. Final P2-COMPANION-7 dashboard merge `bb5b9cb87fdd48197657cb38011509876756b5ea` passed post-merge CI #1966 and migration drift #1778.\n\n'''
          if insert not in text:
              text = text.replace(marker, insert + marker)
          contract.write_text(text)
      - name: Commit canonical docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ROADMAP.md docs/COMPANION_INTELLIGENCE_CONTRACT.md
          git diff --cached --quiet || git commit -m 'docs(companion): sync P2-7 closeout canonicals'
          git push origin HEAD:agent/p2-companion-7-dashboard-entry
