name: D1-6 isolated Safari Django Preview preflight (NO DEPLOY)
on:
  push:
    branches: [research/d1-6-safari-preview-20261113]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-preview-gates:
    name: Django Preview URL isolation / synthetic sessions / WebAuthn regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: d1-ci-only-not-a-production-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: sqlite:////tmp/d1-preview-ci.sqlite3
      CORS_ALLOWED_ORIGINS: https://test-preview.vercel.app
      CSRF_TRUSTED_ORIGINS: https://test-preview.vercel.app
      GEMINI_API_KEY: ""
      FIREBASE_CREDENTIALS_PATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt ruff==0.15.17
      - name: Lint and syntax branch-only lab
        run: |
          ruff check backend/d1_safari_preview backend/core/tests/test_d1_safari_hosted_preview.py backend/api/index.py
          python -m compileall -q backend/d1_safari_preview backend/api/index.py
          node --check backend/d1_safari_preview/assets/client.js
          node --check backend/d1_safari_preview/assets/bridge.js
          node --test frontend/test_node/d1_signed_prf_synthetic_research.test.js
      - name: Preview Django settings boot gate (fake DB URL, no DB connection)
        env:
          VERCEL: "1"
          VERCEL_ENV: preview
          VERCEL_PROJECT_ID: prj_hnlWE6QdXtWvYVfwe2JVAqIKPUiP
          VERCEL_GIT_COMMIT_REF: research/d1-6-safari-preview-20261113
          VERCEL_URL: test-preview.vercel.app
          IAMINA_D1_SAFARI_LAB_ONLY: synthetic-preview-v1
          IAMINA_ENV: development
          IAMINA_EXPECTED_DB_HOST: example.neon.tech
          IAMINA_EXPECTED_DB_NAME: iamina925_empty
          IAMINA_EXPECTED_DB_ROLE: d1_safari_runtime
          DATABASE_URL: postgresql://d1_safari_runtime:ci-non-secret@example.neon.tech/iamina925_empty?sslmode=require
          DEBUG: "False"
        run: |
          cd backend
          python manage.py check --settings=d1_safari_preview.settings
          # A production-targeted process must not be able to import this lab.
          if VERCEL_ENV=production python manage.py check --settings=d1_safari_preview.settings > /tmp/d1-denied.log 2>&1; then
            echo "::error::Lab settings accepted production"; exit 1
          fi
      - name: Django isolated UI session and CSRF tests
        run: |
          cd backend
          pytest -q --tb=short core/tests/test_d1_safari_hosted_preview.py core/tests/test_d1_safari_lab_research.py
      - name: Prevent production route mounting and real external integrations
        run: |
          set -euo pipefail
          if grep -r 'd1_safari_preview' backend/amina/urls.py backend/diabetes/api/main.py frontend/web/index.html; then
            echo "::error::Synthetic preview mounted in patient application"; exit 1
          fi
          test "$(grep -c 'D1_PREVIEW_DEPLOYMENT_NOT_AUTHORIZED' backend/api/index.py)" = 1
          test "$(grep -c 'ROOT_URLCONF = "d1_safari_preview.urls"' backend/d1_safari_preview/settings.py)" = 1
