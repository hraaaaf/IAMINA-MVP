name: PR17 finalize OpenAPI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-openapi.db
      FIREBASE_CREDENTIALS_PATH: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-sovereign-auth-migration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: backend
        run: pip install -r requirements.txt
      - name: Generate schema and finalize documentation
        run: |
          cd backend
          python manage.py export_openapi > ../docs/api/openapi.json
          cd ..
          if ! grep -q 'Completion checkpoint — 31 July 2026' docs/architecture/P0_MENA_3_AUTH_MIGRATION_CONTRACT.md; then
            cat >> docs/architecture/P0_MENA_3_AUTH_MIGRATION_CONTRACT.md <<'EOF'

## Completion checkpoint — 31 July 2026

- Django registration, login, logout, password establishment and native recovery are implemented.
- IAMINA bearer tokens are signed, expiring and globally revocable per patient.
- Flutter initializes native authentication before routing and stores IAMINA credentials securely.
- Native authentication is primary; Firebase remains only a temporary migration bridge and demo dependency.
- Firebase link and unlink are explicit; email is never a silent merge key for an active Django account.
- Historical Firebase shells are migrated only when uniquely identifiable and without synthesized patient facts.
- SQLite and PostgreSQL both apply migration `0011_basepatientprofile_auth_token_version`.
- Readiness audit: `python manage.py audit_auth_migration`.
- Final Firebase-removal gate: `python manage.py audit_auth_migration --require-zero-firebase`.
EOF
          fi
          rm -f .github/workflows/pr17-openapi-artifact.yml
          rm -f .github/workflows/pr17-finalize-generated.yml
          rm -f .github/workflows/pr17-finish-auth.yml
          rm -f .github/workflows/pr17-fix-legacy-test.yml
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(auth): finalize sovereign migration contract"
          git push origin HEAD:feat/p0-mena-sovereign-auth-migration
