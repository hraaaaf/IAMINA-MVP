name: UX10 roadmap closeout helper

on:
  push:
    branches: [docs/ux10-dashboard-closeout]
    paths: [.github/workflows/ux10-roadmap-closeout.yml]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ux10-dashboard-closeout

      - name: Update canonical ROADMAP
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/ROADMAP.md')
          text = path.read_text()
          lines = text.splitlines()

          for i, line in enumerate(lines):
              if line.startswith('> **Last updated:**'):
                  lines[i] = '> **Last updated:** 2026-08-11 — UX visual rebase is closed through UX-10: UX-10 rebuilt the populated mobile Dashboard against the approved reference at 9.3/10; PR #104 merged as `72cac1bf16608c6c23878718a0458c874fa34a70` and post-merge CI #1577 + drift #1389 are green.'
              elif line.startswith('| UX visual rebase |'):
                  lines[i] = '| UX visual rebase | 100% | ✅ Closed | UX-0–9 remain closed; UX-10 PR #104 rebuilt the populated mobile Dashboard against the approved reference at **9.3/10** (merge `72cac1bf16608c6c23878718a0458c874fa34a70`); post-merge CI #1577 + drift #1389 green |'

          text = '\n'.join(lines) + '\n'
          anchor = '\nPreparation work does not close a live benchmark'
          closeout = (
              '\n**UX-10 closeout:** PR #104 rebuilt the populated mobile Dashboard around the approved visual reference while preserving real persisted data, deterministic/fail-closed metrics, five real navigation destinations, routes, persistence, consent, clinical logic and AI safety boundaries. '
              'The converged mobile composition uses the warm ivory canvas, identity-led header, dark-teal current-glucose hero with real sparkline/target state, Trends & Insights surface, real quick actions and a central Add action that no longer overlaps RTL destination hit targets. '
              'Fresh rendered audit run `31501264153` succeeded with artifact `9105255166`, digest `sha256:d3421c07811b3781f89d5659c5d84cfe67e69d121c53d776e53b92846ced5cec`, FR/AR 390×844 and 360×560 plus FR 1440×1000 captures, exactly one `flutter-view`, zero page errors and Product/UX **9.3/10** against the approved reference. '
              'Exact product head `9be1eef14e7c841e69fe5b2e7e97d62e76bc3c22` passed CI #1575 / run `31501897197` and migration drift #1387 / run `31501897201`; PR #104 merged as `72cac1bf16608c6c23878718a0458c874fa34a70`; post-merge CI #1577 / run `31502163598` and migration drift #1389 / run `31502163579` both passed. '
              '**UX-10 is 100% closed.** This UX work does not change the MENA critical-path numerator.\n'
          )
          if anchor not in text:
              raise SystemExit('ROADMAP closeout anchor not found')
          text = text.replace(anchor, closeout + anchor, 1)
          path.write_text(text)
          PY

          git diff --check
          git config user.name "hraaaaf"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git add docs/ROADMAP.md
          git commit -m "docs(ux): close UX-10 roadmap"
          git push origin HEAD:docs/ux10-dashboard-closeout
