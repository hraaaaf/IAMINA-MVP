name: D1 session fence research — Node only (NO DEPLOY)
on:
  pull_request:
    branches:
      - main
      - research/d1-django-passkey-binding-20261112
    paths:
      - frontend/web/d1_prf_session_fence_research.js
      - frontend/test_node/d1_prf_session_fence_research.test.js
      - .github/workflows/d1-client-session-fence-research.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-research-fence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-negative-matrix:
    name: Web client research A→B→A / logout / BFCache (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and synthetic negative tests (no network, no secrets)
        run: |
          node --check frontend/web/d1_prf_session_fence_research.js
          node --test frontend/test_node/d1_prf_session_fence_research.test.js
      - name: Evidence boundary
        run: |
          echo 'PASS only means isolated Node simulation. No Django route, Safari Face ID, physical PRF, clinical vault, Vercel deployment, or patient authorization is tested.' >> "$GITHUB_STEP_SUMMARY"
