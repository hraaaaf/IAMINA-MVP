name: Apply P0 UX privacy truthfulness

on:
  push:
    branches:
      - fix/p0-ux-privacy-truthfulness
    paths:
      - scripts/apply_p0_ux_privacy_truthfulness.py
      - .github/workflows/apply-p0-ux-privacy-truthfulness.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-ux-privacy-truthfulness
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Apply scoped closure
        run: python scripts/apply_p0_ux_privacy_truthfulness.py

      - name: Generate and format localizations
        working-directory: frontend
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib/features/documents/document_import_screen.dart test/p0_privacy_truthfulness_contract_test.dart

      - name: Analyze Flutter
        working-directory: frontend
        run: flutter analyze

      - name: Run P0 privacy and mobile contracts
        working-directory: frontend
        run: |
          flutter test test/p0_privacy_truthfulness_contract_test.dart
          flutter test test/p0_mobile_import_navigation_test.dart

      - name: Commit closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/l10n frontend/lib/features/documents/document_import_screen.dart frontend/test/p0_privacy_truthfulness_contract_test.dart docs/ux/P0_PRODUCT_TRUTHFULNESS.md docs/ROADMAP.md
          git commit -m "fix(p0-ux): close privacy truthfulness contract"
          git push origin HEAD:fix/p0-ux-privacy-truthfulness
