name: MENA C20 PaddleOCR Arabic

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mena-319-c20-arabic-ocr*
    paths:
      - scripts/run_paddleocr_arabic_benchmark.py
      - .github/workflows/mena-c20-paddleocr-arabic.yml

permissions:
  contents: read
  issues: write

jobs:
  paddleocr-arabic:
    name: PP-OCR Arabic synthetic CPU benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Arabic font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - name: Install local OCR runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.2 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.7.0 Pillow>=10.0
      - name: Run C20 Arabic benchmark
        run: python scripts/run_paddleocr_arabic_benchmark.py --output-dir /tmp/paddleocr-c20
      - name: Upload C20 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mena-c20-paddleocr-arabic-${{ github.sha }}
          path: /tmp/paddleocr-c20
          if-no-files-found: warn
          retention-days: 14
      - name: Publish durable C20 result
        if: always()
        uses: actions/github-script@v7
        env:
          C20_STATUS: ${{ job.status }}
        with:
          script: |
            const status = process.env.C20_STATUS.toUpperCase();
            const sha = context.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[MENA C20] ${status} PaddleOCR Arabic ${sha.slice(0, 12)}`;
            const body = [
              `Synthetic Arabic OCR engineering evidence.`,
              ``,
              `- SHA: \`${sha}\``,
              `- Result: **${status}**`,
              `- Workflow run: ${runUrl}`,
              `- Cases: Arabic glucose 54, rotated glucose 68, blurred HbA1c 7.4`,
              `- Patient data: no`,
              `- Real-camera evidence: no`,
              `- Provider API / paid inference: no`,
              ``,
              `Artifact \`mena-c20-paddleocr-arabic-${sha}\` contains measured JSON evidence and synthetic fixtures.`
            ].join('\n');
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
