name: CGM V2 OpenAPI sync

on:
  push:
    branches:
      - agent/cgm-gateway-v2-product-wiring
    paths:
      - .github/workflows/cgm-v2-openapi-sync.yml

permissions:
  contents: write

jobs:
  sync-openapi:
    runs-on: ubuntu-24.04
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cgm-gateway-v2-product-wiring
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Regenerate canonical OpenAPI
        working-directory: backend
        run: python manage.py export_openapi > ../docs/api/openapi.json
      - name: Commit generated schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.json
          if git diff --cached --quiet; then
            echo "OpenAPI already current"
            exit 0
          fi
          git commit -m "docs(api): regenerate OpenAPI for CGM V2"
          git push origin HEAD:agent/cgm-gateway-v2-product-wiring
