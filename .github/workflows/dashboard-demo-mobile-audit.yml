name: IAMINA dashboard demo mobile audit

on:
  push:
    branches:
      - audit/dashboard-demo-mobile-20260909
    paths:
      - '.github/workflows/dashboard-demo-mobile-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run mobile demo audit
        env:
          TARGET_URL: https://iamina-review.vercel.app
        run: |
          mkdir -p dashboard-demo-audit
          cat > audit.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          import fs from 'node:fs';
          const out='dashboard-demo-audit';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({...devices['iPhone 13'],viewport:{width:390,height:844},locale:'fr-FR'});
          const page=await context.newPage();
          const log=[]; const rec=(event,data={})=>log.push({event,at:new Date().toISOString(),...data});
          page.on('console',m=>rec('console',{type:m.type(),text:m.text()}));
          page.on('pageerror',e=>rec('pageerror',{text:String(e)}));
          page.on('requestfailed',r=>rec('requestfailed',{url:r.url(),failure:r.failure()}));
          try {
            const r=await page.goto(process.env.TARGET_URL,{waitUntil:'domcontentloaded',timeout:60000});
            rec('landing',{url:page.url(),status:r?.status()});
            await page.waitForTimeout(7000);
            await page.screenshot({path:`${out}/01-landing-390x844.png`,fullPage:false});
            const taps=[[195,650],[195,642],[195,658]];
            for(const [x,y] of taps){
              if(!page.url().includes('#/login') && page.url()!==process.env.TARGET_URL) break;
              rec('demo-tap',{x,y,url:page.url()});
              await page.touchscreen.tap(x,y);
              await page.waitForTimeout(3500);
            }
            if(page.url().includes('#/login')) throw new Error('Les taps Démo n’ont pas quitté /#/login');
            rec('dashboard-entered',{url:page.url(),title:await page.title()});
            await page.waitForTimeout(30000);
            rec('seed-settle-wait-complete',{url:page.url()});
            await page.screenshot({path:`${out}/02-dashboard-stable-top-390x844.png`,fullPage:false});
            for(let i=0;i<7;i++){
              await page.screenshot({path:`${out}/${String(i+3).padStart(2,'0')}-dashboard-stable-scroll-${i}-390x844.png`,fullPage:false});
              await page.mouse.move(195,600);
              await page.mouse.wheel(0,600);
              await page.waitForTimeout(900);
            }
            fs.writeFileSync(`${out}/page-url.txt`,page.url());
            rec('audit-complete',{url:page.url()});
          } catch(e){rec('fatal',{text:String(e),url:page.url()});await page.screenshot({path:`${out}/99-failure-390x844.png`,fullPage:false}).catch(()=>{});throw e;}
          finally{fs.writeFileSync(`${out}/browser-log.json`,JSON.stringify(log,null,2));await browser.close();}
          JS
          node audit.mjs
      - name: Upload mobile audit proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-dashboard-demo-mobile-audit
          path: dashboard-demo-audit/
          if-no-files-found: warn
          retention-days: 7
