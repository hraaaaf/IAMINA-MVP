name: IAMINA dashboard demo mobile audit

on:
  push:
    branches:
      - audit/dashboard-demo-mobile-20260909
    paths:
      - '.github/workflows/dashboard-demo-mobile-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run mobile demo audit
        env:
          TARGET_URL: https://iamina-review-275t9zih5-achraf-benmoussa-s-projects.vercel.app
        run: |
          mkdir -p dashboard-demo-audit
          cat > audit.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          import fs from 'node:fs';
          const out='dashboard-demo-audit';
          const expectedHost=new URL(process.env.TARGET_URL).host;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({...devices['iPhone 13'],viewport:{width:390,height:844},locale:'fr-FR'});
          const page=await context.newPage();
          const log=[]; const rec=(event,data={})=>log.push({event,at:new Date().toISOString(),...data});
          page.on('console',m=>rec('console',{type:m.type(),text:m.text()}));
          page.on('pageerror',e=>rec('pageerror',{text:String(e)}));
          page.on('requestfailed',r=>rec('requestfailed',{url:r.url(),failure:r.failure()}));
          try {
            const r=await page.goto(process.env.TARGET_URL,{waitUntil:'domcontentloaded',timeout:60000});
            rec('landing',{url:page.url(),status:r?.status()});
            if(new URL(page.url()).host!==expectedHost) throw new Error(`Unexpected redirect host: ${new URL(page.url()).host}`);
            await page.waitForTimeout(7000);
            await page.screenshot({path:`${out}/01-landing-390x844.png`,fullPage:false});
            await page.mouse.click(195,645);
            rec('demo-click',{x:195,y:645,url:page.url()});
            await page.waitForTimeout(6000);
            if(new URL(page.url()).host!==expectedHost) throw new Error(`Unexpected redirect host after demo click: ${new URL(page.url()).host}`);
            if(page.url().includes('#/login')) throw new Error('Mouse click Accès démo n’a pas quitté /#/login');
            rec('dashboard-entered',{url:page.url(),title:await page.title()});
            await page.waitForTimeout(18000);
            if(page.url().includes('#/login')) throw new Error('Retour inattendu sur /#/login');
            await page.screenshot({path:`${out}/02-dashboard-stable-top-390x844.png`,fullPage:false});
            for(let i=0;i<7;i++){
              await page.screenshot({path:`${out}/${String(i+3).padStart(2,'0')}-dashboard-stable-scroll-${i}-390x844.png`,fullPage:false});
              await page.mouse.move(195,600);
              await page.mouse.wheel(0,600);
              await page.waitForTimeout(900);
            }
            const fatal = log.find(e => e.event==='pageerror');
            if(fatal) throw new Error(`pageerror: ${fatal.text}`);
            rec('audit-complete',{url:page.url()});
          } catch(e){rec('fatal',{text:String(e),url:page.url()});await page.screenshot({path:`${out}/99-failure-390x844.png`,fullPage:false}).catch(()=>{});throw e;}
          finally{fs.writeFileSync(`${out}/browser-log.json`,JSON.stringify(log,null,2));fs.writeFileSync(`${out}/page-url.txt`,page.url());await browser.close();}
          JS
          node audit.mjs
      - name: Upload mobile audit proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-dashboard-demo-mobile-audit
          path: dashboard-demo-audit/
          if-no-files-found: error
          retention-days: 7
