name: Export OpenAPI artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-openapi.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-media-consent-api
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Export OpenAPI
        run: python backend/manage.py export_openapi > docs/api/openapi.json
      - name: Commit generated schema
        run: |
          if git diff --quiet -- docs/api/openapi.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.json
          git commit -m "docs(api): regenerate OpenAPI for media consent API"
          git push origin HEAD:feat/p0-mena-media-consent-api
