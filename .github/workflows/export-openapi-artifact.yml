name: Export OpenAPI artifact

on:
  push:
    branches: [feat/p0-mena-media-consent-api]
  pull_request:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-openapi.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Export OpenAPI
        run: python manage.py export_openapi > /tmp/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: generated-openapi
          path: /tmp/openapi.json
          if-no-files-found: error
