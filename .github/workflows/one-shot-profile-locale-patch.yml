name: One-shot Profile locale patch

on:
  push:
    branches:
      - agent/profile-locale-preference
    paths:
      - .github/workflows/one-shot-profile-locale-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-locale-preference
      - name: Apply exact Profile locale patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/lib/features/profile/profile_screen.dart')
          text = path.read_text()
          old = "            preferredLanguage: const drift.Value('fr'),"
          new = "            preferredLanguage: drift.Value(\n              Localizations.localeOf(context).languageCode,\n            ),"
          assert text.count(old) == 1, f'expected exactly one hardcoded Profile language, found {text.count(old)}'
          text = text.replace(old, new)
          path.write_text(text)

          workflow = Path('.github/workflows/one-shot-profile-locale-patch.yml')
          workflow.unlink()
          PY
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/features/profile/profile_screen.dart .github/workflows/one-shot-profile-locale-patch.yml
          git commit -m "fix(profile): persist active locale"
          git push origin HEAD:agent/profile-locale-preference
