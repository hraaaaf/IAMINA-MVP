name: P0 STT Test Codemod

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  codemod:
    if: github.head_ref == 'fix/p0-ai-egress-consent-boundary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scope STT provider unit tests as policy-authorized
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/diabetes/tests/test_sprint4_services.py')
          text = path.read_text()
          old = '''class STTGeminiCallTests(SimpleTestCase):\n    """Mocked Gemini calls: model selection, language hints, error handling."""\n'''
          new = '''class STTGeminiCallTests(SimpleTestCase):\n    """Mocked provider calls; egress policy behavior is tested in core/tests."""\n\n    def setUp(self):\n        super().setUp()\n        self._egress_patcher = patch("media.voice.assert_ai_egress_allowed")\n        self._egress_patcher.start()\n        self.addCleanup(self._egress_patcher.stop)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one STTGeminiCallTests header, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit test update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/diabetes/tests/test_sprint4_services.py
          git commit -m 'test(p0): authorize mocked STT provider unit tests explicitly'
          git push origin HEAD:${{ github.head_ref }}
