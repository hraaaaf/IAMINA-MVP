name: P1 JOURNAL 7 builder

on:
  push:
    branches:
      - agent/p1-journal-ramadan-v2

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-journal-ramadan-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Apply deterministic Ramadan v2 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Backend model: explicit nullable period, never inferred.
          replace_once(
              'backend/diabetes/models/patient.py',
              "    class Meta:\n",
              "    ramadan_start_date = models.DateField(\n"
              "        null=True,\n"
              "        blank=True,\n"
              "        help_text=(\n"
              "            'Patient-declared start of an optional Ramadan journal context. '\n"
              "            'NULL means no period is configured.'\n"
              "        ),\n"
              "    )\n\n"
              "    ramadan_end_date = models.DateField(\n"
              "        null=True,\n"
              "        blank=True,\n"
              "        help_text=(\n"
              "            'Patient-declared end of an optional Ramadan journal context. '\n"
              "            'NULL means no period is configured.'\n"
              "        ),\n"
              "    )\n\n"
              "    class Meta:\n",
          )

          # API response schema.
          replace_once(
              'backend/diabetes/api/v1/schemas.py',
              "    height: Optional[float] = None\n\n\nclass LogEntrySchema",
              "    height: Optional[float] = None\n"
              "    ramadan_start_date: Optional[date] = None\n"
              "    ramadan_end_date: Optional[date] = None\n\n\nclass LogEntrySchema",
          )

          # Profile PATCH: period is an atomic pair; partial/inverted periods fail closed.
          replace_once(
              'backend/diabetes/api/v1/profile.py',
              "    height: Optional[int] = None\n\n    @field_validator(\"preferred_language\")",
              "    height: Optional[int] = None\n"
              "    ramadan_start_date: Optional[date] = None\n"
              "    ramadan_end_date: Optional[date] = None\n\n"
              "    @field_validator(\"preferred_language\")",
          )
          replace_once(
              'backend/diabetes/api/v1/profile.py',
              "        if invalid:\n            raise ValueError(f\"Fields cannot be null: {', '.join(invalid)}\")\n        return self\n\n\nclass MediaConsentStateSchema",
              "        if invalid:\n            raise ValueError(f\"Fields cannot be null: {', '.join(invalid)}\")\n        return self\n\n"
              "    @model_validator(mode=\"after\")\n"
              "    def validate_ramadan_period_pair(self):\n"
              "        fields = {\"ramadan_start_date\", \"ramadan_end_date\"}\n"
              "        touched = fields & self.model_fields_set\n"
              "        if not touched:\n"
              "            return self\n"
              "        if touched != fields:\n"
              "            raise ValueError(\"ramadan_start_date and ramadan_end_date must be patched together\")\n"
              "        start = self.ramadan_start_date\n"
              "        end = self.ramadan_end_date\n"
              "        if (start is None) != (end is None):\n"
              "            raise ValueError(\"Ramadan period must contain both dates or clear both\")\n"
              "        if start is not None and end is not None and start > end:\n"
              "            raise ValueError(\"ramadan_start_date must be on or before ramadan_end_date\")\n"
              "        return self\n\n\nclass MediaConsentStateSchema",
          )
          replace_once(
              'backend/diabetes/api/v1/profile.py',
              "        \"target_range_high\",\n    }\n",
              "        \"target_range_high\",\n        \"ramadan_start_date\",\n        \"ramadan_end_date\",\n    }\n",
          )

          Path('backend/diabetes/migrations/0023_diabetesprofile_ramadan_period.py').write_text('''from django.db import migrations, models\n\n\nclass Migration(migrations.Migration):\n    dependencies = [\n        ("diabetes", "0022_context_unknown_defaults"),\n    ]\n\n    operations = [\n        migrations.AddField(\n            model_name="diabetesprofile",\n            name="ramadan_start_date",\n            field=models.DateField(\n                blank=True,\n                help_text=(\n                    "Patient-declared start of an optional Ramadan journal context. "\n                    "NULL means no period is configured."\n                ),\n                null=True,\n            ),\n        ),\n        migrations.AddField(\n            model_name="diabetesprofile",\n            name="ramadan_end_date",\n            field=models.DateField(\n                blank=True,\n                help_text=(\n                    "Patient-declared end of an optional Ramadan journal context. "\n                    "NULL means no period is configured."\n                ),\n                null=True,\n            ),\n        ),\n    ]\n''')

          Path('backend/diabetes/tests/test_ramadan_profile_period.py').write_text('''from datetime import date\nfrom types import SimpleNamespace\n\nimport pytest\nfrom django.contrib.auth.models import User\nfrom pydantic import ValidationError\n\nfrom core.models import BasePatientProfile\nfrom diabetes.api.v1.profile import ProfilePatchSchema, patch_profile\nfrom diabetes.models import DiabetesProfile\n\n\n@pytest.fixture\ndef patient(db):\n    user = User.objects.create_user(username="ramadan-period-patient")\n    base = BasePatientProfile.objects.create(patient=user)\n    DiabetesProfile.objects.create(base_profile=base)\n    return user\n\n\ndef request_for(user):\n    return SimpleNamespace(user=user)\n\n\ndef test_ramadan_period_rejects_partial_pair():\n    with pytest.raises(ValidationError):\n        ProfilePatchSchema(ramadan_start_date=date(2026, 2, 18))\n\n\ndef test_ramadan_period_rejects_inverted_range():\n    with pytest.raises(ValidationError):\n        ProfilePatchSchema(\n            ramadan_start_date=date(2026, 3, 20),\n            ramadan_end_date=date(2026, 2, 18),\n        )\n\n\ndef test_ramadan_period_persists_as_explicit_patient_context(patient):\n    patch_profile(\n        request_for(patient),\n        ProfilePatchSchema(\n            ramadan_start_date=date(2026, 2, 18),\n            ramadan_end_date=date(2026, 3, 20),\n        ),\n    )\n    profile = DiabetesProfile.objects.get(base_profile__patient=patient)\n    assert profile.ramadan_start_date == date(2026, 2, 18)\n    assert profile.ramadan_end_date == date(2026, 3, 20)\n\n\ndef test_ramadan_period_can_be_cleared_atomically(patient):\n    profile = DiabetesProfile.objects.get(base_profile__patient=patient)\n    profile.ramadan_start_date = date(2026, 2, 18)\n    profile.ramadan_end_date = date(2026, 3, 20)\n    profile.save(update_fields=["ramadan_start_date", "ramadan_end_date"])\n\n    patch_profile(\n        request_for(patient),\n        ProfilePatchSchema(ramadan_start_date=None, ramadan_end_date=None),\n    )\n    profile.refresh_from_db()\n    assert profile.ramadan_start_date is None\n    assert profile.ramadan_end_date is None\n\n\ndef test_unrelated_profile_patch_never_infers_ramadan(patient):\n    patch_profile(request_for(patient), ProfilePatchSchema(preferred_language="fr"))\n    profile = DiabetesProfile.objects.get(base_profile__patient=patient)\n    assert profile.ramadan_start_date is None\n    assert profile.ramadan_end_date is None\n''')

          # Local profile period + additive Drift v9 migration. Legacy ramadan_mode remains readable only.
          replace_once(
              'frontend/lib/data/drift/database.dart',
              "  /// RGPD Art. 7 — explicit AI processing consent timestamp.\n",
              "  DateTimeColumn get ramadanStartDate => dateTime().nullable()();\n"
              "  DateTimeColumn get ramadanEndDate => dateTime().nullable()();\n\n"
              "  /// RGPD Art. 7 — explicit AI processing consent timestamp.\n",
          )
          replace_once(
              'frontend/lib/data/drift/database.dart',
              "  int get schemaVersion => 8;",
              "  int get schemaVersion => 9;",
          )
          replace_once(
              'frontend/lib/data/drift/database.dart',
              "      if (from < 8) {\n        await m.addColumn(logEntries, logEntries.mealPortionsJson);\n      }\n",
              "      if (from < 8) {\n        await m.addColumn(logEntries, logEntries.mealPortionsJson);\n      }\n"
              "      if (from < 9) {\n"
              "        await m.addColumn(patientProfiles, patientProfiles.ramadanStartDate);\n"
              "        await m.addColumn(patientProfiles, patientProfiles.ramadanEndDate);\n"
              "      }\n",
          )
          replace_once(
              'frontend/lib/data/drift/database.dart',
              "  // Watchers\n",
              "  Future<void> setRamadanPeriod({DateTime? start, DateTime? end}) async {\n"
              "    if ((start == null) != (end == null)) {\n"
              "      throw ArgumentError('Ramadan period requires both dates or neither');\n"
              "    }\n"
              "    if (start != null && end != null && start.isAfter(end)) {\n"
              "      throw ArgumentError('Ramadan period start must not be after end');\n"
              "    }\n"
              "    await into(patientProfiles).insertOnConflictUpdate(\n"
              "      PatientProfilesCompanion.insert(\n"
              "        userId: const Value(1),\n"
              "        updatedAt: DateTime.now(),\n"
              "        ramadanStartDate: Value(start),\n"
              "        ramadanEndDate: Value(end),\n"
              "      ),\n"
              "    );\n"
              "  }\n\n"
              "  // Watchers\n",
          )

          Path('frontend/lib/core/data/ramadan_context.dart').write_text('''const List<String> regularMealTypes = <String>[\n  'breakfast',\n  'lunch',\n  'dinner',\n  'snack',\n];\n\nconst List<String> ramadanMealTypes = <String>[\n  'suhoor',\n  'iftar',\n  'snack',\n  'other',\n];\n\nDateTime _dateOnly(DateTime value) => DateTime(value.year, value.month, value.day);\n\nbool isRamadanProfileDate(\n  DateTime eventDate,\n  DateTime? configuredStart,\n  DateTime? configuredEnd,\n) {\n  if (configuredStart == null || configuredEnd == null) return false;\n  final day = _dateOnly(eventDate);\n  final start = _dateOnly(configuredStart);\n  final end = _dateOnly(configuredEnd);\n  return !day.isBefore(start) && !day.isAfter(end);\n}\n\nList<String> mealTypesForProfileDate(\n  DateTime eventDate,\n  DateTime? configuredStart,\n  DateTime? configuredEnd,\n) =>\n    isRamadanProfileDate(eventDate, configuredStart, configuredEnd)\n    ? ramadanMealTypes\n    : regularMealTypes;\n''')

          # Profile API client: explicit pair PATCH, with no inference or background claim.
          replace_once(
              'frontend/lib/services/api_client.dart',
              "  /// Récupère le résumé analytique IAmina.\n",
              "  Future<bool> patchProfile(Map<String, dynamic> patch) async {\n"
              "    try {\n"
              "      final response = await _client.patch(\n"
              "        Uri.parse('/api/v1/profile'),\n"
              "        body: patch,\n"
              "      );\n"
              "      return response.isSuccessful;\n"
              "    } catch (_) {\n"
              "      return false;\n"
              "    }\n"
              "  }\n\n"
              "  /// Récupère le résumé analytique IAmina.\n",
          )

          # Profile UI: a dedicated, optional period card. No fasting assertion.
          replace_once(
              'frontend/lib/features/profile/profile_screen.dart',
              "  bool _hasPersistedProfile = false;\n",
              "  bool _hasPersistedProfile = false;\n"
              "  DateTime? _ramadanStartDate;\n"
              "  DateTime? _ramadanEndDate;\n"
              "  bool _savingRamadan = false;\n",
          )
          replace_once(
              'frontend/lib/features/profile/profile_screen.dart',
              "        _targetHighController.text = profile.targetRangeHigh.toStringAsFixed(0);\n",
              "        _targetHighController.text = profile.targetRangeHigh.toStringAsFixed(0);\n"
              "        _ramadanStartDate = profile.ramadanStartDate;\n"
              "        _ramadanEndDate = profile.ramadanEndDate;\n",
          )
          replace_once(
              'frontend/lib/features/profile/profile_screen.dart',
              "                  _buildMedicalSection(l10n),\n                  const SizedBox(height: 14),\n                  _buildProfileSection(\n",
              "                  _buildMedicalSection(l10n),\n"
              "                  const SizedBox(height: 14),\n"
              "                  _buildRamadanSection(l10n),\n"
              "                  const SizedBox(height: 14),\n"
              "                  _buildProfileSection(\n",
          )
          replace_once(
              'frontend/lib/features/profile/profile_screen.dart',
              "  Widget _buildAccountSection(AppLocalizations l10n) {\n",
              '''  Widget _buildRamadanSection(AppLocalizations l10n) {\n    final configured = _ramadanStartDate != null && _ramadanEndDate != null;\n    return _buildProfileSection(\n      key: const ValueKey('profile-ramadan-section'),\n      icon: Icons.nightlight_round,\n      title: l10n.ramadanProfileSection,\n      subtitle: configured\n          ? '${_dateLabel(_ramadanStartDate!)} → ${_dateLabel(_ramadanEndDate!)}'\n          : l10n.ramadanNotConfigured,\n      initiallyExpanded: false,\n      children: [\n        Text(\n          l10n.ramadanProfileHint,\n          style: const TextStyle(\n            color: AminaTheme.ink500,\n            fontSize: 13,\n            height: 1.45,\n          ),\n        ),\n        const SizedBox(height: 16),\n        LayoutBuilder(\n          builder: (context, constraints) {\n            final compact = constraints.maxWidth < 460;\n            final start = _ramadanDateButton(\n              key: const Key('ramadan-start-date'),\n              label: l10n.ramadanStartDate,\n              value: _ramadanStartDate,\n              onTap: () => _pickRamadanDate(start: true),\n            );\n            final end = _ramadanDateButton(\n              key: const Key('ramadan-end-date'),\n              label: l10n.ramadanEndDate,\n              value: _ramadanEndDate,\n              onTap: () => _pickRamadanDate(start: false),\n            );\n            if (compact) {\n              return Column(children: [start, const SizedBox(height: 10), end]);\n            }\n            return Row(\n              children: [\n                Expanded(child: start),\n                const SizedBox(width: 12),\n                Expanded(child: end),\n              ],\n            );\n          },\n        ),\n        const SizedBox(height: 12),\n        Row(\n          children: [\n            if (configured)\n              TextButton(\n                key: const Key('ramadan-clear-period'),\n                onPressed: _savingRamadan\n                    ? null\n                    : () => setState(() {\n                        _ramadanStartDate = null;\n                        _ramadanEndDate = null;\n                      }),\n                child: Text(l10n.ramadanClear),\n              ),\n            const Spacer(),\n            FilledButton(\n              key: const Key('ramadan-save-period'),\n              onPressed: _savingRamadan ? null : () => _saveRamadanPeriod(l10n),\n              child: Text(_savingRamadan ? l10n.journalSaving : l10n.ramadanSave),\n            ),\n          ],\n        ),\n      ],\n    );\n  }\n\n  Widget _ramadanDateButton({\n    required Key key,\n    required String label,\n    required DateTime? value,\n    required VoidCallback onTap,\n  }) {\n    return OutlinedButton(\n      key: key,\n      onPressed: _savingRamadan ? null : onTap,\n      style: OutlinedButton.styleFrom(\n        minimumSize: const Size.fromHeight(52),\n        alignment: AlignmentDirectional.centerStart,\n      ),\n      child: Column(\n        crossAxisAlignment: CrossAxisAlignment.start,\n        children: [\n          Text(label, style: const TextStyle(fontSize: 11, color: AminaTheme.ink500)),\n          const SizedBox(height: 3),\n          Text(\n            value == null ? AppLocalizations.of(context)!.ramadanChooseDate : _dateLabel(value),\n            style: const TextStyle(fontWeight: FontWeight.w700, color: AminaTheme.ink900),\n          ),\n        ],\n      ),\n    );\n  }\n\n  Future<void> _pickRamadanDate({required bool start}) async {\n    final initial = start\n        ? (_ramadanStartDate ?? DateTime.now())\n        : (_ramadanEndDate ?? _ramadanStartDate ?? DateTime.now());\n    final picked = await showDatePicker(\n      context: context,\n      initialDate: initial,\n      firstDate: DateTime(2020),\n      lastDate: DateTime(2035, 12, 31),\n    );\n    if (picked == null || !mounted) return;\n    setState(() {\n      if (start) {\n        _ramadanStartDate = DateTime(picked.year, picked.month, picked.day);\n      } else {\n        _ramadanEndDate = DateTime(picked.year, picked.month, picked.day);\n      }\n    });\n  }\n\n  Future<void> _saveRamadanPeriod(AppLocalizations l10n) async {\n    final start = _ramadanStartDate;\n    final end = _ramadanEndDate;\n    if ((start == null) != (end == null)) {\n      ScaffoldMessenger.of(context).showSnackBar(\n        SnackBar(content: Text(l10n.ramadanNeedsBothDates)),\n      );\n      return;\n    }\n    if (start != null && end != null && start.isAfter(end)) {\n      ScaffoldMessenger.of(context).showSnackBar(\n        SnackBar(content: Text(l10n.ramadanDateOrderError)),\n      );\n      return;\n    }\n\n    setState(() => _savingRamadan = true);\n    try {\n      final db = context.read<AppDatabase>();\n      final api = context.read<ApiClient>();\n      await db.setRamadanPeriod(start: start, end: end);\n      final serverSaved = await api.patchProfile({\n        'ramadan_start_date': start == null ? null : _apiDate(start),\n        'ramadan_end_date': end == null ? null : _apiDate(end),\n      });\n      if (!mounted) return;\n      setState(() => _hasPersistedProfile = true);\n      ScaffoldMessenger.of(context).showSnackBar(\n        SnackBar(\n          content: Text(\n            serverSaved ? l10n.ramadanSaved : l10n.ramadanSavedLocalOnly,\n          ),\n          backgroundColor: serverSaved\n              ? AminaTheme.successEmerald\n              : AminaTheme.warningOrange,\n          behavior: SnackBarBehavior.floating,\n        ),\n      );\n    } finally {\n      if (mounted) setState(() => _savingRamadan = false);\n    }\n  }\n\n  String _dateLabel(DateTime value) {\n    final dd = value.day.toString().padLeft(2, '0');\n    final mm = value.month.toString().padLeft(2, '0');\n    return '$dd/$mm/${value.year}';\n  }\n\n  String _apiDate(DateTime value) {\n    final mm = value.month.toString().padLeft(2, '0');\n    final dd = value.day.toString().padLeft(2, '0');\n    return '${value.year}-$mm-$dd';\n  }\n\n  Widget _buildAccountSection(AppLocalizations l10n) {\n''',
          )

          # Journal Add flow: period only changes vocabulary; it never selects a meal.
          replace_once(
              'frontend/lib/features/dashboard/widgets/add_log_sheet.dart',
              "import '../../../core/data/nutrition_catalog.dart';\n",
              "import '../../../core/data/nutrition_catalog.dart';\nimport '../../../core/data/ramadan_context.dart';\n",
          )
          replace_once(
              'frontend/lib/features/dashboard/widgets/add_log_sheet.dart',
              "  static const List<String> _mealTypes = <String>[\n    'breakfast',\n    'lunch',\n    'dinner',\n    'snack',\n  ];\n\n",
              "",
          )
          replace_once(
              'frontend/lib/features/dashboard/widgets/add_log_sheet.dart',
              "                                  profile?.aiConsentGivenAt != null,\n                                ),",
              "                                  profile?.aiConsentGivenAt != null,\n                                  profile,\n                                ),",
          )
          replace_once(
              'frontend/lib/features/dashboard/widgets/add_log_sheet.dart',
              "                            profile?.aiConsentGivenAt != null,\n                          ),",
              "                            profile?.aiConsentGivenAt != null,\n                            profile,\n                          ),",
          )
          replace_once(
              'frontend/lib/features/dashboard/widgets/add_log_sheet.dart',
              "    bool canUsePhotoRecognition,\n  ) => Column(",
              "    bool canUsePhotoRecognition,\n    PatientProfileData? profile,\n  ) => Column(",
          )
          replace_once(
              'frontend/lib/features/dashboard/widgets/add_log_sheet.dart',
              "      _mealCapture(l10n, canUsePhotoRecognition),\n",
              "      _mealCapture(l10n, canUsePhotoRecognition, profile),\n",
          )
          replace_once(
              'frontend/lib/features/dashboard/widgets/add_log_sheet.dart',
              "  Widget _mealCapture(AppLocalizations l10n, bool canUsePhotoRecognition) {\n    if (!_mealExpanded) {",
              "  Widget _mealCapture(\n"
              "    AppLocalizations l10n,\n"
              "    bool canUsePhotoRecognition,\n"
              "    PatientProfileData? profile,\n"
              "  ) {\n"
              "    final ramadanActive = isRamadanProfileDate(\n"
              "      _selectedTime,\n"
              "      profile?.ramadanStartDate,\n"
              "      profile?.ramadanEndDate,\n"
              "    );\n"
              "    final mealTypes = mealTypesForProfileDate(\n"
              "      _selectedTime,\n"
              "      profile?.ramadanStartDate,\n"
              "      profile?.ramadanEndDate,\n"
              "    );\n"
              "    if (!_mealExpanded) {",
          )
          replace_once(
              'frontend/lib/features/dashboard/widgets/add_log_sheet.dart',
              "          const SizedBox(height: 8),\n          Wrap(\n            spacing: 8,\n            runSpacing: 8,\n            children: _mealTypes.map((value) {",
              "          const SizedBox(height: 8),\n"
              "          if (ramadanActive) ...<Widget>[\n"
              "            Text(\n"
              "              l10n.journalRamadanMealVocabularyHint,\n"
              "              key: const Key('ramadan-meal-vocabulary-hint'),\n"
              "              style: _helperStyle(),\n"
              "            ),\n"
              "            const SizedBox(height: 10),\n"
              "          ],\n"
              "          Wrap(\n"
              "            spacing: 8,\n"
              "            runSpacing: 8,\n"
              "            children: mealTypes.map((value) {",
          )
          replace_once(
              'frontend/lib/features/dashboard/widgets/add_log_sheet.dart',
              "    'dinner' => l10n.journalMealDinner,\n    _ => l10n.journalMealSnack,\n  };",
              "    'dinner' => l10n.journalMealDinner,\n"
              "    'suhoor' => l10n.journalMealSuhoor,\n"
              "    'iftar' => l10n.journalMealIftar,\n"
              "    'other' => l10n.journalMealOther,\n"
              "    _ => l10n.journalMealSnack,\n"
              "  };",
          )
          replace_once(
              'frontend/lib/features/dashboard/widgets/add_log_sheet.dart',
              "    setState(() {\n      _selectedTime = DateTime(\n        date.year,\n        date.month,\n        date.day,\n        time.hour,\n        time.minute,\n      );\n    });",
              "    final profile = context.read<PatientProfileData?>();\n"
              "    setState(() {\n"
              "      _selectedTime = DateTime(\n"
              "        date.year,\n"
              "        date.month,\n"
              "        date.day,\n"
              "        time.hour,\n"
              "        time.minute,\n"
              "      );\n"
              "      final allowed = mealTypesForProfileDate(\n"
              "        _selectedTime,\n"
              "        profile?.ramadanStartDate,\n"
              "        profile?.ramadanEndDate,\n"
              "      );\n"
              "      if (_mealType != null && !allowed.contains(_mealType)) {\n"
              "        _mealType = null;\n"
              "      }\n"
              "    });",
          )

          # History: legacy Iftar/Suhoor remain readable in the user's language.
          replace_once(
              'frontend/lib/features/journal/journal_screen.dart',
              "      case 'snack':\n        return l10n.journalMealSnack;\n",
              "      case 'snack':\n        return l10n.journalMealSnack;\n"
              "      case 'iftar':\n        return l10n.journalMealIftar;\n"
              "      case 'suhoor':\n        return l10n.journalMealSuhoor;\n"
              "      case 'other':\n        return l10n.journalMealOther;\n",
          )

          # Localized product copy. It explicitly says vocabulary adapts; fasting is not inferred.
          copies = {
              'fr': {
                  'ramadanProfileSection': 'Période de Ramadan',
                  'ramadanProfileHint': 'Optionnel. Cette période adapte les noms de repas dans le journal. IAmina n’en déduit pas que tu jeûnes.',
                  'ramadanNotConfigured': 'Non configurée',
                  'ramadanStartDate': 'Début',
                  'ramadanEndDate': 'Fin',
                  'ramadanChooseDate': 'Choisir une date',
                  'ramadanClear': 'Effacer la période',
                  'ramadanSave': 'Enregistrer',
                  'ramadanSaved': 'Période de Ramadan enregistrée.',
                  'ramadanSavedLocalOnly': 'Enregistrée sur cet appareil. Le serveur n’a pas été mis à jour.',
                  'ramadanNeedsBothDates': 'Choisis une date de début et une date de fin, ou efface les deux.',
                  'ramadanDateOrderError': 'La date de début doit précéder ou être égale à la date de fin.',
                  'journalRamadanMealVocabularyHint': 'Les noms de repas sont adaptés à la période enregistrée dans ton profil. Aucun jeûne n’est supposé.',
                  'journalMealSuhoor': 'Suhoor',
                  'journalMealIftar': 'Iftar',
                  'journalMealOther': 'Autre',
              },
              'en': {
                  'ramadanProfileSection': 'Ramadan period',
                  'ramadanProfileHint': 'Optional. This period adapts meal names in the journal. IAmina does not infer that you are fasting.',
