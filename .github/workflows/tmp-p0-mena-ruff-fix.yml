name: Temporary P0 MENA Ruff Fix

on:
  push:
    branches: [feat/p0-mena-processor-policy-registry]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-processor-policy-registry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.17
      - name: Apply exact CI Ruff fixes
        working-directory: backend
        run: ruff check . --fix
      - name: Commit mechanical fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style: apply CI ruff fixes"
          git push
