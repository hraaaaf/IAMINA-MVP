name: D10 Android medical backup protection

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/android/app/src/main/AndroidManifest.xml'
      - 'frontend/android/app/src/main/res/xml/iamina_*.xml'
      - 'scripts/tests/test_d10_android_backup_protection.py'
      - '.github/workflows/d10-android-backup-protection.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/android/app/src/main/AndroidManifest.xml'
      - 'frontend/android/app/src/main/res/xml/iamina_*.xml'
      - 'scripts/tests/test_d10_android_backup_protection.py'
      - '.github/workflows/d10-android-backup-protection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Source XML and negative-path policy tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_d10_android_backup_protection.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Compile Android debug APK (non-production)
        working-directory: frontend
        run: flutter build apk --debug --no-pub
      - name: Validate merged APK manifest policy
        shell: bash
        run: |
          set -euo pipefail
          merged="$(find frontend/build/app/intermediates -type f -path '*merged_manifests*' -name AndroidManifest.xml | grep -E '/debug/' | head -n 1 || true)"
          test -n "$merged" || { echo "::error::Compiled debug merged manifest not found"; exit 1; }
          python3 scripts/tests/test_d10_android_backup_protection.py --merged-manifest "$merged"
