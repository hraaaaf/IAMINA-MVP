name: IAMINA PERF-WEB — public frontend startup diagnostic
on:
  push:
    branches:
      - perf/iamina-web-startup-20261103
    paths:
      - scripts/iamina_web_startup_perf_ci.py
      - scripts/iamina_web_locale_matrix_ci.py
      - .github/workflows/iamina-web-startup-perf.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iamina-perf-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-flutter-web:
    name: Chromium Intl Locale failure matrix
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact probe source
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Compile-check both diagnostic scripts
        run: |
          python -m py_compile scripts/iamina_web_startup_perf_ci.py
          python -m py_compile scripts/iamina_web_locale_matrix_ci.py

      - name: Diagnose locale failures on both public frontends
        run: python scripts/iamina_web_locale_matrix_ci.py

      - name: Upload anonymous locale diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-perf-web-locale-anonymous-${{ github.run_id }}
          path: |
            perf_web_locale_matrix.json
            perf_web_locale_matrix.md
          if-no-files-found: warn
          retention-days: 7
