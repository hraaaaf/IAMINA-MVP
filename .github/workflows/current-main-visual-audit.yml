name: Current main visual audit

on:
  push:
    branches:
      - audit/current-main-visual-8634293
    paths:
      - .github/workflows/current-main-visual-audit.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 86342934c3ff2b5de74066a3d53e27fdc2c1ba96
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Build
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --dart-define=IAMINA_AUDIT_ACCESS=true
      - name: Install capture runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Serve
        working-directory: frontend/build/web
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/iamina-web.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Capture real current-main matrix
        run: |
          mkdir -p /tmp/current-main-visual
          cat >/tmp/current-main-visual/capture.cjs <<'EOF'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs = require('fs'); const path = require('path');
          const screens=[['dashboard','/dashboard'],['summary','/summary'],['journal','/journal'],['importer','/importer'],['profile','/profile']];
          const langs=[['fr','fr-FR'],['ar','ar-MA']];
          const viewports=[['desktop',1440,1000],['mobile',390,844]];
          const cases=[];
          for(const [vp,w,h] of viewports) for(const [screen,route] of screens) for(const [lang,locale] of langs) cases.push([vp,w,h,screen,route,lang,locale]);
          (async()=>{const b=await chromium.launch({headless:true}); const report=[];
            for(const [vp,w,h,screen,route,lang,locale] of cases){
              const c=await b.newContext({viewport:{width:w,height:h},locale,timezoneId:'Africa/Casablanca'}); const p=await c.newPage();
              const pageErrors=[]; p.on('pageerror',e=>pageErrors.push(String(e)));
              await p.goto(`http://127.0.0.1:8080/?audit=visual-cert&lang=${lang}#${route}`,{waitUntil:'domcontentloaded',timeout:30000});
              await p.waitForTimeout(5000);
              const file=`${vp}-${lang}__${screen}.png`; await p.screenshot({path:path.join('/tmp/current-main-visual',file),fullPage:true});
              report.push({vp,screen,lang,w,h,url:p.url(),flutterViews:await p.locator('flutter-view').count(),pageErrors,screenshot:file}); await c.close();
            }
            await b.close(); fs.writeFileSync('/tmp/current-main-visual/report.json',JSON.stringify(report,null,2));
            if(report.some(x=>x.flutterViews!==1||x.pageErrors.length)) process.exit(1);
          })();
          EOF
          node /tmp/current-main-visual/capture.cjs
      - name: Record source
        if: always()
        run: echo 86342934c3ff2b5de74066a3d53e27fdc2c1ba96 >/tmp/current-main-visual/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-main-visual-8634293
          path: /tmp/current-main-visual
          retention-days: 14
