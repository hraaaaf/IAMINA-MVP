name: TEMP Regenerate OpenAPI

on:
  push:
    branches:
      - fix/p0-auth-profile-integrity
    paths:
      - .github/workflows/regen-openapi-temp.yml

permissions:
  contents: write

jobs:
  regenerate-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Regenerate canonical OpenAPI schema
        env:
          DJANGO_SETTINGS_MODULE: amina.settings
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          DATABASE_URL: sqlite:///ci-test.db
          FIREBASE_CREDENTIALS_PATH: ""
          GEMINI_API_KEY: ""
        run: python backend/manage.py export_openapi > docs/api/openapi.json

      - name: Commit generated schema if changed
        run: |
          if git diff --quiet -- docs/api/openapi.json; then
            echo "OpenAPI schema already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.json
          git commit -m "docs(api): regenerate OpenAPI schema"
          git push origin HEAD:fix/p0-auth-profile-integrity
