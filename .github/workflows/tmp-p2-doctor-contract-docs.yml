name: Temporary P2 doctor contract docs

on:
  push:
    branches:
      - agent/p2-doctor-consultation-contract

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-doctor-consultation-contract
      - name: Align canonical P2 doctor contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one anchor in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          roadmap_anchor = "**Closure:** exact head `28215cd944c32ef310fd9d847fb3959ccf86b2c7` passed CI #1844 + migration drift #1656, Clinical Safety Reviewer, Database/Migration Reviewer, Final Diff/Architecture Reviewer and Release Certifier. Expected-head merge produced `752f5543cc651cfeda6fd75f14fd544ae5e8d03a`; post-merge `main` CI #1845 + drift #1657 passed. The subsequent PR #140 lifecycle hardening preserves this authority contract and ensures proactive workflow state cannot outlive erased source Clinical Twin derivation.\n\n## Ordered execution"
          roadmap_lines = [
              "**Closure:** exact head `28215cd944c32ef310fd9d847fb3959ccf86b2c7` passed CI #1844 + migration drift #1656, Clinical Safety Reviewer, Database/Migration Reviewer, Final Diff/Architecture Reviewer and Release Certifier. Expected-head merge produced `752f5543cc651cfeda6fd75f14fd544ae5e8d03a`; post-merge `main` CI #1845 + drift #1657 passed. The subsequent PR #140 lifecycle hardening preserves this authority contract and ensures proactive workflow state cannot outlive erased source Clinical Twin derivation.",
              "",
              "## 🟡 P2-DOCTOR — Consultation Intelligence — CONTRACT FOUNDATION",
              "",
              "P2-DOCTOR-0 in PR #143 defines the executable consultation-brief authority contract before any new clinician UX, endpoint replacement or model narration integration.",
              "",
              "Runtime candidate contract:",
              "",
              "- versioned schema `consultation-brief.v1` carries only immutable scalar facts/derivations plus explicit provenance, missing-data and limitation fields;",
              "- v1 admits only `OBSERVED_FACT` and `DETERMINISTIC_DERIVATION`; deterministic derivations must reference a registered product RULE whose evidence registry authority is exactly `GOVERNED_RULE`;",
              "- raw external source records, unknown evidence IDs, governed-rule candidates, `NARRATIVE_ONLY` rules, user claims, preferences, conversational state, heuristic inference and model inference fail closed;",
              "- `CURRENT_SNAPSHOT` and `SINCE_REVIEW_CHECKPOINT` are distinct comparison modes; no `new/persisting/improving/resolved since review` claim is legal without an explicit timezone-aware review checkpoint;",
              "- `limited/moderate/strong` remains evidence/repetition density rather than probability or clinical confidence; no numeric confidence field exists;",
              "- allowed next steps are limited to `MONITOR`, `COLLECT_MISSING_DATA` and `PREPARE_CLINICIAN_DISCUSSION`; direct raw-string treatment/dose action injection is rejected at runtime;",
              "- clinician-brief authority is fixed to `clinician_review_support_only`; any later model narration is limited to reformulating approved structured fields and cannot create clinical truth;",
              "- no endpoint, persisted review checkpoint, deterministic assembler, legacy doctor-brief replacement, clinician UX, diagnosis, prescription, dose calculation or treatment optimization is introduced by P2-DOCTOR-0.",
              "",
              "**Next sub-lot after P2-DOCTOR-0 closeout:** build the deterministic consultation-brief assembler from approved synchronized facts, governed KPI/Clinical Twin evidence and an authoritative review checkpoint source; only after that may the legacy narrator boundary be replaced.",
              "",
              "**P2-DOCTOR-0 closure gate:** final docs-inclusive SHA must pass exact-head CI + migration drift, Clinical Safety + Documentation/Architecture review, Release Certifier GO, expected-head merge and post-merge `main` CI + drift. P2-DOCTOR overall remains active after this contract LOT.",
              "",
              "## Ordered execution",
          ]
          replace_once("docs/ROADMAP.md", roadmap_anchor, "\n".join(roadmap_lines))
          replace_once(
              "docs/ROADMAP.md",
              "| **P2-DOCTOR** | **Consultation Intelligence** | 🔵 **NEXT** | Clinician brief reports evidence-qualified change since last review with uncertainty and provenance; no autonomous diagnosis/prescription/treatment change |",
              "| **P2-DOCTOR** | **Consultation Intelligence** | 🟡 **ACTIVE — P2-DOCTOR-0** | PR #143 contract candidate: provenance/uncertainty/authority schema implemented; deterministic assembler + endpoint/UX remain later sub-lots |",
          )
          replace_once(
              "docs/ROADMAP.md",
              "P2-DOCTOR may consume approved Clinical Twin/proactive state and governed evidence, but it must not widen clinical authority. The first implementation LOT must define the consultation-brief contract, provenance/uncertainty semantics and exact non-scope before adding patient/clinician UX. Existing deterministic emergency, no-prescription/no-dose and evidence-promotion boundaries remain upstream and authoritative.",
              "P2-DOCTOR-0 establishes the consultation-brief authority contract without exposing a new product surface. The next implementation LOT must assemble that contract deterministically from approved source facts/governed derivations and an authoritative prior-review checkpoint; it must not infer review history from app activity or let a model populate unapproved fields. Existing deterministic emergency, no-prescription/no-dose and evidence-promotion boundaries remain upstream and authoritative.",
          )

          specs_anchor = "- no proactive state or API output may diagnose, prescribe, calculate a dose, infer causality, optimize/change treatment or grant generative-model clinical authority.\n\n### Post-save experience contract"
          specs_lines = [
              "- no proactive state or API output may diagnose, prescribe, calculate a dose, infer causality, optimize/change treatment or grant generative-model clinical authority.",
              "",
              "### Consultation intelligence contract",
              "",
              "- P2-DOCTOR begins with versioned structured contract `consultation-brief.v1`; this contract is downstream review support and does not create new clinical truth;",
              "- v1 consultation evidence admits only authoritative `OBSERVED_FACT` values and approved `DETERMINISTIC_DERIVATION` values; deterministic derivations must reference an evidence-registry product rule with `GOVERNED_RULE` authority;",
              "- unknown evidence IDs, external source records, candidate/narrative-only rules, user claims, preferences, conversational state, heuristic inference and model inference are not authorized consultation-brief truth in v1;",
              "- contract values are immutable bounded scalars and all runtime enum/container types are validated rather than trusted from Python annotations; raw strings cannot inject treatment/dose actions or bypass comparison/truth validation;",
              "- `CURRENT_SNAPSHOT` cannot claim change since a prior consultation. `SINCE_REVIEW_CHECKPOINT` requires an explicit timezone-aware review checkpoint; absent checkpoint means the brief must expose that limitation rather than fabricate review history;",
              "- `limited` / `moderate` / `strong` is evidence density only; the consultation contract has no numeric clinical-confidence field;",
              "- allowed next steps are only `MONITOR`, `COLLECT_MISSING_DATA` and `PREPARE_CLINICIAN_DISCUSSION`; no treatment change, prescription, dose calculation or autonomous escalation action is part of the contract;",
              "- model narration, if later enabled, is constrained to `approved_structured_fields_only` under `clinician_review_support_only` authority; a model cannot add facts, change classifications or invent missing-data resolution;",
              "- P2-DOCTOR-0 does not replace the existing `/api/v1/ai/doctor-brief`, create a persisted review checkpoint, assemble a live brief, or add clinician/patient UX. Those capabilities require later separately certified LOTs.",
              "",
              "### Post-save experience contract",
          ]
          replace_once("docs/SPECS.md", specs_anchor, "\n".join(specs_lines))

          medical_anchor = "Do not add treatment-adjustment logic to pattern detectors.\n\n## 6. Treatment and insulin data"
          medical_lines = [
              "Do not add treatment-adjustment logic to pattern detectors.",
              "",
              "### 5.1 Consultation-intelligence evidence boundary",
              "",
              "Before any clinician brief is exposed, its structured source contract must be deterministic, provenance-qualified and fail closed:",
              "",
              "- `consultation-brief.v1` may carry only observed facts and deterministic derivations approved for this contract;",
              "- each deterministic derivation requires a registered evidence ID pointing to a versioned product rule with `GOVERNED_RULE` authority; raw literature/source records and candidate/narrative-only rules cannot become consultation truth merely by being cited;",
              "- source identity/version, evidence window where applicable, evidence density, missing data and limitations remain explicit; evidence density is not probability, statistical significance or clinical confidence;",
              "- a `since last review` statement requires an explicit authoritative review checkpoint. If none exists, the system must use current-snapshot semantics and disclose that change-since-review is unavailable;",
              "- model/heuristic/conversational inference and unverified user claims are outside v1 consultation truth; later support for patient-reported claims requires an explicit contract extension that preserves their claim provenance;",
              "- consultation actions are restricted to monitoring, collecting missing data or preparing clinician discussion. The contract contains no diagnosis, prescription, dose or treatment-change authority;",
              "- free-form model output may not be used to populate or override contract fields. Any future narrator may only reformulate a fully assembled approved structured brief;",
              "- P2-DOCTOR-0 defines this contract only. Persistence of review checkpoints, deterministic assembly, endpoint replacement and clinician UX require separate release-gated work.",
              "",
              "## 6. Treatment and insulin data",
          ]
          replace_once("docs/MEDICAL_DATA_PLAN.md", medical_anchor, "\n".join(medical_lines))

          arch_anchor = "Destructive mutation of clinically contributive source Journal rows is serialized against canonical Clinical Twin refresh. Persisted derived observation state is purged/rebuilt only from surviving authoritative source rows, while normal sparse refresh remains a distinct longitudinal-history behavior. Patient export/account deletion/retention govern the derived Clinical Twin state, and subordinate proactive workflow state cannot outlive deletion of its source observation.\n\nIt must consume shared contracts without creating hidden reverse dependencies from core back into diabetes."
          arch_lines = [
              "Destructive mutation of clinically contributive source Journal rows is serialized against canonical Clinical Twin refresh. Persisted derived observation state is purged/rebuilt only from surviving authoritative source rows, while normal sparse refresh remains a distinct longitudinal-history behavior. Patient export/account deletion/retention govern the derived Clinical Twin state, and subordinate proactive workflow state cannot outlive deletion of its source observation.",
              "",
              "P2-DOCTOR adds a downstream versioned consultation-brief authority contract, not a new truth store. `consultation-brief.v1` accepts only bounded immutable observed facts plus evidence-registry-governed deterministic derivations, separates current-snapshot from explicit-review-checkpoint comparison semantics, and fixes model narration to approved structured fields only. The contract has no endpoint or persistence side effect in P2-DOCTOR-0; deterministic assembly, checkpoint persistence/selection and replacement of the legacy AI doctor-brief path remain later LOTs.",
              "",
              "It must consume shared contracts without creating hidden reverse dependencies from core back into diabetes.",
          ]
          replace_once(
              "docs/architecture/ARCHITECTURE.md",
              arch_anchor,
              "\n".join(arch_lines),
          )
          PY
      - name: Commit canonical contract docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md docs/SPECS.md docs/MEDICAL_DATA_PLAN.md docs/architecture/ARCHITECTURE.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(clinical): align P2 doctor consultation contract"
          git push origin HEAD:agent/p2-doctor-consultation-contract
