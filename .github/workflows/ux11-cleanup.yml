name: UX-11 branch cleanup

on:
  push:
    branches:
      - ux/11-dashboard-action-parity
    paths:
      - .github/workflows/ux11-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/11-dashboard-action-parity
          fetch-depth: 0

      - name: Reconcile current main and remove workflow noise
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

          # Restore files touched only by broad formatting/pub-get noise.
          git checkout origin/main -- \
            frontend/.flutter-plugins-dependencies \
            frontend/lib/core/clinical/glucose_ocr_shield.dart \
            frontend/lib/core/data/culinary_data.dart \
            frontend/lib/core/theme/app_theme.dart \
            frontend/lib/core/utils/glucose_formatter.dart \
            frontend/lib/core/widgets/amina_button.dart \
            frontend/lib/core/widgets/amina_text_field.dart \
            frontend/lib/core/widgets/animations/ecg_painter.dart \
            frontend/lib/core/widgets/clinical_card.dart \
            frontend/lib/core/widgets/draggable_fab.dart \
            frontend/lib/core/widgets/glass_card.dart \
            frontend/lib/core/widgets/premium_slider.dart \
            frontend/lib/data/models/ai_models.dart \
            frontend/lib/data/models/document_models.dart \
            frontend/lib/features/auth/login_screen.dart \
            frontend/lib/features/auth/reset_password_screen.dart \
            frontend/lib/features/dashboard/clinical_engine.dart \
            frontend/lib/features/dashboard/widgets/agp_chart.dart \
            frontend/lib/features/dashboard/widgets/chart_section.dart \
            frontend/lib/features/dashboard/widgets/glucose_chart_with_events.dart \
            frontend/lib/features/dashboard/widgets/hero_atoms.dart \
            frontend/lib/features/dashboard/widgets/hero_ecg.dart \
            frontend/lib/features/dashboard/widgets/hero_insight.dart \
            frontend/lib/features/dashboard/widgets/hero_live.dart \
            frontend/lib/features/dashboard/widgets/hero_section.dart \
            frontend/lib/features/dashboard/widgets/insights_section.dart \
            frontend/lib/features/dashboard/widgets/kpi_cards.dart \
            frontend/lib/features/dashboard/widgets/kpi_cv_card.dart \
            frontend/lib/features/dashboard/widgets/recent_entries.dart \
            frontend/lib/features/dashboard/widgets/speed_dial.dart \
            frontend/lib/features/dashboard/widgets/tweaks_panel.dart \
            frontend/lib/features/documents/document_import_screen.dart \
            frontend/lib/features/journal/widgets/amina_chat_view.dart \
            frontend/lib/firebase_options.dart \
            frontend/lib/l10n/audited_page_copy.dart \
            frontend/lib/main.dart \
            frontend/lib/services/auth_service.dart \
            frontend/lib/services/locale_preference_service.dart \
            frontend/lib/services/modules_provider.dart \
            frontend/pubspec.lock \
            frontend/test/features/auth/consent_screen_test.dart \
            frontend/test/features/chat/amina_chat_view_test.dart \
            frontend/test/features/dashboard_test.dart \
            frontend/test/features/ramadan_profile_responsive_test.dart \
            frontend/test/locale_preference_service_test.dart \
            frontend/test/mocks.dart \
            frontend/test/p0_cert_audit_locale_contract_test.dart \
            frontend/test/p0_clinical_explainability_contract_test.dart \
            frontend/test/p0_dashboard_responsive_rtl_contract_test.dart \
            frontend/test/p0_localized_onboarding_copy_contract_test.dart \
            frontend/test/p0_truthful_system_state_contract_test.dart \
            frontend/test/services/connectivity_test.dart \
            frontend/test/services/consent_service_test.dart \
            frontend/test/services/context_intelligence_sync_test.dart \
            frontend/test/services/provider_api_error_test.dart \
            frontend/test/services/sync_service_test.dart \
            frontend/test/ux_1_dashboard_rich_locale_contract_test.dart \
            frontend/test/ux_8_motion_system_contract_test.dart

          # Remove all one-shot UX-11 implementation/capture machinery.
          rm -f \
            .github/workflows/ux11-apply.yml \
            .github/workflows/ux11-populated-visual-gate.yml \
            .github/workflows/ux11-visual-convergence-pass1.yml \
            .github/workflows/ux11-visual-gate.yml \
            .github/workflows/ux11-cleanup.yml \
            scripts/ux11_apply.py \
            scripts/ux11_fix_tests.py \
            scripts/ux11_visual_convergence.py

          git add -A
          git status --short
          git commit -m 'chore(ux): clean UX-11 branch and reconcile main'
          git push origin HEAD:ux/11-dashboard-action-parity
