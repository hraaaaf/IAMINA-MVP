name: UX-0 rich dashboard audit

on:
  push:
    branches: [docs/ux-0-design-constitution]
    paths: [.github/workflows/ux-0-rich-dashboard-audit.yml]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Build audit-only web bundle
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --dart-define=IAMINA_AUDIT_ACCESS=true
      - name: Install capture runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Serve
        working-directory: frontend/build/web
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/iamina-web.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Capture rich dashboard matrix
        run: |
          mkdir -p /tmp/ux0-rich-dashboard
          cat >/tmp/ux0-rich-dashboard/capture.cjs <<'EOF'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const fs = require('fs'); const path = require('path');
          const views=[['desktop',1440,1000],['tablet',768,1024],['mobile',390,844],['small',360,560]];
          const langs=[['fr','fr-FR'],['ar','ar-MA']];
          (async()=>{const b=await chromium.launch({headless:true}); const report=[];
            for(const [vp,w,h] of views) for(const [lang,locale] of langs){
              const c=await b.newContext({viewport:{width:w,height:h},locale,timezoneId:'Africa/Casablanca'}); const p=await c.newPage();
              const pageErrors=[]; p.on('pageerror',e=>pageErrors.push(String(e)));
              await p.goto(`http://127.0.0.1:8080/?audit=visual-cert&lang=${lang}#/dashboard`,{waitUntil:'domcontentloaded',timeout:30000});
              await p.waitForTimeout(8000);
              const file=`${vp}-${lang}__dashboard-rich.png`; await p.screenshot({path:path.join('/tmp/ux0-rich-dashboard',file),fullPage:true});
              report.push({vp,lang,w,h,url:p.url(),flutterViews:await p.locator('flutter-view').count(),pageErrors,screenshot:file}); await c.close();
            }
            await b.close(); fs.writeFileSync('/tmp/ux0-rich-dashboard/report.json',JSON.stringify(report,null,2));
            if(report.some(x=>x.flutterViews!==1||x.pageErrors.length)) process.exit(1);
          })();
          EOF
          node /tmp/ux0-rich-dashboard/capture.cjs
      - name: Record exact source
        if: always()
        run: echo "$GITHUB_SHA" >/tmp/ux0-rich-dashboard/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-0-rich-dashboard-audit
          path: /tmp/ux0-rich-dashboard
          retention-days: 14
