name: P2 proactive exact Ruff fix

on:
  push:
    branches: [p2-proactive-attention-lifecycle]
    paths:
      - .github/workflows/p2-proactive-ruff-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2-proactive-attention-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply repository-pinned Ruff import fix
        working-directory: backend
        run: |
          pip install ruff==0.15.17
          ruff check diabetes/services/clinical/proactive_attention.py --select I001 --fix
      - name: Commit exact Ruff output and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p2-proactive-ruff-fix.yml
          git add backend/diabetes/services/clinical/proactive_attention.py
          git commit -m "style(p2-proactive): apply exact Ruff import fix"
          git pull --rebase origin p2-proactive-attention-lifecycle
          git push origin HEAD:p2-proactive-attention-lifecycle
