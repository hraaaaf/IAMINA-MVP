name: UX-1 closeout docs

on:
  push:
    branches:
      - docs/ux-1-closeout
    paths:
      - .github/workflows/ux-1-closeout-docs.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ux-1-closeout
          fetch-depth: 0
      - name: Record final closure and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('docs/ROADMAP.md')
          s=p.read_text()
          replacements={
            '> **Last updated:** 2026-08-10 — UX-0 is merged and post-merge green. UX-1 has remediated the populated-Dashboard FR/AR locale-parity defect and is in final visual/reviewer certification before merge.':
            '> **Last updated:** 2026-08-10 — UX visual rebase is closed: UX-0 established the rendered baseline/constitution and UX-1 remediated the populated-Dashboard FR/AR rich-state defect to 9.2/10 with exact-head and post-merge certification.',
            '| UX visual rebase | 90% | 🟡 UX-1 final certification | UX-0 closed via PR #83; UX-1 baseline 8.4/10 → first post-fix rendered read ~9.2/10; exact final review/certifier/merge still required |':
            '| UX visual rebase | 100% | ✅ Closed | UX-0 PR #83 + UX-1 PR #84; populated Dashboard baseline 8.4/10 → final **9.2/10**; post-merge CI #1453 + drift #1265 green |',
            '| UX-1 | Populated Dashboard locale parity + hierarchy | 90% | Raw meal IDs and hard-coded rich-state French copy removed; FR/EN/AR GMI/CV/AGP/Hero/events/insights/recent-entry copy localized; clinical calculations unchanged; CI #1449 + drift #1261 green; first 32-view rendered matrix ~**9.2/10**; exact-final-head Reviewer + Certifier + merge pending | 🟡 |':
            '| UX-1 | Populated Dashboard locale parity + hierarchy | 100% | PR #84 merged as `0c2e0ee18da003ccc413ffeffef18334a77c6ad9`; exact-head CI #1452 + drift #1264 + visual run `31409668306` green; UX **9.2/10**; post-merge CI #1453 + drift #1265 green | ✅ Closed |',
            '- UX-1 remains open until the final documentation head is re-rendered, isolated UX + Clinical reviewers pass, Release Certifier authorizes the exact expected head, PR #84 merges and post-merge CI/drift are green.':
            '- Exact final head `27ee9b00c2326add7642bb0f544f5658ebf4d949` passed CI #1452 and migration drift #1264. Final visual run `31409668306`, artifact `9071144760`, digest `sha256:fb2490f8a4d293206917adbcfb56dbc57c24a49f67a61f27eea3a9db391e088f` rendered 24/24 FR/AR top/mid/lower views with one Flutter view each and zero page errors. UX Auditor FINAL PASS **9.2/10**, Clinical Safety Reviewer FINAL PASS, Release Certifier CERTIFIED. PR #84 merged with expected-head locking as `0c2e0ee18da003ccc413ffeffef18334a77c6ad9`; post-merge CI #1453 and drift #1265 passed. **UX-1 is 100% closed.**',
            '6. **UX product-quality lane:** complete UX-1 exact-final-head visual/reviewer certification, merge with expected-head locking and verify post-merge CI/drift; do not broaden beyond fresh evidence.':
            '6. **UX product-quality lane:** UX visual rebase is closed. Do not open another UX remediation LOT unless fresh rendered evidence exposes a new <=9.0 state or a new requirement changes a certified surface.'
          }
          for old,new in replacements.items():
            if s.count(old)!=1:
              raise SystemExit(f'ROADMAP marker count={s.count(old)}: {old[:100]!r}')
            s=s.replace(old,new)
          p.write_text(s)

          p=Path('docs/ux/UX_1_RICH_DASHBOARD_CERTIFICATION.md')
          s=p.read_text()
          old='''## Remaining closure gates\n\nBefore UX-1 may be declared closed:\n\n1. exact-final-head CI and migration drift must pass;\n2. exact-final-head rendered FR/AR matrix must remain >9.0/10;\n3. UX and Clinical reviewers must re-anchor PASS to that exact final head;\n4. Release Certifier must authorize expected-head merge;\n5. PR #84 must merge and post-merge CI/drift must pass.'''
          new='''## Final closure\n\nUX-1 is **100% closed**.\n\n- exact final PR head: `27ee9b00c2326add7642bb0f544f5658ebf4d949`;\n- CI #1452 — SUCCESS;\n- migration drift #1264 — SUCCESS;\n- final visual run `31409668306` — SUCCESS;\n- artifact `9071144760`;\n- digest `sha256:fb2490f8a4d293206917adbcfb56dbc57c24a49f67a61f27eea3a9db391e088f`;\n- 24/24 FR/AR rendered views, one Flutter view each, zero page errors;\n- UX Auditor FINAL PASS — **9.2/10**;\n- Clinical Safety Reviewer FINAL PASS;\n- Release Certifier — CERTIFIED;\n- PR #84 merged with expected-head locking as `0c2e0ee18da003ccc413ffeffef18334a77c6ad9`;\n- post-merge CI #1453 — SUCCESS;\n- post-merge migration drift #1265 — SUCCESS.\n\nNo further visual remediation LOT is implied by this closeout. A new UX LOT requires fresh rendered evidence at <=9.0/10 or a new product requirement that changes a certified surface.'''
          if s.count(old)!=1:
            raise SystemExit(f'cert closeout block count={s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git rm .github/workflows/ux-1-closeout-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md docs/ux/UX_1_RICH_DASHBOARD_CERTIFICATION.md
          git diff --cached --check
          git commit -m 'docs(ux): close UX-1 after post-merge verification'
          git push origin HEAD:docs/ux-1-closeout
