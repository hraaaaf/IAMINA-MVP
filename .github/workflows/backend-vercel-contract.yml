name: IAMINA backend Vercel contract

on:
  push:
    branches:
      - audit/dashboard-demo-mobile-20260909
    paths:
      - 'backend/**'
      - '.github/workflows/backend-vercel-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-vercel-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: contract-only-not-production-secret
      DEBUG: 'False'
      ALLOWED_HOSTS: iamina-certified.vercel.app
      CORS_ALLOWED_ORIGINS: https://iamina-review.vercel.app
      CSRF_TRUSTED_ORIGINS: https://iamina-review.vercel.app
      DATABASE_URL: sqlite:////tmp/iamina-vercel-contract.sqlite3
      FIREBASE_CREDENTIALS_PATH: ''
      GEMINI_API_KEY: ''
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: pip install -r requirements.txt
      - name: Validate Django production config
        run: python manage.py check --deploy
      - name: Migrate contract database
        run: python manage.py migrate --noinput
      - name: Verify WSGI and health endpoint
        run: |
          python - <<'PY'
          from django.test import Client
          from amina.wsgi import application
          assert application is not None
          response = Client(HTTP_HOST='iamina-certified.vercel.app').get('/api/v1/health')
          print(response.status_code, response.content.decode())
          assert response.status_code == 200
          assert response.json()['db'] == 'ok'
          PY
      - name: Validate Vercel config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('vercel.json').read_text())
          assert 'amina/wsgi.py' in cfg['functions']
          assert cfg['functions']['amina/wsgi.py']['maxDuration'] == 60
          print('backend Vercel contract OK')
          PY
