name: P2-UX-14 generated cleanup

on:
  push:
    branches: [fix/p2-ux-14-density-polish]
    paths: [.github/workflows/p2-ux-14-generated-cleanup.yml]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2-ux-14-density-polish
          fetch-depth: 0
      - name: Restore generated metadata exactly from main
        run: |
          git fetch origin main
          git checkout origin/main -- frontend/.flutter-plugins-dependencies frontend/pubspec.lock
          rm -f .github/workflows/p2-ux-14-generated-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(ux): restore generated Flutter metadata'
          git push origin HEAD:fix/p2-ux-14-density-polish
