name: W02 F09-B isolated PostgreSQL refresh family anti-replay

on:
  push:
    branches:
      - test/w02-f09b-server-refresh-rotation-candidate-20261107
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w02-f09b-pg16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg16-refresh-family:
    name: PG16 F09-B hash-only rotation, replay, concurrent lock
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_f09b_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_f09b_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: f09b-synthetic-only-not-for-production-use-2026
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_f09b_disposable
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
      GROQ_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install verified Django and lint dependencies
        run: python -m pip install -r requirements.txt ruff==0.15.17
      - name: Execute synthetic anti-replay, short TTL and true PostgreSQL race
        run: python -m pytest -q -ra core/tests/test_w02_f09b_refresh_family_pg.py
      - name: Security module/style validation
        run: |
          ruff check core/web_refresh_protocol.py core/models/web_refresh.py core/tests/test_w02_f09b_refresh_family_pg.py
          python -m py_compile core/web_refresh_protocol.py core/models/web_refresh.py
      - name: Prove migration plan matches model without data-dependent backfill
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py shell -c "from django.db import connection; assert connection.vendor == 'postgresql'"
