name: Apply P0 clinical explainability

on:
  push:
    branches: [fix/p0-ux-clinical-explainability]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-ux-clinical-explainability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Apply scoped patch
        run: python scripts/apply_p0_clinical_explainability.py

      - name: Format changed Dart files
        working-directory: frontend
        run: dart format lib/features/journal/ai_summary_screen.dart lib/features/dashboard/widgets/kpi_tir_card.dart lib/features/dashboard/widgets/kpi_gmi_card.dart lib/features/dashboard/widgets/kpi_cv_card.dart

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/lib/features/journal/ai_summary_screen.dart frontend/lib/features/dashboard/widgets/kpi_tir_card.dart frontend/lib/features/dashboard/widgets/kpi_gmi_card.dart frontend/lib/features/dashboard/widgets/kpi_cv_card.dart
          git commit -m "fix(p0-ux): remove fabricated clinical confidence"
          git push origin HEAD:fix/p0-ux-clinical-explainability
