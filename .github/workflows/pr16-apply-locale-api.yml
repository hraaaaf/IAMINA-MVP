name: PR16 apply locale API

on:
  push:
    branches:
      - feat/p0-mena-locale-safety-contract

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-locale-safety-contract
      - name: Add authenticated locale confirmation API
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/diabetes/api/v1/profile.py')
          text = path.read_text()
          text = text.replace(
              'from core.ai_egress import grant_media_consent, revoke_media_consent\nfrom core.models import AIMediaConsentGrant, BasePatientProfile\n',
              'from core.ai_egress import grant_media_consent, revoke_media_consent\nfrom core.locale import resolve_patient_locale\nfrom core.models import AIMediaConsentGrant, BasePatientProfile, PatientLocalePreference\n',
          )
          marker = '\n\nclass MediaConsentStateSchema(BaseModel):\n'
          block = '''\n\n_LOCALE_DIMENSIONS = {\n    "country_code",\n    "ui_language",\n    "response_language",\n    "script_preference",\n    "transliteration_preference",\n    "dialect",\n    "glucose_unit",\n    "timezone",\n}\n_ENABLED_DIALECTS: frozenset[str] = frozenset()\n\n\nclass LocalePreferencePatchSchema(BaseModel):\n    country_code: Optional[str] = None\n    ui_language: Optional[str] = None\n    response_language: Optional[str] = None\n    script_preference: Optional[str] = None\n    transliteration_preference: Optional[str] = None\n    dialect: Optional[str] = None\n    glucose_unit: Optional[str] = None\n    timezone: Optional[str] = None\n\n    @model_validator(mode="after")\n    def validate_patch(self):\n        if not self.model_fields_set:\n            raise ValueError("At least one locale dimension is required")\n        return self\n\n\nclass LocalePreferenceStateSchema(BaseModel):\n    values: dict[str, Optional[str]]\n    provenance: dict[str, str]\n    resolved: dict[str, object]\n\n'''
          if 'class LocalePreferencePatchSchema' not in text:
              if marker not in text:
                  raise SystemExit('locale schema insertion marker missing')
              text = text.replace(marker, block + marker, 1)

          helper_marker = '\n\ndef _validate_media_consent_option(purpose: str, modality: str) -> None:\n'
          helper = '''\n\ndef _get_or_create_locale_preference(user) -> PatientLocalePreference:\n    base = _get_base_profile(user)\n    preference, _ = PatientLocalePreference.objects.get_or_create(profile=base)\n    return preference\n\n\ndef _locale_state(preference: PatientLocalePreference) -> dict:\n    resolved = resolve_patient_locale(preference.profile)\n    values = {dimension: getattr(preference, dimension) for dimension in sorted(_LOCALE_DIMENSIONS)}\n    provenance = {\n        "country_code": preference.country_provenance,\n        "ui_language": preference.ui_language_provenance,\n        "response_language": preference.response_language_provenance,\n        "script_preference": preference.script_provenance,\n        "transliteration_preference": preference.transliteration_provenance,\n        "dialect": preference.dialect_provenance,\n        "glucose_unit": preference.glucose_unit_provenance,\n        "timezone": preference.timezone_provenance,\n    }\n    return {"values": values, "provenance": provenance, "resolved": resolved.__dict__}\n\n\ndef _provenance_field(dimension: str) -> str:\n    aliases = {\n        "country_code": "country_provenance",\n        "script_preference": "script_provenance",\n        "transliteration_preference": "transliteration_provenance",\n    }\n    return aliases.get(dimension, f"{dimension}_provenance")\n\n\ndef _reset_locale_dimension(preference: PatientLocalePreference, dimension: str) -> None:\n    defaults = {\n        "ui_language": "fr",\n        "transliteration_preference": "none",\n        "glucose_unit": "mg/dL",\n    }\n    setattr(preference, dimension, defaults.get(dimension))\n    setattr(preference, _provenance_field(dimension), "defaulted")\n\n'''
          if '_get_or_create_locale_preference' not in text:
              if helper_marker not in text:
                  raise SystemExit('locale helper insertion marker missing')
              text = text.replace(helper_marker, helper + helper_marker, 1)

          endpoint_marker = '\n\n@router.get("/profile/ai-media-consents", response=list[MediaConsentStateSchema])\n'
          endpoints = '''\n\n@router.get("/profile/locale-preferences", response=LocalePreferenceStateSchema)\ndef get_locale_preferences(request):\n    """Return stored provenance and effective confirmed locale settings."""\n    return _locale_state(_get_or_create_locale_preference(request.user))\n\n\n@router.patch("/profile/locale-preferences", response=LocalePreferenceStateSchema)\ndef patch_locale_preferences(request, data: LocalePreferencePatchSchema):\n    """Explicitly confirm supplied dimensions for the authenticated patient."""\n    preference = _get_or_create_locale_preference(request.user)\n    changed: list[str] = []\n    for dimension, value in data.model_dump(exclude_unset=True).items():\n        if value is None:\n            _reset_locale_dimension(preference, dimension)\n        else:\n            if dimension == "dialect" and value not in _ENABLED_DIALECTS:\n                raise HttpError(409, "Dialect is not enabled until safety parity is approved")\n            setattr(preference, dimension, value)\n            setattr(preference, _provenance_field(dimension), "user_confirmed")\n        changed.extend([dimension, _provenance_field(dimension)])\n    preference.save(update_fields=[*changed, "updated_at"])\n    return _locale_state(preference)\n\n\n@router.delete(\n    "/profile/locale-preferences/{dimension}",\n    response=LocalePreferenceStateSchema,\n)\ndef revoke_locale_preference(request, dimension: str):\n    """Revoke one confirmed dimension without accepting a patient identifier."""\n    if dimension not in _LOCALE_DIMENSIONS:\n        raise HttpError(422, "Unsupported locale dimension")\n    preference = _get_or_create_locale_preference(request.user)\n    _reset_locale_dimension(preference, dimension)\n    preference.save(\n        update_fields=[dimension, _provenance_field(dimension), "updated_at"]\n    )\n    return _locale_state(preference)\n\n'''
          if 'def get_locale_preferences' not in text:
              if endpoint_marker not in text:
                  raise SystemExit('locale endpoint insertion marker missing')
              text = text.replace(endpoint_marker, endpoints + endpoint_marker, 1)
          path.write_text(text)
          PY

          cat > backend/core/tests/test_locale_preferences_api.py <<'PY'
          from types import SimpleNamespace

          import pytest
          from django.contrib.auth.models import User
          from ninja.errors import HttpError

          from core.models import BasePatientProfile, PatientLocalePreference
          from diabetes.api.v1.profile import (
              LocalePreferencePatchSchema,
              get_locale_preferences,
              patch_locale_preferences,
              revoke_locale_preference,
          )


          @pytest.fixture
          def patient(db):
              user = User.objects.create_user(username="locale-api-patient")
              BasePatientProfile.objects.create(patient=user)
              return user


          def _request(user):
              return SimpleNamespace(user=user)


          def test_get_is_owned_by_authenticated_patient_and_defaults_safe(patient):
              state = get_locale_preferences(_request(patient))
              assert state["resolved"]["response_language"] == "fr"
              assert state["resolved"]["country_code"] is None
              assert PatientLocalePreference.objects.get().profile.patient == patient


          def test_patch_confirms_independent_dimensions(patient):
              state = patch_locale_preferences(
                  _request(patient),
                  LocalePreferencePatchSchema(
                      country_code="ma",
                      ui_language="fr",
                      response_language="en",
                      script_preference="latin",
                      glucose_unit="mmol/L",
                      timezone="Africa/Casablanca",
                  ),
              )
              assert state["values"]["country_code"] == "MA"
              assert state["resolved"]["ui_language"] == "fr"
              assert state["resolved"]["response_language"] == "en"
              assert state["resolved"]["glucose_unit"] == "mmol/L"
              assert state["resolved"]["timezone"] == "Africa/Casablanca"
              assert all(
                  state["provenance"][field] == "user_confirmed"
                  for field in (
                      "country_code",
                      "ui_language",
                      "response_language",
                      "script_preference",
                      "glucose_unit",
                      "timezone",
                  )
              )


          def test_revoke_returns_dimension_to_fail_closed_default(patient):
              patch_locale_preferences(
                  _request(patient),
                  LocalePreferencePatchSchema(response_language="en"),
              )
              state = revoke_locale_preference(_request(patient), "response_language")
              assert state["values"]["response_language"] is None
              assert state["provenance"]["response_language"] == "defaulted"
              assert state["resolved"]["response_language"] == "fr"


          def test_unapproved_dialect_cannot_be_confirmed(patient):
              with pytest.raises(HttpError) as exc_info:
                  patch_locale_preferences(
                      _request(patient),
                      LocalePreferencePatchSchema(dialect="ar-MA"),
                  )
              assert exc_info.value.status_code == 409
              assert get_locale_preferences(_request(patient))["resolved"]["dialect"] is None


          def test_invalid_dimension_is_rejected(patient):
              with pytest.raises(HttpError) as exc_info:
                  revoke_locale_preference(_request(patient), "patient_id")
              assert exc_info.value.status_code == 422
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate OpenAPI and validate focused tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: amina.settings
          SECRET_KEY: locale-api-ci
          DEBUG: 'True'
          DATABASE_URL: sqlite:///locale-api.db
        run: |
          pip install -r requirements.txt
          python manage.py export_openapi
          pytest core/tests/test_locale_preferences.py core/tests/test_locale_preferences_api.py -q
      - name: Commit API
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/diabetes/api/v1/profile.py backend/core/tests/test_locale_preferences_api.py backend/openapi.json
          git commit -m "feat(locale): add patient confirmation API"
          git push origin HEAD:feat/p0-mena-locale-safety-contract
