name: Apply P0-UX-6.4 on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/p0-ux-6-4-rtl-accessibility' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-ux-6-4-rtl-accessibility
          fetch-depth: 0
      - name: Apply patch and remove temporary machinery
        run: |
          python scripts/apply_p0_ux_6_4.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ux): harden RTL navigation accessibility"
          git push origin HEAD:fix/p0-ux-6-4-rtl-accessibility
