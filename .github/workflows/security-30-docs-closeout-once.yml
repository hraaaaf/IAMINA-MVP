name: SECURITY-30 canonical closeout once

on:
  push:
    branches:
      - docs/security-30-closeout
    paths:
      - '.github/workflows/security-30-docs-closeout-once.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update canonical docs and remove one-shot workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text()
          replacements = {
            '> **Last updated:** 2026-08-14 — Gate A Secure Core is certified at 9.0/10 on a ten-dimension engineering rubric; reachable Git-history hygiene remains the single failed dimension and still blocks real-patient pilot authorization.':
            '> **Last updated:** 2026-08-14 — Gate A Secure Core is certified at 10.0/10 after issue #30 reachable Git-history remediation was completed and independently fresh-clone verified; the remaining real-patient pilot blockers are restricted linguistic/compliance/deployment approvals and live provider evidence.',
            '| Gate A — Secure Core engineering certification | 9.0/10 | ✅ Threshold met | `docs/assessments/2026-08-14-gate-a-secure-core-certification.md`; 9/10 dimensions PASS, issue #30 remains FAIL/pilot blocker |':
            '| Gate A — Secure Core engineering certification | 10.0/10 | ✅ Certified | Original rubric: `docs/assessments/2026-08-14-gate-a-secure-core-certification.md`; issue #30 remediation: `docs/assessments/2026-08-14-security-30-history-rewrite-certification.md` |',
            '| Pilot safety/compliance gate | 69% | 🟡 External approvals/remediation remain | 9/13 explicit gates complete; issue #30 remains a governance blocker despite being closed `not planned` |':
            '| Pilot safety/compliance gate | 77% | 🟡 Restricted approvals remain | 10/13 explicit gates complete; issue #30 reachable-history remediation is closed and fresh-clone verified |',
            '# Gate A — Secure Core — CERTIFIED 9.0/10':
            '# Gate A — Secure Core — CERTIFIED 10.0/10',
            'Gate A uses ten equally weighted, independently checkable secure-core dimensions. Nine pass: API/session safety; deterministic clinical authority; high-risk refusal parity; emergency truthfulness; governed AI/data egress; minimization/DLP/raw-media consent; sovereign authentication; PostgreSQL/migration integrity; and current-tree SAST/anti-bypass/secret hygiene. Reachable Git-history secret hygiene fails because issue #30 is explicitly not remediated.':
            'Gate A uses ten equally weighted, independently checkable secure-core dimensions. All ten now pass: API/session safety; deterministic clinical authority; high-risk refusal parity; emergency truthfulness; governed AI/data egress; minimization/DLP/raw-media consent; sovereign authentication; PostgreSQL/migration integrity; current-tree SAST/anti-bypass/secret hygiene; and reachable Git-history hygiene. Issue #30 removed `.claude/settings.local.json` from all reachable branch history and was fresh-clone verified after the force-update.',
            '**Engineering threshold:** met at **9.0/10**.  \n**Real-patient pilot security gate:** remains **OPEN**. Gate A does not waive issue #30, restricted approvals, or native-language safety review.':
            '**Engineering certification:** **10.0/10**.  \n**Reachable-history security blocker:** **CLOSED** by issue #30 remediation. Gate A still does not waive restricted compliance/deployment approvals, native-language safety review, or live provider evidence.',
            '- [ ] Prove no reachable committed secrets remain and rotate affected keys; issue #30 was closed `not planned`, not remediated, so this pilot gate remains open unless governance explicitly supersedes it.':
            '- [x] Prove no reachable committed secrets remain; issue #30 rewrote all reachable branch history, passed tracked-tree + full-history scans before force-update, and passed an independent fresh-clone full-history verification afterward. Provider-side rotation was not applicable on the recorded owner attestation that the historical PekPik material was public/test access rather than a private IAMINA credential.',
            '2. **Gate A Secure Core:** engineering threshold is certified at 9.0/10; no further Gate A engineering work is queued unless a regression appears. This does not supersede the next pilot-security blocker.':
            '2. **Gate A Secure Core:** certified at 10.0/10 after issue #30 reachable-history remediation; no further Gate A engineering work is queued unless a regression appears.',
            '4. **Pilot security blocker:** issue #30 is closed `not planned` but explicitly not remediated; either complete the documented history remediation/verification path or supersede the pilot policy through normal governance before any real-patient go/no-go.':
            '4. **Pilot security blocker:** issue #30 reachable-history remediation is closed and fresh-clone verified; continue with the remaining restricted pilot approvals below.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'ROADMAP replacement anchor missing: {old[:100]}')
              text = text.replace(old, new, 1)
          roadmap.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          replacements = {
            '**Gate A — Secure Core is certified at 9.0/10** on a ten-dimension engineering rubric; the single failed dimension is reachable Git-history hygiene tracked by issue #30.':
            '**Gate A — Secure Core is certified at 10.0/10** after issue #30 completed reachable Git-history remediation and independent fresh-clone verification.',
            'The remaining critical path is pilot security remediation, native-language review, restricted compliance/deployment approvals and deferred live provider benchmarking.':
            'The remaining critical path is native-language review, restricted compliance/deployment approvals and deferred live provider benchmarking.',
            '- **Gate A — Secure Core:** engineering threshold met at **9.0/10**. API/session safety, deterministic clinical authority, refusal/emergency boundaries, governed AI egress and minimization, sovereign auth, database integrity, current-tree SAST/anti-bypass and tracked-secret hygiene pass. Reachable Git-history hygiene remains FAIL under issue #30 and stays a pilot blocker. Evidence: `docs/assessments/2026-08-14-gate-a-secure-core-certification.md`.':
            '- **Gate A — Secure Core:** certified at **10.0/10**. The former reachable Git-history failure was remediated under issue #30 by rewriting all reachable branch history, requiring clean tracked-tree/full-history scans before force-update, and independently re-verifying from a fresh clone afterward. Evidence: `docs/assessments/2026-08-14-gate-a-secure-core-certification.md` and `docs/assessments/2026-08-14-security-30-history-rewrite-certification.md`.',
            '1. Resolve the **pilot security blocker #30**: the current tracked tree is clean, but reachable Git history still contains the historical local-agent settings material and the dedicated full-history scanner remains fail-closed. The issue is closed `not planned`, not remediated; provider ownership/provenance must be resolved before any irreversible history rewrite.':
            '1. **Pilot security blocker #30 is closed:** reachable Git history was rewritten and independently fresh-clone verified. Continue with restricted linguistic, compliance/deployment and provider-evidence gates.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'README replacement anchor missing: {old[:100]}')
              text = text.replace(old, new, 1)
          readme.write_text(text)

          assessment = Path('docs/assessments/2026-08-14-security-30-history-rewrite-certification.md')
          assessment.write_text('''# Security #30 — reachable Git-history remediation certification\n\nDate: 2026-08-14\n\n## Scope\n\nThis assessment certifies only the reachable Git-history remediation tracked by issue #30. It does not waive native-language, CNDP/privacy, processor, deployment-residency or provider-benchmark gates.\n\n## Proven facts\n\n- The project owner explicitly authorized the irreversible full-history rewrite and required force-updates.\n- The historical target was `.claude/settings.local.json`; no credential values are reproduced here.\n- Repository-owner attestation classifies the historical PekPik material as public/test access rather than a privately provisioned IAMINA credential. Provider-side rotation is therefore recorded as not applicable on owner evidence; this is not independent provider verification.\n- The successful rewrite processed all 322 reachable branch refs; no tags existed at execution time.\n- Before any remote mutation, the rewritten local graph no longer exposed the forbidden path, `scripts/check_secrets.py` passed, and the bounded full-history scanner passed.\n- Force-update completed for the reachable branches. Rewritten `main` is `7c2bb4667151e4175f99327091dae0da178a52ae`.\n- The temporary rewrite runner branch was deleted after the coordinated force-update.\n- PR #229 had already merged before the rewrite and therefore required no post-rewrite rebase.\n\n## Independent remote verification\n\nDedicated fresh-clone verification run `31821201798` completed **SUCCESS**. It cloned the repository anew from GitHub, fetched all branches/tags, required a full non-shallow repository, proved `.claude/settings.local.json` unreachable, passed tracked-tree secret hygiene, and passed the bounded full-history scanner.\n\n## Regression evidence\n\n- Django migration drift #2113 / run `31821238444`: **SUCCESS** on rewritten-main SHA `7c2bb4667151e4175f99327091dae0da178a52ae`.\n- CI #2301 / run `31821238451`: required green before this closeout PR may merge.\n\n## Independent security review\n\nThe isolated Security Reviewer pass re-read the security-review contract and evidence. No auth/CSRF/egress boundary was modified by the rewrite; tracked-secret hygiene, SAST and anti-bypass checks remain required. Final reviewer PASS is conditional on CI #2301 completing green.\n\n## Certification boundary\n\nThe reachable-history remediation is technically proven from a fresh GitHub clone. Canonical closure and issue #30 closure remain contingent on the closeout PR exact-head CI + migration-drift gates and an independent Release Certifier pass.\n\nThe MENA critical-path numerator remains **32/41 (~78%)** because Gate A and this pilot-security remediation are governance/certification gates over already-counted foundations, not newly numbered MENA tasks. The pilot safety/compliance checklist advances from **9/13 to 10/13 (~77%)** because its explicit reachable-secret-history item is now satisfied.\n''')
          PY
          rm .github/workflows/security-30-docs-closeout-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md README.md docs/assessments/2026-08-14-security-30-history-rewrite-certification.md .github/workflows/security-30-docs-closeout-once.yml
          git commit -m "docs: close security 30 reachable-history remediation"
          git push origin HEAD:docs/security-30-closeout
