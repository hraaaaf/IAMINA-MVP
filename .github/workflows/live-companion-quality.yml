name: IAMINA Companion quality probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/companion/narrator_prompts.py"
      - "backend/companion/output_guard.py"
      - "backend/companion/test_output_guard.py"
      - "backend/companion/zero_model_router.py"
      - "backend/companion/test_zero_model_router.py"
      - "backend/companion/test_zero_model_runtime.py"
      - "backend/evaluation/live_companion_quality.py"
      - "backend/evaluation/companion_quality_gate.py"
      - "backend/evaluation/tests/test_companion_quality_contract.py"
      - ".github/workflows/live-companion-quality.yml"

permissions:
  contents: read

concurrency:
  group: iamina-companion-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Real Companion + GPT-OSS multi-turn quality
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: iamina-companion-quality-nonproduction
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///iamina-companion-quality.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      IAMINA_CONVERSATION_NETWORK_AUTHORIZED: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt ruff==0.15.17
      - name: Validate candidate before network
        run: >-
          ruff check
          companion/narrator_prompts.py
          companion/output_guard.py
          companion/test_output_guard.py
          companion/zero_model_router.py
          companion/test_zero_model_router.py
          companion/test_zero_model_runtime.py
          evaluation/live_companion_quality.py
          evaluation/companion_quality_gate.py
          evaluation/tests/test_companion_quality_contract.py
          llm/lowcost_openai_compatible.py
          llm/tests/test_lowcost_provider_adapters.py
          && pytest -q
          companion/test_output_guard.py
          companion/test_zero_model_router.py
          companion/test_zero_model_runtime.py
          evaluation/tests/test_companion_quality_contract.py
          llm/tests/test_lowcost_provider_adapters.py
          core/tests/test_companion_convergence_p3_narrator_only.py
          core/tests/test_companion_convergence_p4_multiturn_multilingual.py
          && python manage.py shell -c
          "from evaluation.live_companion_quality import validate_scenario; print(validate_scenario())"
      - name: Run one bounded live multi-turn quality probe
        run: >-
          python manage.py shell -c
          "from pathlib import Path; from evaluation.live_companion_quality import run;
          run(Path('../artifacts/iamina-companion-quality.json'))"
      - name: Apply machine quality gate
        run: python -m evaluation.companion_quality_gate ../artifacts/iamina-companion-quality.json
      - name: Upload synthetic transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-companion-quality
          path: artifacts/iamina-companion-quality.json
          if-no-files-found: warn
          retention-days: 7
