name: A7 OpenAPI artifact

on:
  push:
    branches:
      - analysis/paired-meal-response

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-openapi.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py export_openapi > generated-openapi.json
      - name: Commit exact generated snapshot
        working-directory: .
        run: |
          cp backend/generated-openapi.json docs/api/openapi.json
          if git diff --quiet -- docs/api/openapi.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.json
          git commit -m "docs(api): regenerate OpenAPI for A7"
          git push origin HEAD:analysis/paired-meal-response
      - uses: actions/upload-artifact@v4
        with:
          name: a7-generated-openapi
          path: backend/generated-openapi.json
          if-no-files-found: error
