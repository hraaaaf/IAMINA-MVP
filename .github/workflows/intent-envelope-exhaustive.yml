name: Intent envelope exhaustive certification

on:
  workflow_dispatch:
  push:
    branches:
      - preview/intent-envelope-v1-demo

permissions:
  contents: read

jobs:
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install ruff
      - name: Run local deterministic certification
        env:
          DJANGO_SETTINGS_MODULE: amina.settings
          SECRET_KEY: exhaustive-cert-nonproduction
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: sqlite:///intent-exhaustive.db
        working-directory: backend
        run: |
          python -m ruff check companion/intent_envelope.py companion/intent_model.py companion/intent_pipeline.py companion/demo.py diabetes/services/demo_runtime.py diabetes/api/v1/demo.py diabetes/tests/test_demo_chat.py evaluation/intent_envelope_exhaustive_benchmark.py
          python -m pytest companion/test_intent_envelope_pipeline.py diabetes/tests/test_demo_chat.py -q --tb=short
      - name: Run exhaustive multilingual certification
        env:
          DJANGO_SETTINGS_MODULE: amina.settings
          SECRET_KEY: exhaustive-cert-nonproduction
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: sqlite:///intent-exhaustive.db
        working-directory: backend
        run: python evaluation/intent_envelope_exhaustive_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intent-envelope-exhaustive
          path: backend/artifacts/intent-envelope-exhaustive.json
          retention-days: 14
