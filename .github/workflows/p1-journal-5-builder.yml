name: P1-JOURNAL-5 builder

on:
  push:
    branches: [audit/p1-journal-5-builder-final]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply and verify exact feature patch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=9811a3eaf497aa2ee53f53598c1069c478bf8990
          git fetch origin feat/p1-journal-insulin-v2
          test "$(git rev-parse origin/feat/p1-journal-insulin-v2)" = "$EXPECTED"
          git checkout --detach "$EXPECTED"
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/diabetes/api/v1/schemas.py')
          text = p.read_text()
          old = '    insulin_units: Optional[float] = None\n    exercised: str = "no"'
          if text.count(old) != 2:
              raise SystemExit(f'expected 2 response/create insulin markers, got {text.count(old)}')
          p.write_text(text.replace(old, '    insulin_units: Optional[float] = None  # response-only marker\n    exercised: str = "no"', 1))
          PY
          python <(git show origin/audit/p1-journal-5-builder-final:scripts/audits/p1-journal-5-builder.py)
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/diabetes/api/v1/schemas.py')
          p.write_text(p.read_text().replace('    insulin_units: Optional[float] = None  # response-only marker\n', '    insulin_units: Optional[float] = None\n', 1))
          t = Path('frontend/test/features/insulin_logging_v2_test.dart')
          text = t.read_text()
          text = text.replace('providers: <SingleChildWidget>[', 'providers: [')
          t.write_text(text)
          PY

          cd backend
          pip install -r requirements.txt ruff==0.15.17
          python manage.py export_openapi > ../docs/api/openapi.json
          ruff check diabetes/api/v1 diabetes/tests/test_journal_insulin_logging.py
          pytest -q diabetes/tests/test_journal_insulin_logging.py diabetes/tests/test_journal_meal_portions.py
          cd ../frontend
          flutter pub get
          flutter gen-l10n
          dart format lib/features/dashboard/widgets/add_log_sheet.dart lib/features/journal/edit_log_screen.dart lib/features/journal/journal_screen.dart lib/features/journal/widgets/insulin_logging.dart test/features/insulin_logging_v2_test.dart
          flutter analyze --no-fatal-infos
          flutter test --no-pub test/features/insulin_logging_v2_test.dart test/features/add_log_sheet_test.dart
          cd ..
          rm -f backend/ci-test.db
          git checkout "$EXPECTED" -- frontend/pubspec.lock frontend/.flutter-plugins-dependencies 2>/dev/null || true
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/diabetes/api/v1/logs.py backend/diabetes/api/v1/schemas.py backend/diabetes/tests/test_journal_insulin_logging.py docs/api/openapi.json frontend/lib/features/dashboard/widgets/add_log_sheet.dart frontend/lib/features/journal/edit_log_screen.dart frontend/lib/features/journal/journal_screen.dart frontend/lib/features/journal/widgets/insulin_logging.dart frontend/lib/l10n/app_ar.arb frontend/lib/l10n/app_en.arb frontend/lib/l10n/app_fr.arb frontend/lib/l10n/app_localizations.dart frontend/lib/l10n/app_localizations_ar.dart frontend/lib/l10n/app_localizations_en.dart frontend/lib/l10n/app_localizations_fr.dart frontend/test/features/insulin_logging_v2_test.dart
          git commit -m 'feat(journal): make insulin logging factual and editable'
          git push --force-with-lease=refs/heads/feat/p1-journal-insulin-v2:$EXPECTED origin HEAD:refs/heads/feat/p1-journal-insulin-v2
