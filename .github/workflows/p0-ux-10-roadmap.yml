name: P0-UX-10 roadmap finalize

on:
  push:
    branches:
      - fix/p0-ux-10-importer-document-entry
    paths:
      - .github/workflows/p0-ux-10-roadmap.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-ux-10-importer-document-entry
          fetch-depth: 0
      - name: Update roadmap
        run: python3 .github/scripts/p0_ux_10_roadmap.py
      - name: Commit clean documentation diff
        run: |
          git rm .github/workflows/p0-ux-10-roadmap.yml
          git rm .github/scripts/p0_ux_10_roadmap.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md
          git commit -m 'docs(roadmap): certify P0-UX-10 above 9/10'
          git push origin HEAD:fix/p0-ux-10-importer-document-entry
