name: D20 — Durable notice reservations

on:
  push:
    branches:
      - feat/v1-d20-weight-delivery-ledger-20261015
    paths:
      - frontend/lib/data/drift/patient_weight_notice_delivery_ledger.dart
      - frontend/test/data/drift/d20_weight_notice_delivery_ledger_test.dart
      - .github/workflows/d20-notice-ledger-contract.yml
      - docs/handovers/2026-10-15-iamina-d20-weight-notice-ledger.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger-contract:
    name: D20 per-vault duplicate reservation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze ledger code and tests
        run: flutter analyze --no-fatal-infos lib/data/drift/patient_weight_notice_delivery_ledger.dart test/data/drift/d20_weight_notice_delivery_ledger_test.dart
      - name: Run D20-A/B/C/D synthetic tests
        run: flutter test --no-pub test/features/profile/d20_weight_trend_snapshot_test.dart test/features/profile/d20_weight_notice_policy_test.dart test/data/drift/d20_weight_notice_preferences_store_test.dart test/data/drift/d20_weight_notice_delivery_ledger_test.dart
