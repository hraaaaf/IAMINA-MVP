name: P5-4 temporary iOS identity rewrite

on:
  push:
    branches:
      - pilot/p5-4-ios-identity
    paths:
      - ".github/workflows/p5-4-temp-ios-identity.yml"
      - "frontend/ios/Runner.xcodeproj/project.pbxproj"

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/p5-4-ios-identity
          fetch-depth: 0

      - name: Validate placeholder counts
        shell: bash
        run: |
          set -euo pipefail
          file=frontend/ios/Runner.xcodeproj/project.pbxproj
          app_count=$(grep -c 'PRODUCT_BUNDLE_IDENTIFIER = com.example.amina;' "$file")
          test_count=$(grep -c 'PRODUCT_BUNDLE_IDENTIFIER = com.example.amina.RunnerTests;' "$file")
          test "$app_count" -eq 3
          test "$test_count" -eq 3

      - name: Rewrite permanent iOS identity
        shell: bash
        run: |
          set -euo pipefail
          file=frontend/ios/Runner.xcodeproj/project.pbxproj
          sed -i 's/PRODUCT_BUNDLE_IDENTIFIER = com\.example\.amina\.RunnerTests;/PRODUCT_BUNDLE_IDENTIFIER = ma.iamina.app.RunnerTests;/g' "$file"
          sed -i 's/PRODUCT_BUNDLE_IDENTIFIER = com\.example\.amina;/PRODUCT_BUNDLE_IDENTIFIER = ma.iamina.app;/g' "$file"
          ! grep -q 'com.example.amina' "$file"
          test "$(grep -c 'PRODUCT_BUNDLE_IDENTIFIER = ma.iamina.app;' "$file")" -eq 3
          test "$(grep -c 'PRODUCT_BUNDLE_IDENTIFIER = ma.iamina.app.RunnerTests;' "$file")" -eq 3

      - name: Commit only Xcode identity change
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':(exclude)frontend/ios/Runner.xcodeproj/project.pbxproj' || {
            echo 'Unexpected file changed' >&2
            git status --short
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/ios/Runner.xcodeproj/project.pbxproj
          git commit -m 'build(ios): set permanent IAMINA bundle identity'
          git push origin HEAD:pilot/p5-4-ios-identity
