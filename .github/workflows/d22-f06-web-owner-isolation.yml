name: D22 F06 Web A-logout-B owner isolation Chrome (synthetic)

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/lib/ui_d22_f06_controller_logs_probe_main.dart'
      - 'scripts/d22_f06_web_controller_logs_probe.py'
      - '.github/workflows/d22-f06-web-owner-isolation.yml'

permissions:
  contents: read

concurrency:
  group: d22-f06-controller-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  chrome-controller-vault:
    name: D22 F06 real controller and physical IndexedDB synthetic A-B-A
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Analyze/build real controller browser-only fixture
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos lib/ui_d22_f06_controller_logs_probe_main.dart
          flutter build web --release --no-web-resources-cdn \
            -t lib/ui_d22_f06_controller_logs_probe_main.dart \
            --dart-define=API_BASE_URL=http://127.0.0.1:9
      - name: Real Chrome A-B-A, logout, owner-scoped declaration and reload
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client
          python3 -m http.server 7391 --bind 127.0.0.1 --directory frontend/build/web > /tmp/d22-f06-controller-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:7391/ > /dev/null
          python3 scripts/d22_f06_web_controller_logs_probe.py
      - name: Upload bounded browser evidence (no patient data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d22-f06-controller-indexeddb-aba-synthetic
          path: d22-f06-web-controller-aba-proof.json
          if-no-files-found: warn
          retention-days: 14
