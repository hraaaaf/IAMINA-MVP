name: Dashboard global certification

on:
  workflow_dispatch:
  push:
    branches:
      - audit/dashboard-global-cert-20260909
    paths:
      - '.github/workflows/dashboard-global-cert.yml'
      - 'frontend/lib/ui_dashboard_backend_cert_main.dart'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_dashboard_cert
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_dashboard_cert"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: dashboard-cert-nonproduction
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:7358,http://localhost:7358
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_dashboard_cert
      FIREBASE_CREDENTIALS_PATH: ''
      GEMINI_API_KEY: ''
      IAMINA_CONVERSATION_NETWORK_AUTHORIZED: 'false'
      CERT_EMAIL: dashboard-cert-${{ github.run_id }}-${{ github.run_attempt }}@example.invalid
      CERT_PASSWORD: IAMINA-Dashboard-Cert-2026!Synthetic#42

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare proof directory
        run: mkdir -p dashboard-global-cert

      - name: Audit Dashboard authority and legacy references
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'Canonical route:'
            grep -n "DashboardCompanionEntryScreen" frontend/lib/modules/diabetes_module.dart || true
            echo
            echo 'Legacy DashboardConvergentScreen references outside its own source:'
            grep -RInE 'DashboardConvergentScreen|dashboard_convergent_screen' frontend/lib frontend/test \
              --exclude='dashboard_convergent_screen.dart' || true
          } | tee dashboard-global-cert/dashboard-authority.txt

      - name: Start PostgreSQL-backed IAMINA backend
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py runserver 127.0.0.1:8000 >/tmp/iamina-dashboard-backend.log 2>&1 &
          echo $! >/tmp/iamina-dashboard-backend.pid
          READY=0
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/docs >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != '1' ]; then
            cat /tmp/iamina-dashboard-backend.log >&2 || true
            exit 1
          fi
          echo 'PostgreSQL backend ready.'

      - name: Register and seed synthetic backend identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/register.json
          import json, os
          print(json.dumps({
              'email': os.environ['CERT_EMAIL'],
              'password': os.environ['CERT_PASSWORD'],
              'first_name': 'Dashboard',
              'last_name': 'Certification',
          }))
          PY
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/register.json > dashboard-global-cert/auth-register.json
          python3 - <<'PY'
          import json
          p=json.load(open('dashboard-global-cert/auth-register.json'))
          token=p.get('access_token','')
          assert token.startswith('iamina.'), p
          open('/tmp/iamina-dashboard-token','w').write(token)
          PY
          TOKEN="$(cat /tmp/iamina-dashboard-token)"
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/demo/seed \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' \
            > dashboard-global-cert/backend-demo-seed.json

      - name: Exercise backend-dependent Dashboard contracts
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/iamina-dashboard-token)"
          auth=(-H "Authorization: Bearer $TOKEN")
          curl -fsS "${auth[@]}" http://127.0.0.1:8000/api/v1/auth/me > dashboard-global-cert/auth-me.json
          curl -fsS "${auth[@]}" http://127.0.0.1:8000/api/v1/profile/locale > dashboard-global-cert/profile-locale.json
          curl -fsS "${auth[@]}" http://127.0.0.1:8000/api/v1/account/modules > dashboard-global-cert/account-modules.json
          curl -fsS "${auth[@]}" 'http://127.0.0.1:8000/api/v1/kpis/?days=21&target_low=70&target_high=180' > dashboard-global-cert/kpis.json
          curl -fsS "${auth[@]}" http://127.0.0.1:8000/api/v1/companion/overview > dashboard-global-cert/companion-overview.json
          curl -fsS "${auth[@]}" http://127.0.0.1:8000/api/v1/proactive-insights/preview/ > dashboard-global-cert/proactive-preview.json
          curl -fsS -X POST "${auth[@]}" http://127.0.0.1:8000/api/v1/companion/next-action/evaluate/ > dashboard-global-cert/next-action.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          names=['auth-me','profile-locale','account-modules','kpis','companion-overview','proactive-preview','next-action']
          summary={}
          for name in names:
              p=Path('dashboard-global-cert')/f'{name}.json'
              data=json.loads(p.read_text())
              summary[name]={'type':type(data).__name__,'keys':sorted(data) if isinstance(data,dict) else None}
          Path('dashboard-global-cert/backend-contract-summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False))
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY

      - name: Validate Dashboard frontend contracts
        working-directory: frontend
        run: |
          flutter pub get
          dart format --set-exit-if-changed lib/ui_dashboard_backend_cert_main.dart
          flutter analyze --no-fatal-infos lib/ui_dashboard_backend_cert_main.dart
          flutter test --no-pub \
            test/features/dashboard_latest_reading_contract_test.dart \
            test/features/dashboard_adaptive_kpi_contract_test.dart \
            test/features/dashboard_trend_contract_test.dart \
            test/features/dashboard_responsive_convergence_contract_test.dart

      - name: Build real Dashboard against isolated backend
        working-directory: frontend
        run: |
          flutter build web --release -t lib/ui_dashboard_backend_cert_main.dart \
            --dart-define=API_BASE_URL=http://127.0.0.1:7358 \
            --dart-define=IAMINA_CERT_EMAIL="$CERT_EMAIL" \
            --dart-define=IAMINA_CERT_PASSWORD="$CERT_PASSWORD"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run real backend Dashboard visual matrix
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/iamina_dashboard_proxy.py <<'PY'
          import http.client
          import http.server
          import os
          from pathlib import Path

          root=Path(os.environ['STATIC_ROOT'])

          class Handler(http.server.SimpleHTTPRequestHandler):
              def __init__(self,*args,**kwargs):
                  super().__init__(*args,directory=str(root),**kwargs)

              def _proxy(self):
                  length=int(self.headers.get('content-length','0'))
                  body=self.rfile.read(length) if length else None
                  headers={k:v for k,v in self.headers.items() if k.lower() not in {'host','content-length','connection'}}
                  conn=http.client.HTTPConnection('127.0.0.1',8000,timeout=45)
                  conn.request(self.command,self.path,body=body,headers=headers)
                  response=conn.getresponse()
                  payload=response.read()
                  self.send_response(response.status)
                  for key,value in response.getheaders():
                      if key.lower() not in {'content-length','transfer-encoding','connection'}:
                          self.send_header(key,value)
                  self.send_header('Content-Length',str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)
                  conn.close()

              def do_GET(self):
                  if self.path.startswith('/api/'):
                      return self._proxy()
                  return super().do_GET()
              def do_POST(self): return self._proxy() if self.path.startswith('/api/') else self.send_error(404)
              def do_PATCH(self): return self._proxy() if self.path.startswith('/api/') else self.send_error(404)
              def do_DELETE(self): return self._proxy() if self.path.startswith('/api/') else self.send_error(404)
              def log_message(self,fmt,*args): return

          http.server.ThreadingHTTPServer(('127.0.0.1',7358),Handler).serve_forever()
          PY

          STATIC_ROOT="$GITHUB_WORKSPACE/frontend/build/web" python3 /tmp/iamina_dashboard_proxy.py >/tmp/iamina-dashboard-proxy.log 2>&1 &
          PROXY_PID=$!
          trap 'kill $PROXY_PID 2>/dev/null || true; kill $(cat /tmp/iamina-dashboard-backend.pid) 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7358/ >/dev/null && break
            sleep 1
          done

          cat >/tmp/dashboard_playwright.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          (async()=>{
            const out='dashboard-global-cert';
            const browser=await chromium.launch({headless:true});
            const matrix=[
              ['mobile',390,844],
              ['tablet',768,1024],
              ['desktop',1280,900],
            ];
            const report={};
            for (const [name,width,height] of matrix) {
              const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
              const page=await context.newPage();
              const errors=[]; const consoleErrors=[]; const api=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
              page.on('response',r=>{if(r.url().includes('/api/')) api.push({url:r.url(),status:r.status()})});
              await page.goto('http://127.0.0.1:7358/',{waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForTimeout(12000);
              await page.screenshot({path:path.join(out,`${name}-top-${width}x${height}.png`)});
              await page.mouse.wheel(0,Math.round(height*0.70));
              await page.waitForTimeout(1200);
              await page.screenshot({path:path.join(out,`${name}-mid-${width}x${height}.png`)});
              await page.mouse.wheel(0,Math.round(height*0.85));
              await page.waitForTimeout(1200);
              await page.screenshot({path:path.join(out,`${name}-lower-${width}x${height}.png`)});
              report[name]={width,height,url:page.url(),pageErrors:errors,consoleErrors,api};
              if(errors.length) throw new Error(`${name} page errors: ${errors.join(' | ')}`);
              const bad=api.filter(x=>x.status>=500);
              if(bad.length) throw new Error(`${name} backend 5xx: ${JSON.stringify(bad)}`);
              await context.close();
            }
            fs.writeFileSync(path.join(out,'browser-report.json'),JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/dashboard_playwright.js

      - name: Upload certification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-dashboard-global-cert
          path: |
            dashboard-global-cert/*
            /tmp/iamina-dashboard-backend.log
            /tmp/iamina-dashboard-proxy.log
          if-no-files-found: warn
          retention-days: 7
