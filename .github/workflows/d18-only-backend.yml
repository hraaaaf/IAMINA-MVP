name: D18 only - backend progressive profile verification

on:
  pull_request:
    paths:
      - 'backend/core/models/patient_weight.py'
      - 'backend/core/models/patient.py'
      - 'backend/diabetes/api/v1/profile.py'
      - 'backend/core/tests/test_d18_progressive_weight_history.py'
      - 'backend/diabetes/tests/test_d18_progressive_profile_http.py'
      - '.github/workflows/d18-only-backend.yml'

permissions:
  contents: read

jobs:
  d18-backend-only:
    name: D18 only - authenticated owner, optional facts and append-only weight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-d18-only-not-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-d18-only.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run ONLY D18 backend/API regression suites
        run: |
          python -m pytest -q --tb=short \
            core/tests/test_d18_progressive_weight_history.py \
            diabetes/tests/test_d18_progressive_profile_http.py
