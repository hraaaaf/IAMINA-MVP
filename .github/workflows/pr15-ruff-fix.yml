name: PR15 ruff fix

on:
  push:
    branches:
      - feat/p0-mena-provider-runtime-resilience

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-provider-runtime-resilience
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check backend/llm/runtime.py --fix
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/llm/runtime.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(llm): apply ruff import sort"
          git push origin HEAD:feat/p0-mena-provider-runtime-resilience
