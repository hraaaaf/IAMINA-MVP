name: P1-UX-13 builder v2

on:
  push:
    branches: [fix/p1-ux-13-medical-product-wording]
    paths: [.github/workflows/p1-ux-13-builder-v2.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-ux-13-medical-product-wording
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply wording contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          updates = {
            'fr': {
              'dataPrivacyNote': "Services IA externes : votre accord et une autorisation valide sont requis",
              'consentHeadline': "IAmina peut utiliser des services d’IA externes pour certaines fonctionnalités",
              'consentBody': "Avec votre accord, IAmina peut envoyer uniquement les catégories de données indiquées ci-dessus à un service d’IA externe. L’envoi n’a lieu que si le service, sa région d’hébergement et sa durée de conservation sont autorisés pour votre environnement IAmina. Sans votre accord ou sans autorisation valide du service, aucune donnée n’est envoyée.\n\nVous pouvez retirer votre accord à tout moment depuis votre profil.",
              'documentPrivacyTitle': "Envoi externe uniquement si autorisé",
              'documentPrivacyBody': "IAmina n’envoie ce document à un service externe que si vous avez donné votre accord et si ce service est autorisé pour votre environnement IAmina. Sinon, l’import est bloqué.",
              'targetCoverage': "{count} mesures sur {days} jours · proportion des mesures enregistrées, pas temps dans la cible d’un capteur de glucose en continu (CGM)",
              'cgmExport': "Export de mesure continue du glucose (CGM)",
              'featureRealtimeAgp': "Résumé des tendances du capteur (AGP)",
            },
            'en': {
              'dataPrivacyNote': "External AI services require your consent and valid approval",
              'consentHeadline': "IAmina may use external AI services for some features",
              'consentBody': "With your consent, IAmina may send only the data categories listed above to an external AI service. Data is sent only when the service, its hosting region, and its retention period are approved for your IAmina environment. Without your consent or valid service approval, no data is sent.\n\nYou can withdraw your consent at any time from your profile.",
              'documentPrivacyTitle': "External sending only when authorised",
              'documentPrivacyBody': "IAmina sends this document to an external service only if you have given consent and that service is authorised for your IAmina environment. Otherwise, the import is blocked.",
              'targetCoverage': "{count} readings over {days} days · share of recorded readings, not time in range from continuous glucose monitoring (CGM)",
              'cgmExport': "Continuous glucose monitoring (CGM) export",
              'featureRealtimeAgp': "Sensor trend summary (AGP)",
            },
            'ar': {
              'dataPrivacyNote': "خدمات الذكاء الاصطناعي الخارجية تتطلب موافقتك واعتمادًا صالحًا للخدمة",
              'consentHeadline': "قد تستخدم IAmina خدمات ذكاء اصطناعي خارجية لبعض الميزات",
              'consentBody': "بموافقتك، يمكن لـ IAmina إرسال فئات البيانات المذكورة أعلاه فقط إلى خدمة ذكاء اصطناعي خارجية. لا يتم الإرسال إلا إذا كانت الخدمة ومنطقة استضافتها ومدة الاحتفاظ بالبيانات معتمدة لبيئة IAmina الخاصة بك. من دون موافقتك أو اعتماد صالح للخدمة، لا تُرسل أي بيانات.\n\nيمكنك سحب موافقتك في أي وقت من ملفك الشخصي.",
              'documentPrivacyTitle': "إرسال خارجي فقط عند السماح به",
              'documentPrivacyBody': "لا ترسل IAmina هذا المستند إلى خدمة خارجية إلا إذا منحت موافقتك وكانت الخدمة معتمدة لبيئة IAmina الخاصة بك. خلاف ذلك، يُحظر الاستيراد.",
              'targetCoverage': "{count} قياسًا خلال {days} يومًا · نسبة القراءات المسجلة وليست الوقت ضمن النطاق المحسوب من المراقبة المستمرة للجلوكوز (CGM)",
              'cgmExport': "تصدير بيانات المراقبة المستمرة للجلوكوز (CGM)",
              'featureRealtimeAgp': "ملخص اتجاهات المستشعر (AGP)",
            },
          }
          root=Path('frontend/lib/l10n')
          for locale, values in updates.items():
            p=root/f'app_{locale}.arb'
            data=json.loads(p.read_text())
            for k,v in values.items():
              assert k in data, (locale,k)
              data[k]=v
            p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+"\n")
          PY
          cat > frontend/test/p1_ux_13_wording_contract_test.dart <<'EOF'
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter_test/flutter_test.dart';

          Map<String, dynamic> arb(String locale) => jsonDecode(
                File('lib/l10n/app_$locale.arb').readAsStringSync(),
              ) as Map<String, dynamic>;

          void main() {
            test('P1-UX-13 puts plain language before CGM and AGP jargon', () {
              final fr = arb('fr'); final en = arb('en'); final ar = arb('ar');
              expect(fr['cgmExport'], 'Export de mesure continue du glucose (CGM)');
              expect(en['cgmExport'], 'Continuous glucose monitoring (CGM) export');
              expect(ar['cgmExport'], contains('المراقبة المستمرة للجلوكوز (CGM)'));
              expect(fr['featureRealtimeAgp'], 'Résumé des tendances du capteur (AGP)');
              expect(en['featureRealtimeAgp'], 'Sensor trend summary (AGP)');
              expect(ar['featureRealtimeAgp'], contains('(AGP)'));
              expect(fr['cgmExport'], isNot('Export CGM'));
              expect(fr['featureRealtimeAgp'], isNot('AGP en temps réel'));
              expect(en['featureRealtimeAgp'], isNot('Real-time AGP'));
            });

            test('P1-UX-13 keeps privacy conditions explicit while simplifying copy', () {
              final fr = arb('fr');
              expect(fr['documentPrivacyTitle'], isNot('Traitement externe contrôlé'));
              expect(fr['documentPrivacyBody'], contains('accord'));
              expect(fr['documentPrivacyBody'], contains('autorisé'));
              expect(fr['consentBody'], contains('région d’hébergement'));
              expect(fr['consentBody'], contains('durée de conservation'));
              for (final locale in ['en', 'ar']) {
                final data = arb(locale);
                expect(data['documentPrivacyBody'].toString(), isNotEmpty);
                expect(data['consentBody'].toString(), isNotEmpty);
              }
            });

            test('P1-UX-13 distinguishes reading coverage from CGM time in range', () {
              final fr = arb('fr')['targetCoverage'].toString();
              final en = arb('en')['targetCoverage'].toString();
              final ar = arb('ar')['targetCoverage'].toString();
              expect(fr, contains('capteur de glucose en continu (CGM)'));
              expect(fr, contains('pas temps dans la cible'));
              expect(en, contains('not time in range'));
              expect(en, contains('continuous glucose monitoring (CGM)'));
              expect(ar, contains('المراقبة المستمرة للجلوكوز (CGM)'));
            });
          }
          EOF
      - name: Generate localization and validate
        working-directory: frontend
        run: |
          flutter pub get
          flutter gen-l10n
          dart format test/p1_ux_13_wording_contract_test.dart
          flutter analyze --no-fatal-infos
          flutter test test/p1_ux_13_wording_contract_test.dart
          flutter test test/p0_ux_10_importer_document_entry_contract_test.dart
          flutter test test/p0_privacy_truthfulness_contract_test.dart
          flutter test test/p0_dashboard_responsive_rtl_contract_test.dart
      - name: Commit product patch and remove transports
        run: |
          rm -f .github/workflows/p1-ux-13-builder.yml .github/workflows/p1-ux-13-builder-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/l10n frontend/test/p1_ux_13_wording_contract_test.dart .github/workflows/p1-ux-13-builder.yml .github/workflows/p1-ux-13-builder-v2.yml
          git commit -m "fix(ux): clarify medical and product terminology"
          git push origin HEAD:fix/p1-ux-13-medical-product-wording
