name: D18 iOS native bridge and isolated simulator A-B-A

on:
  pull_request:
    paths:
      - '.github/workflows/d18-ios-biometry-compile.yml'
      - 'frontend/ios/Runner/AppDelegate.swift'
      - 'frontend/ios/Runner/Info.plist'
      - 'frontend/lib/services/app_lock_authenticator_native.dart'
      - 'frontend/lib/services/app_lock_authenticator_factory.dart'
      - 'frontend/lib/services/app_lock_service.dart'
      - 'frontend/test/features/profile/d18_native_app_lock_boundary_test.dart'
      - 'frontend/integration_test/d18_android_patient_profile_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d18-ios-compile:
    name: Compile iOS native bridge and run simulator A-B-A (NO physical biometrics)
    runs-on: macos-15
    timeout-minutes: 65
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Flutter dependencies
        run: flutter pub get
      - name: Test targeted D18 auth-epoch rejection
        run: flutter test --no-pub --reporter expanded test/features/profile/d18_native_app_lock_boundary_test.dart
      - name: Compile iOS app with native Secure Enclave bridge (no signing)
        run: flutter build ios --release --no-codesign --dart-define=ENABLE_FIREBASE_MIGRATION=false
      - name: Verify unsigned device-release compilation and privacy prompt
        run: |
          test -d build/ios/iphoneos/Runner.app
          /usr/libexec/PlistBuddy -c 'Print :NSFaceIDUsageDescription' ios/Runner/Info.plist
          echo 'D18_IOS_DEVICE_RELEASE_COMPILED=true' >> "$GITHUB_ENV"
      - name: Isolate simulator Debug build from preceding device Release build
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get
          (
            cd ios
            pod install
          )
          test -f 'ios/Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig'
          test -f ios/Runner.xcworkspace/contents.xcworkspacedata
      - name: Select and boot a genuine iOS simulator on macOS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/d18-simulator-udid"
          import json, subprocess
          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]))
          phones = [device for devices in payload["devices"].values()
                    for device in devices
                    if device["name"].startswith("iPhone") and device.get("isAvailable", True)]
          if not phones:
              raise SystemExit("NO_IOS_SIMULATOR_AVAILABLE: cannot install iOS on Ubuntu")
          print(phones[0]["udid"])
          PY
          simulator="$(cat "$RUNNER_TEMP/d18-simulator-udid")"
          echo "D18_IOS_SIMULATOR_ID=$simulator" >> "$GITHUB_ENV"
          echo "D18_IOS_SIMULATOR_UDID=$simulator"
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
      - name: Install Flutter app and exercise D18 A-B-A on iOS simulator
        env:
          CI: "true"
        run: |
          flutter test --no-pub --reporter expanded -d "$D18_IOS_SIMULATOR_ID" integration_test/d18_android_patient_profile_test.dart
          echo 'D18_IOS_SIMULATOR_A_B_A_PASSED=true' >> "$GITHUB_ENV"
      - name: Record limits
        if: always()
        run: |
          mkdir -p ../artifacts/d18-ios
          {
            printf 'D18_IOS_DEVICE_RELEASE_COMPILED=%s\n' "${D18_IOS_DEVICE_RELEASE_COMPILED:-false}"
            printf 'D18_IOS_SIMULATOR_A_B_A_PASSED=%s\n' "${D18_IOS_SIMULATOR_A_B_A_PASSED:-false}"
            cat <<'EOF'
          Simulator test result is true ONLY after Flutter integration test exit code 0.
          The simulator cannot prove Face ID / Touch ID hardware or Secure Enclave signing.
          Not a proof of biometric enrollment, Secure Enclave attestation,
          device-key invalidation or physical-device treatment safety.
          No patient data, no deployed binary, no App Store distribution.
          EOF
          } > ../artifacts/d18-ios/PROVENANCE.txt
      - name: Upload provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d18-ios-compile-provenance
          path: artifacts/d18-ios/PROVENANCE.txt
          retention-days: 14
