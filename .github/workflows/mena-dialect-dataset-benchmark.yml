name: MENA dialect dataset benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/evaluation/dialect_dataset_groq_benchmark.py"
      - "backend/evaluation/tests/test_dialect_dataset_groq_benchmark.py"
      - ".github/workflows/mena-dialect-dataset-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: mena-dialect-dataset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Groq public-dataset dialect evidence
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: mena-dialect-dataset-nonproduction
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///mena-dialect-dataset.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MENA_DIALECT_DATASET_NETWORK_AUTHORIZED: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Validate benchmark contracts before network
        run: pytest -q evaluation/tests/test_dialect_dataset_groq_benchmark.py
      - name: Run dataset-backed 6-country dialect benchmark
        run: >-
          python -m evaluation.dialect_dataset_groq_benchmark
          --output ../artifacts/mena-dialect-dataset.json
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mena-dialect-dataset
          path: artifacts/mena-dialect-dataset.json
          if-no-files-found: warn
          retention-days: 14
