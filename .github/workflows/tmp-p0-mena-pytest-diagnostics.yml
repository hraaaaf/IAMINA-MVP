name: Temporary P0 MENA Test Repair

on:
  push:
    branches: [feat/p0-mena-processor-policy-registry]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-processor-policy-registry
      - name: Repair approved-provider test fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/core/tests/test_ai_text_payload.py")
          text = path.read_text()
          old = '''def test_valid_payload_reaches_provider_unchanged(consenting_patient):
              provider = MagicMock()
              original_complete = MagicMock(return_value="ok")
          '''
          new = '''def test_valid_payload_reaches_provider_unchanged(consenting_patient, monkeypatch):
              monkeypatch.setattr("llm.factory._provider_policy_name", lambda _: "fallback")
              provider = MagicMock()
              original_complete = MagicMock(return_value="ok")
          '''
          if old not in text:
              raise SystemExit("expected test block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f P0_MENA_PYTEST_DIAGNOSTICS.txt
          rm -f .github/workflows/tmp-p0-mena-pytest-diagnostics.yml
      - name: Commit repair and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: declare approved processor policy for payload fixture"
          git push
