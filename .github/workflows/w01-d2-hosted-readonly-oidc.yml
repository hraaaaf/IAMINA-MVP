name: W01 + D2 hosted Preview four-field read-only proof
on:
  push:
    branches:
      - integration/w01-d2-preview-only-20261027
permissions:
  contents: read
  id-token: write
jobs:
  hosted-readonly:
    name: Protected Web BFF → API → Neon identity, no writes
    if: github.repository == 'hraaaaf/IAMINA-MVP' && github.ref == 'refs/heads/integration/w01-d2-preview-only-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtain short-lived GitHub OIDC
        id: jwt
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Read only four Neon IDs and backend health through protected Web
        env:
          IAMINA_OIDC: ${{ steps.jwt.outputs.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          // Immutable code deployment: W01 + D2 12ef1240 on BOTH Web and API.
          const base = 'https://iamina-review-f9j940c5d-achraf-benmoussa-s-projects.vercel.app';
          const expected = Object.freeze({
            database_name: 'iamina925_empty',
            role_name: 'iamina_preview_app',
            neon_project_id: 'noisy-truth-00115950',
            neon_branch_id: 'br-sweet-frog-b9ok6ptp',
          });
          const jwt = process.env.IAMINA_OIDC;
          assert.ok(typeof jwt === 'string' && jwt.length > 30, 'OIDC_MISSING');
          async function read(path) {
            const r = await fetch(base + path, {
              method: 'GET',
              headers: {
                accept: 'application/json',
                'x-vercel-trusted-oidc-idp-token': jwt,
              },
              redirect: 'manual',
              cache: 'no-store',
              signal: AbortSignal.timeout(15000),
            });
            const type = (r.headers.get('content-type') || '').toLowerCase();
            console.log(path, 'HTTP', r.status, 'JSON', type.includes('application/json'));
            assert.equal(r.status, 200, 'SSO_OR_UPSTREAM_FAIL_CLOSED');
            assert.ok(type.includes('application/json'), 'NON_JSON_DENIED');
            const raw = await r.text();
            assert.ok(raw.length < 16384, 'OVERSIZE_RESPONSE');
            return JSON.parse(raw);
          }
          try {
            const actual = await read('/api/v1/ops/preview-db-identity');
            assert.deepEqual(
              Object.keys(expected).sort(),
              Object.keys(actual).sort(),
              'IDENTITY_RESPONSE_FIELDS_UNEXPECTED',
            );
            for (const [field,value] of Object.entries(expected))
              assert.equal(actual[field],value,'FOUR_FIELD_NEON_IDENTITY_MISMATCH_STOP');
            console.log('FOUR_FIELD_NEON_BFF_VERIFIED_ON_DEPLOYED_12ef1240');
            const health = await read('/api/v1/health');
            assert.equal(health.db, 'ok', 'DATABASE_HEALTH_UNAVAILABLE');
            console.log('WEB_BFF_API_NEON_READ_ONLY_PROOF_PASS');
          } catch (error) {
            // Do not log JWTs, cookies, credentials, query bodies or patient data.
            console.error('HOSTED_READ_ONLY_BLOCKED:',error?.message||'UNKNOWN');
            process.exitCode=1;
          }
          NODE
