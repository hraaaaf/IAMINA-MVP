name: UI screenshot audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/lib/main.dart'
      - 'frontend/lib/core/theme/**'
      - 'frontend/lib/core/widgets/**'
      - 'frontend/lib/features/dashboard/**'
      - 'frontend/lib/features/journal/**'
      - 'frontend/lib/features/profile/**'
      - 'frontend/lib/features/import/**'
      - 'frontend/lib/features/documents/**'
      - 'frontend/lib/features/navigation/**'
      - 'frontend/lib/features/companion/**'
      - 'frontend/lib/features/medications/**'
      - 'frontend/lib/features/reminders/**'
      - 'frontend/test/ui_visual_screenshot_test.dart'
      - '.github/workflows/ui-screenshot-audit.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/lib/main.dart'
      - 'frontend/lib/core/theme/**'
      - 'frontend/lib/core/widgets/**'
      - 'frontend/lib/features/dashboard/**'
      - 'frontend/lib/features/journal/**'
      - 'frontend/lib/features/profile/**'
      - 'frontend/lib/features/import/**'
      - 'frontend/lib/features/documents/**'
      - 'frontend/lib/features/navigation/**'
      - 'frontend/lib/features/companion/**'
      - 'frontend/lib/features/medications/**'
      - 'frontend/lib/features/reminders/**'
      - 'frontend/test/ui_visual_screenshot_test.dart'
      - '.github/workflows/ui-screenshot-audit.yml'

permissions:
  contents: read

jobs:
  screenshot:
    name: Representative patient surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Render native deterministic goldens
        run: flutter test --update-goldens --reporter expanded test/ui_visual_screenshot_test.dart

      - name: Validate visual evidence
        run: |
          set -euo pipefail
          GOLDENS="test/goldens"
          test -d "$GOLDENS"
          COUNT="$(find "$GOLDENS" -maxdepth 1 -name '*.png' | wc -l)"
          if [ "$COUNT" -ne 14 ]; then
            echo "Expected 14 visual captures, found $COUNT" >&2
            exit 1
          fi

          for FILE in "$GOLDENS"/*.png; do
            BYTES="$(stat -c%s "$FILE")"
            NAME="$(basename "$FILE")"
            MIN_BYTES=8000
            case "$NAME" in
              *1440x1000*) MIN_BYTES=12000 ;;
            esac
            if [ "$BYTES" -lt "$MIN_BYTES" ]; then
              echo "Capture $NAME is suspiciously small: $BYTES bytes" >&2
              exit 1
            fi
          done

          MOBILE_UNIQUE="$(sha256sum "$GOLDENS"/*-390x844.png | awk '{print $1}' | sort -u | wc -l)"
          if [ "$MOBILE_UNIQUE" -lt 8 ]; then
            echo "Visual audit produced too few distinct mobile renders: $MOBILE_UNIQUE" >&2
            exit 1
          fi

      - name: Upload UI audit screenshots
        uses: actions/upload-artifact@v4
        with:
          name: iamina-ui-visual-audit
          path: frontend/test/goldens/*.png
          if-no-files-found: error
          retention-days: 7
