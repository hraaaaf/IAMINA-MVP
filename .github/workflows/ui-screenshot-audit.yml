name: UI screenshot audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/diabetes/**'
      - 'frontend/lib/main.dart'
      - 'frontend/lib/core/theme/**'
      - 'frontend/lib/core/widgets/**'
      - 'frontend/lib/features/dashboard/**'
      - 'frontend/lib/features/journal/**'
      - 'frontend/lib/features/profile/**'
      - 'frontend/lib/features/import/**'
      - 'frontend/lib/features/documents/**'
      - 'frontend/lib/features/navigation/**'
      - 'frontend/lib/features/companion/**'
      - 'frontend/lib/features/medications/**'
      - 'frontend/lib/features/reminders/**'
      - 'frontend/lib/services/companion_service.dart'
      - 'frontend/lib/data/models/**'
      - 'frontend/test/features/dashboard_*'
      - 'frontend/test/ui_visual_screenshot_test.dart'
      - 'frontend/test/dashboard_next_action_visual_test.dart'
      - 'frontend/test/dashboard_responsive_convergence_visual_test.dart'
      - '.github/workflows/ui-screenshot-audit.yml'
  push:
    branches: [main]
    paths:
      - 'backend/diabetes/**'
      - 'frontend/lib/main.dart'
      - 'frontend/lib/core/theme/**'
      - 'frontend/lib/core/widgets/**'
      - 'frontend/lib/features/dashboard/**'
      - 'frontend/lib/features/journal/**'
      - 'frontend/lib/features/profile/**'
      - 'frontend/lib/features/import/**'
      - 'frontend/lib/features/documents/**'
      - 'frontend/lib/features/navigation/**'
      - 'frontend/lib/features/companion/**'
      - 'frontend/lib/features/medications/**'
      - 'frontend/lib/features/reminders/**'
      - 'frontend/lib/services/companion_service.dart'
      - 'frontend/lib/data/models/**'
      - 'frontend/test/features/dashboard_*'
      - 'frontend/test/ui_visual_screenshot_test.dart'
      - 'frontend/test/dashboard_next_action_visual_test.dart'
      - 'frontend/test/dashboard_responsive_convergence_visual_test.dart'
      - '.github/workflows/ui-screenshot-audit.yml'

permissions:
  contents: read

jobs:
  screenshot:
    name: Representative patient surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Render native Flutter golden screenshots
        run: |
          flutter test --dart-define=IAMINA_VISUAL_AUDIT=true --update-goldens --reporter expanded test/ui_visual_screenshot_test.dart
          flutter test --dart-define=IAMINA_VISUAL_AUDIT=true --update-goldens --reporter expanded test/dashboard_next_action_visual_test.dart
          flutter test --dart-define=IAMINA_VISUAL_AUDIT=true --update-goldens --reporter expanded test/dashboard_responsive_convergence_visual_test.dart

      - name: Validate screenshot artifact set
        run: |
          set -euo pipefail
          DIR="test/ui_audit_output"
          EXPECTED=(
            dashboard-360x560.png
            dashboard-ar-360x560.png
            dashboard-390x844.png
            dashboard-trend-390x844.png
            dashboard-trend-ar-360x560.png
            dashboard-kpi-390x844.png
            dashboard-kpi-ar-360x560.png
            dashboard-insight-390x844.png
            dashboard-insight-ar-360x560.png
            dashboard-next-action-390x844.png
            dashboard-next-action-ar-360x560.png
            dashboard-responsive-699x900.png
            dashboard-responsive-701x900.png
            dashboard-responsive-1440x1000.png
            dashboard-responsive-ar-900x900.png
            journal-390x844.png
            summary-390x844.png
            profile-390x844.png
            importer-390x844.png
            document-import-390x844.png
            companion-390x844.png
            add-log-390x844.png
            medications-390x844.png
            reminders-390x844.png
            dashboard-1440x1000.png
            journal-1440x1000.png
            importer-1440x1000.png
            profile-1440x1000.png
          )

          for NAME in "${EXPECTED[@]}"; do
            FILE="$DIR/$NAME"
            test -s "$FILE"
            BYTES="$(stat -c%s "$FILE")"
            if [ "$BYTES" -lt 4000 ]; then
              echo "Capture $NAME is suspiciously small: $BYTES bytes" >&2
              exit 1
            fi
          done

          COUNT="$(find "$DIR" -maxdepth 1 -name '*.png' -type f | wc -l)"
          test "$COUNT" -eq 28

          MOBILE_UNIQUE="$(sha256sum "$DIR"/*-390x844.png | awk '{print $1}' | sort -u | wc -l)"
          if [ "$MOBILE_UNIQUE" -lt 12 ]; then
            echo "Visual audit produced too few distinct mobile renders: $MOBILE_UNIQUE" >&2
            exit 1
          fi

      - name: Upload UI audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-ui-visual-audit
          path: frontend/test/ui_audit_output/*.png
          if-no-files-found: warn
          retention-days: 7

  dashboard-contracts-frontend:
    name: Dashboard contracts P1-P7 — Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run focused Dashboard contracts
        run: |
          flutter test --no-pub --reporter expanded \
            test/features/dashboard_latest_reading_contract_test.dart \
            test/features/dashboard_today_contract_test.dart \
            test/features/dashboard_trend_contract_test.dart \
            test/features/dashboard_adaptive_kpi_contract_test.dart \
            test/features/dashboard_smart_insight_contract_test.dart \
            test/features/dashboard_next_action_contract_test.dart \
            test/features/dashboard_responsive_convergence_contract_test.dart

  dashboard-contracts-backend:
    name: Dashboard governed contracts P5-P6 — Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: dashboard-contract-ci-not-for-production
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///dashboard-contract-ci.db
      FIREBASE_CREDENTIALS_PATH: ''
      GEMINI_API_KEY: ''

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Run focused governed Dashboard backend contracts
        run: |
          pytest --tb=short -q \
            diabetes/tests/test_dashboard_proactive_preview.py \
            diabetes/tests/test_dashboard_next_action_api.py \
            diabetes/tests/test_p2_companion_smart_suggestions.py

      - name: Scope note
        run: echo 'Focused Dashboard evidence only; full CI + OpenAPI certification remain required after destacking to main.'
