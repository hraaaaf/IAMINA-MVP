name: UI screenshot audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/lib/ui_audit_main.dart'
      - 'frontend/lib/main.dart'
      - 'frontend/lib/core/theme/**'
      - 'frontend/lib/core/widgets/**'
      - 'frontend/lib/features/dashboard/**'
      - 'frontend/lib/features/journal/**'
      - 'frontend/lib/features/profile/**'
      - 'frontend/lib/features/import/**'
      - 'frontend/lib/features/documents/**'
      - 'frontend/lib/features/navigation/**'
      - 'frontend/lib/features/companion/**'
      - 'frontend/lib/features/medications/**'
      - 'frontend/lib/features/reminders/**'
      - '.github/workflows/ui-screenshot-audit.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/lib/ui_audit_main.dart'
      - 'frontend/lib/main.dart'
      - 'frontend/lib/core/theme/**'
      - 'frontend/lib/core/widgets/**'
      - 'frontend/lib/features/dashboard/**'
      - 'frontend/lib/features/journal/**'
      - 'frontend/lib/features/profile/**'
      - 'frontend/lib/features/import/**'
      - 'frontend/lib/features/documents/**'
      - 'frontend/lib/features/navigation/**'
      - 'frontend/lib/features/companion/**'
      - 'frontend/lib/features/medications/**'
      - 'frontend/lib/features/reminders/**'
      - '.github/workflows/ui-screenshot-audit.yml'

permissions:
  contents: read

jobs:
  screenshot:
    name: Representative patient surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build deterministic visual audit app
        run: |
          flutter build web --release -t lib/ui_audit_main.dart
          curl -fL --retry 3 \
            https://github.com/simolus3/drift/releases/download/drift-2.31.0/drift_worker.js \
            -o build/web/drift_worker.js
          curl -fL --retry 3 \
            https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-2.9.4/sqlite3.wasm \
            -o build/web/sqlite3.wasm
          test "$(stat -c%s build/web/drift_worker.js)" -gt 300000
          test "$(stat -c%s build/web/sqlite3.wasm)" -gt 700000

      - name: Capture representative screenshots
        run: |
          python3 -m http.server 7358 --directory build/web >/tmp/iamina-ui-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7358 >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = "1"

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          capture() {
            NAME="$1"
            SIZE="$2"
            SCREEN="$3"
            MIN_BYTES="$4"
            PROFILE="/tmp/iamina-ui-${NAME}"
            mkdir -p "$PROFILE"
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --enable-unsafe-swiftshader \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --user-data-dir="$PROFILE" \
              --window-size="$SIZE" \
              --virtual-time-budget=14000 \
              --screenshot="$GITHUB_WORKSPACE/${NAME}.png" \
              "http://127.0.0.1:7358/?screen=${SCREEN}"
            test -s "$GITHUB_WORKSPACE/${NAME}.png"
            BYTES="$(stat -c%s "$GITHUB_WORKSPACE/${NAME}.png")"
            if [ "$BYTES" -lt "$MIN_BYTES" ]; then
              echo "Capture $NAME is suspiciously small: $BYTES bytes" >&2
              exit 1
            fi
          }

          capture dashboard-390x844 390,844 dashboard 8000
          capture journal-390x844 390,844 journal 8000
          capture summary-390x844 390,844 summary 8000
          capture profile-390x844 390,844 profile 8000
          capture importer-390x844 390,844 importer 8000
          capture document-import-390x844 390,844 document-import 8000
          capture companion-390x844 390,844 companion 8000
          capture add-log-390x844 390,844 add-log 8000
          capture medications-390x844 390,844 medications 8000
          capture reminders-390x844 390,844 reminders 8000
          capture dashboard-1440x1000 1440,1000 dashboard 12000
          capture journal-1440x1000 1440,1000 journal 12000
          capture summary-1440x1000 1440,1000 summary 12000
          capture profile-1440x1000 1440,1000 profile 12000

          MOBILE_UNIQUE="$(sha256sum "$GITHUB_WORKSPACE"/*-390x844.png | awk '{print $1}' | sort -u | wc -l)"
          if [ "$MOBILE_UNIQUE" -lt 8 ]; then
            echo "Visual audit produced too few distinct mobile renders: $MOBILE_UNIQUE" >&2
            exit 1
          fi

      - name: Upload UI audit screenshots
        uses: actions/upload-artifact@v4
        with:
          name: iamina-ui-visual-audit
          path: |
            dashboard-390x844.png
            journal-390x844.png
            summary-390x844.png
            profile-390x844.png
            importer-390x844.png
            document-import-390x844.png
            companion-390x844.png
            add-log-390x844.png
            medications-390x844.png
            reminders-390x844.png
            dashboard-1440x1000.png
            journal-1440x1000.png
            summary-1440x1000.png
            profile-1440x1000.png
          if-no-files-found: error
          retention-days: 7
