name: UI screenshot audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/lib/main.dart'
      - 'frontend/lib/core/theme/**'
      - 'frontend/lib/core/widgets/**'
      - 'frontend/lib/features/dashboard/**'
      - 'frontend/lib/features/journal/**'
      - 'frontend/lib/features/profile/**'
      - 'frontend/lib/features/import/**'
      - 'frontend/lib/features/documents/**'
      - 'frontend/lib/features/navigation/**'
      - 'frontend/lib/features/companion/**'
      - 'frontend/lib/features/medications/**'
      - 'frontend/lib/features/reminders/**'
      - 'frontend/test/ui_visual_screenshot_test.dart'
      - '.github/workflows/ui-screenshot-audit.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/lib/main.dart'
      - 'frontend/lib/core/theme/**'
      - 'frontend/lib/core/widgets/**'
      - 'frontend/lib/features/dashboard/**'
      - 'frontend/lib/features/journal/**'
      - 'frontend/lib/features/profile/**'
      - 'frontend/lib/features/import/**'
      - 'frontend/lib/features/documents/**'
      - 'frontend/lib/features/navigation/**'
      - 'frontend/lib/features/companion/**'
      - 'frontend/lib/features/medications/**'
      - 'frontend/lib/features/reminders/**'
      - 'frontend/test/ui_visual_screenshot_test.dart'
      - '.github/workflows/ui-screenshot-audit.yml'

permissions:
  contents: read

jobs:
  screenshot:
    name: Representative patient surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Render native Flutter golden screenshots
        run: flutter test --dart-define=IAMINA_VISUAL_AUDIT=true --update-goldens --reporter expanded test/ui_visual_screenshot_test.dart

      - name: Validate screenshot artifact set
        run: |
          set -euo pipefail
          DIR="test/ui_audit_output"
          EXPECTED=(
            dashboard-390x844.png
            journal-390x844.png
            summary-390x844.png
            profile-390x844.png
            importer-390x844.png
            document-import-390x844.png
            companion-390x844.png
            add-log-390x844.png
            medications-390x844.png
            reminders-390x844.png
            dashboard-1440x1000.png
            journal-1440x1000.png
            importer-1440x1000.png
            profile-1440x1000.png
          )

          for NAME in "${EXPECTED[@]}"; do
            FILE="$DIR/$NAME"
            test -s "$FILE"
            BYTES="$(stat -c%s "$FILE")"
            if [ "$BYTES" -lt 4000 ]; then
              echo "Capture $NAME is suspiciously small: $BYTES bytes" >&2
              exit 1
            fi
          done

          COUNT="$(find "$DIR" -maxdepth 1 -name '*.png' -type f | wc -l)"
          test "$COUNT" -eq 14

          MOBILE_UNIQUE="$(sha256sum "$DIR"/*-390x844.png | awk '{print $1}' | sort -u | wc -l)"
          if [ "$MOBILE_UNIQUE" -lt 8 ]; then
            echo "Visual audit produced too few distinct mobile renders: $MOBILE_UNIQUE" >&2
            exit 1
          fi

      - name: Upload UI audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamina-ui-visual-audit
          path: frontend/test/ui_audit_output/*.png
          if-no-files-found: warn
          retention-days: 7
