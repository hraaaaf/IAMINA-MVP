name: P2-JOURNAL-8 postmerge closeout

on:
  push:
    branches: [audit/p2-journal-8-postmerge-closeout]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout audit tools
        uses: actions/checkout@v4
        with:
          ref: audit/p2-journal-8-postmerge-closeout
          path: audit-tools

      - name: Checkout verified main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: product

      - name: Patch final ROADMAP
        run: python audit-tools/.github/scripts/p2_journal_8_postmerge_closeout.py product

      - name: Verify and push ROADMAP-only closeout
        working-directory: product
        run: |
          git diff --check
          test "$(git diff --name-only)" = "docs/ROADMAP.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md
          git commit -m 'docs(journal): close P2-JOURNAL-8 after merge'
          git push --force-with-lease=refs/heads/main:a8ff01b9298f49133b3201d72086ade2643a9167 origin HEAD:refs/heads/main
