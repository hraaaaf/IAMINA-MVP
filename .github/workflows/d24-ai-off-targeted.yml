name: D24 AI OFF targeted proof (SQLite + PostgreSQL 16)

on:
  pull_request:
    branches: [main]
    paths:
      - backend/core/tests/test_ai_egress.py
      - backend/core/tests/test_media_consent_api.py
      - .github/workflows/d24-ai-off-targeted.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d24-ai-off-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-off-boundary:
    name: D24 consent/revocation (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-d24-synthetic-only-no-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:postgres@127.0.0.1:5432/iamina_ci' || 'sqlite:///ci-test.db' }}
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: pip install -r requirements.txt
      - name: Verify exact D24 regression test collection
        run: |
          python -m pytest --collect-only -q core/tests/test_ai_egress.py core/tests/test_media_consent_api.py | tee /tmp/d24-collected.txt
          grep -q 'test_d24_global_off_denies_existing_scopes_and_provider_calls' /tmp/d24-collected.txt
          grep -q 'test_d24_reconsent_never_resurrects_revoked_media_grant' /tmp/d24-collected.txt
          grep -q 'test_d24_photo_provider_cannot_start_without_granular_grant' /tmp/d24-collected.txt
          grep -q 'test_d24_open_photo_scope_checks_revocation_before_provider_start' /tmp/d24-collected.txt
          grep -q 'test_d24_photo_grants_are_patient_scoped_and_do_not_cross_a_b_a' /tmp/d24-collected.txt
          grep -q 'test_d24_media_api_a_b_a_withdraw_and_reconsent' /tmp/d24-collected.txt
          grep -q 'test_d24_media_grant_does_not_override_pending_processor_approval' /tmp/d24-collected.txt
      - name: Run full AI egress consent test module
        run: python -m pytest --tb=short -q core/tests/test_ai_egress.py core/tests/test_media_consent_api.py
