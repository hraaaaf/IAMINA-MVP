name: Apply P0-UX-6.4 patch

on:
  push:
    branches: [fix/p0-ux-6-4-rtl-accessibility]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-ux-6-4-rtl-accessibility
          fetch-depth: 0
      - name: Apply isolated RTL and accessibility corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/lib/features/navigation/main_shell.dart')
          text = path.read_text()

          replacements = [
              (
                  "border: Border(right: BorderSide(color: AminaTheme.divider(context))),",
                  "border: BorderDirectional(\n          end: BorderSide(color: AminaTheme.divider(context)),\n        ),",
              ),
              (
                  "  Widget build(BuildContext context) {\n    return Padding(\n      padding: const EdgeInsets.symmetric(horizontal: 8),\n      child: GestureDetector(\n        onTap: () {\n          HapticFeedback.lightImpact();\n          GoRouter.of(context).go('/ajouter');\n        },\n        child: Container(\n          height: 40,",
                  "  Widget build(BuildContext context) {\n    final label = AppLocalizations.of(context)!.addEntry;\n    return Padding(\n      padding: const EdgeInsets.symmetric(horizontal: 8),\n      child: Semantics(\n        button: true,\n        label: label,\n        child: InkWell(\n          onTap: () {\n            HapticFeedback.lightImpact();\n            GoRouter.of(context).go('/ajouter');\n          },\n          borderRadius: BorderRadius.circular(10),\n          child: Container(\n          constraints: const BoxConstraints(minHeight: 44),",
              ),
              (
                  "                const Text(\n                  'Ajouter',\n                  style: TextStyle(",
                  "                Text(\n                  label,\n                  maxLines: 2,\n                  softWrap: true,\n                  style: const TextStyle(",
              ),
              (
                  "          ),\n        ),\n      ),\n    );\n  }\n}\n\nclass _BrandHeader",
                  "          ),\n        ),\n      ),\n    );\n  }\n}\n\nclass _BrandHeader",
              ),
              (
                  "      child: InkWell(\n        onTap: () => _navigate(context),\n        borderRadius: BorderRadius.circular(10),\n        child: AnimatedContainer(\n          duration: const Duration(milliseconds: 160),\n          height: 38,",
                  "      child: Semantics(\n        button: true,\n        selected: selected,\n        label: label,\n        child: InkWell(\n          onTap: () => _navigate(context),\n          borderRadius: BorderRadius.circular(10),\n          child: AnimatedContainer(\n          duration: const Duration(milliseconds: 160),\n          constraints: const BoxConstraints(minHeight: 44),",
              ),
              (
                  "          ),\n        ),\n      ),\n    );\n  }\n\n  void _navigate",
                  "          ),\n        ),\n      ),\n    );\n  }\n\n  void _navigate",
              ),
              (
                  "      child: InkWell(\n        onTap: () async {\n          await context.read<AuthService>().signOut();",
                  "      child: Semantics(\n        button: true,\n        label: AppLocalizations.of(context)!.logout,\n        child: InkWell(\n          onTap: () async {\n          await context.read<AuthService>().signOut();",
              ),
              (
                  "        child: Container(\n          height: 38,",
                  "        child: Container(\n          constraints: const BoxConstraints(minHeight: 44),",
              ),
              (
                  "          ),\n        ),\n      ),\n    );\n  }\n}\n\nclass _UserChip",
                  "          ),\n        ),\n      ),\n    );\n  }\n}\n\nclass _UserChip",
              ),
              (
                  "        labelBehavior: MediaQuery.sizeOf(context).width < 430\n            ? NavigationDestinationLabelBehavior.onlyShowSelected\n            : NavigationDestinationLabelBehavior.alwaysShow,",
                  "        labelBehavior: NavigationDestinationLabelBehavior.alwaysShow,",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source fragment missing: {old[:90]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)

          test = Path('frontend/test/p0_ux_6_4_rtl_accessibility_contract_test.dart')
          test.write_text(r'''import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  final source = File(
    'lib/features/navigation/main_shell.dart',
  ).readAsStringSync();

  test('sidebar uses direction-aware separation', () {
    expect(source, contains('BorderDirectional('));
    expect(source, contains('end: BorderSide('));
    expect(source, isNot(contains('Border(right:')));
  });

  test('compact navigation controls keep accessible names and targets', () {
    expect(source, contains('Semantics('));
    expect(source, contains('button: true'));
    expect(source, contains('selected: selected'));
    expect(source, contains('BoxConstraints(minHeight: 44)'));
  });

  test('mobile navigation labels remain permanently visible', () {
    expect(
      source,
      contains('NavigationDestinationLabelBehavior.alwaysShow'),
    );
    expect(
      source,
      isNot(contains('NavigationDestinationLabelBehavior.onlyShowSelected')),
    );
  });

  test('add action uses localized copy', () {
    expect(source, contains('final label = AppLocalizations.of(context)!.addEntry'));
    expect(source, isNot(contains("'Ajouter'")));
  });
}
''')

          workflow = Path('.github/workflows/p0-ux-6-4-apply.yml')
          workflow.unlink()
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/lib/features/navigation/main_shell.dart \
                  frontend/test/p0_ux_6_4_rtl_accessibility_contract_test.dart \
                  .github/workflows/p0-ux-6-4-apply.yml
          git commit -m "fix(ux): harden RTL navigation accessibility"
          git push origin HEAD:fix/p0-ux-6-4-rtl-accessibility
