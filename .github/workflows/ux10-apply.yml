name: UX10 Apply

"on":
  push:
    branches:
      - "ux/10-dashboard-pixel-convergence"
    paths:
      - ".github/workflows/ux10-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/10-dashboard-pixel-convergence
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: Apply dashboard + navigation integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Wire the mockup-convergent composition only for populated mobile Dashboard.
          p = Path('frontend/lib/features/dashboard/dashboard_screen.dart')
          s = p.read_text()
          part_anchor = "part 'widgets/speed_dial.dart';"
          if "part 'widgets/mobile_convergence.dart';" not in s:
              s = s.replace(part_anchor, part_anchor + "\npart 'widgets/mobile_convergence.dart';")
          scaffold_anchor = """                return Scaffold(\n                  backgroundColor: AminaTheme.bg(context),"""
          mobile = """                if (screenW < 700 &&\n                    !localDataLoading &&\n                    !localDataError &&\n                    logs.isNotEmpty) {\n                  return _DashboardMobileConvergence(\n                    logs: logs,\n                    unit: unit,\n                    low: low,\n                    high: high,\n                    range: _range,\n                    syncService: context.read<SyncService>(),\n                    onRangeChanged: (r) {\n                      setState(() => _range = r);\n                      _fetchAiSummary();\n                    },\n                    onChatTap: _openChat,\n                    summary: _aiSummary,\n                    isLoadingSummary: _isLoadingSummary,\n                  );\n                }\n\n                return Scaffold(\n                  backgroundColor: AminaTheme.bg(context),"""
          if '_DashboardMobileConvergence(' not in s:
              if scaffold_anchor not in s:
                  raise SystemExit('dashboard scaffold anchor missing')
              s = s.replace(scaffold_anchor, mobile, 1)
          p.write_text(s)

          # Fix one unsupported weight token before formatter/analyzer.
          mobile_path = Path('frontend/lib/features/dashboard/widgets/mobile_convergence.dart')
          ms = mobile_path.read_text().replace('FontWeight.w650', 'FontWeight.w600')
          mobile_path.write_text(ms)

          # Replace only the mobile bottom-nav implementation. Desktop sidebar is untouched.
          p = Path('frontend/lib/features/navigation/main_shell.dart')
          s = p.read_text()
          start = s.index('class _BottomNav extends StatelessWidget')
          prefix = s[:start]
          tail = r'''class _BottomNav extends StatelessWidget {
  final List<_NavEntry> entries;
  final int selectedIndex;

  const _BottomNav({required this.entries, required this.selectedIndex});

  _NavEntry? _entry(String route) {
    for (final entry in entries) {
      if (entry.route == route) return entry;
    }
    return null;
  }

  @override
  Widget build(BuildContext context) {
    final dark = AminaTheme.isDark(context);
    final left = <_NavEntry?>[_entry('/dashboard'), _entry('/journal')];
    final right = <_NavEntry?>[_entry('/summary'), _entry('/profile')];
    final surface = dark
        ? AminaTheme.darkCard.withValues(alpha: 0.97)
        : Colors.white.withValues(alpha: 0.97);

    return SafeArea(
      top: false,
      minimum: const EdgeInsetsDirectional.fromSTEB(12, 0, 12, 10),
      child: SizedBox(
        height: 78,
        child: Stack(
          alignment: Alignment.topCenter,
          clipBehavior: Clip.none,
          children: [
            Positioned.fill(
              top: 8,
              child: ClipRRect(
                borderRadius: BorderRadius.circular(25),
                child: BackdropFilter(
                  filter: ImageFilter.blur(sigmaX: 18, sigmaY: 18),
                  child: Container(
                    decoration: BoxDecoration(
                      color: surface,
                      borderRadius: BorderRadius.circular(25),
                      border: Border.all(
                        color: dark
                            ? Colors.white.withValues(alpha: 0.10)
                            : const Color(0xFFE7E8E2),
                      ),
                      boxShadow: [
                        BoxShadow(
                          color: Colors.black.withValues(alpha: dark ? 0.24 : 0.08),
                          blurRadius: 26,
                          offset: const Offset(0, 9),
                        ),
                      ],
                    ),
                    child: Row(
                      children: [
                        for (final entry in left)
                          Expanded(
                            child: entry == null
                                ? const SizedBox.shrink()
                                : _ReferenceNavDestination(entry: entry),
                          ),
                        const SizedBox(width: 66),
                        for (final entry in right)
                          Expanded(
                            child: entry == null
                                ? const SizedBox.shrink()
                                : _ReferenceNavDestination(entry: entry),
                          ),
                      ],
                    ),
                  ),
                ),
              ),
            ),
            Positioned(
              top: 0,
              child: Semantics(
                button: true,
                label: AppLocalizations.of(context)!.addEntry,
                child: Tooltip(
                  message: AppLocalizations.of(context)!.addEntry,
                  child: InkWell(
                    key: const ValueKey('mobile-nav-add'),
                    onTap: () {
                      HapticFeedback.lightImpact();
                      GoRouter.of(context).go('/ajouter');
                    },
                    customBorder: const CircleBorder(),
                    child: Container(
                      width: 60,
                      height: 60,
                      decoration: BoxDecoration(
                        gradient: const LinearGradient(
                          colors: [Color(0xFF07575A), Color(0xFF003E43)],
                          begin: AlignmentDirectional.topStart,
                          end: AlignmentDirectional.bottomEnd,
                        ),
                        shape: BoxShape.circle,
                        border: Border.all(
                          color: dark ? AminaTheme.darkCard : Colors.white,
                          width: 5,
                        ),
                        boxShadow: [
                          BoxShadow(
                            color: const Color(0xFF064D50).withValues(alpha: 0.32),
                            blurRadius: 18,
                            offset: const Offset(0, 8),
                          ),
                        ],
                      ),
                      child: const Icon(
                        Icons.add_rounded,
                        color: Colors.white,
                        size: 29,
                      ),
                    ),
                  ),
                ),
              ),
            ),
          ],
        ),
      ),
    );
  }
}

class _ReferenceNavDestination extends StatelessWidget {
  final _NavEntry entry;

  const _ReferenceNavDestination({required this.entry});

  @override
  Widget build(BuildContext context) {
    final dark = AminaTheme.isDark(context);
    final selected = GoRouterState.of(context).uri.path.startsWith(entry.route);
    final label = entry.label(AppLocalizations.of(context)!);
    final active = dark ? AminaTheme.teal400 : const Color(0xFF0A8765);
    final inactive = dark ? AminaTheme.dark400 : const Color(0xFF78807C);

    return Semantics(
      button: true,
      selected: selected,
      label: label,
      child: InkWell(
        key: ValueKey('mobile-nav-${entry.route}'),
        onTap: () {
          HapticFeedback.selectionClick();
          GoRouter.of(context).go(entry.route);
        },
        borderRadius: BorderRadius.circular(18),
        child: SizedBox(
          height: 68,
          child: Column(
            mainAxisAlignment: MainAxisAlignment.center,
            children: [
              AnimatedScale(
                scale: selected ? 1.06 : 1.0,
                duration: AminaMotion.resolve(context, AminaMotion.navSelection),
                curve: AminaMotion.enter,
                child: Icon(
                  selected ? entry.selectedIcon : entry.icon,
                  color: selected ? active : inactive,
                  size: 20,
                ),
              ),
              const SizedBox(height: 4),
              Text(
                label,
                maxLines: 1,
                overflow: TextOverflow.ellipsis,
                textAlign: TextAlign.center,
                style: TextStyle(
                  fontSize: 9.2,
                  height: 1,
                  fontWeight: selected ? FontWeight.w800 : FontWeight.w600,
                  color: selected ? active : inactive,
                ),
              ),
            ],
          ),
        ),
      ),
    );
  }
}
'''
          p.write_text(prefix + tail)
          PY

          cd frontend
          flutter pub get
          dart format lib/features/dashboard/dashboard_screen.dart lib/features/dashboard/widgets/mobile_convergence.dart lib/features/navigation/main_shell.dart
          flutter analyze --no-fatal-infos
          flutter test --no-pub
          cd ..
          git diff --check

      - name: Commit verified UX10 product changes
        run: |
          git config user.name "hraaaaf"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git rm -f .github/workflows/ux10-apply.yml .github/workflows/ux10-builder-helper.yml || true
          git add frontend/lib/features/dashboard/dashboard_screen.dart frontend/lib/features/dashboard/widgets/mobile_convergence.dart frontend/lib/features/navigation/main_shell.dart
          git commit -m "feat(ux): converge mobile dashboard to reference"
          git push origin HEAD:ux/10-dashboard-pixel-convergence
