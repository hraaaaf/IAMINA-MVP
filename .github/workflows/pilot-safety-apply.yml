name: Apply pilot safety certification

on:
  push:
    branches: [feat/pilot-safety-certification]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pilot-safety-certification
      - name: Apply safety changes and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1. Medical safety: multilingual refusals, broader input detection, recursive output sanitizer.
          replace_once(
              'backend/core/medical_safety.py',
              '''def no_prescription_message(language: str = "fr") -> str:\n    if language == "ar-MA":\n        return (\n            "Ma nqderch nbadel lik traitement, n3ti dosage dial insuline, "\n            "wla n9ol tashkhis. Nqder n3awnk tfham l-ma3loumat dyalk "\n            "w t7dder as2ila l-tabib."\n        )\n    return (\n        "Je ne peux pas prescrire, modifier une dose d'insuline, arreter un traitement, "\n        "ou poser un diagnostic. Je peux t'aider a organiser tes observations "\n        "et preparer les bonnes questions pour ton medecin."\n    )\n''',
              '''def no_prescription_message(language: str = "fr") -> str:\n    if language == "ar-MA":\n        return (\n            "Ma nqderch nbadel lik traitement, n3ti dosage dial insuline, "\n            "wla n9ol tashkhis. Nqder n3awnk tfham l-ma3loumat dyalk "\n            "w t7dder as2ila l-tabib."\n        )\n    if language == "ar":\n        return (\n            "لا يمكنني وصف علاج أو تعديل جرعة الأنسولين أو إيقاف دواء أو تشخيص حالة. "\n            "يمكنني مساعدتك في تنظيم ملاحظاتك وتحضير أسئلة لطبيبك."\n        )\n    if language == "en":\n        return (\n            "I cannot prescribe treatment, change an insulin dose, stop medication, "\n            "or diagnose a condition. I can help organize your observations and "\n            "prepare questions for your clinician."\n        )\n    return (\n        "Je ne peux pas prescrire, modifier une dose d'insuline, arreter un traitement, "\n        "ou poser un diagnostic. Je peux t'aider a organiser tes observations "\n        "et preparer les bonnes questions pour ton medecin."\n    )\n'''
          )

          medical = Path('backend/core/medical_safety.py')
          text = medical.read_text()
          append = r'''

# Additional multilingual output-side prescription patterns. These are defense in
# depth for generated/fallback text; input-side blocking remains authoritative.
_FORBIDDEN_PATTERNS.extend(
    [
        re.compile(
            r"\b(?:increase|decrease|reduce|double|change|adjust|stop)\b.{0,45}"
            r"\b(?:dose|insulin|medication|medicine|treatment)\b",
            re.IGNORECASE,
        ),
        re.compile(
            r"\b(?:take|inject|use)\b.{0,25}\b\d+(?:[.,]\d+)?\s*(?:u|units?)\b",
            re.IGNORECASE,
