        re.compile(r"(?:زد|زِد|نقص|خفف|ضاعف|أوقف|اوقف).{0,30}(?:جرعة|الأنسولين|الانسولين|دواء|العلاج)"),
        re.compile(r"(?:خذ|خد|حقن).{0,20}\d+(?:[.,]\d+)?\s*(?:وحدة|وحدات)"),
        re.compile(
            r"\b(?:zid|n9es|nqes|doubli|7بس|hbes|wa9ef)\b.{0,30}"
            r"\b(?:dose|insulin|insuline|dwa|traitement)\b",
            re.IGNORECASE,
        ),
    ]
)

# English insulin-dose requests are classified as insulin-specific blocks so
# reporting can distinguish them from other treatment-change requests.
_INSULIN_INPUT_PATTERNS.extend(
    [
        re.compile(
            r"\b(?:how much|how many)\b.{0,30}\b(?:insulin|units?)\b",
            re.IGNORECASE,
        ),
        re.compile(
            r"\b(?:what|which)\b.{0,15}\b(?:dose|dosage)\b.{0,25}\binsulin\b",
            re.IGNORECASE,
        ),
        re.compile(
            r"\binsulin\b.{0,30}\b(?:dose|dosage|how much|how many)\b",
