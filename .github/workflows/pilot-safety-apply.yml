    ),
    re.compile(
        r"\b(?:quelle?|combien)\b.{0,25}\b(?:dose|dosage)\b.{0,35}"
        r"\b(?:m[ée]dicament|metformine|traitement)\b",
        re.IGNORECASE,
    ),
    re.compile(r"\bprescri(?:s|re|vez|ption)\b.{0,40}\b(?:moi|traitement|m[ée]dicament|dose)\b", re.IGNORECASE),
    # English treatment/medication changes.
    re.compile(
        r"\bshould i\b.{0,40}\b(?:stop|double|increase|decrease|change|adjust|skip)\b.{0,40}"
        r"\b(?:medication|medicine|treatment|metformin|dose)\b",
        re.IGNORECASE,
    ),
    re.compile(
        r"\b(?:what|which|how much)\b.{0,20}\b(?:dose|dosage)\b.{0,35}"
        r"\b(?:medication|medicine|metformin|treatment)\b",
        re.IGNORECASE,
    ),
    re.compile(r"\bprescribe\b.{0,35}\b(?:medication|medicine|treatment|dose)\b", re.IGNORECASE),
    # Arabic and Darija treatment changes.
    re.compile(r"(?:هل|واش).{0,20}(?:أوقف|اوقف|نوقف|نحبس|أضاعف|اضاعف|نضاعف|نزيد|ننقص).{0,35}(?:الدواء|دواء|العلاج|الجرعة|جرعة)"),
    re.compile(r"(?:ما هي|ماهي|شنو|شحال|كم).{0,20}(?:الجرعة|جرعة).{0,25}(?:الدواء|دواء|الميتفورمين|متفورمين)"),
    re.compile(
        r"\b(?:wach|wash)\b.{0,25}\b(?:n7بس|nhbes|hbes|nwa9ef|nzid|n9es|nqes|ndoubli)\b.{0,35}"
        r"\b(?:dwa|dose|traitement|metformin|metformine)\b",
