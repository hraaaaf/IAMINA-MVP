name: Apply pilot safety certification

on:
  push:
    branches: [feat/pilot-safety-certification]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pilot-safety-certification
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply versioned safety patch
        run: python scripts/apply_pilot_safety.py
      - name: Format touched Python
        run: |
          pip install ruff==0.15.17
          cd backend
          ruff check --fix core/medical_safety.py core/input_safety.py companion/conversation.py ai/api/v1/ai.py ai/api/v1/voice.py diabetes/services/clinical/engine.py core/tests/test_pilot_safety_gate.py diabetes/tests/test_pilot_summary_safety.py
          ruff format core/medical_safety.py core/input_safety.py companion/conversation.py ai/api/v1/ai.py ai/api/v1/voice.py diabetes/services/clinical/engine.py core/tests/test_pilot_safety_gate.py diabetes/tests/test_pilot_summary_safety.py
      - name: Remove temporary application files
        run: |
          rm .github/workflows/pilot-safety-apply.yml
          rm scripts/apply_pilot_safety.py
          rm -f docs/internal/PILOT_SAFETY_TRIGGER.md
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(pilot-safety): enforce deterministic therapeutic refusal"
          git push origin HEAD:feat/pilot-safety-certification
