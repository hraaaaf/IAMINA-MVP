name: W02 F09-C3 OIDC atomic session PG16 isolated

on:
  push:
    branches:
      - test/w02-f09c3-oidc-atomic-tabs-20261107
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w02-f09c3-synthetic
  cancel-in-progress: true

jobs:
  c3-oidc-session:
    name: C3 OIDC JWT, locked CSRF/rotation, two-tab synthetic PG16
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_c3_ephemeral
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_c3_ephemeral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-c3-test-only-synthetic-never-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_c3_ephemeral
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Django PG16 and ruff
        run: python -m pip install -r requirements.txt ruff==0.15.17
      - name: Lint C3 candidate and synthetic test
        run: |
          ruff check core/web_refresh_c3_candidate.py core/tests/test_w02_f09c3_oidc_atomic_tabs.py
          python manage.py makemigrations --check --dry-run
      - name: C3 signed service identity and transaction oracles
        run: python -m pytest -q -ra core/tests/test_w02_f09c3_oidc_atomic_tabs.py
      - name: Regression C2 Node22 sign and Django PG16 controls
        run: python -m pytest -q -ra core/tests/test_w02_f09c2_signed_boundary.py
      - name: C1 always-deny and BFF isolation
        working-directory: .
        run: |
          node --test tools/w02_f09c1_web_refresh_deny_gate.test.js
          node --test tools/w02_f09_web_bff_isolation.test.js
          python scripts/check_web_topology_contract.py
      - name: Full Django PG16 regression on same HEAD
        run: python -m pytest -q --tb=short
