name: MENA C22 PaddleOCR Arabic robustness

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mena-319-c22-arabic-robustness-matrix*
    paths:
      - scripts/run_paddleocr_arabic_robustness_matrix.py
      - .github/workflows/mena-c22-paddleocr-arabic-robustness.yml

permissions:
  contents: read
  issues: write

jobs:
  arabic-robustness:
    name: Arabic OCR typography + numeric preservation matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fonts and local OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.2 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install paddleocr==3.7.0 Pillow>=10.0
      - name: Run C22 robustness matrix
        run: python scripts/run_paddleocr_arabic_robustness_matrix.py --output-dir /tmp/paddleocr-c22
      - name: Upload C22 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mena-c22-paddleocr-${{ github.sha }}
          path: /tmp/paddleocr-c22
          if-no-files-found: warn
          retention-days: 14
      - name: Publish durable C22 result
        if: always()
        uses: actions/github-script@v7
        env:
          C22_STATUS: ${{ job.status }}
        with:
          script: |
            const status = process.env.C22_STATUS.toUpperCase();
            const sha = context.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[MENA C22] ${status} Arabic robustness ${sha.slice(0, 12)}`,
              body: [
                `Arabic OCR typography/numeric robustness evidence.`,
                ``,
                `- SHA: \`${sha}\``,
                `- Result: **${status}**`,
                `- Workflow run: ${runUrl}`,
                `- Profiles: proper RTL/Noto Naskh + generic DejaVu rendering`,
                `- Safety criterion: every critical numeric token must be preserved`,
                `- Patient data: no`,
                `- Real-camera evidence: no`,
                `- Provider API / paid inference: no`,
                ``,
                `Artifact \`mena-c22-paddleocr-${sha}\` contains JSON evidence and synthetic fixtures.`
              ].join('\n')
            });
