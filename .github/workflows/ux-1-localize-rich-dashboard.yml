name: UX-1 localize rich dashboard

on:
  push:
    branches:
      - ux/ux-1-dashboard-rich-locale-parity
    paths:
      - .github/workflows/ux-1-localize-rich-dashboard.yml

permissions:
  contents: write

jobs:
  minimize-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/ux-1-dashboard-rich-locale-parity
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Rebuild product patch from main without formatter churn
        run: |
          git fetch origin main
          git checkout origin/main -- \
            frontend/lib/features/dashboard/widgets/chart_section.dart \
            frontend/lib/features/dashboard/widgets/glucose_chart_with_events.dart \
            frontend/lib/features/dashboard/widgets/hero_insight.dart \
            frontend/lib/features/dashboard/widgets/hero_live.dart \
            frontend/lib/features/dashboard/widgets/insights_section.dart \
            frontend/lib/features/dashboard/widgets/kpi_cv_card.dart \
            frontend/lib/features/dashboard/widgets/kpi_gmi_card.dart \
            frontend/lib/features/dashboard/widgets/recent_entries.dart \
            frontend/lib/l10n/app_ar.arb \
            frontend/lib/l10n/app_en.arb \
            frontend/lib/l10n/app_fr.arb \
            frontend/lib/l10n/app_localizations.dart \
            frontend/lib/l10n/app_localizations_ar.dart \
            frontend/lib/l10n/app_localizations_en.dart \
            frontend/lib/l10n/app_localizations_fr.dart \
            frontend/lib/l10n/audited_page_copy.dart
          rm -f frontend/test/ux_1_dashboard_rich_locale_contract_test.dart
          sed -i "s/_TimeChip(label: '6h',   value: 6/_TimeChip(label: '6h',  value: 6/" frontend/lib/features/dashboard/widgets/glucose_chart_with_events.dart
          sed -i "s/_TimeChip(label: '3h',   value: 3/_TimeChip(label: '3h',  value: 3/" frontend/lib/features/dashboard/widgets/glucose_chart_with_events.dart
          python3 scripts/ux1_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/lib/features/dashboard/widgets/glucose_chart_with_events.dart')
          text = p.read_text()
          marker = 'l10n.dashboardAgpInsufficient'
          pos = text.index(marker)
          start = text.rfind('const SizedBox(', 0, pos)
          if start < 0:
              raise SystemExit('localized AGP empty state const parent not found')
          text = text[:start] + text[start:].replace('const SizedBox(', 'SizedBox(', 1)
          p.write_text(text)
          PY
      - name: Generate localization output
        working-directory: frontend
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Validate minimized patch
        working-directory: frontend
        run: |
          flutter analyze --no-fatal-infos
          flutter test test/ux_1_dashboard_rich_locale_contract_test.dart
          flutter test test/p0_dashboard_responsive_rtl_contract_test.dart test/p0_ux_11_first_use_dashboard_contract_test.dart
      - name: Commit minimized implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/lib frontend/test/ux_1_dashboard_rich_locale_contract_test.dart
          git diff --cached --check
          git commit -m 'chore(ux): minimize dashboard locale parity diff'
          git push origin HEAD:ux/ux-1-dashboard-rich-locale-parity
