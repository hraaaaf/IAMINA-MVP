name: Temporary P2 proactive POST contract sync

on:
  push:
    branches:
      - agent/p2-proactive-insight-lifecycle

permissions:
  contents: write

jobs:
  sync-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: sqlite:///ci-test.db
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-proactive-insight-lifecycle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Align canonical docs
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "docs/ROADMAP.md": (
                  "- protected `GET /api/v1/proactive-insights/` returns at most one evidence-qualified candidate plus an explicit observation-only safety notice;",
                  "- explicit `POST /api/v1/proactive-insights/evaluate/` evaluates and consumes at most one evidence-qualified candidate; safe GET requests cannot consume delivery state or the attention budget;",
              ),
              "docs/SPECS.md": (
                  "- protected `GET /api/v1/proactive-insights/` returns at most one non-urgent evidence-qualified candidate for the authenticated patient and never accepts a client-supplied patient identity;",
                  "- protected `POST /api/v1/proactive-insights/evaluate/` explicitly evaluates and consumes at most one non-urgent evidence-qualified candidate for the authenticated patient; safe GET requests cannot mutate delivery state or consume the attention budget, and the command never accepts a client-supplied patient identity;",
              ),
          }
          for path, (old, new) in replacements.items():
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one anchor in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))
          PY
      - name: Regenerate canonical OpenAPI
        run: python manage.py export_openapi > ../docs/api/openapi.json
      - name: Commit generated contract artifacts
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md docs/SPECS.md docs/api/openapi.json
          git diff --cached --quiet && exit 0
          git commit -m "docs(api): align proactive POST contract"
          git push origin HEAD:agent/p2-proactive-insight-lifecycle
