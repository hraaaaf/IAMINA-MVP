name: Apply P0 mobile import patch

on:
  push:
    branches: [test/p0-ux-mobile-import]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/p0-ux-mobile-import
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Apply scoped patch
        run: python scripts/apply_p0_mobile_import.py

      - name: Format changed Dart files
        working-directory: frontend
        run: dart format lib/features/navigation/main_shell.dart lib/features/import/import_screen.dart lib/features/documents/document_import_screen.dart

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/lib/features/navigation/main_shell.dart frontend/lib/features/import/import_screen.dart frontend/lib/features/documents/document_import_screen.dart
          git commit -m "fix(p0-ux): make mobile document import reachable"
          git push origin HEAD:test/p0-ux-mobile-import
