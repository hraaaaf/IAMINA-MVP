name: FRUG-5 Groq raw prompt-cache probe

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/evaluation/frug5_groq_cache_probe.py"
      - "backend/evaluation/tests/test_frug5_groq_cache_probe.py"
      - "backend/evaluation/fixtures/frug7_groq_text_price.json"
      - "backend/companion/narrator_prompts.py"
      - ".github/workflows/frug5-groq-cache-probe.yml"

permissions:
  contents: read

concurrency:
  group: frug5-groq-cache-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Groq bounded raw prompt-cache probe
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: frug5-cache-nonproduction
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///frug5-cache.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      FRUG5_CACHE_NETWORK_AUTHORIZED: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Validate raw cache probe before network
        run: pytest -q evaluation/tests/test_frug5_groq_cache_probe.py
      - name: Run one bounded raw cache probe
        run: >-
          python -m evaluation.frug5_groq_cache_probe
          --output ../artifacts/frug5-groq-cache-probe.json
      - name: Upload cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frug5-groq-cache-probe
          path: artifacts/frug5-groq-cache-probe.json
          if-no-files-found: warn
          retention-days: 14
