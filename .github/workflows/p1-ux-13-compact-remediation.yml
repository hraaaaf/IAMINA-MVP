name: P1-UX-13 compact consent remediation

on:
  push:
    branches: [fix/p1-ux-13-medical-product-wording]
    paths: [.github/workflows/p1-ux-13-compact-remediation.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-ux-13-medical-product-wording
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Validate compact consent remediation
        working-directory: frontend
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib/features/auth/consent_screen.dart test/p1_ux_13_compact_consent_contract_test.dart
          flutter analyze --no-fatal-infos
          flutter test test/p1_ux_13_wording_contract_test.dart
          flutter test test/p1_ux_13_compact_consent_contract_test.dart
          flutter test test/p0_privacy_truthfulness_contract_test.dart
          flutter test test/p0_ux_9_small_screen_contract_test.dart
      - name: Persist formatting and remove transport
        run: |
          rm .github/workflows/p1-ux-13-compact-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/features/auth/consent_screen.dart frontend/test/p1_ux_13_compact_consent_contract_test.dart .github/workflows/p1-ux-13-compact-remediation.yml
          git commit -m "fix(ux): certify compact consent layout"
          git push origin HEAD:fix/p1-ux-13-medical-product-wording
