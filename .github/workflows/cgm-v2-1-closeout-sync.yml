name: CGM V2.1 closeout sync

on:
  push:
    branches: [docs/cgm-v2-1-closeout]
    paths: ['.github/workflows/cgm-v2-1-closeout-sync.yml']

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/cgm-v2-1-closeout
          fetch-depth: 0
      - name: Update canonical roadmap and closeout evidence
        shell: python
        run: |
          from pathlib import Path

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text()
          old = "| CGM-GW-V2 — Product Wiring | 100% | ✅ Closed | Runtime PR #285 merge `8231be71…`; exact-head CI #2652 + drift #2464 + UI #265 + Chrome #230 green; post-merge CI #2653 + drift #2465 + UI #266 + Chrome #231 green; closeout `docs/assessments/2026-08-16-cgm-gateway-v2-closeout.md`; real-device proof remains a separate external gate |"
          new = old + "\n| CGM-GW-V2.1 — Premium How to use | 100% | ✅ Closed | Runtime PR #294 merge `d6318790…`; exact-head CI #2684 + drift #2496 + UI #289 + Chrome #254 green; post-merge CI #2685 + Chrome #255 green; visual dialog score 9.6/10; FR/EN/AR source-specific guidance for Dexcom, Libre and LinX; real-device proof remains a separate external gate |"
          if new not in text:
              if old not in text:
                  raise SystemExit('CGM V2 roadmap anchor not found')
              text = text.replace(old, new, 1)
          text = text.replace(
              "CGM-GW-V1 is closed for Dexcom/Libre, CGM-GW-V1.1 is closed for explicit LinX provenance through an external Juggluco-to-Nightscout bridge, and CGM-GW-V2 product wiring is closed for authenticated connection/sync/persistence/API/Flutter integration;",
              "CGM-GW-V1 is closed for Dexcom/Libre, CGM-GW-V1.1 is closed for explicit LinX provenance through an external Juggluco-to-Nightscout bridge, CGM-GW-V2 product wiring is closed for authenticated connection/sync/persistence/API/Flutter integration, and CGM-GW-V2.1 premium per-source How-to guidance is closed;",
              1,
          )
          roadmap.write_text(text)

          assessment = Path('docs/assessments/2026-08-17-cgm-v2-1-how-to-use.md')
          a = assessment.read_text()
          closeout = """

## Final certification / closeout
- Runtime PR: #294, merge `d6318790be505b80e21e1c7810c56d373ae64a49`.
- Exact-head gates: CI #2684 SUCCESS; migration drift #2496 SUCCESS; UI screenshot audit #289 SUCCESS; Chrome browser certification #254 SUCCESS.
- Post-merge evidence: CI #2685 SUCCESS; Chrome browser certification #255 SUCCESS. Remaining push UI/drift are governed permanent gates and are not bypassed by this record.
- Final 390×844 dialog visual score: **9.6/10**. Three steps, safety disclosure and Configure CTA are fully visible without initial scrolling or overflow.
- Scope ceiling preserved: no backend, persistence, credential or treatment-authority change. Live physical-sensor/provider proof remains a separate external gate.
- Status: **CGM-GW-V2.1 CLOSED** after runtime merge and post-merge certification evidence above.
"""
          if '## Final certification / closeout' not in a:
              assessment.write_text(a.rstrip() + closeout)
      - name: Remove temporary helper and commit closeout
        run: |
          rm .github/workflows/cgm-v2-1-closeout-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md docs/assessments/2026-08-17-cgm-v2-1-how-to-use.md .github/workflows/cgm-v2-1-closeout-sync.yml
          git commit -m "docs(cgm): close V2.1 premium how-to"
          git push origin HEAD:docs/cgm-v2-1-closeout
