name: Ruff Autofix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  ruff-autofix:
    if: github.head_ref == 'fix/p0-api-safety-boundaries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff==0.15.17
      - name: Apply deterministic Ruff fixes
        run: |
          cd backend
          ruff check . --fix --unsafe-fixes
      - name: Commit fixes if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "chore: apply ruff autofixes"
          git push origin HEAD:${{ github.head_ref }}
