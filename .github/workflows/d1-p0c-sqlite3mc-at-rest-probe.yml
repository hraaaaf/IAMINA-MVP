name: D1 P0-C SQLite3MC physical at-rest probe (NO DEPLOY)

on:
  push:
    branches: [research/d1-p0c-sqlite3mc-at-rest-web-20261111]
    paths:
      - 'frontend/lib/ui_d1_p0c_sqlite3mc_at_rest_probe_main.dart'
      - 'tools/d1_p0c_sqlite3mc_at_rest_browser.js'
      - '.github/workflows/d1-p0c-sqlite3mc-at-rest-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-at-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Fetch SHA-pinned SQLite3MultipleCiphers module (CI-only)
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/simolus3/drift/releases/download/drift-2.35.4/sqlite3mc.wasm \
            --output web/sqlite3mc.wasm
          printf '%s  %s\n' \
            '408a1d9bf8071bfb6e91aba005e6c8e2072c240784e1d199bbd7eb441dd5ea94' \
            web/sqlite3mc.wasm | sha256sum --check
          bash scripts/verify_drift_web_assets.sh verify
          git diff --exit-code -- pubspec.yaml pubspec.lock web/sqlite3.wasm web/drift_worker.js
      - name: Static analysis and compile isolated fake-data probe
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos lib/ui_d1_p0c_sqlite3mc_at_rest_probe_main.dart
          flutter build web --release --no-web-resources-cdn \
            -t lib/ui_d1_p0c_sqlite3mc_at_rest_probe_main.dart
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Assert ciphertext vs raw plaintext control in physical IndexedDB
        env:
          D1_BROWSER: ${{ matrix.browser }}
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/d1_p0c_sqlite3mc_at_rest_browser.js
          python3 -m http.server 7398 --bind 127.0.0.1 \
            --directory frontend/build/web >/tmp/d1p0c-sqlite3mc-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:7398/ >/dev/null
          node tools/d1_p0c_sqlite3mc_at_rest_browser.js
      - name: Preserve synthetic proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-p0c-sqlite3mc-${{ matrix.browser }}
          path: d1-p0c-*-at-rest-proof.json
          retention-days: 14
          if-no-files-found: warn
