name: W02 F09-C4 unmounted BFF Django HTTP PG16 contract

on:
  push:
    branches:
      - test/w02-f09c4-web-http-adapter-20261107
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w02-f09c4-synthetic
  cancel-in-progress: true

jobs:
  c4-synthetic-http:
    name: Node22 BFF to Django RequestFactory PG16 (no route activation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_c4_ephemeral
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_c4_ephemeral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-c4-test-only-synthetic-never-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_c4_ephemeral
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FIREBASE_CREDENTIALS_PATH: ""
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Django PostgreSQL and Ruff
        run: python -m pip install -r requirements.txt ruff==0.15.17
      - name: Lint adapter and exact schema
        run: |
          ruff check core/web_refresh_c4_http_candidate.py core/web_refresh_c3_candidate.py core/tests/test_w02_f09c4_http_adapter_pg.py core/tests/test_w02_f09c3_oidc_atomic_tabs.py
          node --check ../frontend/api/w02_f09c4_prepare.js
          node --check ../tools/w02_f09c4_signed_http_adapter.test.js
          python manage.py makemigrations --check --dry-run
      - name: Node22 BFF candidate and unchanged deny-only route
        working-directory: .
        run: |
          node --test tools/w02_f09c4_signed_http_adapter.test.js
          node --test tools/w02_f09c1_web_refresh_deny_gate.test.js
          node --test tools/w02_f09_web_bff_isolation.test.js
          python scripts/check_web_topology_contract.py
      - name: Django HTTP request adapter, signed Node22, PostgreSQL16 concurrency
        run: python -m pytest -q -ra core/tests/test_w02_f09c4_http_adapter_pg.py
      - name: C3 OIDC family, C2 signer regressions
        run: python -m pytest -q -ra core/tests/test_w02_f09c3_oidc_atomic_tabs.py core/tests/test_w02_f09c2_signed_boundary.py
      - name: Full Django PostgreSQL16 regression on same commit
        run: python -m pytest -q --tb=short
