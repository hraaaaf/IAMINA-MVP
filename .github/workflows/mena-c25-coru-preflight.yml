name: MENA C25 CORU preflight

on:
  pull_request:
    paths:
      - ".github/workflows/mena-c25-coru-preflight.yml"
      - "backend/evaluation/coru_dataset_preflight.py"
      - "backend/evaluation/fixtures/c25_coru_source.json"
      - "scripts/run_coru_receipt_preflight.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coru-receipt-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve pinned public metadata source
        id: source
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          source = json.loads(Path("backend/evaluation/fixtures/c25_coru_source.json").read_text())
          print(f"url={source['source_url']}")
          PY
      - name: Download CORU receipt metadata only
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output /tmp/coru-test.json \
            "${{ steps.source.outputs.url }}"
      - name: Run privacy-safe schema preflight
        run: |
          python scripts/run_coru_receipt_preflight.py /tmp/coru-test.json \
            --output c25-coru-preflight.json
      - name: Upload structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mena-c25-coru-preflight
          path: c25-coru-preflight.json
          if-no-files-found: error
