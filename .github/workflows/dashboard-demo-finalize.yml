name: IAMINA dashboard demo finalize

on:
  push:
    branches:
      - audit/dashboard-demo-mobile-20260909
    paths:
      - '.github/workflows/dashboard-demo-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/dashboard-demo-mobile-20260909
          fetch-depth: 0

      - name: Move future-reading guard into seed source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/lib/data/drift/database.dart')
          text = p.read_text()
          marker = "          // Demo data must never fabricate readings in the future.\n          if (loggedAt.isAfter(now)) continue;\n"
          if marker not in text:
              anchor = "          final loggedAt = DateTime("
              start = text.find(anchor)
              if start < 0:
                  raise SystemExit('loggedAt construction not found')
              insert_anchor = "          await into(logEntries).insert("
              insert_at = text.find(insert_anchor, start)
              if insert_at < 0:
                  raise SystemExit('seed insert call not found')
              guard = (
                  "          // Demo data must never fabricate readings in the future.\n"
                  "          if (loggedAt.isAfter(now)) continue;\n\n"
              )
              text = text[:insert_at] + guard + text[insert_at:]
              p.write_text(text)
          PY
          git diff --check

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Format and validate frontend
        working-directory: frontend
        run: |
          dart format lib/data/drift/database.dart
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test --no-pub

      - name: Commit validated product fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/lib/data/drift/database.dart
          git diff --cached --check
          git commit -m 'fix: prevent future readings in demo seed'
          git push origin HEAD:audit/dashboard-demo-mobile-20260909
