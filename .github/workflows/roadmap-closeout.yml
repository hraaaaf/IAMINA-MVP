name: Roadmap closeout

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-media-consent-api
      - name: Update canonical roadmap
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/ROADMAP.md")
          text = path.read_text()
          text = text.replace(
              "> **Last updated:** 2026-07-26 — P0-MENA-1B semantic DLP merged; P0-MENA-1C granular raw-media consent in final validation.",
              "> **Last updated:** 2026-07-26 — P0-MENA-1C granular raw-media consent merged; P0-MENA-1D patient consent-management API in final validation.",
          )
          old = """## 🟡 P0-MENA-1C — Granular raw-media consent — IN VALIDATION

Implementation PR: #12, branch `fix/p0-mena-granular-media-consent`.

- global AI consent remains a mandatory baseline;
- raw audio, image and document egress additionally require an active exact patient + purpose + modality grant;
- historical global consent is deliberately not converted into media authorization;
- grants are unique, revocable and checked immediately before real egress;
- one purpose cannot authorize another purpose and one modality cannot authorize another modality;
- tests prove fail-closed behavior, purpose isolation, modality isolation and immediate revocation;
- migration drift and the first complete SQLite/PostgreSQL CI run are green.

**Status rule:** this LOT is not complete until the final documentation commit passes repository CI and PR #12 is merged.

**Operational boundary:** backend enforcement is implemented. A patient-facing grant/revoke workflow remains required before raw-media features can be enabled for real patients.
"""
          new = """## ✅ P0-MENA-1C — Granular raw-media consent — MERGED

Closed in PR #12 after green SQLite, PostgreSQL, OpenAPI, security, Flutter and migration-drift gates.

- global AI consent remains a mandatory baseline;
- raw audio, image and document egress additionally require an active exact patient + purpose + modality grant;
- historical global consent is deliberately not converted into media authorization;
- grants are unique, revocable and checked immediately before real egress;
- one purpose cannot authorize another purpose and one modality cannot authorize another modality;
- tests prove fail-closed behavior, purpose isolation, modality isolation and immediate revocation.

## 🟡 P0-MENA-1D — Patient media-consent management API — IN VALIDATION

Implementation PR: #13, branch `feat/p0-mena-media-consent-api`.

- authenticated patients can list every supported raw-media purpose/modality option and its active or revoked state;
- grant and revoke operations derive ownership only from `request.user` and accept no client-supplied patient identifier;
- grants require active global AI consent and remain idempotent;
- revocation is immediate and idempotent;
- unsupported purpose/modality pairs fail closed;
- the generated OpenAPI contract and ownership/isolation regression tests are included.

**Status rule:** this LOT is not complete until the final SHA passes repository CI and PR #13 is merged.
"""
          if old not in text:
              raise SystemExit("Expected P0-MENA-1C roadmap block not found")
          text = text.replace(old, new)
          text = text.replace(
              "- [ ] Introduce purpose/modality-granular media consent for raw audio/images/documents. **Implementation and first CI complete; awaiting final CI + merge.**",
              "- [x] Introduce purpose/modality-granular media consent for raw audio/images/documents.",
          )
          text = text.replace(
              "- [ ] Expose an authenticated patient-facing grant/revoke workflow before enabling raw-media features for real patients.",
              "- [ ] Expose an authenticated patient-facing grant/revoke workflow before enabling raw-media features for real patients. **API implementation complete; awaiting final CI + merge.**",
          )
          text = text.replace(
              "- [ ] Granular raw-media consent workflow exposed to patients; backend enforcement is in PR #12.",
              "- [ ] Granular raw-media consent workflow exposed to patients; backend enforcement is merged and the authenticated API is in PR #13.",
          )
          path.write_text(text)
          PY
      - name: Commit roadmap
        run: |
          if git diff --quiet -- docs/ROADMAP.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          git commit -m "docs: close granular consent and track patient workflow"
          git push origin HEAD:feat/p0-mena-media-consent-api
