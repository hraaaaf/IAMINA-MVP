name: Secret history preflight

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  history-secret-preflight:
    name: Secret hygiene — all reachable Git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify checkout is complete
        run: |
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git rev-list --all --count

      - name: Scan tracked files
        run: python scripts/check_secrets.py

      - name: Scan all reachable historical blobs
        run: python scripts/audit_git_history_secrets.py
