name: Secret history preflight

on:
  pull_request:
    paths:
      - ".github/workflows/secret-history-preflight.yml"
      - "scripts/audit_git_history_secrets.py"
      - "backend/core/tests/test_git_history_secret_audit.py"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-secret-preflight:
    name: Secret hygiene — all reachable Git history
    runs-on: ubuntu-latest
    # Timeouts FAIL the secret scan; they never mark it as passed or bypass it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify checkout is complete
        run: |
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git rev-list --all --count

      - name: Scan tracked files
        run: python scripts/check_secrets.py

      - name: Scan all reachable historical blobs
        run: python scripts/audit_git_history_secrets.py
