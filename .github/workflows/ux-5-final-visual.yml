name: UX-5 final visual

on:
  push:
    branches:
      - audit/ux-5-final-e3a5b1c
    paths:
      - .github/workflows/ux-5-final-visual.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3a5b1c21a5f85cb79227229b439d832e46953d8
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Build exact UX-5 head
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --dart-define=IAMINA_AUDIT_ACCESS=true
      - name: Install capture runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve
        run: |
          nohup python3 -m http.server 8080 --directory frontend/build/web >/tmp/ux5-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ux5-server.log
          exit 1
      - name: Capture FR/AR mobile and small selected states
        run: |
          mkdir -p ux5-visual
          cat > /tmp/capture-ux5.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({headless: true});
            const matrix = [
              {name:'mobile', width:390, height:844},
              {name:'small', width:360, height:560},
            ];
            const locales = [
              {name:'fr', locale:'fr-FR'},
              {name:'ar', locale:'ar-MA'},
            ];
            const routes = ['dashboard', 'journal'];
            const report = [];

            for (const viewport of matrix) {
              for (const lang of locales) {
                for (const route of routes) {
                  const context = await browser.newContext({
                    viewport: {width: viewport.width, height: viewport.height},
                    locale: lang.locale,
                    timezoneId: 'Africa/Casablanca',
                    deviceScaleFactor: 1,
                  });
                  const page = await context.newPage();
                  const pageErrors = [];
                  page.on('pageerror', error => pageErrors.push(String(error)));
                  const url = `http://127.0.0.1:8080/?audit=visual-cert&lang=${lang.name}#/${route}`;
                  await page.goto(url, {waitUntil:'networkidle', timeout:90000});
                  await page.waitForTimeout(5000);
                  const flutterViews = await page.locator('flutter-view').count();
                  if (flutterViews !== 1) {
                    throw new Error(`${viewport.name}-${lang.name}-${route}: expected 1 flutter-view, got ${flutterViews}`);
                  }
                  if (pageErrors.length) {
                    throw new Error(`${viewport.name}-${lang.name}-${route}: page errors: ${pageErrors.join(' | ')}`);
                  }
                  const filename = `ux5-visual/${viewport.name}-${lang.name}__${route}.png`;
                  await page.screenshot({path: filename, fullPage: false});
                  report.push({
                    viewport: viewport.name,
                    width: viewport.width,
                    height: viewport.height,
                    lang: lang.name,
                    route,
                    url,
                    flutterViews,
                    pageErrors,
                    filename,
                  });
                  await context.close();
                }
              }
            }
            fs.writeFileSync('ux5-visual/report.json', JSON.stringify(report, null, 2));
            fs.writeFileSync('ux5-visual/source-sha.txt', 'e3a5b1c21a5f85cb79227229b439d832e46953d8\n');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node /tmp/capture-ux5.js
      - uses: actions/upload-artifact@v4
        with:
          name: ux-5-final-visual
          path: ux5-visual
          if-no-files-found: error
          retention-days: 14
