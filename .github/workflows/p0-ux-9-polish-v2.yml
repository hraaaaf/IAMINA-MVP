name: P0-UX-9 polish v2

on:
  push:
    branches:
      - fix/p0-ux-9-small-screen
    paths:
      - .github/workflows/p0-ux-9-polish-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-ux-9-small-screen
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - name: Apply patch
        run: python3 .github/scripts/p0_ux_9_polish.py
      - name: Validate targeted contracts
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test --no-pub test/p0_ux_9_small_screen_contract_test.dart test/p0_ux_7_desktop_tablet_contract_test.dart test/p0_audited_page_localization_contract_test.dart
      - name: Commit clean product diff
        run: |
          git rm .github/workflows/p0-ux-9-polish-apply.yml
          git rm .github/workflows/p0-ux-9-polish-v2.yml
          git rm .github/scripts/p0_ux_9_polish.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/lib/features/dashboard/dashboard_screen.dart frontend/lib/features/journal/ai_summary_screen.dart frontend/lib/features/profile/profile_screen.dart frontend/lib/l10n/app_ar.arb frontend/lib/l10n/app_localizations_ar.dart frontend/test/p0_ux_9_small_screen_contract_test.dart
          git commit -m 'fix(ux): polish 360x560 flows after visual audit'
          git push origin HEAD:fix/p0-ux-9-small-screen
