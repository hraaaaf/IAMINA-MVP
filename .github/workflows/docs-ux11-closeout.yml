name: UX-11 docs closeout

on:
  push:
    branches:
      - docs/ux11-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ux11-closeout
          fetch-depth: 0

      - name: Update canonical docs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"missing {label} in {path}")
              path.write_text(text.replace(old, new, 1))

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text()
          old = '> **Last updated:** 2026-08-11 — UX visual rebase is closed through UX-10: UX-10 rebuilt the populated mobile Dashboard against the approved reference at 9.3/10; PR #104 merged as `72cac1bf16608c6c23878718a0458c874fa34a70` and post-merge CI #1577 + drift #1389 are green.'
          new = '> **Last updated:** 2026-08-12 — UX visual rebase is closed through UX-11: Dashboard action + visual parity reached **9.8/10** against the approved reference; PR #110 merged as `8e45474ba5fab607783fa07750a268592b76875a` and post-merge CI #1704 + drift #1516 are green.'
          if old not in text:
              raise SystemExit('missing ROADMAP last-updated marker')
          text = text.replace(old, new, 1)

          old = '| UX visual rebase | 100% | ✅ Closed | UX-0–9 remain closed; UX-10 PR #104 rebuilt the populated mobile Dashboard against the approved reference at **9.3/10** (merge `72cac1bf16608c6c23878718a0458c874fa34a70`); post-merge CI #1577 + drift #1389 green |'
          new = '| UX visual rebase | 100% | ✅ Closed | UX-0–10 remain closed; UX-11 PR #110 aligned real Dashboard actions and the populated mobile composition with the approved reference at **9.8/10** (merge `8e45474ba5fab607783fa07750a268592b76875a`); post-merge CI #1704 + drift #1516 green |'
          if old not in text:
              raise SystemExit('missing ROADMAP UX rebase row')
          text = text.replace(old, new, 1)

          anchor = '**UX-10 closeout:** PR #104 rebuilt the populated mobile Dashboard around the approved visual reference while preserving real persisted data, deterministic/fail-closed metrics, five real navigation destinations, routes, persistence, consent, clinical logic and AI safety boundaries. The converged mobile composition uses the warm ivory canvas, identity-led header, dark-teal current-glucose hero with real sparkline/target state, Trends & Insights surface, real quick actions and a central Add action that no longer overlaps RTL destination hit targets. Fresh rendered audit run `31501264153` succeeded with artifact `9105255166`, digest `sha256:d3421c07811b3781f89d5659c5d84cfe67e69d121c53d776e53b92846ced5cec`, FR/AR 390×844 and 360×560 plus FR 1440×1000 captures, exactly one `flutter-view`, zero page errors and Product/UX **9.3/10** against the approved reference. Exact product head `9be1eef14e7c841e69fe5b2e7e97d62e76bc3c22` passed CI #1575 / run `31501897197` and migration drift #1387 / run `31501897201`; PR #104 merged as `72cac1bf16608c6c23878718a0458c874fa34a70`; post-merge CI #1577 / run `31502163598` and migration drift #1389 / run `31502163579` both passed. **UX-10 is 100% closed.** This UX work does not change the MENA critical-path numerator.'
          addition = anchor + '\n\n**UX-11 closeout:** PR #110 completed action parity as well as the final visual convergence of the populated mobile Dashboard. Quick actions are now exactly **Journal · Alimentation · Activité · Médicaments · Rappels** and map to real destinations/capture flows; mobile bottom navigation is exactly **Accueil · Mesures · + · Rapports · Profil**. Meal/activity actions pre-focus existing truthful capture surfaces without fabricating state; medication events and in-app reminders are real Drift-backed local features; the calendar control is a real date selector; the reminder bell does not fabricate unread state; Import remains reachable outside the parity bottom-nav. Drift schema v10 adds `medication_events` and `reminders`. Final populated render audit run `31545347918` succeeded with FR/AR 390×844 and 360×560 captures, one `flutter-view`, zero page errors and structural visual parity **9.8/10** against the approved reference while deliberately excluding fabricated mockup clinical content. Exact PR head `c6eb0713feda6f1781b2fba130259df8ed2e2b5f` passed CI #1703 / run `31545978539` and migration drift #1515 / run `31545978553`; PR #110 merged as `8e45474ba5fab607783fa07750a268592b76875a`; post-merge CI #1704 / run `31546184632` and migration drift #1516 / run `31546184633` both passed. Issue #109 is closed completed. **UX-11 is 100% closed and CERTIFIED.** This UX work does not change the MENA critical-path numerator.'
          if anchor not in text:
              raise SystemExit('missing ROADMAP UX-10 anchor')
          text = text.replace(anchor, addition, 1)
          roadmap.write_text(text)

          specs = Path('docs/SPECS.md')
          text = specs.read_text()
          old = '- document/import and image/audio-assisted flows where currently wired.\n\n### Metabolic-event logging contract'
          new = '''- document/import and image/audio-assisted flows where currently wired;\n- persisted local medication-event logging;\n- persisted in-app reminders;\n- approved mobile Dashboard quick actions and bottom navigation with real destinations.\n\n### Mobile Dashboard action-parity contract\n\nThe populated mobile Dashboard follows the approved UX-11 information architecture without inventing patient state or product capability.\n\nCurrent invariants:\n\n- quick actions are **Journal / Alimentation / Activité / Médicaments / Rappels**;\n- Journal opens the real history surface; Alimentation and Activité open the existing add-entry flow already focused on the relevant truthful capture context, without silently asserting that a meal/activity occurred;\n- Médicaments records only user-entered medication-event facts and must not recommend, calculate or optimize a treatment or dose;\n- Rappels is a real Drift-backed in-app reminder list; system notification delivery is not claimed when no operating-system notification integration is enabled;\n- the mobile bottom navigation is **Accueil / Mesures / + / Rapports / Profil**; Import remains reachable elsewhere rather than masquerading as one of those destinations;\n- the Dashboard calendar control is a real date selector that changes the anchored data window;\n- the reminder bell must not display a fabricated unread badge;\n- FR/EN/AR and RTL behavior remain required, including >=48 px interactive targets for primary navigation actions;\n- visual parity must never be achieved by copying fabricated clinical values, causal claims, praise or treatment/exercise advice from a design reference.\n\nDrift schema v10 adds `medication_events` and `reminders`; these local tables hold user-entered events/reminders and do not create new clinical authority.\n\n### Metabolic-event logging contract'''
          if old not in text:
              raise SystemExit('missing SPECS client capability anchor')
          specs.write_text(text.replace(old, new, 1))

          arch = Path('docs/architecture/ARCHITECTURE.md')
          text = arch.read_text()
          old = '''- diabetes logging and journal;\n- dashboard/analytics presentation;\n- companion conversation UI;\n- offline-first Drift persistence and sync;\n- locale/script/RTL presentation;'''
          new = '''- diabetes logging and journal;\n- dashboard/analytics presentation;\n- truthful mobile Dashboard action routing;\n- local medication-event and in-app reminder persistence in Drift v10;\n- companion conversation UI;\n- offline-first Drift persistence and sync;\n- locale/script/RTL presentation;'''
          if old not in text:
              raise SystemExit('missing ARCH responsibilities anchor')
          text = text.replace(old, new, 1)
          old = '''- Flutter is the only product frontend.\n- No business-critical safety rule may exist only in the client.\n- Location may suggest locale settings but must not silently choose clinical/safety behavior.'''
          new = '''- Flutter is the only product frontend.\n- No business-critical safety rule may exist only in the client.\n- Medication-event capture is patient-entered historical data, not prescribing/dose authority.\n- In-app reminder persistence must not be presented as operating-system notification delivery unless that integration is actually enabled.\n- Mockup parity must not introduce fabricated patient data, unread-notification state or unsupported clinical capability.\n- Location may suggest locale settings but must not silently choose clinical/safety behavior.'''
          if old not in text:
              raise SystemExit('missing ARCH Flutter rules anchor')
          arch.write_text(text.replace(old, new, 1))
          PY

      - name: Commit documentation closeout
        run: |
          if git diff --quiet; then
            echo "No documentation changes produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md docs/SPECS.md docs/architecture/ARCHITECTURE.md
          git commit -m "docs(ux): close UX-11 in canonical docs"
          git push origin HEAD:docs/ux11-closeout
