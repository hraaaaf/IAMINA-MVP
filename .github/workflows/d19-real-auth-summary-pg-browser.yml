name: D19 real native Django auth summary Web PG16 synthetic
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/lib/ui_d19_real_auth_summary_pg_main.dart'
      - 'tools/d19_real_auth_summary_pg_browser_check.js'
      - '.github/workflows/d19-real-auth-summary-pg-browser.yml'
      - 'backend/ai/api/v1/ai.py'
      - 'backend/diabetes/api/v1/kpis.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-d19-auth-http:
    name: Real Flutter Web + native Django auth + PG16 + A-B-A
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_d19_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_d19_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-d19-web-ephemeral-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:7383
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_d19_ci
      FIREBASE_CREDENTIALS_PATH: ""
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Create disposable masked native credentials
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,secrets
          v={'D19_CI_A':'d19-ci-a@example.invalid','D19_CI_B':'d19-ci-b@example.invalid',
             'D19_CI_PASS':secrets.token_urlsafe(30)+'_A1!'}
          with open(os.path.join(os.environ['RUNNER_TEMP'],'d19-credentials.json'),'w') as f:json.dump(v,f)
          print('::add-mask::'+v['D19_CI_PASS'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for k,x in v.items(): f.write(k+'='+x+'\n')
          PY
      - name: Install isolated Django backend
        run: python3 -m pip install -r backend/requirements.txt
      - name: Create PG16 schema, fake A/B profiles and distinct manual logs
        working-directory: backend
        run: |
          set -euo pipefail
          python manage.py migrate --noinput
          python3 - <<'PY'
          import os,django
          django.setup()
          from datetime import date,timedelta
          from django.utils import timezone
          from django.contrib.auth.models import User
          from core.models import BasePatientProfile
          from diabetes.models import DiabetesProfile,LogEntry
          for env_name,glucose in (('D19_CI_A',95.0),('D19_CI_B',210.0)):
              email=os.environ[env_name]
              user=User.objects.create_user(username=email,email=email,password=os.environ['D19_CI_PASS'])
              base=BasePatientProfile.objects.create(patient=user,date_of_birth=date(1980,1,1))
              DiabetesProfile.objects.create(base_profile=base,diabetes_type='type2',treatment_type='oral_meds')
              for n in range(7):
                  LogEntry.objects.create(patient=user,blood_sugar=glucose,source='manual',logged_at=timezone.now()-timedelta(hours=n))
          assert User.objects.count()==2
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile true Flutter AuthService + real ApiClient + AISummaryScreen
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos lib/ui_d19_real_auth_summary_pg_main.dart
          flutter build web --release --no-web-resources-cdn \
            -t lib/ui_d19_real_auth_summary_pg_main.dart \
            --dart-define=API_BASE_URL=http://127.0.0.1:8000 \
            --dart-define-from-file="$RUNNER_TEMP/d19-credentials.json"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Run browser A-B-A real Django PG authentication and clinical screen
        run: |
          set -euo pipefail
          (cd backend && python - <<'PY'
          import os,django
          django.setup()
          # CI ONLY: no actual provider egress, HTTP + Flutter + auth are real.
          import ai.api.v1.ai as mod
          mod._call_llm_for_summary = lambda *args, **kwargs: []
          from django.core.management import execute_from_command_line
          execute_from_command_line(['manage.py','runserver','127.0.0.1:8000','--noreload'])
          PY
          ) > /tmp/d19-real-api.log 2>&1 &
          API_PID=$!
          python3 -m http.server 7383 --bind 127.0.0.1 --directory frontend/build/web > /tmp/d19-real-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" "$API_PID" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/api/v1/health > /dev/null
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:7383/ > /dev/null
          node tools/d19_real_auth_summary_pg_browser_check.js
      - name: Upload synthetic-only browser report/screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d19-real-django-pg-native-auth-summary-web
          path: d19-real-auth-web-proof/*
          if-no-files-found: warn
          retention-days: 7
