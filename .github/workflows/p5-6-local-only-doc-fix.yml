name: P5-6 local-only audit doc correction

on:
  push:
    branches:
      - docs/p5-6-local-only-audit-contract-20260913

permissions:
  contents: write

jobs:
  correct-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p5-6-local-only-audit-contract-20260913
          fetch-depth: 0

      - name: Correct release-scoped consent audit contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          gate = Path('docs/P5_6_REAL_PATIENT_RELEASE_GATE.md')
          text = gate.read_text()
          old = """## Exact-SHA release audit contract

```bash
python manage.py audit_pilot_consent_governance \\
  --require-approved \\
  --expected-source-commit-sha 5b27a22fc5c05a06e7eeeb0e841bb0e7dadce7f6
"""
          new = """## Exact-SHA release audit contract

The frozen P5-6 release scope is **local-only for external AI egress**: every network provider remains runtime-denied by the processor policy. The consent audit must therefore use `--local-only`; this scopes out disabled network-provider evidence but deliberately keeps the global CNDP health-processing authorization blocker fail-closed.

```bash
python manage.py audit_pilot_consent_governance \\
  --local-only \\
  --require-approved \\
  --expected-source-commit-sha 5b27a22fc5c05a06e7eeeb0e841bb0e7dadce7f6
"""
          if text.count(old) != 1:
              raise SystemExit(f'gate replacement count={text.count(old)}')
          gate.write_text(text.replace(old, new))

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text()
          old = "python manage.py audit_pilot_consent_governance --require-approved --expected-source-commit-sha 5b27a22fc5c05a06e7eeeb0e841bb0e7dadce7f6"
          new = "python manage.py audit_pilot_consent_governance --local-only --require-approved --expected-source-commit-sha 5b27a22fc5c05a06e7eeeb0e841bb0e7dadce7f6"
          if text.count(old) != 1:
              raise SystemExit(f'roadmap replacement count={text.count(old)}')
          text = text.replace(old, new)
          marker = "Public provider or regulatory documentation may establish requirements but is not account/deployment-specific approval evidence."
          addition = marker + "\n\nThe current frozen pilot scope enables no external AI processor. `--local-only` is therefore mandatory for the consent audit; it does not waive the global CNDP health-processing authorization gate."
          if text.count(marker) != 1:
              raise SystemExit(f'roadmap marker count={text.count(marker)}')
          roadmap.write_text(text.replace(marker, addition))
          PY

          rm .github/workflows/p5-6-local-only-doc-fix.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/P5_6_REAL_PATIENT_RELEASE_GATE.md docs/ROADMAP.md .github/workflows/p5-6-local-only-doc-fix.yml
          git diff --cached --check
          git commit -m 'docs(p5-6): scope consent audit to local-only release'
          git push origin HEAD:docs/p5-6-local-only-audit-contract-20260913
