name: Governance roadmap finalize

on:
  push:
    branches:
      - chore/governance-agent-team
    paths:
      - .github/workflows/governance-roadmap-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/governance-agent-team
          fetch-depth: 0
      - name: Update roadmap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ROADMAP.md')
          s = p.read_text()
          s = s.replace(
              '> **Last updated:** 2026-08-08 — P0-UX-11 first-use Dashboard certified at 9.3/10 after rejecting the baseline and a first post-patch small-screen pass; P1-UX-12 progressive Profile is next.',
              '> **Last updated:** 2026-08-08 — agent governance protocol established through PR #63; P1-UX-12 progressive Profile remains the next product LOT.',
              1,
          )
          marker = '| P0 product truthfulness | 100% | ✅ Closed | PRs #39–#43; five executable UX truthfulness contracts |\n'
          row = '| P0 agent governance | 100% | ✅ Ready for certification | PR #63; Builder → Reviewer → Release Certifier protocol, 6 role briefs and 6 reusable skills |\n'
          if row not in s:
              s = s.replace(marker, marker + row, 1)
          ledger_marker = '## ✅ P0 product truthfulness\n'
          block = '''## ✅ P0 agent governance\n\n- `AGENTS.md`, `CLAUDE.md` and `docs/CONTRIBUTING.md` require a Builder → applicable Reviewer(s) → Release Certifier chain for every future roadmap LOT, P-level remediation, hotfix and governance change.\n- Six role briefs live under `.agents/`; six reusable procedures live under `.skills/`.\n- Reviewer routing is explicit by change surface; the Builder may not self-certify.\n- Exact-head evidence becomes stale when code or canonical documentation changes and must be rerun.\n- Expected-head merge locking and post-merge CI + migration drift are required before a LOT can be declared 100% complete.\n\n**Closure unit:** PR #63. This governance work does not change the MENA critical-path numerator.\n\n'''
          if block not in s:
              s = s.replace(ledger_marker, block + ledger_marker, 1)
          p.write_text(s)
          PY
      - name: Commit clean documentation diff
        run: |
          git rm .github/workflows/governance-roadmap-finalize.yml
          git add docs/ROADMAP.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs(roadmap): record agent governance protocol"
          git push origin HEAD:chore/governance-agent-team
