name: PR15 final roadmap

on:
  push:
    branches:
      - feat/p0-mena-provider-runtime-resilience

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0-mena-provider-runtime-resilience
      - name: Close P0-MENA-1F
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/ROADMAP.md')
          text = path.read_text()
          replacements = {
            'P0-MENA-1F tranches 1–5 implemented and validated in draft PR #15.': 'P0-MENA-1F complete and validated in PR #15; ready for review.',
            '| P0-MENA-1 — outbound AI/data-egress contract | 90% | 🟡 In progress | 9 of 10 explicit controls complete; typed failures, bounded timeouts, stable API errors and deterministic Flutter UX validated in draft PR #15 |': '| P0-MENA-1 — outbound AI/data-egress contract | 100% | ✅ Complete in PR | 10 of 10 explicit controls complete; final merge remains pending review of PR #15 |',
            '**MENA critical-path completion:** 11 of 41 explicit roadmap tasks closed, approximately **27%**.': '**MENA critical-path completion:** 12 of 41 explicit roadmap tasks closed, approximately **29%**.',
            '- [ ] Remove or deliberately isolate provider-specific runtime seams.': '- [x] Remove or deliberately isolate provider-specific runtime seams.',
            '- [ ] Add provider and streaming timeouts, typed failures and safe frontend error UX. **Current lot: P0-MENA-1F.**': '- [x] Add provider and streaming timeouts, typed failures and safe frontend error UX.',
            '- [ ] Prove fallback paths cannot bypass the same policy.': '- [x] Prove fallback paths cannot bypass the same policy.',
            '### P0-MENA-1F — Provider runtime resilience — IN IMPLEMENTATION': '### P0-MENA-1F — Provider runtime resilience — COMPLETE IN PR #15',
            '- [ ] Inventory every synchronous, streaming and multimodal provider execution path.': '- [x] Inventory every synchronous, streaming and multimodal provider execution path. **Text complete/stream/think, STT audio, meal vision, glucometer OCR and document-image OCR are covered by executable inventory tests.**',
            '- [ ] Prove timeout, error and fallback paths cannot bypass egress scope, consent, DLP or processor policy.': '- [x] Prove timeout, error and fallback paths cannot bypass egress scope, consent, DLP or processor policy. **Permanent tests prove authorization and processor policy run before provider invocation, multimodal calls are bounded, errors are normalized and local fallbacks cannot bypass scope.**',
            '- [ ] Pass SQLite, PostgreSQL, OpenAPI, security, Flutter and migration-drift gates before merge.': '- [x] Pass SQLite, PostgreSQL, OpenAPI, security, Flutter and migration-drift gates before merge. **All permanent gates passed on the clean tranche-6 SHA before this checkpoint was closed.**',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing roadmap anchor: {old}')
              text = text.replace(old, new, 1)
          checkpoint = '- **Tranche 6 — exhaustive runtime inventory and multimodal boundary:** implemented and validated on 2026-07-30. STT audio, meal vision, glucometer OCR and document-image OCR now execute through one bounded runtime that checks patient scope/consent and processor policy before SDK invocation, normalizes vendor failures and fails closed while network-provider policies remain pending. Executable inventory tests prevent future direct multimodal SDK bypass. SQLite, PostgreSQL, Ruff, import-linter, anti-bypass, Bandit, OpenAPI, Flutter analyze, secret hygiene and migration drift passed before P0-MENA-1F was closed.\n'
          anchor = '\n### Acceptance gate\n'
          if checkpoint not in text:
              text = text.replace(anchor, '\n' + checkpoint + anchor, 1)
          path.write_text(text)
          PY
      - name: Commit roadmap
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ROADMAP.md
          git commit -m "docs(roadmap): close P0-MENA-1F runtime resilience"
          git push origin HEAD:feat/p0-mena-provider-runtime-resilience
