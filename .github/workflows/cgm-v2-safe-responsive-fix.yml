name: CGM V2 safe responsive fix

on:
  push:
    branches:
      - agent/cgm-gateway-v2-product-wiring
    paths:
      - .github/workflows/cgm-v2-safe-responsive-fix.yml

permissions:
  contents: write

jobs:
  restore-and-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cgm-gateway-v2-product-wiring
          fetch-depth: 0
      - name: Restore known-good component and patch timestamp flex
        run: |
          git show c1f7f3b94418d153ac390b942ba72c3a4ab20f5a:frontend/lib/features/import/cgm_connections_section.dart > frontend/lib/features/import/cgm_connections_section.dart
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/lib/features/import/cgm_connections_section.dart')
          lines = path.read_text().splitlines()
          target = None
          for i, line in enumerate(lines):
              if 'const Spacer(),' in line:
                  window = '\n'.join(lines[i:i+8])
                  if '_relative(latest.recordedAt, l10n)' in window:
                      target = i
                      break
          if target is None:
              raise SystemExit('latest-reading spacer anchor not found')

          indent = lines[target].split('const Spacer()')[0]
          replacement = [
              f'{indent}const SizedBox(width: 8),',
              f'{indent}Flexible(',
              f'{indent}  child: Text(',
              f'{indent}    _relative(latest.recordedAt, l10n),',
              f'{indent}    overflow: TextOverflow.ellipsis,',
              f'{indent}    textAlign: TextAlign.end,',
              f'{indent}    style: const TextStyle(fontSize: 11, color: AminaTheme.ink500),',
              f'{indent}  ),',
              f'{indent}),',
          ]
          end = target + 1
          while end < len(lines):
              if lines[end].strip() == '),' and '_relative(latest.recordedAt, l10n)' in '\n'.join(lines[target:end+1]):
                  end += 1
                  break
              end += 1
          if end >= len(lines):
              raise SystemExit('latest-reading timestamp block end not found')
          lines[target:end] = replacement
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit repaired component
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/features/import/cgm_connections_section.dart
          git commit -m "fix(cgm): repair mobile latest-reading layout"
          git push origin HEAD:agent/cgm-gateway-v2-product-wiring
