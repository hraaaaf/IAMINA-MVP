name: P1-UX-12 Builder

on:
  push:
    branches:
      - fix/p1-ux-12-progressive-profile
    paths:
      - .github/workflows/p1-ux-12-builder.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-ux-12-progressive-profile
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Apply Builder patch
        run: python3 tools/p1_ux_12_builder.py

      - name: Generate localization and format
        working-directory: frontend
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib/features/profile/profile_screen.dart test/p1_ux_12_progressive_profile_contract_test.dart

      - name: Validate Builder patch
        working-directory: frontend
        run: |
          flutter analyze --no-fatal-infos
          flutter test test/p1_ux_12_progressive_profile_contract_test.dart test/p0_ux_9_small_screen_contract_test.dart

      - name: Commit surgical product diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p1-ux-12-builder.yml tools/p1_ux_12_builder.py
          git add frontend/lib/features/profile/profile_screen.dart frontend/lib/l10n frontend/test/p1_ux_12_progressive_profile_contract_test.dart
          git diff --cached --check
          git commit -m 'fix(ux): make profile progressively scannable'
          git push origin HEAD:fix/p1-ux-12-progressive-profile
